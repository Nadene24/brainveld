      ["Scale 1 cm = 10 km. Two towns are 7 cm apart. How far apart are they really?",["70 km","17 km","7 km","700 km"],"7 × 10 = 70."],
      ["In grid reference D4, what does the D tell you?",["the column across","the row up or down","the scale","the direction"],"Letters go across."],
      ["The Sun rises in the...",["east","west","north","south"],"And it sets in the west."]]}},
s5b:{W:["Explain why the Western Cape gets winter rain",["In winter, cold fronts move in from the ocean to the south-west.","They bring clouds, wind and rain to the Western Cape.","In summer, the cold fronts stay further south, so the Cape is dry."],"Cold fronts bring rain in winter"],
 X:"Don't mix up weather and climate. One rainy day in Joburg is weather. Joburg's wet summers, year after year, are its climate.",
 C:["Which sentence describes climate, not weather?",["The Karoo is usually dry.","It's raining now.","Tomorrow will be windy.","There was hail this morning."],"It describes the usual pattern."],
 H:{L:[["Rivers flow downhill","A river starts high up (its source), often in mountains, and flows down to the sea (its mouth).","The Orange River starts in the Lesotho highlands and ends at the Atlantic Ocean."],
       ["Height changes the weather","Higher places are colder. The Highveld is high, so it gets frost in winter. The coastal plains are lower and warmer.","Snow falls in the Drakensberg, but not on the KZN beaches."]],
   Q:[["Where does the Orange River end?",["the Atlantic Ocean","the Indian Ocean","Lake Kariba","the Vaal Dam"],"It flows west."],
      ["Why is the Highveld colder in winter than Durban?",["it is higher above sea level","it is closer to the sea","it has more people","it has no wind"],"Higher land is colder."],
      ["The place where a river starts is its...",["source","mouth","delta","bank"],"The mouth is where it ends."],
      ["What do cold fronts bring to Cape Town in winter?",["rain and wind","snow on the beach","hot dry air","dust storms"],"Cold fronts carry clouds."]]}},
s5c:{W:["Compare how the San and the Khoikhoi got food",["San: hunted wild animals and gathered plants.","Khoikhoi: kept cattle and sheep for milk and meat.","Both moved around, but for different reasons. The San followed wild food. The Khoikhoi followed grazing for their animals."],"The San hunted and gathered. The Khoikhoi herded."],
 X:"The San and the Khoikhoi were different groups with different ways of life, even though they sometimes lived near each other and traded.",
 C:["Why did the Khoikhoi move from place to place?",["to find fresh grazing for their animals","to go to markets","to escape snow","to visit the coast"],"Their animals needed grass."],
 H:{L:[["Clever hunters","San hunters put poison from beetle larvae on their arrow tips, tracked animals for hours, and knew the use of every plant.","They could find water in dry places, like the water stored in tsamma melons."],
       ["Rock art is history","San rock art tells us about their lives and beliefs. Some paintings are thousands of years old.","The eland appears often because it was a special animal in San beliefs."]],
   Q:[["What did San hunters put on their arrows?",["poison","fire","gold","paint"],"It came from beetle larvae."],
      ["Which animal often appears in San rock art?",["eland","horse","camel","kangaroo"],"It was spiritually important."],
      ["The Khoikhoi measured wealth by...",["the number of cattle","money in a bank","gold coins","the size of their house"],"Cattle meant wealth."],
      ["Why is San rock art important today?",["it tells us about the past","it was used as money","it shows maps","it was a school test"],"It's a historical source."]]}},
s5d:{W:["Explain how the Nile helped Egypt grow",["Every year the Nile flooded.","When the water went down, it left rich black soil called silt.","Farmers grew crops in the silt, so there was plenty of food.","Extra food meant people could build cities, temples and pyramids."],"Floods gave rich soil, which gave food, which built a strong civilisation"],
 X:"The pyramids were tombs, not houses or palaces. Pharaohs lived in palaces.",
 C:["The pyramids were built as...",["tombs for pharaohs","homes for farmers","schools","markets"],"They held the pharaoh's body."],
 H:{L:[["Egypt's three seasons","Egyptians had three seasons: the flood, the growing season (planting) and the harvest.","Farmers measured the height of the flood with a 'nilometer'."],
       ["Everyday life","Most Egyptians were farmers. Scribes could read and write hieroglyphs, and they were important workers.","Boys training to be scribes practised writing for years."]],
   Q:[["What did the Nile flood leave behind?",["rich black soil","sand dunes","gold","snow"],"Perfect for farming."],
      ["Who could read and write hieroglyphs?",["scribes","all children","only farmers","only soldiers"],"It took years of training."],
      ["Most ancient Egyptians were...",["farmers","pharaohs","soldiers","sailors"],"Farming fed the country."],
      ["The Great Pyramid is at...",["Giza","Cape Town","Timbuktu","Mapungubwe"],"Near Cairo."]]}},
l5a:{W:["Check if this lunch is balanced: white bread, chips and a fizzy drink",["Starch: bread and chips. That's too much starch.","Protein: none.","Fruit and veg: none.","Better: brown bread with egg, an apple and water."],"Not balanced. Add protein and fruit, and swap the fizzy drink for water."],
 X:"Healthy eating doesn't mean never having treats. It means having them only sometimes.",
 C:["Which lunch is the most balanced?",["brown bread, an egg, an apple and water","chips, sweets and cooldrink","white bread and jam","biscuits and juice"],"It has starch, protein and fruit."],
 H:{L:[["Read a food label","Labels show sugar, salt (sodium) and fat. Lower numbers are usually better.","A can of cooldrink can have about 8 teaspoons of sugar."],
       ["Why breakfast matters","Breakfast gives your brain energy to concentrate in the morning.","Learners who eat breakfast often find it easier to focus in class."]],
   Q:[["Which food group gives you energy?",["starch","protein","dairy","water"],"Pap, bread and rice are starches."],
      ["What should you do before eating?",["wash your hands","run around","eat sweets first","skip water"],"It removes germs."],
      ["Which snack is healthiest?",["an apple","a chocolate bar","a packet of chips","sweets"],"Fruit has vitamins and fibre."],
      ["Why is breakfast important?",["it gives your brain energy to focus","it makes you sleepy","it replaces water","it isn't important"],"It's fuel for the morning."]]}},
l5b:{W:["A learner keeps interrupting the teacher. Which right is affected, and what is the responsibility?",["Which right is affected? The other learners' right to education.","What is the responsibility? To listen and let others learn.","What can they do? Put up a hand and wait their turn."],"Right to education, so the responsibility is to let others learn"],
 X:"Rights don't mean 'I can do anything I want'. My rights stop where they would hurt someone else's rights.",
 C:["You have the right to be safe. Your responsibility is to...",["not harm others","stay home always","fight bullies","ignore rules"],"Keep others safe too."],
 H:{L:[["Rights belong to everyone","Every child has the same rights, no matter their race, religion, language or where they come from.","A new learner from another country has the same right to learn as you."],
       ["Who protects children's rights","Parents, teachers, the police, social workers and the government all help protect children's rights.","If a child is in danger, a social worker can help."]],
   Q:[["Who has children's rights?",["every child","only children born in SA","only boys","only older children"],"Rights are for everyone."],
      ["Who can help if a child's rights are not respected?",["a social worker or teacher","nobody","only a friend","a shopkeeper"],"Trusted adults can act."],
      ["My rights should not...",["take away someone else's rights","ever be used","be known","be written down"],"Rights come with limits."],
      ["Recycling at home is linked to the right to...",["a clean environment","play","a name","privacy"],"Caring for the environment."]]}},
l5c:{W:["Someone grabs your ball. Handle your anger in 4 steps.",["Stop: notice your body (hot face, tight fists).","Breathe: take 3 slow breaths.","Speak calmly: \"I was playing with that. Please give it back.\"","If it carries on, ask a teacher for help."],"Stop, breathe, speak calmly, get help"],
 X:"Telling an adult about bullying is not 'snitching'. It's how you keep yourself and others safe.",
 C:["What is the first step when you feel very angry?",["stop and notice how you feel","hit something","shout","run away"],"Notice first, then calm down."],
 H:{L:[["Feelings show in your body","Fear: a fast heartbeat. Anger: a hot face and tight muscles. Sadness: feeling tired and heavy. Your body gives you clues.","Butterflies in your tummy before a test can mean you're nervous."],
       ["Upstander power","If you see bullying, don't laugh or join in. Stand with the person and tell an adult. Bullies often stop when others don't support them.","\"Come sit with us\" can change someone's day."]],
   Q:[["What can butterflies in your tummy mean?",["you feel nervous","you swallowed a butterfly","you are hungry","you are angry"],"It's a body clue for a feeling."],
      ["You see someone being bullied. What should you do?",["support them and tell an adult","laugh","join in","film it"],"Be an upstander."],
      ["Bullying is...",["hurting someone on purpose, again and again","one accidental bump","playing tag","a joke everyone enjoys"],"It's repeated and on purpose."],
      ["Telling an adult about bullying is...",["the right thing to do","snitching","against the rules","only for little kids"],"It keeps people safe."]]}},
/* ===== GRADE 6 ===== */
m6a:{W:["Find the HCF of 24 and 36",["List the factors of 24: 1, 2, 3, 4, 6, 8, 12, 24.","List the factors of 36: 1, 2, 3, 4, 6, 9, 12, 18, 36.","Circle the common factors: 1, 2, 3, 4, 6, 12.","The highest one is 12."],"12"],
 X:"Factors go INTO a number (they're smaller or equal). Multiples come OUT of the times table (bigger or equal). 3 is a factor of 12; 24 is a multiple of 12.",
 C:["What is the LCM of 3 and 5?",["15","8","1","3"],"15 is the first number in both times tables."],
 H:{L:[["Find factors in pairs","Start with 1 × the number, then try 2, 3, 4 and so on. Stop when the pairs start repeating.","18: 1 × 18, 2 × 9, 3 × 6. Factors: 1, 2, 3, 6, 9, 18."],
       ["Divisibility tricks","Divisible by 2 if it's even. By 3 if its digits add up to a multiple of 3. By 5 if it ends in 0 or 5. By 10 if it ends in 0.","261: 2 + 6 + 1 = 9, so 261 is divisible by 3."]],
   Q:[["Which number is divisible by 3?",["123","124","125","130"],"1 + 2 + 3 = 6, a multiple of 3."],
      ["What are the factors of 15?",["1, 3, 5, 15","1, 5, 15, 30","3 and 5 only","1 and 15 only"],"Pairs: 1 × 15 and 3 × 5."],
      ["Which is a multiple of 7?",["42","27","47","17"],"7 × 6 = 42."],
      ["How many prime numbers are there between 1 and 10?",["4","3","5","6"],"2, 3, 5 and 7."]]}},
m6b:{W:["Calculate 2/3 + 1/4",["Find a common denominator: the LCM of 3 and 4 is 12.","2/3 = 8/12 (multiply top and bottom by 4).","1/4 = 3/12 (multiply top and bottom by 3).","Add the tops: 8/12 + 3/12 = 11/12."],"11/12"],
 X:"Never add the bottoms. 1/2 + 1/3 is not 2/5. Make the denominators the same first.",
 C:["1/2 + 1/3 = ?",["5/6","2/5","2/6","1/5"],"3/6 + 2/6 = 5/6."],
 H:{L:[["Why denominators must match","You can only add pieces of the same size. Halves and thirds are different sizes, so cut them both into sixths first.","It's like adding R1 coins and 50c coins: change everything to cents first."],
       ["Mixed number steps","Improper to mixed: divide; the answer is the whole number and the remainder goes on top. Mixed to improper: whole × bottom + top.","3 2/5: 3 × 5 + 2 = 17, so 17/5."]],
   Q:[["What is 2 3/4 as an improper fraction?",["11/4","9/4","5/4","23/4"],"2 × 4 + 3 = 11."],
      ["3/5 − 1/10 = ?",["1/2","2/5","2/10","4/10"],"6/10 − 1/10 = 5/10 = 1/2."],
      ["Simplify 12/16.",["3/4","6/8","2/3","4/3"],"Divide top and bottom by 4."],
      ["What is 1/3 of 27?",["9","3","24","81"],"27 ÷ 3 = 9."]]}},
m6c:{W:["Find 15% of R60",["Find 10%: R60 ÷ 10 = R6.","Find 5%, which is half of 10%: R3.","Add them: R6 + R3 = R9."],"R9"],
 X:"More digits doesn't mean bigger. 0,45 is less than 0,5, because 0,45 < 0,50.",
 C:["Which is bigger: 0,4 or 0,35?",["0,4","0,35","they're equal","you can't tell"],"0,40 is bigger than 0,35."],
 H:{L:[["Decimals are money","Think of R1 as one whole. 10c is 0,1 of a rand and 1c is 0,01.","R0,75 = 75c = 3/4 of a rand."],
       ["Benchmark percentages","Learn these: 100% is all, 50% is half, 25% is a quarter, 10% means divide by 10, 1% means divide by 100.","For 30%, find 10% and multiply by 3."]],
   Q:[["What is 30% of 50?",["15","30","5","35"],"10% = 5, and 5 × 3 = 15."],
      ["Which decimal equals 3/4?",["0,75","0,34","0,25","3,4"],"75 hundredths."],
      ["Round 4,67 to one decimal place.",["4,7","4,6","5","4,67"],"The 7 rounds the 6 up."],
      ["What is 0,6 + 0,25?",["0,85","0,31","0,625","8,5"],"0,60 + 0,25 = 0,85."]]}},
m6d:{W:["Find the perimeter and area of a rectangle 9 cm by 4 cm",["Perimeter: add all four sides: 9 + 4 + 9 + 4 = 26 cm.","Area: length × breadth: 9 × 4 = 36.","Area is measured in squares, so it's 36 cm²."],"Perimeter 26 cm, area 36 cm²"],
 X:"Perimeter is a length, so it's in cm. Area counts squares, so it's in cm². Don't mix up the units.",
 C:["A square has sides of 5 m. What is its area?",["25 m²","20 m","10 m²","25 m"],"5 × 5 = 25 square metres."],
 H:{L:[["Perimeter is a fence, area is a lawn","Perimeter: walk around the edge. Area: count the squares that cover the inside.","A garden 5 m × 3 m needs 16 m of fencing and 15 m² of grass."],
       ["Estimate angles","Compare with a right angle, like a book's corner. Smaller is acute. Bigger but less than a straight line is obtuse. More than a straight line is reflex.","At 3:00, clock hands make a right angle."]],
   Q:[["What angle do clock hands make at 3:00?",["90°","180°","45°","360°"],"A right angle."],
      ["A garden is 7 m by 3 m. What is its perimeter?",["20 m","21 m","10 m","21 m²"],"7 + 3 + 7 + 3 = 20."],
      ["What is the volume of a box 2 cm × 3 cm × 5 cm?",["30 cm³","10 cm³","30 cm²","15 cm³"],"2 × 3 × 5 = 30."],
      ["An angle of exactly 180° is...",["a straight angle","a right angle","a reflex angle","an acute angle"],"It makes a straight line."]]}},
m6e:{W:["Find the median of: 7, 3, 9, 4",["Put the numbers in order: 3, 4, 7, 9.","There are two middle numbers: 4 and 7.","Find halfway between them: (4 + 7) ÷ 2 = 5,5."],"5,5"],
 X:"Always put the data in order before finding the median. The middle of an unsorted list is usually wrong.",
 C:["What is the median of 8, 2, 5?",["5","2","8","15"],"In order: 2, 5, 8."],
 H:{L:[["Mode means most popular","The mode is the favourite: the value that appears most often. There can be more than one mode, or none at all.","Shoe sizes 5, 6, 6, 7, 7: the modes are 6 and 7."],
       ["Choose the right graph","Bar graph: compare groups. Line graph: show change over time. Pie chart: show parts of a whole.","Temperature over a week: use a line graph."]],
   Q:[["Which graph best shows temperature over a week?",["line graph","pie chart","tally table","pictograph"],"It shows change over time."],
      ["What is the mode of 2, 4, 4, 6, 6, 6?",["6","4","2","5"],"6 appears three times."],
      ["What is the median of 5, 1, 9, 3, 7?",["5","9","3","7"],"In order: 1, 3, 5, 7, 9."],
      ["The range of 3, 8, 12 is...",["9","12","3","23"],"Biggest minus smallest: 12 − 3."]]}},
e6a:{W:["Name the figure of speech: 'The stars winked at us.'",["Is there 'like' or 'as'? No, so it's not a simile.","Is something non-human doing a human action? Yes: stars can't really wink.","So it's personification."],"Personification"],
 X:"A simile must use 'like' or 'as'. 'He is a lion' has no like or as, so it's a metaphor.",
 C:["'As cold as ice' is a...",["simile","metaphor","personification","onomatopoeia"],"It uses 'as'."],
 H:{L:[["Ask three questions","1. 'Like' or 'as'? Simile. 2. Says something IS something else? Metaphor. 3. A thing acting like a person? Personification.","'The kettle sang' is a thing acting like a person: personification."],
       ["Why writers use them","Figures of speech paint pictures in the reader's mind and make writing more interesting.","'Her voice was honey' tells you it was sweet and smooth."]],
   Q:[["'The sun smiled down on us' is...",["personification","a simile","alliteration","onomatopoeia"],"The sun can't really smile."],
      ["'Peter Piper picked peppers' is...",["alliteration","a metaphor","a simile","personification"],"The p sound repeats."],
      ["'Her voice was honey' suggests her voice was...",["sweet and smooth","sticky","yellow","loud"],"Think about what honey is like."],
      ["Which is a simile?",["He swims like a fish.","He is a fish.","Splash!","The fish laughed."],"It uses 'like'."]]}},
e6b:{W:["Change to reported speech: \"I am playing soccer today,\" said Musa.",["Remove the inverted commas and add 'that': Musa said that...","Change the pronoun: I becomes he.","Move the tense back: am playing becomes was playing.","Change the time word: today becomes that day."],"Musa said that he was playing soccer that day."],
 X:"Don't forget to change the pronouns. 'Sara said that I was hungry' is wrong if Sara was the hungry one.",
 C:["Reported form of: \"We are late,\" said the girls.",["The girls said that they were late.","The girls said that we are late.","The girls said they are late today.","The girls said, we were late."],"We becomes they, are becomes were."],
 H:{L:[["Punctuating direct speech","Inverted commas open and close the spoken words. The punctuation goes inside them. The spoken words start with a capital.","\"Where is my bag?\" asked Lebo."],
       ["Reporting questions","Use 'asked if' or 'asked where/what', drop the question mark, and put the words in statement order.","\"Where is my bag?\" asked Lebo. Becomes: Lebo asked where her bag was."]],
   Q:[["Which is punctuated correctly?",["\"Where is my bag?\" asked Lebo.","\"Where is my bag\"? asked Lebo.","Where is my bag? \"asked Lebo.\"","\"where is my bag?\" asked Lebo."],"The question mark goes inside the inverted commas."],
      ["\"Are you ready?\" asked Mom. In reported speech:",["Mom asked if I was ready.","Mom asked are you ready?","Mom said that are you ready.","Mom asked if I am ready?"],"Use 'asked if' and no question mark."],
      ["In reported speech, 'here' usually becomes...",["there","where","near","this"],"The place shifts."],
      ["\"I saw a snake,\" said Ali. Reported:",["Ali said that he had seen a snake.","Ali said that I saw a snake.","Ali says he sees a snake.","Ali said, I had seen a snake."],"Saw moves back to had seen."]]}},
e6c:{W:["Join into a complex sentence: 'We cancelled the game.' 'It was raining.'",["Which part is the reason? 'It was raining'.","Choose a conjunction that gives a reason: because.","Join them: We cancelled the game because it was raining.","Or start with the reason: Because it was raining, we cancelled the game."],"We cancelled the game because it was raining."],
 X:"When a sentence starts with a dependent clause (Because..., When..., Although...), put a comma after that clause.",
 C:["Which conjunction shows a result?",["so","although","because","if"],"It rained, so we stayed inside."],
 H:{L:[["FANBOYS","The joining words for compound sentences spell FANBOYS: for, and, nor, but, or, yet, so.","I like tea, but my brother likes coffee."],
       ["Conjunctions have jobs","Reason: because, since. Time: when, after, before. Contrast: but, although. Condition: if, unless.","If you finish your homework, you can play."]],
   Q:[["Which conjunction shows a condition?",["if","and","but","so"],"Something must happen first."],
      ["Join 'I was hungry.' and 'I ate.' The best answer is:",["I was hungry, so I ate.","I was hungry but I ate.","I was hungry or I ate.","I was hungry, although I ate."],"'So' shows the result."],
      ["Where does the comma go? 'When the bell rang we left.'",["after rang","after When","after we","after left"],"After the dependent clause."],
      ["Which is a simple sentence?",["The cat slept on the mat.","The cat slept because it was tired.","The cat slept and the dog barked.","When it was dark, the cat slept."],"One main idea with one verb."]]}},
e6d:{W:["Plan a letter to a friend about your holiday",["Brainstorm: where you went, what you did, the best moment.","Organise into paragraphs: opening, your news (one or two paragraphs), closing.","Write a draft, then edit it for spelling and punctuation.","Write a neat final copy."],"Plan, draft, edit, final copy"],
 X:"Friendly letters have a warm, informal tone. Don't end with 'Yours faithfully'; that's for formal letters.",
 C:["Which ending suits a friendly letter?",["Your friend,","Yours faithfully,","Regards, the Manager","To whom it may concern"],"It's warm and personal."],
 H:{L:[["Opening and closing paragraphs","Open by asking how they are or thanking them for their last message. Close by asking a question and saying you'll write again.","\"I hope you're well. Thanks for the photos!\""],
       ["Edit with a checklist","Check capitals, full stops, spelling and paragraphs, and make sure every sentence makes sense.","Read it aloud to catch missing words."]],
   Q:[["What usually goes in the opening paragraph?",["a greeting and asking how they are","the date","your full address","the ending"],"A warm start."],
      ["Why should you read your draft aloud?",["to catch mistakes and missing words","to make it longer","to waste time","to skip editing"],"Your ears catch errors."],
      ["A friendly letter has a...",["warm, informal tone","very formal tone","angry tone","business tone"],"It's to someone you know."],
      ["Which is the editing step?",["checking spelling and punctuation","brainstorming ideas","posting the letter","choosing a topic"],"Editing fixes mistakes."]]}},
n6a:{W:["Write the word equation for photosynthesis",["What goes in: carbon dioxide and water.","What powers it: sunlight, trapped by chlorophyll.","What comes out: glucose and oxygen.","Put it together with an arrow."],"carbon dioxide + water → (sunlight) → glucose + oxygen"],
 X:"Plants don't get their food from the soil. They make it from air, water and sunlight. Soil gives them water and minerals.",
 C:["Where does a plant get carbon dioxide from?",["the air","the soil","sunlight","rain"],"It enters through tiny holes in the leaves."],
 H:{L:[["The leaf is a kitchen","Ingredients: water (from the roots) and carbon dioxide (from the air). Energy: sunlight. Chef: chlorophyll. Meal: glucose. Leftover: oxygen.","That leftover oxygen is what we breathe."],
       ["Everything is connected","In a food web, one animal can eat many things and be eaten by many things.","A grasshopper may be eaten by a bird, a lizard or a frog."]],
   Q:[["What do plants give off that we breathe?",["oxygen","carbon dioxide","glucose","nitrogen"],"It's left over from photosynthesis."],
      ["How does water reach the leaves?",["through the roots and stem","through the flowers","from the air only","through the leaves only"],"Roots absorb it."],
      ["An ecosystem includes...",["living and non-living things","only animals","only plants","only water"],"Soil, water and air count too."],
      ["Why can't plants photosynthesise at night?",["there is no sunlight","it's too cold","they sleep","they have no water"],"Light is needed."]]}},
n6b:{W:["Separate a mixture of salt, sand and water",["Filter it: the sand stays in the filter paper.","The salty water passes through.","Heat the salty water so the water evaporates.","The salt is left behind."],"Filter, then evaporate"],
 X:"Dissolved doesn't mean disappeared. The sugar is still in the tea; you can taste it.",
 C:["Sugar that has dissolved in water has...",["not disappeared; it's still there","vanished completely","turned into water","become sand"],"You can still taste it."],
 H:{L:[["Solute + solvent = solution","The solute is what dissolves. The solvent is the liquid it dissolves in. Together they make a solution.","Juice powder (solute) + water (solvent) = juice (solution)."],
       ["Water pollution","Harmful mixtures can pollute rivers: oil, chemicals and litter. Clean water is precious, so never pour oil or paint down the drain.","A small amount of oil can pollute a huge amount of water."]],
   Q:[["In juice made from powder, the water is the...",["solvent","solute","filter","residue"],"It's the liquid that does the dissolving."],
      ["How do you get salt back from salt water?",["evaporate the water","filter it","stir it","freeze it"],"The salt stays behind."],
      ["Which action pollutes rivers?",["pouring oil down the drain","planting trees","recycling","saving water"],"Oil spreads through water."],
      ["Which is NOT soluble in water?",["sand","sugar","salt","instant coffee"],"Sand settles at the bottom."]]}},
n6c:{W:["Find out why a torch doesn't work",["Check the cells: are they flat or the wrong way round?","Check the switch: is it closed (on)?","Check the bulb: is it blown?","Check the connections: is the loop complete?"],"Look for the break in the circuit"],
 X:"A 'closed' switch means ON: the circuit is complete. An 'open' switch means OFF.",
 C:["When a switch is closed, the circuit is...",["complete, so the bulb lights","broken","dangerous","empty"],"Closed means a complete loop."],
 H:{L:[["Circuit symbols","Scientists draw circuits with symbols: a long and a short line for a cell, a circle with a cross for a bulb, and a gap with a lever for a switch.","Drawing a circuit first helps you plan it."],
       ["Electricity safety","Never touch fallen power lines, never use appliances near water, and don't overload plugs.","Report fallen cables to an adult right away."]],
   Q:[["What should you do if you see a fallen power line?",["stay away and tell an adult","touch it to check","move it with a stick","jump over it"],"It can kill."],
      ["Why are wires covered in plastic?",["plastic is an insulator","plastic is a conductor","to make them heavy","to make them shiny"],"It keeps you safe."],
      ["What is the job of a cell in a circuit?",["it's the energy source","it gives light","it opens the circuit","it's a wire"],"Like a battery."],
      ["Which object would complete a circuit?",["a metal key","a plastic ruler","a rubber band","a paper strip"],"Metal conducts electricity."]]}},
n6d:{W:["Explain why we have day and night",["Earth spins on its axis once every 24 hours.","The half facing the Sun has day.","The half facing away has night.","As Earth turns, places move from day into night."],"Earth's rotation"],
 X:"The Sun doesn't travel around Earth. It only looks that way because Earth is spinning.",
 C:["What is Earth's spin on its axis called?",["rotation","revolution","orbit","eclipse"],"Revolution is the trip around the Sun."],
 H:{L:[["Rotation vs revolution","Rotate means spin on the spot: one rotation is a day. Revolve means travel around something: one revolution is a year.","A dancer spinning while moving around the room does both."],
       ["Moon phases","The Moon makes no light of its own. As it orbits Earth, we see different amounts of its sunlit side: new moon, crescent, half moon, full moon.","At full moon, we see the whole lit side."]],
   Q:[["One revolution of Earth around the Sun takes about...",["a year","a day","a month","an hour"],"About 365 days."],
      ["Why does the Moon shine?",["it reflects sunlight","it makes its own light","it's on fire","it's a star"],"Like a mirror."],
      ["Which planet is closest to the Sun?",["Mercury","Venus","Earth","Mars"],"It's first in the order."],
      ["Which planets are gas giants?",["Jupiter and Saturn","Mars and Venus","Earth and Mercury","Mercury and Mars"],"The big outer planets."]]}},
s6a:{W:["A place is at 15° N, 30° W. Which hemispheres is it in?",["15° N: north of the Equator, so the northern hemisphere.","30° W: west of the Prime Meridian, so the western hemisphere.","Put them together."],"Northern and western hemispheres"],
 X:"Lines of latitude run sideways, but they measure how far north or south you are. Think: LATitude lines lie FLAT, like the rungs of a ladder.",
 C:["Which line divides Earth into northern and southern halves?",["the Equator","the Prime Meridian","the Tropic of Cancer","Greenwich"],"It's at 0° latitude."],
 H:{L:[["Ladder and long","Latitude lines are like the rungs of a ladder (flat). Longitude lines are long, running from pole to pole.","All the lines of longitude meet at the poles."],
       ["Reading coordinates","Find the latitude line first (N or S), then the longitude line (E or W). Your place is where they cross.","Durban is about 30° S, 31° E."]],
   Q:[["Lines of longitude meet at...",["the poles","the Equator","Greenwich","the tropics"],"They run from pole to pole."],
      ["Durban is about 30° S, 31° E. The 'E' means...",["east of the Prime Meridian","east of the Equator","on the east coast","in the evening"],"E and W are for longitude."],
      ["Which comes first in a coordinate?",["latitude","longitude","the city name","the country"],"Latitude, then longitude."],
      ["Lines of latitude measure...",["distance north or south","distance east or west","height","time"],"From the Equator."]]}},
s6b:{W:["Follow a chocolate bar's journey through the economy",["Primary: farmers grow cocoa beans, and dairy farmers produce milk.","Secondary: a factory turns them into chocolate bars.","Tertiary: trucks transport the bars, shops sell them, and adverts promote them."],"Primary, then secondary, then tertiary"],
 X:"Imports aren't bad and exports aren't good on their own. Countries sell what they produce well and buy what they need.",
 C:["A factory that makes clothes is a ___ activity.",["secondary","primary","tertiary","import"],"It makes products."],
 H:{L:[["Why countries trade","No country has everything. Countries sell what they have plenty of and buy what they lack.","South Africa has platinum but little oil, so we sell platinum and buy oil."],
       ["Fair trade","Fair trade means producers, often small farmers, get a fair price for their goods.","Buying local supports South African businesses and jobs."]],
   Q:[["Why does South Africa buy oil from other countries?",["we don't produce enough","we have too much","it's free","it's a service"],"We have very little crude oil."],
      ["Growing cocoa beans is a ___ activity.",["primary","secondary","tertiary","manufacturing"],"Farming is primary."],
      ["Fair trade makes sure producers...",["get a fair price","work for free","only sell overseas","pay more tax"],"Fairness for producers."],
      ["Transporting goods by truck is a ___ activity.",["tertiary","primary","secondary","mining"],"It's a service."]]}},
s6c:{W:["Explain why Mapungubwe became powerful",["It was near rivers, so farming and cattle-keeping went well.","It controlled the trade in gold and ivory.","Traders brought glass beads and cloth from far away.","Wealth from trade gave the king power."],"Farming plus control of trade brought wealth and power"],
 X:"Don't mix up Mapungubwe with Egypt or Mali. Mapungubwe was in southern Africa, and was one of the first kingdoms here.",
 C:["Mapungubwe was...",["one of the first kingdoms in southern Africa","a city in Egypt","a European colony","a modern town"],"It thrived about 800 years ago."],
 H:{L:[["How we know","Archaeologists dug on the hill in the 1930s and found gold objects, beads, pottery and royal graves.","The golden rhino is kept at the University of Pretoria."],
       ["Why it ended","Around 1300 the climate became colder and drier. Farming failed and people moved away, many towards Great Zimbabwe.","Great Zimbabwe became the next big trading centre."]],
   Q:[["Why did people leave Mapungubwe?",["the climate got drier and farming failed","a volcano erupted","Europeans arrived","the gold ran out in a day"],"Climate change."],
      ["Which kingdom grew after Mapungubwe?",["Great Zimbabwe","Mali","Egypt","Rome"],"It is north of the Limpopo."],
      ["Who dug up Mapungubwe's treasures?",["archaeologists","farmers in 1994","astronauts","the king"],"In the 1930s."],
      ["What did the king living on the hill show?",["his power and importance","he liked climbing","it was cooler","he was hiding"],"It was a class society."]]}},
s6d:{W:["Follow how a law is made",["A bill (a draft law) is written.","Parliament debates the bill and votes on it.","If it passes, the President signs it.","It becomes law. Courts can check it agrees with the Constitution."],"Bill, Parliament vote, President signs, law"],
 X:"The President doesn't make laws alone. Parliament makes the laws; the President signs them.",
 C:["Who votes to pass laws in South Africa?",["Parliament","the courts","the municipality","the police"],"Parliament is the law-making branch."],
 H:{L:[["Separation of powers","Splitting government into three branches stops any one person or group from having too much power.","Courts can strike down a law that goes against the Constitution."],
       ["Being a good citizen","Vote when you turn 18, obey the law, pay taxes, respect others' rights and take part in your community.","Joining a clean-up campaign is active citizenship."]],
   Q:[["Why is power split into three branches?",["so no one has too much power","to make things slow","to have more holidays","so the President rules alone"],"Checks and balances."],
      ["What is a bill?",["a draft law","a type of money","a court case","a voting slip"],"It's not a law yet."],
      ["Which is active citizenship?",["joining a community clean-up","littering","ignoring elections","breaking laws"],"Helping your community."],
      ["Freedom Day is on...",["27 April","16 June","21 March","24 September"],"The date of the first democratic election."]]}},
l6a:{W:["Your friends want you to skip class. Use the decision steps.",["Stop: notice the pressure.","Options: go along, say no, or suggest something else.","Results: skipping could get you in trouble and you'd miss work.","Choose: say no and go to class. Check later: you'll feel good about it."],"Say no and go to class"],
 X:"Saying no doesn't mean losing your friends. Real friends respect your choices.",
 C:["Which reply is assertive?",["\"No, I don't want to. I'm going to class.\"","\"Um... maybe... I don't know.\"","\"You're stupid for asking!\"","Saying nothing"],"Calm, clear and respectful."],
 H:{L:[["Passive, aggressive, assertive","Passive: going along to avoid trouble. Aggressive: shouting or bullying. Assertive: calm, clear and respectful.","Assertive is the healthy middle."],
       ["Choose good friends","Good friends support you, respect your 'no' and encourage good choices.","A friend who keeps pressuring you to do wrong isn't looking out for you."]],
   Q:[["Shouting insults when you disagree is...",["aggressive","assertive","passive","polite"],"It hurts others."],
      ["A good friend will...",["respect your choices","force you to do things","laugh at your 'no'","keep pressuring you"],"Respect is key."],
      ["Agreeing just to avoid trouble is...",["passive","assertive","aggressive","brave"],"You don't say what you really mean."],
      ["What should you think about before deciding?",["the possible results","what's quickest","what's coolest","nothing"],"The consequences."]]}},
l6b:{W:["Plan a daily hygiene routine",["Morning: wash your face, brush your teeth, use deodorant, put on clean clothes.","After sport: shower or wash.","Night: brush your teeth and wash your face.","Wash your hair a few times a week."],"A simple daily routine"],
 X:"Pimples aren't caused by being dirty. They're mostly caused by hormones, but gentle washing helps.",
 C:["Why do teenagers sweat more?",["sweat glands become more active","they eat more","they sleep less","it's always hot"],"Hormones switch them on."],
 H:{L:[["Emotional changes are normal","During puberty you may feel moody, shy or want more privacy. That's normal and it gets easier.","Talking, exercise and enough sleep help with moods."],
       ["Respect others' changes","Everyone changes at a different time. Teasing someone about their body is bullying.","Be kind: everyone goes through it."]],
   Q:[["Teasing someone about their body is...",["bullying","a joke","normal","helpful"],"It hurts."],
      ["What helps with mood swings?",["sleep, exercise and talking","skipping meals","staying up late","bottling it up"],"Healthy habits help."],
      ["Pimples are mainly caused by...",["hormones","being lazy","sunlight","reading"],"Hormones make skin oilier."],
      ["How often should you brush your teeth?",["at least twice a day","once a week","only before school","never"],"Morning and night."]]}},
l6c:{W:["Make a plan to save water at home",["Find the water wasters: leaking taps, long showers, hosepipes.","Fix leaks and close taps tightly.","Take shorter showers and use a bucket instead of a hose.","Reuse grey water (from washing) on the garden."],"Find, fix, cut back, reuse"],
 X:"Recycling is good, but reducing comes first. Not creating waste is better than recycling it.",
 C:["Which comes first in the 3 Rs?",["reduce","recycle","burn","bury"],"Less waste to begin with."],
 H:{L:[["Why litter matters","Litter blocks drains (which causes floods), harms animals and makes places unsafe.","Plastic can take hundreds of years to break down."],
       ["Compost","Food scraps like peels can become compost, which feeds plants instead of filling up landfills.","Banana peels, eggshells and tea leaves are great for compost."]],
   Q:[["What can litter in drains cause?",["flooding","more rain","cleaner rivers","more fish"],"Blocked drains overflow."],
      ["Which can go into compost?",["banana peels","plastic bottles","glass","cans"],"It breaks down naturally."],
      ["Grey water is...",["used water from washing","sea water","rain water","drinking water"],"You can reuse it in the garden."],
      ["How long can plastic take to break down?",["hundreds of years","a week","a day","a month"],"Very, very slowly."]]}},
/* ===== GRADE 7 ===== */
m7a:{W:["Calculate −5 + 8 − 6",["Start at −5 on the number line.","+8: move 8 to the right, to 3.","−6: move 6 to the left, to −3."],"−3"],
 X:"−8 is SMALLER than −2, even though 8 is bigger than 2. Further left on the number line means smaller.",
 C:["Which is bigger: −3 or −7?",["−3","−7","they're equal","you can't tell"],"−3 is further right."],
 H:{L:[["Think about money","Positive is money you have. Negative is money you owe. If you owe R5 (−5) and earn R8, you have R3.","−5 + 8 = 3"],
       ["Think about a lift","Floor 0 is the ground. Basement levels are negative. Going up adds, going down subtracts.","From basement −2, go up 5 floors: you're on floor 3."]],
   Q:[["You owe R10 and then earn R4. What's your balance?",["−R6","R6","−R14","R14"],"−10 + 4 = −6."],
      ["−4 − 3 = ?",["−7","−1","1","7"],"Move 3 left from −4."],
      ["A lift goes from floor −3 up 7 floors. Which floor is it on now?",["4","10","−10","−4"],"−3 + 7 = 4."],
      ["Order from smallest: 2, −5, 0, −1",["−5, −1, 0, 2","−1, −5, 0, 2","0, −1, 2, −5","2, 0, −1, −5"],"Read left to right on the number line."]]}},
m7b:{W:["Calculate 3 × 2² + √25",["Exponents and roots first: 2² = 4 and √25 = 5.","Then multiply: 3 × 4 = 12.","Then add: 12 + 5 = 17."],"17"],
 X:"2³ is NOT 2 × 3. It means 2 × 2 × 2 = 8.",
 C:["What is 5²?",["25","10","7","52"],"5 × 5 = 25."],
 H:{L:[["Picture a square","A square number is the area of a square: 4² is a 4 by 4 square of tiles, which is 16 tiles.","That's why 4² is read as 'four squared'."],
       ["Order of operations","Brackets first, then exponents and roots, then × and ÷ (left to right), then + and − (left to right).","(2 + 3)² = 5² = 25, but 2 + 3² = 2 + 9 = 11."]],
   Q:[["(1 + 2)² = ?",["9","5","7","3"],"Brackets first: 3² = 9."],
      ["Which number has a cube root of 2?",["8","4","6","9"],"2 × 2 × 2 = 8."],
      ["10² = ?",["100","20","1 000","12"],"10 × 10 = 100."],
      ["√36 + √64 = ?",["14","100","10","48"],"6 + 8 = 14."]]}},
m7c:{W:["Solve 3x − 4 = 11",["Undo the − 4: add 4 to both sides. 3x = 15.","Undo the × 3: divide both sides by 3. x = 5.","Check: 3 × 5 − 4 = 15 − 4 = 11. Correct."],"x = 5"],
 X:"Whatever you do to one side, do to the other. Undo + with −, and undo × with ÷.",
 C:["Solve: y − 9 = 3",["12","6","−6","27"],"Add 9 to both sides."],
 H:{L:[["Equations are balance scales","To keep the scale level, add or remove the same amount on both sides.","x + 3 = 10: take 3 off both sides, so x = 7."],
       ["Turn words into algebra","'A number plus 5' is n + 5. 'Double a number' is 2n. 'A number minus 3' is n − 3.","'Double a number plus 1 is 9' becomes 2n + 1 = 9, so n = 4."]],
   Q:[["Write 'three times a number, minus 2' in algebra.",["3n − 2","3 − 2n","n − 3 × 2","3 + n − 2"],"3n, then take away 2."],
      ["Solve: 5x = 35",["7","30","40","175"],"Divide both sides by 5."],
      ["If a = 4, what is 2a + 3?",["11","9","24","10"],"8 + 3 = 11."],
      ["Simplify 6p − 2p + p",["5p","3p","4p","9p"],"6 − 2 + 1 = 5."]]}},
m7d:{W:["A R240 jacket is 25% off. Find the sale price.",["25% is the same as 1/4.","1/4 of R240 = R60. That's the discount.","Subtract: R240 − R60 = R180."],"R180"],
 X:"20% off doesn't mean R20 off. It means 20% OF the price.",
 C:["What is 50% of R86?",["R43","R50","R36","R172"],"Half of 86."],
 H:{L:[["Percentages with a bar","Draw a bar for 100% and split it into 10 parts. Each part is 10%. Count the parts you need.","35% of R200: 10% is R20, so 35% is 3,5 × R20 = R70."],
       ["Ratio is sharing","Add the ratio parts, divide the amount by that total, then give each person their parts.","R90 in the ratio 2:1: 3 parts of R30, so R60 and R30."]],
   Q:[["Share R90 in the ratio 2:1. The smaller share is...",["R30","R60","R45","R20"],"3 parts of R30."],
      ["An item costs R80 before VAT. Add 15% VAT. New price?",["R92","R95","R68","R12"],"15% of 80 is 12."],
      ["What is 20% of R350?",["R70","R35","R20","R700"],"10% is R35, so double it."],
      ["Simplify the ratio 10:15",["2:3","1:5","3:2","10:5"],"Divide both sides by 5."]]}},
m7e:{W:["A triangle has angles of 90° and 35°. Find the third angle.",["Angles in a triangle add up to 180°.","Add the angles you know: 90 + 35 = 125.","Subtract from 180: 180 − 125 = 55."],"55°"],
 X:"For a triangle's area, use the perpendicular height (straight up from the base), not the slanted side.",
 C:["Two angles of a triangle are 60° and 60°. What is the third?",["60°","120°","180°","90°"],"180 − 120 = 60."],
 H:{L:[["Tear and see","Draw any triangle, tear off its three corners and line them up. They always make a straight line: 180°.","Try it with scrap paper."],
       ["A triangle is half a rectangle","A triangle fits exactly into half of a rectangle with the same base and height.","A 6 × 4 rectangle is 24, so the triangle is 12."]],
   Q:[["Angles around a point add up to...",["360°","180°","90°","270°"],"A full turn."],
      ["A triangle has a base of 10 cm and a height of 7 cm. Area?",["35 cm²","70 cm²","17 cm²","35 cm"],"½ × 10 × 7 = 35."],
      ["A triangle with no equal sides is...",["scalene","isosceles","equilateral","right-angled"],"All sides are different."],
      ["Two vertically opposite angles: one is 40°. The other is...",["40°","140°","320°","50°"],"They are equal."]]}},
e7a:{W:["Change to passive: 'The learners clean the classroom.'",["Find what receives the action: the classroom.","Make it the subject: 'The classroom...'","Add a form of 'to be' + past participle, keeping the tense: 'is cleaned'.","Add 'by' + the doer: 'by the learners'."],"The classroom is cleaned by the learners."],
 X:"Keep the same tense when you change the voice. 'cleaned' (past) becomes 'was cleaned', not 'is cleaned'.",
 C:["Passive of 'The cat caught a mouse':",["A mouse was caught by the cat.","A mouse is caught by the cat.","The cat was caught by a mouse.","A mouse caught the cat."],"Past tense stays past."],
 H:{L:[["Spotting the passive","Look for a form of 'to be' (is, was, were, has been) plus a past participle (eaten, made, written). 'By ...' often follows.","'The song was written by her.'"],
       ["Active is usually stronger","Active voice is clearer and livelier, so use it most of the time. Use the passive when the doer is unknown or unimportant.","'Mistakes were made' hides who made them."]],
   Q:[["Which sentence is passive?",["The cake was baked by Gran.","Gran baked the cake.","Gran is baking.","Bake the cake!"],"was + baked."],
      ["Active form of 'The song was sung by the choir':",["The choir sang the song.","The song sang the choir.","The choir was singing.","The song is sung."],"The doer comes first."],
      ["Passive of 'They will build a school':",["A school will be built by them.","A school was built by them.","A school is built by them.","They will be built a school."],"will + be + built."],
      ["Why use the passive in 'My wallet was stolen'?",["the thief is unknown","to sound happy","it's shorter","it's the only option"],"We don't know the doer."]]}},
e7b:{W:["Find the rhyme scheme: 'The rain came down / on every town / the children played / in puddles they made'",["Line 1 ends with 'down': label it A.","Line 2 ends with 'town', which rhymes with down: A.","Line 3 ends with 'played', a new sound: B.","Line 4 ends with 'made', which rhymes with played: B."],"AABB"],
 X:"A theme is a message about life (like 'family helps us through hard times'), not just a topic (like 'family').",
 C:["Which is a theme, not just a topic?",["Friendship helps us through hard times.","Friends","A dog","The sea"],"A theme is a message."],
 H:{L:[["Tone vs mood","Tone is how the poet feels (angry, joyful, sad). Mood is how YOU feel reading it (calm, scared, hopeful).","A poem about a storm might create a fearful mood."],
       ["Read a poem three times","1. Read for meaning. 2. Look for devices (rhyme, imagery, figures of speech). 3. Ask what the poet is saying about life.","Underline the words that create pictures in your mind."]],
   Q:[["The poet's attitude is called the...",["tone","mood","rhyme","stanza"],"The mood is the reader's feeling."],
      ["Lines ending in sky / tree / high / free. Rhyme scheme?",["ABAB","AABB","ABBA","AAAA"],"sky rhymes with high, tree with free."],
      ["'The golden fields of sunflowers' mainly appeals to...",["sight","hearing","smell","taste"],"Colour is something you see."],
      ["A stanza of two lines is called a...",["couplet","quatrain","sonnet","paragraph"],"A quatrain has four lines."]]}},
e7c:{W:["Choose the verb: 'Neither the teacher nor the learners (was / were) ready.'",["With 'neither...nor', the verb agrees with the subject closest to it.","The closest subject is 'learners', which is plural.","So use the plural verb."],"were"],
 X:"Words between the subject and the verb can trick you: 'The box of pencils IS on the desk' (the box is singular).",
 C:["'The box of pencils ___ on the desk.'",["is","are","were","be"],"The subject is 'box', which is singular."],
 H:{L:[["Find the real subject","Cross out phrases like 'of the...' or 'with the...' to find the main subject, then match the verb to it.","'The colour of the cars (is) red.'"],
       ["The swap test","Swap the short form for its full form. If 'it is' or 'they are' makes sense, use the apostrophe form.","'(It's / Its) raining' → 'It is raining' works, so It's."]],
   Q:[["'___ a lovely day.'",["It's","Its","Its'","It"],"It is a lovely day."],
      ["'The group of learners ___ on a trip.'",["is going","are going","were goes","go"],"Group is singular."],
      ["'___ bag is this?'",["Whose","Who's","Whos","Who"],"Whose means belonging to whom."],
      ["'Each of the boys ___ a ball.'",["has","have","are having","were having"],"Each is singular."]]}},
e7d:{W:["Summarise: 'Sharks are often feared, but most sharks are harmless to humans. In fact, people kill millions of sharks each year. Sharks keep oceans healthy by eating sick fish.'",["Find the main points: most sharks are harmless; humans kill many sharks; sharks keep oceans healthy.","Leave out filler like 'in fact'.","Write the points in your own words, in short full sentences."],"Most sharks are harmless. People kill millions every year. Sharks help keep oceans healthy."],
 X:"Don't add your own opinions to a summary. Only include what the text says.",
 C:["A good summary is...",["short and in your own words","longer than the text","full of your opinions","copied word for word"],"Main points only."],
 H:{L:[["PEEL paragraphs","Point (your argument), Evidence (a fact or example), Explain (why it matters), Link (back to your opinion).","Point: School gardens teach useful skills. Evidence: learners learn to grow food..."],
       ["Spot persuasion in adverts","Ask: who made this? What do they want? Which words try to make me feel something? Are there real facts or just claims?","'9 out of 10 dentists recommend...' is a statistic used to persuade."]],
   Q:[["In PEEL, what does the first E stand for?",["Evidence","Ending","Emotion","Essay"],"Point, Evidence, Explain, Link."],
      ["'9 out of 10 kids love it!' uses...",["statistics","a rhetorical question","a simile","passive voice"],"Numbers are used to persuade."],
      ["Which belongs in a conclusion?",["restating your opinion","a brand new argument","your address","a joke"],"Wrap up your view."],
      ["Why mention the other side in an argument?",["to answer it and make your case stronger","to change your opinion","to confuse readers","to make it shorter"],"It shows you've thought it through."]]}},
n7a:{W:["Classify a crocodile",["Does it have a backbone? Yes, so it's a vertebrate.","What is its skin like? Dry and scaly, so it's not an amphibian.","It lays eggs with leathery shells on land, so it's a reptile."],"Reptile"],
 X:"Bats fly but are mammals (fur, milk). Whales and dolphins live in water but are mammals too.",
 C:["A whale is a...",["mammal","fish","amphibian","reptile"],"It breathes air and feeds its young on milk."],
 H:{L:[["Use a key","A dichotomous key asks yes/no questions to identify a living thing. Each answer leads you to the next question.","Has feathers? Yes: bird. No: has fur? Yes: mammal."],
       ["Why biodiversity matters","Many species working together keep ecosystems healthy and give us food, medicine and tourism.","Rooibos and honeybush tea come from South African fynbos plants."]],
   Q:[["A bat is a...",["mammal","bird","reptile","insect"],"It has fur and feeds its young on milk."],
      ["A dichotomous key uses...",["yes/no questions","maths sums","maps","only drawings"],"Two choices at every step."],
      ["Rooibos tea comes from...",["fynbos plants","the Kalahari Desert","rainforests","the ocean"],"It grows in the Cederberg area."],
      ["Which feature do ONLY birds have?",["feathers","eggs","a backbone","wings"],"Bats and insects have wings too."]]}},
n7b:{W:["Get pure water from salty water",["Heat the salty water until it boils.","The water turns into steam; the salt stays behind.","Cool the steam so it condenses back into liquid.","Collect the pure water. This is distillation."],"Distillation"],
 X:"Evaporation gets the solid back but loses the water. Distillation keeps both the water and the solid.",
 C:["Which method gives you drinkable water from salt water?",["distillation","filtration","sieving","a magnet"],"Boil, then condense."],
 H:{L:[["Match the property to the method","Different sizes: sieve. Insoluble solid in a liquid: filter. Dissolved solid: evaporate. Magnetic: magnet. Mixed dyes: chromatography.","Separating a mixture is like choosing the right tool for the job."],
       ["In real life","Water treatment plants filter water. Salt pans evaporate seawater. Mines use magnets and sieves.","Rand Water filters and cleans water for Gauteng."]],
   Q:[["Water treatment plants mainly clean water by...",["filtering it","adding sand","using magnets","chromatography"],"Removing particles."],
      ["Sand and gravel are best separated by...",["sieving","evaporation","distillation","a magnet"],"They're different sizes."],
      ["In distillation, steam turns back into water by...",["condensing (cooling)","freezing","boiling again","filtering"],"Cooling it down."],
      ["A salt pan uses...",["evaporation","filtration","sieving","magnets"],"The Sun evaporates the water."]]}},
n7c:{W:["Test a liquid with litmus paper",["Dip blue litmus paper in the liquid.","If it turns red, the liquid is an acid.","If it stays blue, test with red litmus: turning blue means a base.","No change on either one means it's neutral."],"Blue to red means acid"],
 X:"Acids and bases can both be dangerous. Strong bases like drain cleaner burn skin just like strong acids.",
 C:["A liquid turns red litmus paper blue. It is...",["a base","an acid","neutral","pure water"],"Bases turn red litmus blue."],
 H:{L:[["A memory trick","Acid turns Blue litmus Red. Think 'A-B-R'. Bases do the opposite.","Lemon juice on blue litmus turns it red."],
       ["Neutralisation in daily life","Farmers add lime (a base) to acidic soil. Toothpaste is slightly basic to neutralise acids in your mouth.","An antacid tablet neutralises extra stomach acid."]],
   Q:[["Farmers add lime to soil to...",["neutralise acidic soil","make it more acidic","kill plants","add water"],"Lime is a base."],
      ["Which pH is a strong acid?",["1","7","10","14"],"Lower pH means more acidic."],
      ["Drain cleaner is a strong...",["base","acid","neutral","indicator"],"It can burn skin."],
      ["Toothpaste helps teeth because it...",["neutralises acids in your mouth","is acidic","contains sugar","is an indicator"],"It's slightly basic."]]}},
n7d:{W:["Explain why a pot handle is made of plastic",["Heat travels from the hot pot by conduction.","Metal conducts heat well, so a metal handle would get very hot.","Plastic is an insulator: it conducts heat poorly.","So a plastic handle stays cool enough to hold."],"Plastic is an insulator"],
 X:"Insulators don't make heat; they slow it down. A blanket keeps you warm by trapping YOUR body heat.",
 C:["Why does a blanket keep you warm?",["it traps your body heat","it makes heat","it conducts heat to you","it reflects the cold"],"It's an insulator."],
 H:{L:[["Three ways heat moves","Conduction: by touching (solids). Convection: by flowing (liquids and gases). Radiation: as waves (even through space).","Making tea: the stove conducts, the water convects, and you feel heat radiating from the flame."],
       ["Shiny vs dark","Dark, dull surfaces absorb and give off radiation well. Shiny, light surfaces reflect it.","Solar geyser panels are black to absorb more heat."]],
   Q:[["Why are solar water heater panels black?",["to absorb more radiation","to look nice","to reflect heat","to cool the water"],"Dark surfaces absorb heat."],
      ["Heat moving along a metal rod is...",["conduction","convection","radiation","insulation"],"Particle to particle."],
      ["Why are heaters placed low in a room?",["warm air rises and spreads through the room","cold air rises","it's safer for cats","floors conduct heat"],"A convection current forms."],
      ["Ceiling insulation keeps houses...",["warm in winter and cool in summer","hot all year","damp","bright"],"It slows heat transfer."]]}},
s7a:{W:["Explain the gold and salt trade",["North (the Sahara) had plenty of salt but no gold.","South (West Africa) had plenty of gold but little salt.","Salt was needed to preserve food and stay healthy in the heat.","Mali sat in the middle, controlled the routes and taxed the trade."],"Mali grew rich by controlling and taxing trade between north and south"],
 X:"Mali was in West Africa. Don't confuse it with Mapungubwe, which was in southern Africa.",
 C:["Why was salt so valuable?",["it preserved food and was needed in the heat","it was shiny","it was used as paint","it was rare everywhere"],"It was essential for life."],
 H:{L:[["Caravan life","Camel caravans, sometimes with hundreds of camels, crossed the Sahara and stopped at oases for water.","A crossing could take about two months."],
       ["Learning and Islam","Traders brought Islam and Arabic writing. Timbuktu's scholars wrote about maths, astronomy, medicine and law.","Some manuscripts are over 700 years old."]],
   Q:[["What is an oasis?",["a place with water in the desert","a type of camel","a gold mine","a mosque"],"Caravans stopped there to drink."],
      ["What did Timbuktu's manuscripts cover?",["maths, astronomy, medicine and law","only stories","only maps","only recipes"],"It was a centre of learning."],
      ["Mali was in...",["West Africa","southern Africa","East Africa","Europe"],"Along the Niger River."],
      ["How did Mali grow rich from trade?",["by taxing goods passing through","by selling camels to Europe","by printing money","by mining salt only"],"Trade taxes."]]}},
s7b:{W:["Explain why conflict grew between the Khoikhoi and the VOC",["The VOC needed meat for ships, so it traded with the Khoikhoi for cattle.","Free burghers took land for farms, blocking Khoikhoi grazing land.","Without grazing, the Khoikhoi couldn't keep their cattle.","Fighting broke out over land and cattle."],"Competition for land and cattle"],
 X:"The Cape wasn't empty when the Dutch arrived. Khoikhoi and San people had lived there for a very long time.",
 C:["Who lived at the Cape before 1652?",["the Khoikhoi and San","nobody","the Dutch","the British"],"They had been there for centuries."],
 H:{L:[["Life under slavery","Enslaved people had no freedom, could be sold, and were forced to work very hard on farms and in homes.","Slavery at the Cape ended in 1834, but freed people had to keep working for their owners for 4 more years."],
       ["Lasting effects","Cape culture today shows influences of the Khoikhoi, enslaved people and settlers: in language, food, music and religion.","Cape Malay cooking, like bobotie and koeksisters, has roots in this history."]],
   Q:[["When did slavery officially end at the Cape?",["1834","1652","1994","1713"],"Under British rule."],
      ["Why did the VOC first trade with the Khoikhoi?",["to get cattle for meat","to buy gold","to learn Dutch","to build ships"],"Ships needed fresh meat."],
      ["Bobotie has roots in...",["Cape Malay culture","ancient Egypt","Mali","Mapungubwe"],"Brought by enslaved people from the East."],
      ["The free burghers were...",["former VOC workers given farms","Khoikhoi leaders","enslaved people","British soldiers"],"Settler farmers from 1657."]]}},
s7c:{W:["Explain what happens in an earthquake",["Tectonic plates push against each other and get stuck.","Pressure builds up over time.","The rock suddenly slips, releasing energy.","Waves of energy shake the ground, strongest near the epicentre."],"Pressure builds, rock slips, and energy shakes the ground"],
 X:"The focus is underground, where the earthquake starts. The epicentre is the point on the surface directly above it.",
 C:["Where is the shaking usually strongest?",["near the epicentre","far away","only under the sea","at the poles"],"It's closest to the focus."],
 H:{L:[["Why disasters hurt some places more","Poorer areas often have weaker buildings, fewer warning systems and less money to recover.","Informal settlements near rivers were badly hit by the 2022 KZN floods."],
       ["Be prepared","Have an emergency plan and kit (water, torch, first aid) and know where to go. In an earthquake: drop, cover and hold on.","Never walk or drive through floodwater."]],
   Q:[["In an earthquake you should...",["drop, cover and hold on","run outside immediately","stand by windows","use the lift"],"Protect yourself from falling objects."],
      ["Why do some communities suffer more in disasters?",["weaker buildings and fewer resources","they're unlucky","they live on mountains","they cause the disasters"],"Poverty increases risk."],
      ["What should an emergency kit include?",["water, a torch and first aid","only sweets","a TV","nothing"],"Survival basics."],
      ["What is safest during a flood?",["move to higher ground","drive through the water","play in the water","stay in a basement"],"Water rises fast."]]}},
s7d:{W:["1 000 people live in an area of 50 km². Find the population density.",["Density = number of people ÷ area.","1 000 ÷ 50 = 20.","Write the unit: people per km²."],"20 people per km²"],
 X:"A big population doesn't always mean high density. Density also depends on how big the area is.",
 C:["What is the density of 600 people in 20 km²?",["30 per km²","12 000 per km²","620 per km²","3 per km²"],"600 ÷ 20 = 30."],
 H:{L:[["Push and pull together","Most migration has both: something pushing people away and something pulling them to the new place.","A farm worker leaves because of drought (push) and moves for city jobs (pull)."],
       ["Effects of urbanisation","Fast-growing cities can face housing shortages, traffic and pressure on water and services, but they also bring jobs and opportunities.","Informal settlements often grow when housing can't keep up."]],
   Q:[["Rapid urbanisation can cause...",["housing shortages","fewer people in cities","more farmland","less traffic"],"Cities can't keep up."],
      ["Which province has the fewest people?",["Northern Cape","Gauteng","KwaZulu-Natal","Western Cape"],"It's large and dry."],
      ["A drought forcing people to leave is a...",["push factor","pull factor","density","census"],"It pushes them out."],
      ["A census is...",["an official count of people","a type of map","a weather report","a migration route"],"Stats SA ran one in 2022."]]}},
l7a:{W:["Turn 'I want to get better at maths' into a SMART goal",["Specific: improve my fractions.","Measurable: score 3 or more out of 4 on the fractions quiz.","Achievable and realistic: practise for 15 minutes a day.","Time-bound: by the end of this month."],"I will practise fractions for 15 minutes a day to score 3/4 by the end of the month."],
 X:"Self-esteem isn't about being better than others. It's about valuing yourself as you are, while you keep growing.",
 C:["Which goal is SMART?",["Read 10 pages every night this week.","Be good at reading.","Read more someday.","Become the best reader ever."],"It's specific, measurable and has a deadline."],
 H:{L:[["Your inner coach","Talk to yourself like a good coach: honest but kind. Swap 'I can't' for 'I can't YET'.","'I failed this test' becomes 'I'll find what I missed and fix it.'"],
       ["A strengths list","Write down 5 things you're good at or like about yourself. Read the list when you feel down.","Kind, funny, good at drawing, loyal, hard-working."]],
   Q:[["Replace 'I can't do this' with...",["\"I can't do this yet.\"","\"I'll never do this.\"","\"It's impossible.\"","\"I'm hopeless.\""],"'Yet' shows you can grow."],
      ["What does the 'T' in SMART stand for?",["Time-bound","Tough","Talent","Total"],"It needs a deadline."],
      ["Self-esteem is about...",["valuing yourself","being better than others","having more likes","never making mistakes"],"Your own worth."],
      ["A strengths list helps you...",["remember what you're good at","compare yourself with others","find your faults","feel worse"],"It boosts self-esteem."]]}},
l7b:{W:["Is a post insulting someone's religion protected by freedom of expression?",["Freedom of expression lets you share your opinions.","But it doesn't protect hate speech: speech that spreads hatred based on race, religion, gender and similar things.","The post also attacks the other person's right to dignity.","So it is not protected."],"No. It is hate speech."],
 X:"Having rights doesn't mean you can ignore other people's rights. Rights have limits when they clash.",
 C:["Which is protected by freedom of expression?",["writing a respectful letter disagreeing with a school rule","spreading hate about a religion","threatening someone","bullying online"],"Respectful disagreement is protected."],
 H:{L:[["When rights clash","Sometimes two rights clash, like privacy and safety. Courts weigh them up to decide what's fair.","A school may search bags for weapons to keep everyone safe."],
       ["Reporting violations","You can report human rights violations to the SA Human Rights Commission, the police or a trusted adult.","Childline (116) helps children whose rights are being violated."]],
   Q:[["Where can you report a human rights violation?",["the SA Human Rights Commission","a shop","a sports club","nowhere"],"The SAHRC investigates."],
      ["What happened at Sharpeville in 1960?",["police killed protesters","a new school opened","an election was held","a dam was built"],"It's remembered on Human Rights Day."],
      ["When two rights clash, who decides?",["the courts","the loudest person","nobody","social media"],"Courts weigh them up."],
      ["The right to dignity means...",["everyone deserves respect","you can do anything","only adults have rights","you must be rich"],"Respect for all."]]}},
l7c:{W:["Make a study timetable for a week",["List your subjects and your test dates.","Give harder subjects more sessions.","Plan short sessions of about 25 minutes with breaks.","Include rest and fun time, then stick to it."],"Short, regular, planned sessions"],
 X:"Rereading notes feels useful but doesn't stick well. Testing yourself works much better.",
 C:["What's the best way to prepare for a test?",["quiz yourself over several days","reread notes the night before","highlight everything","study while watching videos"],"Spaced self-testing works best."],
 H:{L:[["Mind maps","Put the topic in the middle, draw branches for the main ideas, then smaller branches for details. Use colours and pictures.","A mind map on 'Heat transfer' with three branches: conduction, convection and radiation."],
       ["Research careers","Find out what a job involves, which subjects you need, and where to study. Ask people who do the job.","Engineers usually need Mathematics and Physical Sciences in matric."]],
   Q:[["What goes in the middle of a mind map?",["the main topic","the smallest detail","your name","the date"],"Branches grow from it."],
      ["Which subjects do engineers usually need?",["Mathematics and Physical Sciences","only Art","only History","no particular subjects"],"Strong maths and science."],
      ["Spreading study over several days helps you...",["remember for longer","forget faster","waste time","sleep less"],"Spaced practice works."],
      ["Why ask someone who does a job about it?",["to learn what it's really like","to get the job today","to skip school","to copy them"],"First-hand information."]]}}
