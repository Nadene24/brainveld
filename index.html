{ id:"n6e", T:1, t:"Nutrients in food", s:"What our bodies need and where to find it",
  L:[["The nutrient groups","Food contains nutrients: carbohydrates (energy), proteins (growth and repair), fats (stored energy and warmth), vitamins and minerals (staying healthy), fibre (digestion) and water.","Pap gives carbohydrates; beans give protein."],
     ["Vitamins and minerals","We need small amounts of vitamins and minerals. Calcium builds bones, iron makes healthy blood, and vitamin C helps fight infections.","Oranges are rich in vitamin C. Spinach has iron."],
     ["Testing food","Scientists use tests to find nutrients. Iodine turns blue-black when starch is present. Fat leaves a see-through greasy mark on brown paper.","A drop of iodine on bread turns blue-black."]],
  A:{t:"match", p:"Match each nutrient to its main job.", d:[["Carbohydrates","Give energy"],["Proteins","Growth and repair"],["Calcium","Strong bones and teeth"],["Fibre","Helps digestion"],["Iron","Healthy blood"]]},
  Q:[["Which nutrient mainly gives us energy?",["carbohydrates","fibre","water","calcium"],"Starches and sugars."],
     ["What does iodine solution show?",["starch is present","fat is present","protein is present","water is present"],"Turns blue-black."],
     ["Which food is rich in protein?",["eggs","rice","apples","bread"],"Eggs help growth."],
     ["Why do we need fibre?",["to help digestion","to see in the dark","for energy only","to grow hair"],"Keeps food moving."]],
  W:["Test a potato chip for fat and starch",["Fat test: rub it on brown paper and hold it up to the light. A see-through greasy patch means fat.","Starch test: add a drop of iodine. Blue-black means starch.","Record your results in a table."],"A chip contains both fat and starch"],
  X:"Fats aren't all bad. Our bodies need some fat, but too much fried or fatty food is unhealthy.",
  C:["Which nutrient builds strong bones?",["calcium","sugar","fat","fibre"],"Milk and maas."],
  H:{L:[["Food sources","Carbohydrates: pap, rice, bread, potatoes. Proteins: beans, eggs, fish, meat. Fats: oil, butter, nuts. Vitamins: fruit and vegetables.","A balanced plate has foods from each group."],
        ["Water is a nutrient too","More than half your body is water. You lose water when you sweat and breathe, so drink clean water every day.","Thirst and headaches can be signs you need water."]],
    Q:[["Which food is mostly carbohydrate?",["potatoes","fish","butter","beans"],"Starchy."],
       ["What happens to brown paper with fat on it?",["a see-through greasy patch forms","it turns blue","it catches fire","nothing"],"The fat test."],
       ["Vitamin C helps the body...",["fight infections","grow taller instantly","store fat","digest sand"],"Immune system."],
       ["Is water a nutrient?",["yes, the body needs it every day","no","only for plants","only in summer"],"Essential."]]}},
{ id:"n6f", T:1, t:"Nutrition & health", s:"Balanced diets and diseases caused by poor diets",
  L:[["A balanced diet","A balanced diet has the right amounts of all the nutrients. Different people need different amounts depending on age and activity.","An athlete needs more energy food than someone who sits a lot."],
     ["Too little","Malnutrition is when the body doesn't get enough of the right nutrients. Kwashiorkor is caused by too little protein. Scurvy is caused by too little vitamin C. Rickets is caused by too little vitamin D and calcium.","Kwashiorkor causes a swollen belly."],
     ["Too much","Too much sugar, fat and salt can lead to obesity, tooth decay, type 2 diabetes and high blood pressure.","Swap sweets for fruit and fizzy drinks for water."]],
  A:{t:"match", p:"Match each condition to its cause.", d:[["Kwashiorkor","Too little protein"],["Scurvy","Too little vitamin C"],["Rickets","Too little vitamin D and calcium"],["Tooth decay","Too much sugar"],["Obesity","Too much energy food and too little exercise"]]},
  Q:[["What is malnutrition?",["not getting the right nutrients","eating breakfast","drinking water","exercising"],"Poor nutrition."],
     ["Which disease is caused by too little protein?",["kwashiorkor","scurvy","flu","rickets"],"Swollen belly."],
     ["Too much sugar can cause...",["tooth decay","strong bones","good eyesight","faster healing"],"Sugar feeds mouth bacteria."],
     ["Which helps prevent scurvy?",["oranges","chips","sweets","white bread"],"Vitamin C."]],
  W:["Improve this daily menu: white bread and jam for breakfast, chips for lunch, sweets as a snack",["Missing protein: add an egg, beans or peanut butter.","Missing vitamins and fibre: add fruit and vegetables.","Too much sugar and fat: swap sweets for fruit and chips for a sandwich with salad.","Add water through the day."],"Add protein and vegetables, cut sugar and fried food, drink water"],
  X:"Being thin doesn't mean being healthy, and malnutrition isn't only about not having enough food. Eating lots of junk food can also leave the body short of nutrients.",
  C:["Rickets causes...",["soft, weak bones","a swollen belly","bleeding gums","tooth decay"],"Lack of vitamin D and calcium."],
  H:{L:[["Read the food label","Labels list energy (kJ), sugar, fat and salt. Compare two products and pick the one with less sugar and salt.","Many breakfast cereals are full of sugar."],
        ["Healthy and affordable","Healthy food doesn't have to be expensive: beans, lentils, eggs, cabbage, carrots, pap and seasonal fruit are good value.","A vegetable garden at home or school saves money."]],
    Q:[["Which is a cheap, healthy protein?",["lentils and beans","sweets","chips","cooldrink"],"Good value."],
       ["When comparing labels, choose the product with...",["less sugar and salt","more sugar","more salt","the brightest packet"],"Healthier choice."],
       ["Bleeding gums can be a sign of too little...",["vitamin C","sugar","fat","salt"],"Scurvy."],
       ["Type 2 diabetes is linked to...",["too much sugar and too little exercise","too much water","too many vegetables","sleeping"],"Lifestyle disease."]]}},
{ id:"n6g", T:1, t:"Food processing", s:"Preserving food and keeping it safe",
  L:[["Why process food?","Processing changes food to make it last longer, kill germs, make it safer, or make it tastier. Food spoils when bacteria and fungi grow on it.","Mould on old bread is a fungus."],
     ["Ways to preserve food","Drying (biltong, dried fruit), salting, smoking, freezing, cooling, canning, pickling in vinegar and adding sugar (jam) all slow down germs.","Biltong is meat that is salted, spiced and dried."],
     ["Processing for taste and safety","Cooking, pasteurising milk (heating to kill germs), and fermenting (making maas or amasi) also change food.","Pasteurised milk is safe to drink."]],
  A:{t:"match", p:"Match each food to the way it is preserved.", d:[["Biltong","Salting and drying"],["Jam","Adding sugar and heating"],["Pickled onions","Vinegar"],["Frozen peas","Freezing"],["Long-life milk","Heating (UHT) and sealing"]]},
  Q:[["Why does food spoil?",["bacteria and fungi grow on it","it gets lonely","it is too clean","light makes it grow"],"Germs."],
     ["How is biltong preserved?",["salting and drying","freezing","adding sugar","pickling"],"A South African favourite."],
     ["Pasteurising milk means...",["heating it to kill germs","freezing it","adding salt","drying it"],"Named after Louis Pasteur."],
     ["Why does a fridge slow down spoiling?",["germs grow slowly in the cold","it adds sugar","it removes water","it adds light"],"Cold slows growth."]],
  W:["Explain why dried fruit lasts longer than fresh fruit",["Germs need water to grow.","Drying removes most of the water from the fruit.","With little water, bacteria and fungi can't grow easily.","So dried fruit lasts for months."],"Drying removes the water germs need"],
  X:"Freezing doesn't kill most germs; it only stops them growing. Once food thaws, germs can grow again.",
  C:["Pickling uses...",["vinegar","sugar only","ice","smoke only"],"An acid."],
  H:{L:[["What germs need","Germs need warmth, moisture and food. Take away one of these and they slow down or stop.","Fridge: no warmth. Drying: no moisture. Sealed tin: no air and no new germs."],
        ["Food safety at home","Wash hands, keep raw meat away from other food, cook meat properly and store leftovers in the fridge.","Don't leave cooked food out in the heat for hours."]],
    Q:[["Drying food takes away...",["moisture","warmth","food","light"],"Germs need water."],
       ["Why keep raw meat apart from salad?",["to stop germs spreading","to keep colours nice","it's tradition","to save space"],"Cross-contamination."],
       ["Maas is made by...",["fermenting milk","drying milk","freezing milk","salting milk"],"Sour milk."],
       ["A sealed tin keeps food safe because...",["germs can't get in","it's shiny","it's cold","it adds salt"],"Airtight."]]}},
{ id:"n6i", T:2, t:"Solids, liquids & gases", s:"The particle model and changes of state",
  L:[["Everything is made of particles","All matter is made of tiny particles. How they are arranged and move makes something a solid, liquid or gas.","You can't see particles, even with a normal microscope."],
     ["Three states","Solids: particles packed tightly in fixed places, vibrating. Liquids: particles close together but able to slide past each other. Gases: particles far apart, moving fast in all directions.","Ice (solid), water (liquid), steam (gas)."],
     ["Changing state","Heating makes particles move faster. Melting: solid to liquid. Evaporation/boiling: liquid to gas. Cooling reverses it: condensation (gas to liquid) and freezing (liquid to solid).","Water drops on a cold bottle are condensation."]],
  A:{t:"match", p:"Match each change of state to its name.", d:[["Ice turns into water","Melting"],["Water turns into ice","Freezing"],["Water turns into water vapour","Evaporation"],["Water vapour turns into water","Condensation"],["Water bubbling hard in a hot pot","Boiling"]]},
  Q:[["In which state are particles furthest apart?",["gas","solid","liquid","all the same"],"Gases spread out."],
     ["Water droplets on a cold can come from...",["condensation","melting","freezing","the can leaking"],"Vapour cools into liquid."],
     ["What happens to particles when you heat them?",["they move faster","they stop moving","they shrink","they disappear"],"More energy."],
     ["Liquids take the shape of...",["their container","a cube always","nothing","a ball"],"Particles slide past each other."]],
  W:["Explain why a puddle disappears on a sunny day",["The sun heats the water in the puddle.","Particles at the surface gain energy and move faster.","Some escape into the air as water vapour: this is evaporation.","Over time all the water evaporates."],"The water evaporates into the air"],
  X:"Steam you can see from a kettle is actually tiny water droplets that have condensed. Real water vapour is invisible.",
  C:["Turning a liquid into a solid is called...",["freezing","melting","evaporating","condensing"],"Like water to ice."],
  H:{L:[["Act it out","Solid: stand close and just wiggle on the spot. Liquid: stay close but shuffle around each other. Gas: spread out and run around the room.","This shows how particles behave."],
        ["The water cycle uses changes of state","Water evaporates from oceans, condenses into clouds, falls as rain, and flows back to the sea.","Every rain shower is condensation in action."]],
    Q:[["Clouds form when water vapour...",["condenses","melts","freezes into stone","burns"],"Cools into droplets."],
       ["Which state keeps its own shape?",["solid","liquid","gas","steam"],"Particles fixed."],
       ["Wet washing dries on the line because of...",["evaporation","condensation","freezing","melting"],"Water leaves as vapour."],
       ["Melting chocolate in your hand shows...",["heat changing a solid to a liquid","cooling","condensation","evaporation"],"Your hand warms it."]]}},
{ id:"n6j", T:2, t:"Clean water", s:"Water resources, pollution and purifying water",
  L:[["A precious resource","South Africa is a water-scarce country. We get water from rivers, dams and underground water (groundwater). Only a tiny part of Earth's water is fresh and easy to use.","The Vaal Dam supplies water to Gauteng."],
     ["Water pollution","Water can be polluted by litter, sewage, chemicals from factories and farms, and oil. Polluted water can spread diseases like cholera.","Never throw rubbish into rivers or storm drains."],
     ["Making water safe","Water treatment works clean water by letting dirt settle, filtering it through sand and gravel, and adding chlorine to kill germs. At home, boiling water for one minute kills germs.","Wetlands are nature's water filters."]],
  A:{t:"order", p:"Put the steps of cleaning water at a treatment works in order.", d:["Collect water from a river or dam","Let the dirt settle to the bottom","Filter the water through sand and gravel","Add chlorine to kill germs","Pump clean water to homes"]},
  Q:[["Which disease can spread through dirty water?",["cholera","chickenpox","flu","measles"],"Waterborne disease."],
     ["How can you make water safe to drink at home?",["boil it for a minute","add sugar","stir it","put it in the sun for a minute"],"Kills germs."],
     ["Why add chlorine to water?",["to kill germs","to colour it","to make it sweet","to make it fizzy"],"Disinfects."],
     ["Wetlands help by...",["filtering and cleaning water","making water dirty","drying up rivers","stopping rain"],"Natural filters."]],
  W:["Build a simple water filter",["Cut a plastic bottle and turn the top half upside down as a funnel.","Layer from the bottom: cotton wool, fine sand, coarse sand, small stones.","Pour muddy water through and collect it.","The water comes out clearer, but it still isn't safe to drink until boiled."],"Layers of stones, sand and cotton wool; boil the water afterwards"],
  X:"Clear water isn't always safe water. Germs are too small to see, so filtered water still needs boiling or chlorine.",
  C:["Water stored underground is called...",["groundwater","seawater","rainwater","tap water"],"In rocks and soil."],
  H:{L:[["Save water","Close taps while brushing teeth, fix leaks, take short showers and reuse washing water on the garden.","A dripping tap can waste thousands of litres in a year."],
        ["Day Zero","In 2018, Cape Town almost ran out of water during a severe drought. People cut their water use to about 50 litres a day each to avoid 'Day Zero'.","Every drop saved helped."]],
    Q:[["Why did Cape Town fear 'Day Zero' in 2018?",["the dams were nearly empty because of drought","there was too much rain","the sea dried up","pipes were made of gold"],"Severe drought."],
       ["Which saves the most water?",["fixing a leaking tap","leaving it dripping","long baths","washing cars with a hose"],"Stops waste."],
       ["Filtered water should still be...",["boiled before drinking","frozen","sold","thrown away"],"Germs may remain."],
       ["Which pollutes water?",["dumping oil down a drain","planting trees","protecting wetlands","picking up litter"],"Oil spreads."]]}},
{ id:"n6k", T:3, t:"Mains electricity", s:"How power is generated and used safely",
  L:[["Generating electricity","Power stations turn other energy into electrical energy. Most of South Africa's power comes from burning coal. Koeberg near Cape Town is a nuclear power station.","Eskom runs most of the country's power stations."],
     ["Renewable energy","Renewable sources won't run out: sunlight (solar panels), wind (wind turbines) and moving water (hydro-electric). They also pollute less than coal.","Wind farms can be seen in the Eastern Cape."],
     ["Cost and safety","Electricity costs money and burning coal pollutes the air. Illegal connections are very dangerous and can kill. Use electricity wisely and safely.","Switching off lights and geysers saves money."]],
  A:{t:"sort", p:"Is it a renewable or non-renewable energy source?", b:["Renewable","Non-renewable"], d:[["Sunlight",0],["Coal",1],["Wind",0],["Petrol",1],["Moving water",0],["Natural gas",1]]},
  Q:[["Where does most of South Africa's electricity come from?",["coal power stations","wind farms","the moon","batteries"],"Coal is still the main source."],
     ["Which energy source is renewable?",["the sun","coal","oil","natural gas"],"It won't run out."],
     ["Koeberg is a...",["nuclear power station","coal mine","wind farm","dam"],"Near Cape Town."],
     ["Why are illegal electricity connections dangerous?",["they can cause electrocution and fires","they save money","they are safer","they make lights brighter"],"Deadly."]],
  W:["Trace the energy changes in a coal power station",["Coal stores chemical energy.","Burning coal releases heat energy that boils water into steam.","The steam spins a turbine (movement energy).","The turbine turns a generator, which makes electrical energy."],"Chemical → heat → movement → electrical"],
  X:"Renewable doesn't mean free or pollution-free forever, but these sources won't run out like coal and oil will.",
  C:["Solar panels change sunlight into...",["electrical energy","coal","water","sound"],"Solar power."],
  H:{L:[["Why save electricity?","Less electricity used means less coal burnt, less air pollution and lower bills.","Use LED bulbs, switch off appliances at the wall and boil only the water you need."],
        ["Load shedding","When there isn't enough electricity for everyone, Eskom switches off areas in turn to stop the whole grid failing.","Using less electricity at peak times helps prevent it."]],
    Q:[["Why does Eskom use load shedding?",["to stop the whole grid failing when there isn't enough power","to save candles","to test lights","for fun"],"Protects the grid."],
       ["Which bulbs use the least electricity?",["LED bulbs","old filament bulbs","candles","torches"],"Efficient."],
       ["Burning coal causes...",["air pollution","cleaner air","more rain","nothing"],"Smoke and gases."],
       ["A turbine is turned by...",["steam, wind or water","electricity","light","sound"],"Movement energy."]]}},
{ id:"n6l", T:3, t:"Circuits that solve problems", s:"Using switches and circuits in useful systems",
  L:[["Circuits as systems","An electric system has an input (switch), a process (circuit) and an output (light, buzzer, motor).","A doorbell: press the button (input), circuit closes (process), bell rings (output)."],
     ["Series and parallel","In a series circuit, everything is in one loop: if one bulb breaks, all go off. In a parallel circuit, each bulb has its own path: if one breaks, the others stay on.","Homes are wired in parallel."],
     ["Designing a solution","Engineers design circuits to solve problems: burglar alarms, night lights, steady-hand games and torches.","A pressure switch under a mat can trigger an alarm when someone steps on it."]],
  A:{t:"order", p:"Put the design process for an alarm circuit in order.", d:["Identify the problem: someone keeps taking my snacks","Investigate: how do alarms work?","Design: draw the circuit with a switch, cell and buzzer","Make: build and connect the circuit","Evaluate: test it and improve it"]},
  Q:[["In a series circuit, if one bulb breaks...",["all the bulbs go off","only that bulb goes off","the others get brighter","nothing happens"],"One loop."],
     ["Why are homes wired in parallel?",["so one broken light doesn't switch off everything","it's cheaper","it uses fewer wires","to make lights flicker"],"Separate paths."],
     ["In a doorbell, the button is the...",["input","output","process","cell"],"You press it."],
     ["Which output device makes sound?",["a buzzer","a bulb","a switch","a cell"],"Buzzers buzz."]],
  W:["Design a steady-hand game",["Bend a bare wire into a wavy track and connect one end to a cell and buzzer.","Make a loop of wire on a handle and connect it to the other side of the circuit.","When the loop touches the track, the circuit closes and the buzzer sounds.","Players must move the loop along without touching."],"Touching the wire completes the circuit and sounds the buzzer"],
  X:"Adding more cells makes bulbs brighter, but too much can blow them. Match the cells to what the bulb can handle.",
  C:["What is the output in a torch?",["light","the switch","the cell","the wire"],"What it produces."],
  H:{L:[["Draw it with symbols","Circuit diagrams use symbols: a cell (long and short line), bulb (circle with a cross), switch (a gap with a lever), buzzer and wires (straight lines).","Diagrams make circuits easy to plan and share."],
        ["Fault-finding","If a circuit doesn't work, check: is the cell flat? Is the switch closed? Are all connections tight? Is the bulb broken?","Test one part at a time."]],
    Q:[["First thing to check if a circuit doesn't work?",["the cell and connections","the colour of the wires","the table","the weather"],"Common faults."],
       ["A circle with a cross in a circuit diagram is a...",["bulb","cell","switch","buzzer"],"Lamp symbol."],
       ["In a parallel circuit, each bulb has...",["its own path","the same single loop","no wires","no cell"],"Separate branches."],
       ["A pressure-mat alarm switch is closed by...",["someone stepping on it","sunlight","sound","heat"],"Weight presses it."]]}},
{ id:"n6m", T:4, t:"The Moon", s:"How the Moon moves and why it changes shape",
  L:[["Earth's satellite","The Moon orbits Earth about once every 27 days. It spins at the same speed, so we always see the same side.","The far side of the Moon can't be seen from Earth."],
     ["Phases of the Moon","The Moon doesn't make its own light; it reflects sunlight. As it orbits, we see different amounts of the lit half: new moon, waxing crescent, first quarter, waxing gibbous, full moon, then waning back.","A full cycle of phases takes about 29,5 days."],
     ["Effects on Earth","The Moon's gravity pulls on Earth's oceans and causes tides: the sea rises and falls about twice a day.","Spring tides (extra high) happen at full and new moon."]],
  A:{t:"order", p:"Put the Moon's phases in order, starting from new moon.", d:["New moon","Waxing crescent","First quarter","Waxing gibbous","Full moon","Waning gibbous","Last quarter","Waning crescent"]},
  Q:[["Why does the Moon seem to change shape?",["we see different amounts of its sunlit side","it breaks into pieces","clouds cover it","it makes its own light"],"Phases."],
     ["What causes ocean tides?",["the Moon's gravity","wind only","fish swimming","boats"],"Pull of the Moon."],
     ["How long is one cycle of Moon phases?",["about 29,5 days","24 hours","one year","one week"],"About a month."],
     ["Why do we always see the same side of the Moon?",["it spins once for each orbit","it doesn't spin","it's flat","the other side is dark"],"Same speed."]],
  W:["Explain why we can't see the Moon at new moon",["At new moon, the Moon is between Earth and the Sun.","The Sun lights up the side of the Moon facing away from us.","The side facing Earth is dark.","So the Moon is almost invisible."],"The lit side faces away from Earth"],
  X:"Moon phases are not caused by Earth's shadow. That's a lunar eclipse, which is rare. Phases are about how much of the sunlit side we can see.",
  C:["'Waxing' means the lit part of the Moon is...",["growing","shrinking","disappearing","red"],"Getting bigger."],
  H:{L:[["Ball and lamp model","In a dark room, hold a ball at arm's length and turn slowly in a circle around a lamp. Watch how much of the lit side you see.","This shows all the phases."],
        ["Lunar eclipse","A lunar eclipse happens when Earth is exactly between the Sun and Moon, and Earth's shadow falls on the Moon. It can make the Moon look red.","It only happens at full moon."]],
    Q:[["A lunar eclipse happens when...",["Earth's shadow falls on the Moon","the Moon is behind the Sun","clouds cover the Moon","it is new moon"],"Earth blocks sunlight."],
       ["'Waning' means the lit part is...",["shrinking","growing","full","new"],"Getting smaller."],
       ["How long does the Moon take to orbit Earth?",["about 27 days","about 365 days","24 hours","7 days"],"About a month."],
       ["Spring tides happen at...",["full moon and new moon","only in spring","every hour","never"],"Sun and Moon line up."]]}},
{ id:"n6n", T:4, t:"Exploring space", s:"Telescopes, rockets and rovers",
  L:[["Telescopes","Optical telescopes collect light to see distant objects. Radio telescopes collect radio waves from space. South Africa has SALT (Sutherland) and the MeerKAT radio telescope (Karoo), part of the Square Kilometre Array (SKA).","SALT is one of the largest single optical telescopes in the southern hemisphere."],
     ["Rockets","Rockets push hot gases out of the back at high speed, which pushes the rocket forward and up. They must be powerful enough to escape Earth's gravity.","For every action there's an equal and opposite reaction."],
     ["Exploring the Moon and Mars","Astronauts walked on the Moon in 1969. Robots called rovers explore Mars, taking photos and testing soil and rocks.","Mars rovers are controlled from Earth."]],
  A:{t:"match", p:"Match each space tool to its job.", d:[["Optical telescope","Collects light to see distant objects"],["Radio telescope","Collects radio waves from space"],["Rocket","Carries things into space"],["Rover","Robot vehicle that explores a planet's surface"],["Satellite","Orbits Earth to send signals or take pictures"]]},
  Q:[["What is MeerKAT?",["a radio telescope in South Africa","an animal on Mars","a rocket","a Moon base"],"In the Karoo."],
     ["When did humans first walk on the Moon?",["1969","1994","2010","1652"],"Apollo 11."],
     ["How does a rocket move upwards?",["it pushes hot gas out of the back","it flaps wings","it's pulled by a rope","it floats on air"],"Action and reaction."],
     ["Why are telescopes built in dry, remote places like Sutherland?",["dark, clear skies","to be near shops","because it rains a lot","to hide them"],"Less light pollution."]],
  W:["Explain why we send rovers to Mars instead of people (for now)",["Mars is very far: a trip takes many months.","There's no breathable air, it's very cold and there's dangerous radiation.","Robots don't need food, air or water and can work for years.","So rovers explore safely and send data back to Earth."],"Rovers are safer and can work in harsh conditions"],
  X:"Radio telescopes don't 'listen' for sounds. They detect radio waves, which are a kind of light our eyes can't see.",
  C:["SALT is in...",["Sutherland, Northern Cape","Durban","Pretoria","Mars"],"A dark Karoo town."],
  H:{L:[["Balloon rocket","Blow up a balloon, tape it to a straw threaded on a string, and let go. The air rushing out the back pushes the balloon forward.","That's the same principle as a real rocket."],
        ["Satellites in daily life","Satellites help with weather forecasts, GPS maps, TV and phone signals.","Your phone's map uses satellites to find where you are."]],
    Q:[["A balloon rocket moves because...",["air rushes out the back","it's magnetic","gravity pulls it sideways","the string pulls it"],"Action and reaction."],
       ["GPS on a phone uses...",["satellites","telescopes","rovers","rockets on the ground"],"Signals from orbit."],
       ["The SKA is a project to build...",["a huge network of radio telescopes","a Moon base","a rocket factory","a Mars rover"],"Square Kilometre Array."],
       ["Which explores the surface of Mars?",["a rover","a telescope on Earth","a submarine","an aeroplane"],"Robot vehicle."]]}}
];
G6_MORE.ss = [
{ id:"s6e", T:1, t:"World map skills", s:"Continents, oceans, atlases and scale",
  L:[["Continents and oceans","There are seven continents: Africa, Asia, Europe, North America, South America, Australia (Oceania) and Antarctica. The five oceans are the Pacific, Atlantic, Indian, Southern and Arctic.","South Africa lies between the Atlantic and Indian oceans."],
     ["Using an atlas","An atlas is a book of maps. Use the contents page or the index (with grid references or coordinates) to find places.","Look up 'Nairobi' in the index to find its page and position."],
     ["Scale","Scale shows how much smaller the map is than real life. It can be a word scale (1 cm represents 10 km), a line (bar) scale or a number scale (1 : 1 000 000).","On a 1 : 100 000 map, 1 cm = 100 000 cm = 1 km."]],
  A:{t:"match", p:"Match each place to its continent.", d:[["Egypt","Africa"],["Brazil","South America"],["India","Asia"],["France","Europe"],["Canada","North America"]]},
  Q:[["How many continents are there?",["7","5","6","9"],"Africa is the second largest."],
     ["Which is the largest ocean?",["Pacific","Atlantic","Indian","Arctic"],"It covers about a third of Earth."],
     ["In an atlas, where do you look up a place name?",["the index","the cover","the scale","the key"],"At the back."],
     ["A scale of 1 cm = 50 km. Two cities are 6 cm apart. Real distance?",["300 km","56 km","50 km","3 000 km"],"6 × 50."]],
  W:["A map scale is 1 : 500 000. What is 4 cm on the map in real life?",["1 cm on the map = 500 000 cm in real life.","500 000 cm = 5 000 m = 5 km.","4 cm = 4 × 5 km = 20 km."],"20 km"],
  X:"A large-scale map shows a small area in lots of detail (like a town). A small-scale map shows a big area with little detail (like the world).",
  C:["Which ocean lies to the east of South Africa?",["Indian","Atlantic","Pacific","Arctic"],"Durban is on the Indian Ocean."],
  H:{L:[["Remember the continents","Use the rhyme of names and the shape: Africa in the middle, Europe above it, Asia to the right, the Americas to the left, Australia bottom right, Antarctica at the bottom.","Draw a rough world map from memory to practise."],
        ["Converting number scales","Change the scale from cm to km by removing five zeros (100 000 cm = 1 km).","1 : 250 000 → 1 cm = 2,5 km."]],
    Q:[["A scale of 1 : 200 000 means 1 cm equals...",["2 km","20 km","200 km","0,2 km"],"Remove 5 zeros."],
       ["Which continent is at the South Pole?",["Antarctica","Australia","South America","Africa"],"Covered in ice."],
       ["A map of your town is a...",["large-scale map","small-scale map","world map","globe"],"Lots of detail."],
       ["Which ocean lies west of South Africa?",["Atlantic","Indian","Pacific","Southern only"],"Cape Town's west coast."]]}},
{ id:"s6f", T:2, t:"Explorers from Europe", s:"Why and how Europeans sailed to southern Africa",
  L:[["Why explore?","In the 1400s, Europeans wanted spices, silk and gold from Asia. Land routes were long and controlled by others, so Portugal searched for a sea route around Africa.","Spices like pepper and cloves were worth more than gold."],
     ["Dias and da Gama","Bartolomeu Dias sailed around the southern tip of Africa in 1488 and named it the Cape of Storms. Vasco da Gama sailed around the Cape to India in 1497 and 1498.","The king renamed it the Cape of Good Hope."],
     ["Ships and navigation","Explorers used caravels (small, fast ships) and navigated with a compass, an astrolabe and maps. Sailors faced storms, scurvy and long months at sea.","Scurvy was caused by a lack of vitamin C."]],
  A:{t:"order", p:"Put these events in order.", d:["1400s: Europe wants a sea route to the spices of Asia","1488: Dias sails around the southern tip of Africa","1497: Da Gama sets sail for India","1498: Da Gama reaches India","1652: The Dutch set up a refreshment station at the Cape"]},
  Q:[["Who first sailed around the southern tip of Africa?",["Bartolomeu Dias","Jan van Riebeeck","Mansa Musa","Christopher Columbus"],"In 1488."],
     ["Why did Europeans want a sea route to Asia?",["to trade for spices and silk","to find penguins","to build schools","to escape snow"],"Valuable goods."],
     ["What did Dias first call the Cape?",["the Cape of Storms","Table Bay","the Cape of Diamonds","Robben Island"],"Later Good Hope."],
     ["Which tool helped sailors find their direction?",["a compass","a thermometer","a calculator","a telescope only"],"Points north."]],
  W:["Explain how the Khoikhoi and the Portuguese first interacted",["Portuguese ships stopped along the coast for fresh water and meat.","They traded with the Khoikhoi for cattle and sheep.","Misunderstandings and disputes over cattle and water led to fighting, such as in 1510 at Table Bay.","Contact was mostly short visits, not settlement."],"Trade at first, then conflict over cattle and water"],
  X:"The explorers didn't 'discover' southern Africa. People had lived here for thousands of years before Europeans arrived.",
  C:["Vasco da Gama reached...",["India","America","Australia","China"],"In 1498."],
  H:{L:[["Life on board","Ships were crowded and dirty. Food was dry biscuits and salted meat. Many sailors died of scurvy, storms and disease.","Long voyages could take many months."],
        ["Effects of exploration","The sea route opened trade between Europe and Asia and later led to European settlement and colonisation in southern Africa.","It changed the lives of the Khoikhoi and San."]],
    Q:[["Scurvy was caused by...",["a lack of vitamin C","too much salt water","sunburn","seasickness"],"No fresh fruit."],
       ["What was a caravel?",["a small, fast sailing ship","a camel","a compass","a fort"],"Portuguese ship."],
       ["Why is 'discovered' the wrong word for Dias's arrival?",["people already lived here","nobody lived here","he never arrived","it was underwater"],"Khoikhoi and San were here."],
       ["What did exploration later lead to in southern Africa?",["colonisation","the end of trade","the first farmers","Mapungubwe"],"Settlement by Europeans."]]}},
{ id:"s6g", T:3, t:"Climate & vegetation", s:"World climate regions and the plants that grow there",
  L:[["Climate and vegetation are linked","Temperature and rainfall decide what plants can grow. Natural vegetation is what grows without people planting it.","Rainforests need lots of rain; deserts have little."],
     ["Hot regions","Tropical rainforests (near the Equator): hot and wet all year, tall trees. Savanna: hot with wet summers and dry winters, grass and scattered trees. Deserts: very dry, few plants such as cacti and succulents.","The Kruger Park is savanna; the Namib is a desert."],
     ["Cooler regions","Mediterranean climate: hot dry summers and wet winters (like Cape Town's fynbos). Temperate grasslands: warm summers, cold winters. Coniferous forests and tundra are found in cold places.","The Highveld grasslands are temperate grasslands."]],
  A:{t:"match", p:"Match each climate region to its vegetation.", d:[["Tropical rainforest","Tall trees and thick plant growth"],["Savanna","Grass and scattered trees"],["Desert","Succulents and few plants"],["Mediterranean","Fynbos and low bushes"],["Tundra","Mosses and lichens, no trees"]]},
  Q:[["Where are tropical rainforests found?",["near the Equator","at the poles","only in South Africa","in deserts"],"Hot and wet."],
     ["Which climate has hot dry summers and wet winters?",["Mediterranean","tropical rainforest","tundra","savanna"],"Like Cape Town."],
     ["The Kruger National Park is mainly...",["savanna","rainforest","tundra","desert"],"Grass and trees."],
     ["How are desert plants adapted?",["they store water","they have huge thin leaves","they need daily rain","they float"],"Succulents."]],
  W:["Explain why fynbos grows in the Western Cape",["The south-western Cape has a Mediterranean climate.","Summers are hot and dry; winters are cool and wet.","Fynbos plants have small, tough leaves that save water in summer.","Some even need fire to release their seeds."],"Fynbos is adapted to the Mediterranean climate"],

{ id:"s6h", T:4, t:"Population: where people live", s:"Why people live where they do",
  L:[["Population distribution","People are not spread evenly across the world. Some areas are crowded (densely populated) and some have few people (sparsely populated).","Gauteng is densely populated; the Karoo is sparsely populated."],
     ["Why people settle where they do","People are attracted to places with water, flat land, fertile soil, a mild climate, jobs and services. They avoid deserts, very high mountains and very cold places.","Many cities grew near rivers, ports and mines."],
     ["World population","The world has more than 8 billion people. Asia has the most people. Big cities with millions of people are called megacities.","Lagos, Cairo and Kinshasa are huge African cities."]],
  A:{t:"sort", p:"Would this attract people or keep them away?", b:["Attracts people","Keeps people away"], d:[["Fresh water nearby",0],["A very dry desert",1],["Lots of jobs",0],["Extremely cold weather",1],["Flat, fertile land",0],["Steep, rocky mountains",1]]},
  Q:[["Which continent has the most people?",["Asia","Africa","Europe","Australia"],"China and India are there."],
     ["A sparsely populated area has...",["few people","many people","only cities","only children"],"Spread out."],
     ["Why did many cities grow near rivers?",["for water, transport and farming","because rivers are pretty","to avoid people","because it's cold"],"Water is vital."],
     ["About how many people live in the world today?",["more than 8 billion","8 million","800","80 billion"],"And growing."]],
  W:["Explain why the Northern Cape has so few people",["It is very dry, with low rainfall.","Much of the soil isn't good for farming.","There are fewer cities and jobs.","So people tend to live in other provinces."],"Dry climate, poor farming conditions and fewer jobs"],
  X:"A big area doesn't mean many people. The Northern Cape is the largest province but has the fewest people.",
  C:["A densely populated area is...",["crowded with people","empty","a desert","a forest"],"Many people per km²."],
  H:{L:[["Physical and human factors","Physical factors are natural (water, climate, soil, landforms). Human factors are made by people (jobs, roads, schools, hospitals).","A new mine (human factor) can make a town grow fast."],
        ["Using a dot map","On a dot map, each dot stands for a number of people. Crowded dots show dense population.","Dots crowd around Johannesburg and Durban."]],
    Q:[["Which is a human factor attracting people?",["jobs","rainfall","soil","temperature"],"Made by people."],
       ["Which is a physical factor?",["climate","schools","roads","hospitals"],"Natural."],
       ["On a dot map, lots of dots close together show...",["dense population","no people","mountains","rivers only"],"Crowded."],
       ["A city with more than 10 million people is a...",["megacity","village","hamlet","suburb"],"Very large."]]}},
{ id:"s6i", T:4, t:"National orders & medal winners", s:"How South Africa honours people who made a difference",

     ["Nobel Peace Prize winners","Four South Africans have won the Nobel Peace Prize: Albert Luthuli (1960), Desmond Tutu (1984), and Nelson Mandela and F.W. de Klerk (1993).","They were honoured for working for peace and an end to apartheid."]],

  Q:[["Who awards national orders in South Africa?",["the President","a school principal","the mayor","a sports coach"],"The highest honours."],
     ["Who was the first South African to win the Nobel Peace Prize?",["Albert Luthuli","Desmond Tutu","Nelson Mandela","F.W. de Klerk"],"In 1960."],
     ["Which order honours artists and sportspeople?",["Order of Ikhamanga","Order of Mendi for Bravery","Order of Luthuli","Order of the Baobab"],"Arts, culture, sport."],
     ["In which year did Mandela and de Klerk share the Nobel Peace Prize?",["1993","1994","1960","1984"],"Just before the 1994 election."]],
  W:["Choose a suitable order for a firefighter who saved children from a burning building",["What did they do? An act of great bravery.","Which order honours bravery? The Order of Mendi for Bravery.","It is named after the SS Mendi, a ship that sank in 1917 with many South African soldiers on board."],"The Order of Mendi for Bravery"],
  X:"National orders aren't only for politicians. Artists, scientists, sportspeople, teachers and ordinary heroes have received them.",

       ["The SS Mendi was...",["a ship that sank in 1917 with South African soldiers","a mine","a school","a mountain"],"The bravery order is named after it."],
       ["Which order honours foreign friends of South Africa?",["Order of the Companions of O.R. Tambo","Order of Ikhamanga","Order of Mendi","Order of the Baobab"],"Foreign leaders."],

     ["Effects on the body","Smoking damages the lungs and heart. Alcohol affects the brain and judgement. Drugs can cause addiction, mental illness and even death.","Nicotine is very addictive."],
     ["Saying no and getting help","Say no firmly, give a reason, walk away and choose friends who respect you. If you or someone you know needs help, talk to a trusted adult or call the SANCA helpline.","\"No thanks, I want to keep my lungs healthy for soccer.\""]],

     ["Alcohol mainly affects the...",["brain and judgement","toenails","hair colour","eyesight only"],"Poor decisions."],

  X:"Vapes are not harmless 'flavoured air'. Most contain nicotine and chemicals that harm young lungs and brains.",
  C:["Addiction means...",["the body and mind feel they can't stop using something","you like something a little","a healthy habit","a type of sport"],"Hard to quit."],

{ id:"l6e", t:"Self-concept & achievement", s:"Knowing your strengths and setting goals",
  L:[["Self-concept","Your self-concept is how you see yourself: your strengths, interests, values and things you'd like to improve. A positive self-concept helps you try new things.","\"I'm a good listener and I'm getting better at maths.\""],
     ["Achievements","Celebrate achievements, big and small. Effort counts, not just winning.","Improving from 40% to 55% is an achievement."],
     ["Setting goals","Set goals that are specific and realistic, with a time limit. Break big goals into small steps.","Goal: read one chapter book a month. Step 1: get a library book this week."]],
  A:{t:"order", p:"Put the steps of reaching a goal in order.", d:["Choose a specific goal","Break it into small steps","Set a deadline","Work on one step at a time","Check your progress and celebrate"]},
  Q:[["Self-concept is...",["how you see yourself","your height","your favourite food","your address"],"Your view of yourself."],
     ["Which goal is the most specific?",["Practise spelling 10 words every evening this week.","Be better at school.","Try harder someday.","Be the best."],"Clear and measurable."],
     ["Why celebrate small achievements?",["it builds confidence and motivation","it wastes time","to show off","it doesn't matter"],"Keep going."],
     ["If a goal feels too big, you should...",["break it into small steps","give up","ignore it","change friends"],"One step at a time."]],
  W:["Make a goal from 'I want to get fitter'",["Specific: run without stopping.","Measurable: for 15 minutes.","Realistic steps: run 5 minutes this week, 10 next week, 15 the week after.","Deadline: in three weeks."],"I will run for 15 minutes without stopping in three weeks, adding 5 minutes each week."],
  X:"Comparing yourself to others can hurt your self-concept. Compare yourself to who you were last month instead.",
  C:["A realistic goal is one that...",["you can actually achieve","is impossible","has no steps","someone else chose"],"Achievable."],
  H:{L:[["Strengths and growth areas","Everyone has strengths and areas to grow. List three of each, and ask a friend or family member what they see in you.","Strength: kind. Growth area: speaking in front of the class."],
        ["Learning from setbacks","When something goes wrong, ask: what can I learn? What will I do differently next time?","Mistakes are part of learning."]],
    Q:[["After a poor test mark, a helpful thought is...",["\"What can I learn from this?\"","\"I'm hopeless.\"","\"I'll never try again.\"","\"It's someone else's fault.\""],"Growth mindset."],
       ["Who should you compare yourself with?",["your past self","famous people","everyone online","your siblings"],"Track your own progress."],
       ["A growth area is...",["something you want to improve","something you're best at","a garden","a hobby"],"Room to grow."],
       ["Why ask others about your strengths?",["they may see things you don't","to get compliments only","to argue","no reason"],"Another view."]]}},
{ id:"l6f", t:"Creative Arts: visual art & design", s:"Proportion, perspective, pattern and design",
  L:[["Proportion and perspective","Proportion is how parts relate in size to each other. Perspective makes things look 3D on flat paper: things further away look smaller, and parallel lines meet at a vanishing point.","A road drawn narrowing to a point looks like it goes into the distance."],
     ["Pattern and rhythm","Repeated shapes, lines and colours make patterns. Many South African crafts use bold patterns.","Ndebele wall painting and Zulu beadwork use geometric patterns."],
     ["Design with a purpose","Design is art with a job: a poster, a logo or a package. Think about the message, the audience and clear, simple images.","A logo should be easy to recognise even when small."]],
  A:{t:"match", p:"Match each art term to its meaning.", d:[["Perspective","Making flat drawings look 3D"],["Vanishing point","Where parallel lines seem to meet"],["Proportion","How sizes of parts relate"],["Pattern","Repeated shapes, lines or colours"],["Logo","A simple design that represents a group or company"]]},
  Q:[["In perspective drawing, objects further away look...",["smaller","bigger","brighter","the same"],"Distance shrinks them."],
     ["Zulu beadwork is known for...",["colourful geometric patterns","oil paintings","marble statues","photographs"],"Patterns with meaning."],
     ["A good logo should be...",["simple and easy to recognise","very detailed and tiny","full of words","always grey"],"Clear."],
     ["The point where parallel lines meet in a drawing is the...",["vanishing point","horizon line","border","frame"],"Perspective."]],
  W:["Draw a road going into the distance",["Draw a horizon line across the page.","Mark a vanishing point in the middle of the horizon.","Draw two lines from the bottom corners to the vanishing point: that's the road.","Draw trees getting smaller as they get closer to the vanishing point."],"Lines meet at a vanishing point; objects shrink with distance"],
  X:"Don't draw far-away objects the same size as near ones; the picture will look flat.",
  C:["What does a design need to think about?",["its message and audience","only its colour","nothing","only its size"],"Purpose."],
  H:{L:[["Body proportions","In a standing figure, the body is about 7 heads tall, and the elbows are at about waist level.","Use this guide to draw people."],
        ["Talking about art","Describe what you see, analyse how it was made (lines, colour, pattern), interpret what it means, and give your opinion with reasons.","'I think the bright colours show joy.'"]],
    Q:[["About how many heads tall is a standing adult figure?",["7","3","12","1"],"A useful guide."],
       ["When talking about art, giving reasons for your opinion is...",["important","not needed","rude","only for teachers"],"Support it."],
       ["Ndebele wall painting is known for...",["bold geometric shapes and colours","watercolour landscapes","clay pots","sculptures"],"Bright patterns."],
       ["A poster for a school play needs...",["the title, date, time and place","only a picture","no words","the script"],"Key information."]]}},
{ id:"l6g", t:"Creative Arts: music & performance", s:"Note values, South African music styles and performing",
  L:[["Note values","Music notes show how long a sound lasts. A semibreve lasts 4 beats, a minim 2 beats, a crotchet 1 beat and a quaver half a beat.","Two quavers = one crotchet."],
     ["South African music","South Africa has many styles: isicathamiya (Ladysmith Black Mambazo), maskandi, kwela (penny whistle), mbaqanga, kwaito, gospel and amapiano.","Kwela music became popular with the penny whistle in the 1950s."],
     ["Performing together","In drama and dance, plan a beginning, middle and end, use levels (high, middle, low), and work as a team. Respond to the audience and stay in character.","A freeze-frame is a still picture made by actors."]],
  A:{t:"match", p:"Match each note to its number of beats.", d:[["Semibreve","4 beats"],["Minim","2 beats"],["Crotchet","1 beat"],["Quaver","Half a beat"]]},
  Q:[["How many crotchets equal one minim?",["2","4","1","8"],"2 × 1 beat."],
     ["Kwela music is famous for which instrument?",["penny whistle","violin","bagpipes","harp"],"A tin whistle."],
     ["Ladysmith Black Mambazo sing which style?",["isicathamiya","rock","opera","jazz only"],"A cappella Zulu singing."],
     ["A freeze-frame in drama is...",["a still picture made by actors","a cold room","a type of dance","a song"],"Like pausing a video."]],
  W:["Work out the total beats in: minim, crotchet, crotchet",["Minim = 2 beats.","Crotchet = 1 beat, twice = 2 beats.","Total: 2 + 2 = 4 beats."],"4 beats (one full bar in 4/4 time)"],
  X:"Don't confuse the beat with the notes. A minim isn't 'two notes'; it's one sound held for two beats.",
  C:["How many beats does a semibreve last?",["4","2","1","half"],"The longest of these."],
  H:{L:[["Clap the notes","Say 'ta' for a crotchet (1 beat), 'ta-a' for a minim (2 beats), and 'ti-ti' for two quavers (1 beat together).","Clapping helps you feel note lengths."],
        ["Levels and space in performance","Use high levels (standing tall, jumping), middle (crouching) and low (on the floor) to make dance and drama interesting.","Changing levels keeps the audience watching."]],
    Q:[["'ti-ti' (two quavers) together last...",["1 beat","2 beats","4 beats","half a beat"],"Like one crotchet."],
       ["Which is a low level in dance?",["lying or kneeling on the floor","jumping","standing tall","stretching up"],"Close to the ground."],
       ["Amapiano is a...",["South African music style","type of instrument","dance move only","classical opera"],"Popular house-music style."],
       ["How many quavers equal a minim?",["4","2","1","8"],"Each quaver is half a beat."]]}},
{ id:"l6h", t:"Physical education", s:"Team games, rules and fitness",
  L:[["Team games","Team games like soccer, netball and cricket need communication, cooperation and positions. Each player has a role.","In netball, players stay in certain areas of the court."],
     ["Rules and sportsmanship","Rules keep games fair and safe. Accept the referee's decisions, play fair, and win or lose with respect.","Shake hands with the other team after a match."],
     ["Fitness components","Fitness includes cardiovascular endurance, muscular strength, flexibility, speed, agility and coordination.","Skipping improves endurance and coordination."]],
  A:{t:"match", p:"Match each activity to the fitness part it improves most.", d:[["Long-distance running","Endurance"],["Push-ups","Strength"],["Stretching","Flexibility"],["Sprinting","Speed"],["Zigzag running between cones","Agility"]]},
  Q:[["Why do games have rules?",["to keep them fair and safe","to make them boring","to help one team cheat","there's no reason"],"Fairness and safety."],
     ["Agility means...",["changing direction quickly","lifting heavy things","sitting still","sleeping well"],"Quick changes."],
     ["Good sportsmanship includes...",["accepting the referee's decision","arguing every call","refusing to shake hands","blaming teammates"],"Respect."],
     ["Which activity builds flexibility?",["stretching","sprinting","lifting","sitting"],"Bending and reaching."]],
  W:["Plan a 20-minute fitness circuit",["Warm up: 3 minutes of jogging and arm circles.","Stations (2 minutes each): star jumps, push-ups, skipping, zigzag runs, stretches.","Rest 30 seconds between stations and drink water.","Cool down: walk and stretch for 3 minutes."],"Warm up, 5 stations, rests, cool down"],
  X:"Being competitive is fine, but winning at all costs isn't. Cheating or hurting others spoils the game for everyone.",
  C:["Which builds muscular strength?",["push-ups","stretching","walking slowly","sleeping"],"Working against resistance."],
  H:{L:[["Communication on the field","Call names, point, and use agreed signals. Teams that talk win more often.","\"Mine!\" or \"Pass left!\""],
        ["Preventing injuries","Warm up, wear the right shoes, drink water, use equipment properly and tell a teacher if you're hurt.","Never play through sharp pain."]],
    Q:[["What should you do if you get hurt during a game?",["stop and tell a teacher","keep playing through the pain","hide it","run harder"],"Get help."],
       ["Calling 'Pass left!' is an example of...",["communication","flexibility","strength","speed"],"Teamwork."],
       ["Which helps prevent injuries?",["warming up first","skipping water","wrong shoes","playing tired"],"Prepare the body."],
       ["Coordination means...",["moving different body parts together smoothly","lifting heavy weights","running far","sitting still"],"Like catching a ball."]]}}

{ id:"m7f", T:1, t:"Prime factors, HCF & LCM", s:"Breaking numbers into primes and using them",
  L:[["Prime factorisation","Every whole number bigger than 1 can be written as a product of prime numbers. Use a factor tree or repeated division.","60 = 2 × 2 × 3 × 5 = 2² × 3 × 5"],
     ["HCF with primes","The highest common factor (HCF) is the biggest number that divides into all the numbers. Multiply the prime factors they share.","24 = 2³ × 3 and 36 = 2² × 3². Shared: 2² × 3 = 12."],
     ["LCM with primes","The lowest common multiple (LCM) is the smallest number all the numbers divide into. Take each prime the most times it appears in any number.","24 = 2³ × 3, 36 = 2² × 3². LCM = 2³ × 3² = 72."]],
  A:{t:"fill", p:"Type your answers.", d:[["HCF of 18 and 24","6"],["LCM of 6 and 8","24"],["HCF of 45 and 75","15"],["LCM of 4, 5 and 6","60"],["The smallest prime factor of 91","7"]]},
  Q:[["What is the prime factorisation of 36?",["2² × 3²","4 × 9","2 × 18","6²"],"36 = 2 × 2 × 3 × 3, using only primes."],
     ["What is the HCF of 28 and 42?",["14","7","2","84"],"28 = 2² × 7, 42 = 2 × 3 × 7. Shared: 2 × 7."],
     ["What is the LCM of 9 and 12?",["36","108","3","72"],"9 = 3², 12 = 2² × 3. LCM = 2² × 3² = 36."],

  W:["Find the prime factorisation of 180",["Divide by the smallest prime: 180 ÷ 2 = 90.","Again by 2: 90 ÷ 2 = 45.","45 isn't even, so try 3: 45 ÷ 3 = 15, then 15 ÷ 3 = 5.","5 is prime. Collect them: 2 × 2 × 3 × 3 × 5."],"180 = 2² × 3² × 5"],

  C:["Which is the prime factorisation of 20?",["2² × 5","4 × 5","2 × 10","1 × 20"],"Only primes."],
  H:{L:[["Factor trees","Split the number into any two factors, then keep splitting until every branch ends in a prime. Circle the primes.","72 → 8 × 9 → (2 × 4) × (3 × 3) → 2 × 2 × 2 × 3 × 3."],
        ["When to use HCF or LCM","HCF: sharing or cutting things into the biggest equal groups. LCM: when things repeat and you want to know when they happen together.","Cutting 24 m and 36 m ropes into equal longest pieces: HCF = 12 m."]],
    Q:[["Two ropes, 24 m and 36 m, are cut into equal pieces as long as possible. How long is each piece?",["12 m","6 m","72 m","4 m"],"HCF."],
