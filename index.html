      ["A pie chart is best for showing...",["parts of a whole","change over time","exact large numbers","map directions"],"The whole circle is 100%."],
      ["What do you use to collect data by asking people questions?",["a questionnaire","a bar graph","a median","a protractor"],"Then you organise the answers."]]}
]},
{ id:"eng", name:"English", topics:[
 { id:"e6a", t:"Figures of speech", s:"Similes, metaphors, personification and sound words",
   L:[["Simile and metaphor","A simile compares using 'like' or 'as'. A metaphor says something IS something else.","Simile: as brave as a lion. Metaphor: the classroom was a zoo."],
      ["Personification","Personification gives human actions or feelings to things that are not human.","The wind whispered through the trees."],
      ["Sound devices","Alliteration repeats the same first sound. Onomatopoeia is a word that sounds like its meaning.","Alliteration: Sipho's seven silly sheep. Onomatopoeia: buzz, splash, boom."]],
   A:{t:"match", p:"Match each figure of speech to an example.", d:[["Simile","Her smile was as bright as the sun."],["Metaphor","My brother is a couch potato."],["Personification","The leaves danced in the wind."],["Alliteration","Busy bees buzz by the baobab."],["Onomatopoeia","The thunder went BOOM!"]]},
   Q:[["'He runs like a cheetah' is a...",["simile","metaphor","personification","onomatopoeia"],"It uses 'like' to compare."],
      ["Which word is onomatopoeia?",["sizzle","giant","quietly","happiness"],"Sizzle sounds like food frying."],
      ["'Time is a thief' is a...",["metaphor","simile","alliteration","rhyme"],"It says time IS a thief, without 'like' or 'as'."],
      ["'The old car coughed and groaned up the hill' uses...",["personification","simile","alliteration","rhyme"],"Cars can't really cough or groan like people."]]},
 { id:"e6b", t:"Direct & reported speech", s:"Changing what people said into reported speech",
   L:[["Direct speech","Direct speech gives the exact words, inside inverted commas.","\"I am hungry,\" said Zola."],
      ["Reported speech","Reported (indirect) speech tells what someone said, without inverted commas. Usually add 'that', and change the pronouns.","Zola said that she was hungry."],
      ["Words that change","The tense moves one step back. am/is become was, will becomes would, can becomes could, today becomes that day, here becomes there.","\"I will come today,\" said Sam. Sam said that he would come that day."]],
   A:{t:"match", p:"Match the direct speech to its reported speech.", d:[["\"I am tired,\" said Ben.","Ben said that he was tired."],["\"We will win,\" said the team.","The team said that they would win."],["\"I like maths,\" said Amy.","Amy said that she liked maths."],["\"It is raining,\" said Dad.","Dad said that it was raining."]]},
   Q:[["Change to reported speech: \"I can swim,\" said Nandi.",["Nandi said that she could swim.","Nandi said that I can swim.","Nandi said, \"she could swim.\"","Nandi says she can swim."],"can becomes could, and I becomes she."],
      ["Which sentence is direct speech?",["\"Close the gate,\" shouted Mr Dube.","Mr Dube shouted to close the gate.","Mr Dube said that the gate was closed.","The gate was closed by Mr Dube."],"It has the exact words in inverted commas."],
      ["In reported speech, 'will' usually becomes...",["would","shall","was","willed"],"The tense moves one step back."],
      ["Direct speech is written inside...",["inverted commas","brackets","full stops","capital letters"],"Also called quotation marks."]]},
 { id:"e6c", t:"Sentences & conjunctions", s:"Simple, compound and complex sentences",
   L:[["Simple sentences","A simple sentence has one main idea with one main verb.","The bus arrived."],
      ["Compound sentences","Two simple sentences joined with and, but, or, or so.","It rained, so we stayed inside."],
      ["Complex sentences","A main clause plus a clause that can't stand alone, joined with words like because, when, although or if.","We stayed inside because it rained."]],
   A:{t:"sort", p:"What kind of sentence is each one?", b:["Simple","Compound","Complex"], d:[["The dog barked.",0],["I was tired, but I finished my homework.",1],["When the bell rang, we ran outside.",2],["Mpho plays soccer.",0],["You can have tea or you can have juice.",1],["We cheered because our team scored.",2]]},
   Q:[["Choose the best conjunction: 'I wanted to play, ___ it was raining.'",["but","because","so","or"],"'But' shows a contrast."],
      ["Which is a complex sentence?",["Although she was scared, she jumped.","She jumped.","She was scared and she jumped.","Jump now!"],"'Although she was scared' can't stand on its own."],
      ["A compound sentence joins two simple sentences with...",["a word like and, but or so","a full stop","a question mark","an adjective"],"These are called coordinating conjunctions."],
      ["Which word is a conjunction?",["because","beautiful","quickly","table"],"It joins clauses together."]]},
 { id:"e6d", t:"Writing a friendly letter", s:"Layout, paragraphs and the writing process",
   L:[["Layout","Write your address in the top right corner with the date underneath. Start with a greeting like 'Dear Gogo,'.","Dear Lindiwe,"],
      ["Paragraphs","Use an opening paragraph, then paragraphs with your news (one main idea each), then a closing paragraph.","Paragraph 2: our school trip to the Apartheid Museum."],
      ["Ending and the process","End with 'Love,' or 'Your friend,' and your name. Write in steps: plan, draft, edit, then write a neat final copy.","Your friend, Kabelo"]],
   A:{t:"order", p:"Put the parts of a friendly letter in order, from top to bottom.", d:["Your address","Date","Greeting (Dear ...)","Opening paragraph","Paragraphs with your news","Closing paragraph","Ending (Your friend,)","Your name"]},
   Q:[["Where does your address go in a friendly letter?",["top right","bottom left","in the middle","it is left out"],"The date goes just below it."],
      ["Which is a suitable greeting for a friendly letter?",["Dear Lindiwe,","To whom it may concern","Yours faithfully","Re: Complaint"],"Friendly letters use a warm, personal greeting."],
      ["What is the correct order of the writing process?",["plan, draft, edit, final copy","final copy, plan, draft, edit","edit, plan, final copy, draft","draft, final copy, plan, edit"],"Plan first and polish last."],
      ["A good paragraph has...",["one main idea","no sentences","many unrelated ideas","only one word"],"Start a new paragraph for a new idea."]]}
]},
{ id:"sci", name:"Natural Sciences & Technology", topics:[
 { id:"n6a", t:"Photosynthesis & food webs", s:"How plants make food and how ecosystems connect",
   L:[["Photosynthesis","Plants use sunlight, water (from their roots) and carbon dioxide (from the air) to make glucose, their food. They give off oxygen.","It happens in the leaves, which are green because of chlorophyll."],
      ["Food webs","A food web is many food chains linked together. An ecosystem is all the living and non-living things in an area working together.","In the bushveld, grass feeds impala, zebra and grasshoppers."],
      ["Keeping the balance","If one living thing disappears, others in the web are affected.","If the grass dies in a drought, herbivores go hungry, and then so do predators."]],
   A:{t:"sort", p:"Is each one needed for photosynthesis, or made by it?", b:["Needed","Made"], d:[["Carbon dioxide",0],["Water",0],["Sunlight",0],["Oxygen",1],["Glucose (food)",1],["Chlorophyll",0]]},
   Q:[["Which gas do plants take in for photosynthesis?",["carbon dioxide","oxygen","nitrogen","helium"],"They release oxygen."],
      ["What gives leaves their green colour?",["chlorophyll","oxygen","glucose","roots"],"Chlorophyll traps sunlight energy."],
      ["A food web is...",["many food chains linked together","one plant","a spider's web","a type of soil"],"Most animals eat more than one thing."],
      ["If all the grass in a savanna died, what would happen first?",["Herbivores would lose their food","Lions would have more food","Nothing","Rain would stop"],"Then the predators would be affected too."]]},
 { id:"n6b", t:"Mixtures & solutions", s:"Dissolving, solutes, solvents and separating",
   L:[["Mixtures","A mixture is two or more substances mixed together but not joined. You can often separate them again.","Sand and water. Fruit salad."],
      ["Solutions","When a solid dissolves in a liquid it makes a solution. The solid is the solute and the liquid is the solvent.","Sugar (solute) dissolves in tea (solvent)."],
      ["Faster dissolving and separating","Stirring, hot water and smaller pieces make things dissolve faster. Use sieving for different sizes and filtering for insoluble solids.","Coffee filters keep the grounds out of your cup."]],
   A:{t:"sort", p:"Does it dissolve in water?", b:["Soluble","Insoluble"], d:[["sugar",0],["salt",0],["instant coffee",0],["sand",1],["stones",1],["cooking oil",1]]},
   Q:[["In salt water, the salt is the...",["solute","solvent","filter","sieve"],"The solute is what dissolves."],
      ["What will make sugar dissolve fastest?",["stirring it in hot water","cold water with no stirring","adding sand","freezing it"],"Heat and stirring speed things up."],
      ["Which method separates sand from water?",["filtering","stirring","dissolving","shaking"],"The sand stays in the filter paper."],
      ["Which mixture can you separate easily by hand?",["beads and buttons","sugar in tea","salt water","juice in water"],"The pieces are big and don't dissolve."]]},
 { id:"n6c", t:"Electric circuits", s:"Cells, switches, conductors and staying safe",
   L:[["A complete circuit","A circuit needs an energy source (a cell or battery), conductors (wires) and a device like a bulb, joined in a closed loop.","Break the loop and the bulb goes off."],
      ["Switches, conductors and insulators","A switch opens and closes a circuit. Conductors let electricity flow (copper, steel). Insulators don't (plastic, rubber, wood).","Electric wires are copper inside, plastic outside."],
      ["Mains electricity","Most of South Africa's electricity is made in coal-fired power stations. Mains electricity can kill.","Never touch plugs with wet hands or poke anything into a wall socket."]],
   A:{t:"sort", p:"Conductor or insulator?", b:["Conductor","Insulator"], d:[["paper clip",0],["rubber eraser",1],["copper wire",0],["plastic straw",1],["aluminium foil",0],["wooden peg",1],["R5 coin",0],["glass marble",1]]},
   Q:[["A bulb will NOT light if...",["the circuit is open (broken)","the switch is closed","the wires are copper","the cell is new"],"Electricity needs a complete loop."],
      ["Which material is an insulator?",["rubber","copper","iron","aluminium"],"Rubber blocks electricity."],
      ["What does a switch do?",["opens and closes the circuit","makes electricity","stores energy","changes colour"],"It's a gate for the current."],
      ["Most of South Africa's electricity comes from power stations that burn...",["coal","wood","sugar","sand"],"We are also building more solar and wind power."]]},
 { id:"n6d", t:"The solar system", s:"The Sun, planets, day and night, and the Moon",
   L:[["The Sun and planets","The Sun is a star at the centre of our solar system. Eight planets orbit it: Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune.","Remember: My Very Easy Method Just Speeds Up Naming."],
      ["Days and years","Earth spins (rotates) once every 24 hours, giving day and night. It orbits the Sun once in about 365 days: one year.","When it is day in South Africa, it is night on the other side of Earth."],
      ["The Moon and looking up","The Moon orbits Earth in about 27 days. We see it because it reflects sunlight.","South Africa's SALT telescope in Sutherland and the MeerKAT radio telescope in the Karoo help scientists study space."]],
   A:{t:"order", p:"Put the planets in order, starting nearest the Sun.", d:["Mercury","Venus","Earth","Mars","Jupiter","Saturn","Uranus","Neptune"]},
   Q:[["Which is the largest planet?",["Jupiter","Saturn","Earth","Neptune"],"Jupiter is a gas giant."],
      ["Day and night happen because Earth...",["rotates on its axis","goes around the Moon","moves closer to the Sun","stops spinning at night"],"Half of Earth faces the Sun at a time."],
      ["How long does Earth take to orbit the Sun?",["about 365 days","24 hours","about 30 days","10 years"],"That is one year."],
      ["SALT, a huge telescope in Sutherland, is used to...",["study distant stars and galaxies","measure rain","track cars","grow plants"],"It is one of the largest optical telescopes in the southern hemisphere."]]}
]},
{ id:"ss", name:"Social Sciences", topics:[
 { id:"s6a", t:"Latitude & longitude", s:"Finding any place on Earth",
   L:[["Latitude","Lines of latitude run east to west around Earth. They tell you how far north or south of the Equator (0°) a place is.","The Tropic of Capricorn passes through Limpopo."],
      ["Longitude","Lines of longitude run from pole to pole. They tell you how far east or west of the Prime Meridian (0°) a place is. The Prime Meridian passes through Greenwich in London.","South Africa is east of the Prime Meridian."],
      ["Giving a position","Write latitude first, then longitude.","Johannesburg is about 26° S, 28° E. Cape Town is about 34° S, 18° E."]],
   A:{t:"match", p:"Match each word to its meaning.", d:[["Equator","0° latitude"],["Prime Meridian","0° longitude"],["Tropic of Capricorn","Passes through Limpopo"],["Latitude","Distance north or south of the Equator"],["Longitude","Distance east or west of Greenwich"]]},
   Q:[["South Africa is in which hemispheres?",["southern and eastern","northern and western","northern and eastern","southern and western"],"South of the Equator and east of the Prime Meridian."],
      ["Lines of latitude are also called...",["parallels","meridians","contours","borders"],"They run parallel to the Equator."],
      ["Which line is at 0° longitude?",["the Prime Meridian","the Equator","the Tropic of Capricorn","the Arctic Circle"],"It passes through Greenwich."],
      ["Cape Town is about 34° S, 18° E. The 'S' means it is...",["south of the Equator","south of Greenwich","in the sea","in summer"],"S and N are for latitude."]]},
 { id:"s6b", t:"Trade", s:"Imports, exports and types of economic activity",
   L:[["Buying and selling","Trade is buying and selling goods and services. Imports come into a country. Exports are sold to other countries.","South Africa exports platinum, gold, coal, citrus and wine, and imports crude oil, machinery and phones."],
      ["Three kinds of work","Primary activities take resources from nature (farming, mining, fishing). Secondary activities make products (factories). Tertiary activities provide services (teaching, nursing, transport).","Growing wheat (primary), baking bread (secondary), selling it in a shop (tertiary)."],
      ["Trade routes","Goods move by ship, road, rail and air. Durban has one of the busiest ports in Africa.","Oranges from Limpopo can end up on breakfast tables in Europe."]],
   A:{t:"sort", p:"Primary, secondary or tertiary activity?", b:["Primary","Secondary","Tertiary"], d:[["Mining platinum",0],["Growing oranges",0],["Making cars in a factory",1],["Baking bread in a bakery",1],["Teaching at a school",2],["Driving a taxi",2],["Fishing",0],["Nursing",2]]},
   Q:[["Goods sold to other countries are called...",["exports","imports","taxes","loans"],"Ex means out."],
      ["Which is a tertiary (service) job?",["doctor","farmer","miner","factory worker"],"Doctors provide a service."],
      ["South Africa imports a lot of which product?",["crude oil","citrus fruit","platinum","gold"],"We export the other three."],
      ["Which city has one of Africa's busiest ports?",["Durban","Bloemfontein","Kimberley","Polokwane"],"The others are inland."]]},
 { id:"s6c", t:"Mapungubwe", s:"An African kingdom of long ago",
   L:[["Where and when","Mapungubwe was a kingdom about 800 years ago, near where the Limpopo and Shashe rivers meet, close to Botswana and Zimbabwe.","It is now a national park and a World Heritage Site."],
      ["A class society","Mapungubwe had rich and ordinary people. The king and his family lived on top of Mapungubwe Hill. Ordinary people lived in the valley below.","Living up high showed the king's power."],
      ["Trade and treasure","People traded gold, ivory and animal skins to traders on the east coast for glass beads and cloth from places like India and China.","A famous golden rhinoceros was found in a royal grave on the hill."]],
   A:{t:"match", p:"Match each clue to Mapungubwe.", d:[["Golden rhinoceros","Famous gold object found there"],["The king","Lived on top of the hill"],["Ivory and gold","Traded to the east coast"],["Glass beads and cloth","Brought in from far-away lands"],["Limpopo and Shashe","Rivers that meet nearby"]]},
   Q:[["Where is Mapungubwe?",["in Limpopo, where SA meets Botswana and Zimbabwe","in the Western Cape","in Durban","in Egypt"],"It is near the confluence of the Limpopo and Shashe."],
      ["Where did the king of Mapungubwe live?",["on top of the hill","in a cave by the sea","in a city in Europe","on a boat"],"This showed he was above ordinary people."],
      ["Mapungubwe traded gold and ivory for...",["glass beads and cloth","cell phones","coal","maize seeds"],"These came by sea from distant lands."],
      ["What famous object was found at Mapungubwe?",["a golden rhinoceros","a stone lion","a silver ship","a clay pyramid"],"It is made of thin gold foil."]]},
 { id:"s6d", t:"Democracy & citizenship", s:"Elections, government and the Constitution",
   L:[["Democracy","Democracy means rule by the people. South Africa held its first democratic election on 27 April 1994, now Freedom Day.","Nelson Mandela became the first democratically elected president."],
      ["How government works","There are three spheres: national, provincial and local. There are three branches: Parliament makes laws, the President and Cabinet carry them out, and the courts interpret them.","Your municipality (local government) handles water and rubbish removal."],
      ["The Constitution","The Constitution of 1996 is the highest law in the country. It includes the Bill of Rights. Citizens can vote from age 18.","Every law must agree with the Constitution."]],
   A:{t:"match", p:"Match each part of government to its job.", d:[["Parliament","Makes laws"],["Courts","Interpret the law"],["President and Cabinet","Carry out laws"],["Municipality","Local services like water"],["Constitution","Highest law in SA"]]},
   Q:[["South Africa's first democratic election was in...",["1994","1910","1976","2010"],"27 April 1994."],
      ["At what age can South Africans vote?",["18","16","21","12"],"You register to vote from 16, and can vote from 18."],
      ["Which sphere of government collects your rubbish?",["local (municipality)","national","provincial","international"],"Local government delivers basic services."],
      ["The highest law in South Africa is the...",["Constitution","school rules","dictionary","newspaper"],"All other laws must follow it."]]}
]},
{ id:"ls", name:"Life Skills", topics:[
 { id:"l6a", t:"Peer pressure & decisions", s:"Making good choices and saying no",
   L:[["Peer pressure","Peer pressure is when friends influence what you do. It can be positive (study together) or negative (a dare to steal).","Joining a friend at choir practice can be positive peer pressure."],
      ["Making a decision","Stop, think about your options and what could happen with each, choose, then check how it worked out.","Ask yourself: Is it safe? Is it kind? Would I be proud of it tomorrow?"],
      ["Saying no","Be assertive: use a calm, firm voice, look the person in the eye, give a reason and suggest something else.","\"No thanks, I don't want to. Let's play soccer instead.\""]],
   A:{t:"order", p:"Put the decision-making steps in order.", d:["Stop and notice the problem","List your options","Think about the results of each","Choose the best option","Check how it worked out"]},
   Q:[["Which is positive peer pressure?",["Friends encouraging you to join the reading club","Friends daring you to bunk school","Friends telling you to lie","Friends pushing you to vape"],"It pushes you toward something good."],
      ["Being assertive means...",["saying what you mean calmly and respectfully","shouting until others agree","always saying yes","ignoring everyone"],"It's not aggressive and not passive."],
      ["Before you make a decision, you should...",["think about the consequences","act fast without thinking","do what is popular","flip a coin"],"Consequences are the results of a choice."],
      ["A friend dares you to take a sweet without paying. A good response is...",["\"No thanks. Let's go play instead.\"","\"OK, just this once.\"","\"Only if you do it too.\"","Say nothing and do it"],"Say no and offer something else."]]},
 { id:"l6b", t:"Growing up", s:"Puberty and looking after your changing body",
   L:[["What is puberty?","Puberty is when your body starts changing from a child's into an adult's. Hormones cause the changes. It usually starts between 8 and 14 years old.","Everyone starts at their own time. There is no 'right' age."],
      ["Changes you may notice","Growth spurts, new body hair, more sweat, oily skin and pimples, and voice changes. Girls begin to have periods. Feelings can change quickly too.","Mood swings are a normal part of puberty."],
      ["Looking after yourself","Bath or shower every day, use deodorant, wear clean clothes, get enough sleep and talk to a trusted adult about questions.","It's normal to have questions. A parent, nurse or teacher can help."]],
   A:{t:"sort", p:"Is it a physical change or an emotional change?", b:["Physical change","Emotional change"], d:[["Growing taller quickly",0],["Mood swings",1],["Voice getting deeper",0],["Wanting more privacy",1],["Pimples",0],["Worrying about how you look",1]]},
   Q:[["What causes the changes of puberty?",["hormones","eating sweets","the weather","homework"],"Hormones are chemical messengers in your body."],
      ["Which is a good hygiene habit during puberty?",["bathing every day","wearing the same socks for a week","skipping brushing your teeth","sleeping only 4 hours"],"Sweat glands become more active, so daily washing helps."],
      ["Puberty happens...",["at different times for different people","at exactly age 12 for everyone","only to boys","only to girls"],"Everyone grows at their own pace."],
      ["If you feel worried about body changes, it's best to...",["talk to a trusted adult","keep it to yourself forever","search random websites","ignore your health"],"Trusted adults can give correct information."]]},
 { id:"l6c", t:"Caring for the environment", s:"Pollution, recycling and saving water",
   L:[["Pollution","Pollution makes air, water or land dirty and harmful. Smoke, litter, chemicals and illegal dumping are all pollution.","Plastic bags in rivers can kill fish and birds."],
      ["Reduce, reuse, recycle","Reduce: use less. Reuse: use things again. Recycle: turn waste into new products.","Reuse a glass jar as a pencil holder. Recycle cans and paper."],
      ["Save water and electricity","South Africa is a water-scarce country. Every drop counts.","Turn off the tap while brushing your teeth, take short showers and switch off lights."]],
   A:{t:"sort", p:"Is this reducing, reusing or recycling?", b:["Reduce","Reuse","Recycle"], d:[["Buy fewer things in plastic packaging",0],["Turn an old jar into a pencil holder",1],["Put cans in the recycling bin",2],["Use a lunch box instead of cling wrap",0],["Give outgrown clothes to a younger cousin",1],["Take old newspapers to a recycling depot",2]]},
   Q:[["Which saves water?",["Turning off the tap while brushing your teeth","A long bath every day","Washing the car with a running hose","Leaving a leaking tap"],"A running tap wastes litres every minute."],
      ["Which item is easy to recycle?",["an aluminium can","a used tissue","a dirty nappy","a chip packet"],"Cans can be melted and remade again and again."],
      ["Burning tyres causes...",["air pollution","clean air","more rain","healthy soil"],"The smoke is toxic."],
      ["South Africa is described as a ___ country.",["water-scarce","water-rich","snow-covered","rainforest"],"We get less rain than the world average."]]}
]}
],
7: [
{ id:"math", name:"Mathematics", topics:[
 { id:"m7a", t:"Integers", s:"Negative numbers, ordering, adding and subtracting",
   L:[["Meet the integers","Integers are whole numbers and their negatives: ... −3, −2, −1, 0, 1, 2, 3 ... On a number line, numbers further left are smaller.","−8 < −2. On a winter night Sutherland can drop to −10 °C."],
      ["Adding and subtracting","Start at the first number. Adding moves you right, subtracting moves you left.","−3 + 5 = 2. 4 − 7 = −3."],
      ["Subtracting a negative","Taking away a negative is the same as adding.","5 − (−2) = 5 + 2 = 7."]],
   A:{t:"fill", p:"Type your answers. Use - for negative numbers.", d:[["−4 + 9","5"],["3 − 8","-5"],["−2 − 5","-7"],["6 − (−3)","9"],["−10 + 4","-6"]]},
   Q:[["Which number is the smallest?",["−9","−2","0","3"],"−9 is furthest left on the number line."],
      ["−6 + 10 = ?",["4","−4","16","−16"],"Start at −6 and move 10 to the right."],
      ["It is 3 °C and the temperature drops by 7 degrees. What is it now?",["−4 °C","4 °C","−10 °C","10 °C"],"3 − 7 = −4."],
      ["7 − (−5) = ?",["12","2","−12","−2"],"Subtracting a negative means adding: 7 + 5."]]},
 { id:"m7b", t:"Exponents", s:"Squares, cubes, roots and order of operations",
   L:[["Powers","An exponent tells you how many times to multiply the base by itself.","2³ = 2 × 2 × 2 = 8. Careful: 3² = 9, not 6."],
      ["Squares and cubes","Learn the squares to 12² and the cubes to 5³.","Squares: 1, 4, 9, 16, 25, 36, 49, 64, 81, 100, 121, 144. Cubes: 1, 8, 27, 64, 125."],
      ["Roots and order","A square root undoes a square. A cube root undoes a cube. Order of operations: brackets, then exponents, then × and ÷, then + and −.","√49 = 7. ∛27 = 3. 2 + 3² = 2 + 9 = 11."]],
   A:{t:"fill", p:"Work these out.", d:[["5²","25"],["2⁴","16"],["√81","9"],["∛64","4"],["10³","1000"]]},
   Q:[["What is 4³?",["64","12","16","43"],"4 × 4 × 4 = 64."],
      ["√144 = ?",["12","72","14","24"],"12 × 12 = 144."],
      ["Work out 2 + 3²",["11","25","13","10"],"Exponents first: 3² = 9, then 2 + 9."],
      ["Which number is a perfect square?",["49","50","27","18"],"7 × 7 = 49."]]},
 { id:"m7c", t:"Algebra basics", s:"Variables, expressions and solving equations",
   L:[["Variables","A variable is a letter that stands for a number we don't know yet. 3x means 3 × x.","If x = 4, then 3x = 12."],
      ["Like terms","You can only add or subtract like terms: the same letter with the same exponent.","2a + 5a = 7a. But 3x + 2y stays as it is."],
      ["Solving equations","An equation is like a balanced scale. Do the same thing to both sides to find the unknown. Then check your answer.","x + 7 = 15, so x = 15 − 7 = 8. 3y = 21, so y = 7."]],
   A:{t:"fill", p:"Find the unknown.", d:[["x + 6 = 14. What is x?","8"],["4y = 36. What is y?","9"],["a − 5 = 12. What is a?","17"],["If n = 3, what is 5n + 2?","17"],["2x + 1 = 11. What is x?","5"]]},
   Q:[["Simplify 4m + 3m",["7m","12m","7m²","43m"],"Like terms: 4 + 3 = 7 m's."],
      ["Solve: x ÷ 4 = 5",["20","1,25","9","1"],"Multiply both sides by 4."],
      ["Rule: output = 3 × input − 2. An input of 5 gives...",["13","15","17","11"],"3 × 5 = 15, then 15 − 2 = 13."],
      ["Which pair are like terms?",["5p and 2p","5p and 2q","5p and 5","p² and p"],"Same letter, same exponent."]]},
 { id:"m7d", t:"Percentages & money", s:"Discounts, VAT, profit, loss and ratio",
   L:[["Percent of an amount","Change the percentage to a fraction out of 100 and multiply.","15% of R200 = 15/100 × 200 = R30."],
      ["Discount and VAT","A discount takes money off. VAT (value-added tax) in South Africa is 15% and is added to prices.","20% off R350: R70 off, so you pay R280."],
      ["Profit, loss and ratio","Profit = selling price − cost price. If it is negative, it's a loss. A ratio shares an amount in parts.","Share R50 in the ratio 2:3. There are 5 parts of R10: R20 and R30."]],
   A:{t:"fill", p:"Type the answer in rand (just the number).", d:[["10% of R450","45"],["25% of R80","20"],["Share R60 in the ratio 1:2. The bigger share is?","40"],["A shirt costs R200 and is 30% off. New price?","140"],["Bought for R50, sold for R65. Profit?","15"]]},
   Q:[["What is 15% VAT on R100?",["R15","R1,50","R115","R85"],"15/100 × 100 = 15."],
      ["A bike costs R1 200 and is 10% off. What do you pay?",["R1 080","R1 190","R1 100","R120"],"10% of 1 200 is 120, and 1 200 − 120 = 1 080."],
      ["Simplify the ratio 6:9",["2:3","3:2","1:3","6:3"],"Divide both sides by 3."],
      ["Bought for R40, sold for R30. This is a...",["loss of R10","profit of R10","profit of R70","loss of R70"],"It sold for less than it cost."]]},
 { id:"m7e", t:"Geometry", s:"Angle facts, triangles and area",
   L:[["Angle facts","Angles on a straight line add up to 180°. Angles around a point add up to 360°. Vertically opposite angles are equal.","If one angle on a line is 110°, the other is 70°."],
      ["Triangles","The three angles inside any triangle add up to 180°. Equilateral: 3 equal sides (each angle 60°). Isosceles: 2 equal sides. Scalene: no equal sides.","Angles of 50° and 60° leave 70° for the third."],
      ["Area of a triangle","Area = ½ × base × height. The height must be at a right angle to the base.","Base 10 cm, height 6 cm: ½ × 10 × 6 = 30 cm²."]],
   A:{t:"fill", p:"Type the number only (no ° or units).", d:[["A triangle has angles of 50° and 70°. The third angle?","60"],["Angles on a straight line: 125° and ?","55"],["Area of a triangle with base 8 cm and height 5 cm (cm²)","20"],["Each angle in an equilateral triangle","60"],["Angles around a point: 90°, 150° and ?","120"]]},
   Q:[["The angles inside a triangle add up to...",["180°","360°","90°","100°"],"Every triangle, every time."],
      ["A triangle with exactly two equal sides is...",["isosceles","equilateral","scalene","obtuse"],"Its two base angles are also equal."],
      ["What is the area of a triangle with base 12 m and height 4 m?",["24 m²","48 m²","16 m²","8 m²"],"½ × 12 × 4 = 24."],
      ["One angle on a straight line is 35°. The other is...",["145°","55°","325°","65°"],"180 − 35 = 145."]]}
]},
{ id:"eng", name:"English", topics:[
 { id:"e7a", t:"Active & passive voice", s:"Who does the action?",
   L:[["Active voice","In the active voice, the subject does the action.","The dog chased the cat."],
      ["Passive voice","In the passive voice, the subject receives the action. Use a form of 'to be' plus the past participle, and often 'by'.","The cat was chased by the dog."],
      ["When to use passive","Use passive when the doer is unknown or not important, or to sound formal, like in news reports.","My bike was stolen. The bridge was opened in 2010."]],
   A:{t:"match", p:"Match each active sentence to its passive form.", d:[["Thabo kicked the ball.","The ball was kicked by Thabo."],["The chef cooks the meal.","The meal is cooked by the chef."],["The learners painted the mural.","The mural was painted by the learners."],["The storm damaged the roof.","The roof was damaged by the storm."]]},
   Q:[["Which sentence is in the passive voice?",["The window was broken by the ball.","The ball broke the window.","The ball is rolling.","Close the window."],"The subject (window) receives the action."],
      ["Change to passive: 'Lindi wrote a poem.'",["A poem was written by Lindi.","A poem is writing by Lindi.","Lindi was written a poem.","A poem wrote Lindi."],"Keep the past tense: was written."],
      ["In 'The cake was eaten by the children', who did the action?",["the children","the cake","nobody","the oven"],"The doer comes after 'by'."],
      ["Why might a news report say 'The shop was robbed'?",["The robber is unknown","To sound happy","Passive is always wrong","It is in the future tense"],"Passive works when the doer isn't known."]]},
 { id:"e7b", t:"Poetry", s:"Stanzas, rhyme scheme, imagery and theme",
   L:[["Structure","A poem is written in lines. Lines are grouped into stanzas. A rhyme scheme uses letters to show which line endings rhyme.","cat / hat / sun / fun = AABB"],
      ["Imagery","Imagery is language that appeals to the senses: sight, sound, smell, taste and touch.","'The sour smell of the dusty taxi rank' appeals to smell."],
      ["Tone, mood and theme","Tone is the poet's attitude. Mood is the feeling the reader gets. Theme is the main message.","A poem about a grandmother's hands might have a loving tone and a theme of family."]],
   A:{t:"match", p:"Match each poetry term to its meaning.", d:[["Stanza","A group of lines in a poem"],["Rhyme scheme","The pattern of rhymes, like AABB"],["Imagery","Words that appeal to the senses"],["Theme","The main message"],["Mood","The feeling the reader gets"]]},
   Q:[["Lines ending in cat / hat / sun / fun have which rhyme scheme?",["AABB","ABAB","ABBA","AAAA"],"The first two rhyme, then the next two."],
      ["A stanza is like a ___ in a story.",["paragraph","title","full stop","character"],"Both are groups of lines or sentences."],
      ["'The sour smell of the dusty taxi rank' mainly appeals to...",["smell","hearing","touch","no senses"],"It describes a smell."],
      ["The theme of a poem is...",["its main message","its first line","the poet's name","the number of lines"],"Ask: what is the poet saying about life?"]]},
 { id:"e7c", t:"Concord & tricky words", s:"Subject-verb agreement and words that sound alike",
   L:[["Concord","The verb must agree with its subject. One subject takes a singular verb, more than one takes a plural verb.","The boy runs. The boys run."],
      ["Singular words that trick you","Everyone, each, nobody and somebody are singular. A collective noun like 'team' usually takes a singular verb.","Everyone is here. The team is ready."],
      ["Sound-alike words","their = belonging to them, there = a place, they're = they are. its = belonging to it, it's = it is. your = belonging to you, you're = you are.","They're putting their bags over there."]],
   A:{t:"match", p:"Match each word to its meaning.", d:[["They're","They are"],["Their","Belongs to them"],["There","A place"],["It's","It is"],["Its","Belongs to it"],["You're","You are"]]},
   Q:[["Choose the correct verb: 'The learners ___ excited.'",["are","is","was","be"],"Learners is plural."],
      ["'___ going to the beach tomorrow.'",["They're","Their","There","Thier"],"They are going."],
      ["'Everyone ___ to bring a hat.'",["has","have","are having","were"],"Everyone is singular."],
      ["'The dog wagged ___ tail.'",["its","it's","its'","it is"],"Belonging to it: no apostrophe."]]},
 { id:"e7d", t:"Persuasive writing & summaries", s:"Making an argument and summarising well",
   L:[["Structure of an argument","Introduction: state your opinion clearly. Body paragraphs: one argument each, with evidence. Conclusion: sum up and restate your view.","'Schools should have vegetable gardens.'"],
      ["Persuasive techniques","Writers persuade with emotive language, rhetorical questions, facts and statistics, and repetition. Adverts use them all the time.","'Don't you want a cleaner, safer school?' is a rhetorical question."],
      ["Writing a summary","Find the main points, write them in your own words, leave out examples and repetition, and stick to the word limit.","Turn a 300-word article into 7 short points."]],
   A:{t:"order", p:"Put the parts of a persuasive essay in order.", d:["Introduction: state your opinion","Body paragraph: first argument with evidence","Body paragraph: second argument with evidence","Body paragraph: answer the other side","Conclusion: restate your opinion"]},
   Q:[["'Don't you want a cleaner, safer school?' is an example of...",["a rhetorical question","a simile","a statistic","passive voice"],"It isn't meant to be answered. It makes you think."],
      ["When summarising you should...",["use your own words and only the main points","copy the whole text","add your opinions","include every example"],"A summary is short and to the point."],
      ["Where should you clearly state your opinion in a persuasive essay?",["in the introduction","only in the title","nowhere","in a footnote"],"The reader should know your view from the start."],
      ["Words like 'heartbreaking' and 'amazing' are...",["emotive language","statistics","conjunctions","prepositions"],"They stir up feelings."]]}
]},
{ id:"sci", name:"Natural Sciences", topics:[
 { id:"n7a", t:"Biodiversity & classification", s:"Grouping living things and vertebrate classes",
   L:[["Biodiversity","Biodiversity is the variety of living things in an area. South Africa is one of the most biodiverse countries on Earth.","The Cape Floral Kingdom (fynbos) has thousands of plants found nowhere else."],
      ["Classification","Scientists group living things by shared features. The biggest groups are kingdoms, such as animals, plants, fungi, protists and bacteria.","Mushrooms are fungi, not plants: they can't make their own food."],
      ["Vertebrate classes","Fish: gills and scales. Amphibians: moist skin, live in water and on land. Reptiles: dry scaly skin. Birds: feathers. Mammals: hair or fur, and feed their young on milk.","A dolphin is a mammal. A crocodile is a reptile."]],
   A:{t:"sort", p:"Sort each vertebrate into its class.", b:["Fish","Amphibian","Reptile","Bird","Mammal"], d:[["shark",0],["frog",1],["crocodile",2],["ostrich",3],["dolphin",4],["chameleon",2],["toad",1],["bat",4]]},
   Q:[["A dolphin breathes air and feeds its young on milk. It is a...",["mammal","fish","amphibian","reptile"],"Mammals feed their young on milk."],
      ["Which group has moist skin and lives in water and on land?",["amphibians","reptiles","birds","fish"],"Frogs start life in water as tadpoles."],
      ["Mushrooms belong to which kingdom?",["fungi","plants","animals","bacteria"],"Fungi can't photosynthesise."],
      ["Fynbos is a special kind of vegetation found mainly in the...",["Western Cape","Kalahari","Highveld","Lowveld"],"It is part of the Cape Floral Kingdom."]]},
 { id:"n7b", t:"Separating mixtures", s:"Choosing the right method for each mixture",
   L:[["Use the properties","How you separate a mixture depends on how its parts differ: size, whether they dissolve, whether they are magnetic, or their boiling points.","Iron filings are magnetic, sand is not."],
      ["Solids and liquids","Sieving separates particles of different sizes. Filtration separates an insoluble solid from a liquid. Evaporation gets a dissolved solid back from a liquid.","Salt is made by evaporating seawater in salt pans."],
      ["More methods","Distillation collects pure water by boiling and condensing it. Chromatography separates the colours in ink. Magnets separate magnetic metals.","Black ink on wet filter paper spreads into blue, red and yellow."]],
   A:{t:"match", p:"Match each mixture to the best way to separate it.", d:[["Iron filings and sand","Magnet"],["Salt from seawater","Evaporation"],["Sand and water","Filtration"],["Stones and fine flour","Sieving"],["Colours in black ink","Chromatography"],["Pure water from muddy water","Distillation"]]},
   Q:[["How do you get salt back from salt water?",["evaporation","filtering","a magnet","sieving"],"The water evaporates and the salt is left."],
      ["Chromatography is used to separate...",["dyes in ink","rocks from soil","water from ice","sand from gravel"],"Different dyes travel different distances on paper."],
      ["Why can a magnet separate iron filings from sand?",["iron is magnetic and sand is not","sand is heavier","iron dissolves","sand is a metal"],"Use the difference in properties."],
      ["Filtration works because...",["the solid particles are too big to pass through the filter","the liquid evaporates","the solid dissolves","magnets attract water"],"The liquid passes through. The solid stays behind."]]},
 { id:"n7c", t:"Acids, bases & neutrals", s:"Indicators, the pH scale and neutralisation",
   L:[["Three groups","Acids taste sour (lemon juice, vinegar). Bases feel soapy (soap, bicarbonate of soda). Neutral substances are neither (pure water). Never taste chemicals in a lab!","Maas is acidic, which is why it tastes sour."],
      ["Indicators","Indicators change colour to show acid or base. Acids turn blue litmus paper red. Bases turn red litmus paper blue.","Red cabbage juice makes a homemade indicator."],
      ["The pH scale","pH goes from 0 to 14. Below 7 is acidic, 7 is neutral, above 7 is basic. An acid and a base can neutralise each other.","An antacid tablet (a base) neutralises stomach acid."]],
   A:{t:"sort", p:"Acid, base or neutral?", b:["Acid","Base","Neutral"], d:[["lemon juice",0],["vinegar",0],["soap",1],["bicarbonate of soda",1],["pure water",2],["maas",0],["toothpaste",1],["salt water",2]]},
   Q:[["Lemon juice turns blue litmus paper...",["red","blue","green","clear"],"Acids turn blue litmus red."],
      ["A substance with a pH of 7 is...",["neutral","an acid","a base","poisonous"],"7 is the middle of the scale."],
      ["Which of these is a base?",["bicarbonate of soda","vinegar","lemon juice","cooldrink"],"Bicarb feels soapy and has a pH above 7."],
      ["When an acid and a base cancel each other out, it is called...",["neutralisation","evaporation","photosynthesis","filtration"],"It makes a salt and water."]]},
 { id:"n7d", t:"Heat transfer", s:"Conduction, convection, radiation and insulation",
   L:[["Conduction","Heat always moves from hot to cold. Conduction is heat moving through a solid, particle to particle.","A metal spoon in hot soup gets hot all the way up."],
      ["Convection","In liquids and gases, warm parts rise and cool parts sink, making a current.","Water in a kettle circulates as it heats. A heater warms a whole room."],
      ["Radiation and insulation","Radiation is heat moving as waves. It doesn't need particles, so it can cross space. Insulators slow heat transfer.","The Sun warms Earth by radiation. A Wonderbag, a South African invention, insulates a pot so food keeps cooking."]],
   A:{t:"sort", p:"How is the heat moving?", b:["Conduction","Convection","Radiation"], d:[["A metal spoon gets hot in soup",0],["Warm air rising from a heater",1],["Feeling the Sun's warmth",2],["Burning your hand on a hot pot handle",0],["Hot water rising in a kettle",1],["Feeling the heat from a braai fire",2]]},
   Q:[["How does heat from the Sun reach Earth?",["radiation","conduction","convection","evaporation"],"Space is empty, so it can't be conduction or convection."],
      ["Which is the best insulator?",["a wool blanket","a copper pot","an iron nail","a steel spoon"],"Wool traps air, which slows heat transfer."],
      ["Warm air rises and cool air sinks. This is...",["convection","conduction","radiation","insulation"],"It makes a convection current."],
      ["A Wonderbag keeps food cooking because it...",["insulates the pot and traps heat","makes electricity","conducts heat away","cools the pot"],"Less heat escapes, so the food keeps cooking."]]}
]},
{ id:"ss", name:"Social Sciences", topics:[
 { id:"s7a", t:"The Kingdom of Mali", s:"Gold, salt, Mansa Musa and Timbuktu",
   L:[["A rich West African empire","Mali was founded by Sundiata Keita in the 1200s. It grew rich from trade across the Sahara Desert.","Gold from the south was traded for salt from the north."],
      ["Mansa Musa","Mansa Musa was one of the richest rulers in history. On his pilgrimage to Mecca in 1324 he gave away so much gold that its value fell in Cairo.","He also built mosques and schools."],
      ["Timbuktu","Timbuktu became a great centre of learning, with scholars and thousands of handwritten manuscripts. Camel caravans carried goods across the desert.","South Africa helped build a library to protect the Timbuktu manuscripts."]],
   A:{t:"match", p:"Match each name to its description.", d:[["Sundiata Keita","Founder of the Mali Empire"],["Mansa Musa","Rich ruler who went to Mecca in 1324"],["Timbuktu","City of learning and manuscripts"],["Camel caravans","Carried goods across the Sahara"],["Salt and gold","Main trade goods"]]},
   Q:[["Mali became rich mainly by trading...",["gold and salt","oil and coal","cars","diamonds and tea"],"Salt was so valuable it was swapped for gold."],
      ["Timbuktu was famous as a centre of...",["learning and books","car-making","fishing","skiing"],"Scholars came from far away."],
      ["Which animals carried goods across the Sahara?",["camels","elephants","zebras","oxen"],"Camels can go days without water."],
      ["Mansa Musa travelled to Mecca in...",["1324","1652","1994","1066"],"The 14th century."]]},
 { id:"s7b", t:"Colonisation of the Cape", s:"The VOC, the Khoikhoi and slavery",
   L:[["A refreshment station","In 1652 Jan van Riebeeck arrived at the Cape for the Dutch East India Company (VOC) to set up a station that supplied passing ships with fresh food and water.","Ships sailed between Europe and the East to trade spices."],
      ["The Khoikhoi lose their land","From 1657, free burghers were given farms. The Khoikhoi lost grazing land and cattle, which led to wars. A smallpox epidemic in 1713 killed many Khoikhoi.","Without land and cattle, many Khoikhoi had to work on settler farms."],
      ["Slavery at the Cape","From 1658, enslaved people were brought from East Africa, Madagascar, India and Indonesia. They shaped Cape culture, food and the Afrikaans language.","Bobotie and the Cape Malay community have roots in this history."]],
   A:{t:"order", p:"Put these events in the order they happened.", d:["1652: VOC station set up at the Cape","1657: First free burghers given farms","1658: First large group of enslaved people arrives","1713: Smallpox kills many Khoikhoi"]},
   Q:[["Why did the VOC set up a station at the Cape?",["to supply passing ships with fresh food and water","to mine gold","to build a university","to start a sports league"],"It was halfway between Europe and the East."],
      ["Who led the VOC group that arrived in 1652?",["Jan van Riebeeck","Mansa Musa","Shaka","Vasco da Gama"],"He was the first commander at the Cape."],
      ["How were the Khoikhoi affected by colonisation?",["They lost land and cattle","They gained land","Nothing changed","They moved to Europe"],"Settler farms took over their grazing land."],
      ["Where did many enslaved people at the Cape come from?",["Indonesia, India, Madagascar and East Africa","Australia","South America","Antarctica"],"The VOC traded across the Indian Ocean."]]},
 { id:"s7c", t:"Natural disasters", s:"Earthquakes, volcanoes and floods",
   L:[["Moving plates","Earth's crust is broken into huge tectonic plates that move very slowly. Most earthquakes and volcanoes happen where plates meet.","The 'Ring of Fire' around the Pacific Ocean has many volcanoes."],
      ["Earthquakes","An earthquake is sudden shaking of the ground. The point underground is the focus. The point on the surface above it is the epicentre. A seismograph records the shaking.","In 2014 a magnitude 5,5 earthquake shook Orkney in North West."],
      ["Volcanoes and floods","Magma is melted rock underground. When it erupts it is called lava. Floods are also natural disasters.","In April 2022, severe floods hit Durban and other parts of KwaZulu-Natal."]],
