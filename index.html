{ id:"m6g", T:2, t:"Long multiplication & division", s:"Multiplying and dividing bigger numbers",
  L:[["Long multiplication","Multiply by each digit of the second number separately, remembering to add a zero when you multiply by the tens digit. Then add the rows.","243 × 36: 243 × 6 = 1 458, 243 × 30 = 7 290, total 8 748."],
     ["Long division","Divide step by step from the left: divide, multiply, subtract, bring down. Repeat until all digits are used.","864 ÷ 4: 8 ÷ 4 = 2, 6 ÷ 4 = 1 r 2, 24 ÷ 4 = 6, so 216."],
     ["Remainders in real life","Decide what a remainder means in the story. Sometimes you round up, sometimes you leave it out.","100 learners, 30 per bus: 100 ÷ 30 = 3 r 10, so you need 4 buses."]],
  A:{t:"fill", p:"Work these out on paper, then type the answer.", d:[["125 × 24","3000"],["312 × 15","4680"],["936 ÷ 6","156"],["1 248 ÷ 12","104"],["45 × 99","4455"]]},
  Q:[["What is 234 × 12?",["2 808","2 708","2 818","468"],"234 × 10 = 2 340 and 234 × 2 = 468; add them."],
     ["What is 756 ÷ 7?",["108","18","118","1 008"],"7 into 7 = 1, 7 into 5 = 0 r 5, 7 into 56 = 8."],
     ["250 learners go on a trip. Each bus takes 60. How many buses are needed?",["5","4","4 r 10","6"],"4 buses carry 240, so 10 learners need a fifth bus."],
     ["What is 50 × 400?",["20 000","2 000","200 000","450"],"5 × 4 = 20, then add three zeros."]],
  W:["Calculate 2 754 ÷ 9",["9 into 2 won't go, so use 27: 27 ÷ 9 = 3.","Bring down 5: 5 ÷ 9 = 0 remainder 5. Write 0.","Bring down 4 to make 54: 54 ÷ 9 = 6.","Answer: 306. Check: 306 × 9 = 2 754."],"306"],
  X:"Don't forget a 0 in the answer when a step doesn't divide. In 2 754 ÷ 9 the answer is 306, not 36.",
  C:["What is 123 × 11?",["1 353","1 343","246","1 233"],"123 × 10 + 123."],
  H:{L:[["The grid method","Split both numbers into parts, multiply each pair in a grid, then add everything.","34 × 26: 30 × 20 = 600, 30 × 6 = 180, 4 × 20 = 80, 4 × 6 = 24. Total 884."],
        ["Division as chunking","Take away big multiples of the divisor until nothing (or a remainder) is left.","864 ÷ 4: 200 × 4 = 800 (64 left), 16 × 4 = 64. 200 + 16 = 216."]],
    Q:[["34 × 26 = ?",["884","864","780","904"],"Grid method: 600 + 180 + 80 + 24."],
       ["What is 648 ÷ 8?",["81","8","801","88"],"8 × 81 = 648."],
       ["Pencils come in boxes of 12. How many boxes for 150 pencils?",["13","12","12 r 6","14"],"12 boxes hold 144, so 13 are needed."],
       ["What is 405 × 20?",["8 100","810","81 000","4 050"],"405 × 2 = 810, then × 10."]]}},
{ id:"m6h", T:2, t:"Patterns & number sentences", s:"Numeric and geometric patterns, rules and flow diagrams",
  L:[["Finding the rule","Look at how the pattern changes from one term to the next. The rule might add, subtract, multiply or a mix.","3, 7, 11, 15: add 4. 2, 6, 18, 54: multiply by 3."],
     ["Geometric patterns","Shape patterns grow in a predictable way. Count how many shapes are in each stage and look for the rule.","Stage 1: 4 matches, stage 2: 7, stage 3: 10. Rule: add 3 matches each time."],
     ["Flow diagrams and tables","A flow diagram applies a rule to an input to get an output. You can work backwards using the opposite operations.","Input 5 → × 3 → + 2 → output 17."]],
  A:{t:"fill", p:"Find the next number or the output.", d:[["5, 12, 19, 26, ?","33"],["2, 6, 18, 54, ?","162"],["100, 91, 82, 73, ?","64"],["Input 7 → × 4 → − 3 → output?","25"],["Output 20 came from: input → × 2 → + 6. Input?","7"]]},
  Q:[["What is the rule: 4, 8, 16, 32?",["multiply by 2","add 4","add 8","multiply by 4"],"Each term doubles."],
     ["In a match pattern, stage 1 uses 4 matches and each stage adds 3. How many in stage 5?",["16","15","19","12"],"4 + 3 + 3 + 3 + 3 = 16."],
     ["Input 6 → × 5 → + 1. Output?",["31","35","30","11"],"6 × 5 = 30, then + 1."],
     ["What is the 10th term of 3, 6, 9, 12 ...?",["30","27","33","13"],"Rule: 3 × the term number."]],
  W:["Find the 20th term of: 5, 9, 13, 17 ...",["The difference is 4 each time, so the rule involves 4 × the term number.","Term 1: 4 × 1 = 4, but the term is 5, so add 1.","Rule: 4 × term number + 1.","Term 20: 4 × 20 + 1 = 81."],"81"],
  X:"Don't just keep adding to find a far-away term. Find the rule using the term number, then use it directly.",
  C:["What comes next: 1, 4, 9, 16, ...?",["25","20","24","32"],"These are square numbers: 5 × 5."],
  H:{L:[["Make a table","Write the term number in one row and the term in the next. Comparing them helps you find the rule.","Term number: 1, 2, 3. Term: 3, 5, 7. Rule: 2 × term number + 1."],
        ["Work backwards","To find an input from an output, reverse the steps and use opposite operations in reverse order.","Output 17 from × 3 then + 2: 17 − 2 = 15, 15 ÷ 3 = 5."]],
    Q:[["Output 23 came from: input → × 4 → + 3. Input?",["5","6","20","4"],"23 − 3 = 20, 20 ÷ 4 = 5."],
       ["Rule: 2 × term number + 1. What is term 8?",["17","16","18","10"],"2 × 8 + 1."],
       ["What comes next: 81, 27, 9, 3, ...?",["1","0","6","2"],"Divide by 3."],
       ["Stage 1 has 2 squares, stage 2 has 4, stage 3 has 6. Stage 10?",["20","12","18","22"],"Rule: 2 × stage number."]]}},
{ id:"m6i", T:2, t:"2D shapes & circles", s:"Polygons, quadrilaterals and parts of a circle",
  L:[["Polygons","A polygon is a closed 2D shape with straight sides. Regular polygons have all sides and angles equal.","A regular hexagon has 6 equal sides and 6 equal angles."],
     ["Quadrilaterals","Square: 4 equal sides, 4 right angles. Rectangle: opposite sides equal, 4 right angles. Rhombus: 4 equal sides, no right angles needed. Parallelogram: opposite sides parallel. Trapezium: one pair of parallel sides. Kite: two pairs of equal sides next to each other.","Every square is also a rectangle and a rhombus."],
     ["Parts of a circle","The centre is the middle point. The radius goes from the centre to the edge. The diameter goes across through the centre and is twice the radius. The circumference is the distance around.","Radius 5 cm means diameter 10 cm."]],
  A:{t:"match", p:"Match each shape to its description.", d:[["Trapezium","Only one pair of parallel sides"],["Rhombus","Four equal sides"],["Rectangle","Opposite sides equal, four right angles"],["Kite","Two pairs of equal sides next to each other"],["Parallelogram","Two pairs of parallel sides"]]},
  Q:[["A circle has a radius of 7 cm. What is its diameter?",["14 cm","7 cm","3,5 cm","21 cm"],"Diameter = 2 × radius."],
     ["Which quadrilateral has only one pair of parallel sides?",["trapezium","rectangle","square","rhombus"],"Trapezium."],
     ["A regular pentagon has...",["5 equal sides and 5 equal angles","5 different sides","4 sides","6 equal sides"],"Regular means all equal."],
     ["The distance around a circle is called the...",["circumference","radius","diameter","centre"],"Like perimeter for a circle."]],
  W:["Is a square a rhombus? Check the definition.",["A rhombus is a quadrilateral with 4 equal sides.","A square has 4 equal sides.","So a square meets the definition of a rhombus.","It's a special rhombus with right angles."],"Yes, a square is a special kind of rhombus"],
  X:"The diameter must pass through the centre. A line across a circle that misses the centre is a chord, not a diameter.",
  C:["What is the radius of a circle with a 20 cm diameter?",["10 cm","20 cm","40 cm","5 cm"],"Half the diameter."],
  H:{L:[["Family tree of quadrilaterals","Quadrilateral → parallelogram → rectangle and rhombus → square. Each one has all the properties of the one above it, plus more.","A square is a rectangle AND a rhombus."],
        ["Draw it to check","When unsure, draw the shape with a ruler and test: measure sides, check angles with a set square, check parallel lines.","Parallel lines never meet, like railway tracks."]],
    Q:[["Which statement is true?",["Every square is a rectangle","Every rectangle is a square","Every trapezium is a square","Every kite is a rectangle"],"Squares have all rectangle properties."],
       ["Parallel lines...",["never meet","always cross","form a right angle","are curved"],"Like railway tracks."],
       ["A line from the centre to the edge of a circle is a...",["radius","diameter","circumference","chord"],"Half a diameter."],
       ["How many sides does an octagon have?",["8","6","10","7"],"Octo = eight."]]}},
{ id:"m6j", T:3, t:"3D objects & nets", s:"Prisms, pyramids and the nets that fold into them",
  L:[["Prisms and pyramids","A prism has two identical end faces joined by rectangles. A pyramid has one base and triangular faces that meet at a point (apex). They're named after the base shape.","A triangular prism looks like a Toblerone box."],
     ["Faces, edges and vertices","Count the flat faces, the edges where faces meet, and the vertices (corners).","A triangular prism: 5 faces, 9 edges, 6 vertices."],
     ["Nets","A net is a flat shape that folds up to make a 3D object. A cube has 11 different nets.","A cube's net has 6 squares joined edge to edge."]],
  A:{t:"match", p:"Match each object to its faces.", d:[["Cube","6 squares"],["Triangular prism","2 triangles and 3 rectangles"],["Square-based pyramid","1 square and 4 triangles"],["Triangular pyramid (tetrahedron)","4 triangles"],["Cylinder","2 circles and 1 curved surface"]]},
  Q:[["How many edges does a cube have?",["12","6","8","10"],"4 on top, 4 at the bottom, 4 up the sides."],
     ["A pyramid is named after its...",["base","apex","height","colour"],"Square-based, triangular-based..."],
     ["How many faces does a triangular prism have?",["5","6","4","9"],"2 triangles + 3 rectangles."],
     ["A flat shape that folds into a 3D object is a...",["net","prism","polygon","grid"],"Like an unfolded box."]],
  W:["Find the faces, edges and vertices of a square-based pyramid",["Faces: 1 square base + 4 triangles = 5.","Edges: 4 around the base + 4 up to the apex = 8.","Vertices: 4 base corners + 1 apex = 5."],"5 faces, 8 edges, 5 vertices"],
  X:"Not every arrangement of 6 squares folds into a cube. If two squares would overlap when folded, it's not a cube net.",
  C:["How many vertices does a cube have?",["8","12","6","4"],"Corners."],
  H:{L:[["Euler's rule","For prisms and pyramids: faces + vertices − edges = 2. Use it to check your counting.","Cube: 6 + 8 − 12 = 2. Correct!"],
        ["Unfold real boxes","Carefully open a cereal box along its edges and flatten it. That flat shape is its net.","Notice the flaps that are glued."]],
    Q:[["Use faces + vertices − edges = 2: a shape has 5 faces and 6 vertices. How many edges?",["9","11","8","7"],"5 + 6 − 9 = 2."],
       ["A tetrahedron has how many faces?",["4","3","5","6"],"All triangles."],
       ["A cylinder's net has...",["2 circles and a rectangle","3 circles","6 squares","4 triangles"],"The rectangle wraps round."],
       ["Which is a prism?",["a box shaped like a Toblerone","a cone","a sphere","a square-based pyramid"],"Identical triangle ends."]]}},
{ id:"m6k", T:3, t:"Transformations & enlargements", s:"Slides, flips, turns, enlarging and reducing",
  L:[["Three moves","Translation slides a shape. Reflection flips it over a mirror line. Rotation turns it around a point. The shape stays the same size.","A quarter turn is 90°, a half turn is 180°."],
     ["Enlargements and reductions","An enlargement makes a shape bigger in proportion; a reduction makes it smaller. Every length is multiplied by the same scale factor.","Enlarge a 2 cm by 3 cm rectangle by 2: it becomes 4 cm by 6 cm."],
     ["Similar shapes","After enlarging or reducing, the shape has the same angles and proportions. It is similar, but not the same size.","A photo and its enlarged poster are similar shapes."]],
  A:{t:"fill", p:"A shape is enlarged or reduced. Find the new length.", d:[["A 3 cm side is enlarged by a factor of 2 (cm)","6"],["A 5 cm side is enlarged by a factor of 3 (cm)","15"],["A 12 cm side is reduced to half (cm)","6"],["A 4 cm by 2 cm rectangle enlarged by 3: the longer side (cm)","12"]]},
  Q:[["A triangle is enlarged by a factor of 4. A 2 cm side becomes...",["8 cm","6 cm","4 cm","2 cm"],"2 × 4."],
     ["Which transformation changes size?",["enlargement","translation","reflection","rotation"],"The others keep the same size."],
     ["After a reflection, a shape is...",["a mirror image","bigger","smaller","the same and facing the same way"],"Flipped."],
     ["A three-quarter turn is...",["270°","90°","180°","360°"],"3 × 90°."]],
  W:["Enlarge a 4 cm by 2 cm rectangle so the long side becomes 10 cm",["Find the scale factor: 10 ÷ 4 = 2,5.","Multiply the short side by the same factor: 2 × 2,5 = 5.","New rectangle: 10 cm by 5 cm."],"10 cm by 5 cm"],
  X:"Don't add the same amount to each side. Enlarging means multiplying every side by the same factor, or the shape gets stretched out of proportion.",
  C:["A square with 5 cm sides is reduced by half. New side?",["2,5 cm","10 cm","5 cm","3 cm"],"5 ÷ 2."],
  H:{L:[["Grid enlargements","On grid paper, count squares. To enlarge by 2, every line that was 1 square long becomes 2 squares long.","An L-shape 3 squares tall becomes 6 squares tall."],
        ["Spot the transformation","Ask: did it change size (enlargement)? Is it a mirror image (reflection)? Is it turned (rotation)? Otherwise it slid (translation).","A letter 'p' that becomes 'q' was reflected."]],
    Q:[["A 'b' that turns into a 'd' was...",["reflected","translated","enlarged","nothing happened"],"Mirror image."],
       ["On grid paper, a 3-square line enlarged by 2 becomes...",["6 squares","5 squares","3 squares","9 squares"],"3 × 2."],
       ["A shape slides 5 units right. That's a...",["translation","rotation","reflection","reduction"],"A slide."],
       ["A photo 10 cm by 15 cm is enlarged by 2. New size?",["20 cm by 30 cm","12 cm by 17 cm","20 cm by 15 cm","5 cm by 7,5 cm"],"Both sides × 2."]]}},
{ id:"m6l", T:4, t:"Position & movement", s:"Grid references, maps and directions",
  L:[["Grid references","Maps use grids so you can find places quickly. Give the column letter first, then the row number.","The library is at C4."],
     ["Directions and routes","Use compass directions (N, S, E, W, NE, SE, SW, NW) and the number of blocks to describe a route.","From A1 go 3 blocks east and 2 blocks north."],
     ["Scale on a map","A map scale tells you the real distance. Measure on the map and multiply.","1 cm = 2 km. 4,5 cm on the map = 9 km in real life."]],
  A:{t:"fill", p:"Use the clues to answer. Columns are letters A to H; rows are numbers 1 to 8, increasing northwards.", d:[["Start at B2 and move 3 blocks east. Which column are you in? (letter)","E",true],["Start at D5 and move 2 blocks south. Which row are you in?","3"],["Scale 1 cm = 5 km. A road is 7 cm long on the map. Real length (km)?","35"],["Scale 1 cm = 500 m. 6 cm on the map is how many metres?","3000"]]},
  Q:[["What direction is halfway between north and east?",["north-east","south-east","north-west","south-west"],"NE."],
     ["From F3, move 2 blocks west. Where are you?",["D3","H3","F1","F5"],"West goes back through the letters."],
     ["Scale 1 cm = 10 km. Two towns are 3,5 cm apart. Real distance?",["35 km","3,5 km","350 km","13,5 km"],"3,5 × 10."],
     ["You face north and turn 180°. Which way do you face?",["south","east","west","north"],"A half turn."]],
  W:["Give a route from home at A1 to school at D4, avoiding a river in column B rows 2 to 4",["You can't go straight up column B or through it at rows 2 to 4.","Go east along row 1 first: A1 to D1 (3 blocks east).","Then go north up column D: D1 to D4 (3 blocks north).","Check: the route never enters B2 to B4."],"3 blocks east, then 3 blocks north"],
  X:"A grid reference names a block, not a point on a line. B3 is the square where column B and row 3 overlap.",
  C:["Turning a quarter turn clockwise from north, you face...",["east","west","south","north-west"],"90° clockwise."],
  H:{L:[["Clockwise directions","Going clockwise from north: N, NE, E, SE, S, SW, W, NW. Each step is 45°.","From E, a quarter turn clockwise is S."],
        ["Measuring on maps","Use a ruler from the centre of one place to the centre of the other. Multiply by the scale. For winding roads, use a piece of string.","String along a curvy road, then measure the string."]],
    Q:[["From east, turn a quarter turn clockwise. You face...",["south","north","west","north-east"],"E → S."],
       ["How do you measure a curved road on a map?",["lay a string along it, then measure the string","use only a straight ruler","guess","count the towns"],"String follows curves."],
       ["How many degrees between N and NE?",["45°","90°","30°","180°"],"Half of a right angle."],
       ["Scale 1 cm = 200 m. A park is 4 cm long on the map. Real length?",["800 m","200 m","4 km","80 m"],"4 × 200."]]}},
{ id:"m6m", T:1, t:"Time", s:"12- and 24-hour time, calendars and time intervals",
  L:[["Units of time","60 seconds = 1 minute, 60 minutes = 1 hour, 24 hours = 1 day, 7 days = 1 week, 12 months = 1 year, 365 days = 1 year (366 in a leap year).","A decade is 10 years, a century is 100 years."],
     ["12-hour and 24-hour time","a.m. is from midnight to noon; p.m. is from noon to midnight. In 24-hour time, add 12 to p.m. hours.","8:15 p.m. = 20:15. 00:30 is half past midnight."],
     ["Time intervals","To find how long something took, count on to the next hour, then whole hours, then the minutes left.","07:45 to 10:20: 15 min + 2 h + 20 min = 2 h 35 min."]],
  A:{t:"fill", p:"Work out the times. Use hh:mm for clock times.", d:[["Write 3:40 p.m. in 24-hour time","15:40",true],["How many minutes are in 2 and a half hours?","150"],["A flight leaves at 09:50 and lands at 12:05. How many minutes long?","135"],["How many days are in a leap year?","366"]]},
  Q:[["What is 21:30 in 12-hour time?",["9:30 p.m.","9:30 a.m.","11:30 p.m.","2:30 p.m."],"21 − 12 = 9."],
     ["How many seconds in 5 minutes?",["300","500","60","3 000"],"5 × 60."],
     ["A movie starts at 18:45 and lasts 1 h 40 min. When does it end?",["20:25","20:45","19:85","20:15"],"18:45 + 1 h = 19:45; + 40 min = 20:25."],
     ["How many years in a century?",["100","10","1 000","50"],"Cent = hundred."]],
  W:["How long is it from 10:35 to 14:10?",["Count on to the next hour: 10:35 to 11:00 is 25 minutes.","Whole hours: 11:00 to 14:00 is 3 hours.","The rest: 14:00 to 14:10 is 10 minutes.","Add: 3 h + 25 min + 10 min = 3 h 35 min."],"3 h 35 min"],
  X:"Never subtract times like normal numbers. 14:10 − 10:35 is not 3:75! Count on in hours and minutes instead.",
  C:["What is 00:15 in 12-hour time?",["12:15 a.m.","12:15 p.m.","0:15 p.m.","15:00"],"Just after midnight."],
  H:{L:[["Use a time line","Draw a line, mark the start and end times, and add jumps to the next hour and then whole hours.","A time line makes intervals easy to see."],
        ["Calendar skills","30 days have September, April, June and November; all the rest have 31, except February with 28 (29 in a leap year).","Leap years happen every 4 years, for example 2024 and 2028."]],
    Q:[["How many days does September have?",["30","31","28","29"],"30 days have September..."],
       ["How long from 08:50 to 11:20?",["2 h 30 min","2 h 70 min","3 h 30 min","2 h 20 min"],"10 min + 2 h + 20 min."],
       ["Which year is a leap year?",["2028","2027","2026","2030"],"Every 4 years: 2024, 2028."],
       ["How many minutes in 3 hours?",["180","300","120","36"],"3 × 60."]]}},
{ id:"m6n", T:3, t:"Measurement conversions", s:"Converting length, mass and capacity with decimals",
  L:[["The conversion facts","10 mm = 1 cm, 100 cm = 1 m, 1 000 m = 1 km, 1 000 g = 1 kg, 1 000 ml = 1 l.","1 000 kg = 1 tonne (t)."],
     ["Bigger to smaller unit: multiply","When you change to a smaller unit, you need more of them, so multiply.","2,5 kg = 2,5 × 1 000 = 2 500 g. 3,4 m = 340 cm."],
     ["Smaller to bigger unit: divide","When you change to a bigger unit, you need fewer of them, so divide.","750 ml = 750 ÷ 1 000 = 0,75 l. 1 250 m = 1,25 km."]],
  A:{t:"fill", p:"Convert. Use a decimal comma if you need one (for example 1,5).", d:[["2,5 kg in grams","2500"],["450 cm in metres","4,5"],["3 250 ml in litres","3,25"],["0,8 km in metres","800"],["65 mm in centimetres","6,5"]]},
  Q:[["How many grams are in 1,25 kg?",["1 250 g","125 g","12,5 g","12 500 g"],"1,25 × 1 000."],
     ["What is 3 500 m in kilometres?",["3,5 km","35 km","350 km","0,35 km"],"Divide by 1 000."],
     ["A bottle holds 1,5 l. How many 250 ml glasses can it fill?",["6","5","4","15"],"1 500 ÷ 250."],
     ["What is 1 tonne in kilograms?",["1 000 kg","100 kg","10 000 kg","10 kg"],"A tonne is 1 000 kg."]],
  W:["Add 1,2 kg and 850 g. Give the answer in grams.",["Make the units the same first: 1,2 kg = 1 200 g.","Add: 1 200 g + 850 g = 2 050 g.","You could also write 2,05 kg."],"2 050 g (2,05 kg)"],
  X:"Always change to the same unit before you add or compare. 1,2 kg + 850 g is not 851,2.",
  C:["What is 5 cm in millimetres?",["50 mm","500 mm","0,5 mm","5 mm"],"× 10."],
  H:{L:[["The place value slide","Multiplying by 1 000 moves each digit 3 places to the left. Dividing by 1 000 moves them 3 places to the right.","2,5 × 1 000 = 2 500. 750 ÷ 1 000 = 0,750."],
        ["Does it make sense?","After converting, check: a smaller unit should give a bigger number, and a bigger unit a smaller number.","3 m = 300 cm (more cm than m). Good."]],
    Q:[["What is 0,5 l in millilitres?",["500 ml","50 ml","5 ml","5 000 ml"],"× 1 000."],
       ["Which is longer: 1,2 km or 1 100 m?",["1,2 km","1 100 m","they're equal","can't tell"],"1,2 km = 1 200 m."],
       ["What is 2 345 g in kilograms?",["2,345 kg","23,45 kg","234,5 kg","0,2345 kg"],"÷ 1 000."],
       ["What is 1,75 m in centimetres?",["175 cm","17,5 cm","1 750 cm","1,75 cm"],"× 100."]]}},
{ id:"m6p", T:4, t:"Probability", s:"Outcomes, experiments and comparing chances",
  L:[["Possible outcomes","List every possible outcome of an experiment. A dice has 6; a coin has 2; a spinner has as many as its sections.","Spinning a spinner with red, blue and green parts has 3 outcomes."],
     ["Experiments and frequency","Do an experiment many times and record the results in a tally table. The frequency is how many times each outcome happened.","Toss a coin 30 times: heads 14, tails 16."],
     ["Comparing chances","An outcome that can happen in more ways is more likely. Results of a small experiment can differ from what you expect, but get closer with more tries.","On a dice, rolling a number bigger than 2 (4 ways) is more likely than rolling a 1 (1 way)."]],
  A:{t:"sort", p:"Rolling one normal dice: how likely is each event?", b:["Impossible","Unlikely","Likely","Certain"], d:[["Rolling an 8",0],["Rolling a 6",1],["Rolling a number less than 6",2],["Rolling a number from 1 to 6",3],["Rolling a 0",0],["Rolling a 3",1]]},
  Q:[["How many possible outcomes when you toss two coins?",["4","2","3","6"],"HH, HT, TH, TT."],
     ["A bag has 3 red, 5 blue and 2 green marbles. Which colour is most likely?",["blue","red","green","all equal"],"5 is the most."],
     ["You toss a coin 40 times. About how many heads do you expect?",["20","40","10","0"],"About half."],
     ["Rolling an even number on a dice can happen in how many ways?",["3","2","6","1"],"2, 4 or 6."]],
  W:["List the outcomes of tossing a coin and rolling a dice together",["The coin can be H or T.","The dice can be 1, 2, 3, 4, 5 or 6.","Pair each coin outcome with each dice outcome: H1, H2, ... H6, T1, ... T6.","Count: 2 × 6 = 12 outcomes."],"12 outcomes"],
  X:"Rolling a 6 five times in a row doesn't make a 6 less likely next time. The dice has no memory.",
  C:["Which is more likely on a dice: rolling a 1 or rolling an odd number?",["an odd number","a 1","they're equal","neither"],"3 ways vs 1 way."],
  H:{L:[["Use a tree or table","To find all outcomes of two events, draw a table: one event across the top, the other down the side. Each cell is an outcome.","Coin across (H, T), dice down (1 to 6): 12 cells."],
        ["Fair or unfair?","A game is fair if every player has the same chance of winning.","'Even numbers win for Thabo, odd for Ama' on a dice is fair: 3 ways each."]],
    Q:[["'1 or 2 wins for Ben, 3 to 6 wins for Sam' on a dice. Is it fair?",["No, Sam has more ways to win","Yes","Ben has more chances","Only on Sundays"],"2 ways vs 4 ways."],
       ["How many outcomes when spinning a 4-colour spinner and tossing a coin?",["8","6","4","2"],"4 × 2."],
       ["The number of times an outcome happens is its...",["frequency","probability line","mode","range"],"How often."],
       ["Which outcome is certain when you toss a coin?",["heads or tails","heads","tails","the edge"],"One of the two."]]}}
]};

;
G6_MORE.eng = [
{ id:"e6e", t:"Narrative & descriptive writing", s:"Planning stories and painting pictures with words",
  L:[["Plan the plot","A narrative has an introduction, rising action, a climax (the most exciting part), and a resolution. Plan these before you write.","Climax: the moment the hikers realise the storm has cut off the path."],
     ["Descriptive writing","Description uses the five senses and vivid vocabulary so the reader can picture the scene.","'The market buzzed with voices, and the smell of roasting mielies drifted between the stalls.'"],
     ["Paragraphs and variety","Start a new paragraph for a new time, place, speaker or idea. Vary your sentence beginnings and lengths.","Short sentences build tension. 'Silence. Then a crack.'"]],
  A:{t:"order", p:"Put the parts of a narrative plot in order.", d:["Introduction: meet the characters and setting","Rising action: a problem begins","Climax: the most exciting moment","Falling action: things start to settle","Resolution: the problem is solved"]},
  Q:[["The most exciting moment in a story is the...",["climax","introduction","resolution","title"],"The turning point."],
     ["Which sentence uses the most senses?",["The salty wind stung my face as gulls screeched overhead.","It was a nice day.","We went to the beach.","The beach was there."],"Touch, taste, hearing."],
     ["When should you start a new paragraph?",["for a new time, place, speaker or idea","every sentence","never","only at the end"],"Organise ideas."],
     ["Short sentences are useful for...",["building tension","explaining long ideas","lists","addresses"],"Quick and punchy."]],
  W:["Improve this sentence: 'The dog was big and it barked.'",["Replace weak words: 'big' → 'enormous', 'barked' → 'thundered'.","Add a sense detail: what did it look or sound like?","Rebuild the sentence: 'The enormous dog thundered a bark that rattled the gate.'"],"The enormous dog thundered a bark that rattled the gate."],
  X:"Don't pile on adjectives. 'The big, huge, giant, enormous dog' is weaker than one well-chosen word.",
  C:["What happens in the resolution?",["the problem is solved","the characters are introduced","the problem starts","the title is written"],"The ending."],
  H:{L:[["Show, don't tell","Show feelings through actions, dialogue and body language rather than naming them.","Tell: 'She was nervous.' Show: 'She twisted her sleeve and kept glancing at the door.'"],
        ["Strong verbs","Swap plain verbs for precise ones: walked → strolled, crept, marched; said → whispered, snapped, called.","'He crept down the stairs' tells us more than 'he walked'."]],
    Q:[["Which sentence SHOWS anger?",["He slammed the door so hard the window rattled.","He was angry.","He felt bad.","He was a boy."],"Actions show feelings."],
       ["Which verb best shows moving quietly?",["crept","walked","went","moved"],"Precise verb."],
       ["The rising action is where...",["the problem builds up","the story ends","the title appears","the author's name goes"],"Tension grows."],
       ["Which is the best word to replace 'said' for a quiet voice?",["whispered","shouted","yelled","screamed"],"Soft speech."]]}},
{ id:"e6f", t:"Novels & short stories", s:"Plot, character, setting, conflict and theme",
  L:[["Story elements","Every story has a setting, characters, a plot and a conflict. The main character is the protagonist; the one who opposes them is the antagonist.","In many stories the protagonist must overcome a challenge."],
     ["Types of conflict","Conflict can be between characters (person vs person), with nature (person vs nature), or inside a character's mind (person vs self).","A boy deciding whether to tell the truth is person vs self."],
     ["Theme and point of view","The theme is the big message about life. A story told by 'I' is first person; a story told using 'he' and 'she' is third person.","Theme: courage means acting even when you're afraid."]],
  A:{t:"match", p:"Match each story term to its meaning.", d:[["Protagonist","The main character"],["Antagonist","The character who opposes the main character"],["Setting","Where and when the story happens"],["Theme","The story's message about life"],["First person","The narrator uses 'I'"]]},
  Q:[["A girl trying to survive a flood is an example of...",["person vs nature","person vs self","person vs person","no conflict"],"Nature is the opponent."],
     ["'I opened the door slowly.' This is written in the...",["first person","third person","second person","passive voice"],"I = first person."],
     ["The protagonist is...",["the main character","the villain always","the setting","the author"],"The story follows them."],
     ["Which is a theme?",["Honesty is always worth it.","A dog named Max","A farm","Chapter 3"],"A message about life."]],
  W:["Find the conflict and theme: 'Sizwe finds money on the ground. He wants new shoes but knows it isn't his. He hands it in, and the owner thanks him.'",["Conflict: Sizwe struggles with himself about keeping the money: person vs self.","Resolution: he hands it in.","Theme: doing the right thing matters, even when it's hard."],"Person vs self; theme: honesty matters"],
  X:"The theme isn't a summary of the plot. 'Sizwe hands in the money' is plot; 'honesty matters' is theme.",
  C:["A story told with 'she' and 'they' is in the...",["third person","first person","second person","future tense"],"Narrator outside the story."],
  H:{L:[["Character traits","Describe characters with traits (brave, selfish, curious) and support them with evidence from the story.","Lerato is brave: she climbed down to rescue the goat."],
        ["Prediction and inference","Use clues to predict what will happen and to infer what the author doesn't say directly.","Dark clouds gathering: you can predict a storm is coming."]],
    Q:[["'Thabo shared his lunch with the new boy.' Which trait does this show?",["kind","selfish","lazy","rude"],"Evidence of kindness."],
       ["Inferring means...",["working out what isn't said directly","copying the text","skipping pages","reading the title"],"Reading between the lines."],
       ["A character arguing with a bully shows...",["person vs person conflict","person vs nature","no conflict","person vs self"],"Two characters."],
       ["Why give evidence for a character trait?",["to prove your opinion with the text","to make it longer","because it's fun","it isn't needed"],"Support claims."]]}},
{ id:"e6g", t:"Poetry", s:"Rhyme scheme, imagery and the poet's message",
  L:[["Structure","Poems have lines and stanzas. Free verse doesn't rhyme or follow a set rhythm. A rhyme scheme uses letters to show which lines rhyme.","Lines ending day / play / sun / fun = AABB."],
     ["Imagery and figurative language","Poets create images with similes, metaphors and personification, and use sound devices like alliteration and onomatopoeia.","'The moon is a silver coin' is a metaphor."],
     ["Mood and message","The mood is the feeling the poem creates. The message (theme) is what the poet wants us to think about.","A poem about a lonely old tree might have a sad mood and a message about ageing."]],
  A:{t:"match", p:"Match each line to the device it uses.", d:[["The kettle sang on the stove.","Personification"],["Her eyes were as bright as stars.","Simile"],["The classroom was a beehive.","Metaphor"],["Crash! went the waves.","Onomatopoeia"],["Six sleek swans swam south.","Alliteration"]]},
  Q:[["Lines ending: cat / sun / hat / fun. Rhyme scheme?",["ABAB","AABB","ABBA","AAAA"],"cat/hat, sun/fun."],
     ["A poem with no regular rhyme or rhythm is called...",["free verse","a sonnet","a limerick","a stanza"],"Free form."],
     ["The feeling a poem creates is its...",["mood","rhyme","stanza","title"],"Mood."],
     ["'The moon is a silver coin' is a...",["metaphor","simile","rhyme","pun"],"Says it IS."]],
  W:["Work out the rhyme scheme: 'The rain falls down / on roof and street, / it soaks the town / and cools the heat.'",["Line 1 ends 'down' → A.","Line 2 ends 'street' → new sound, B.","Line 3 ends 'town' → rhymes with down, A.","Line 4 ends 'heat' → rhymes with street, B."],"ABAB"],
  X:"Mood and tone aren't the same. Tone is the poet's attitude; mood is the feeling you get as the reader.",
  C:["A group of lines in a poem is a...",["stanza","chapter","paragraph","verse number"],"Stanza."],
  H:{L:[["Read like a detective","1. Read it twice. 2. Underline images and devices. 3. Ask: how does it make me feel? 4. What is the poet saying?","Write one sentence for the theme."],
        ["Write your own","Choose a topic, brainstorm sense words, and use at least one simile and one alliteration.","'Summer storms stomp like elephants across the sky.'"]],
    Q:[["'Summer storms stomp like elephants' uses...",["alliteration and a simile","only rhyme","a metaphor only","no devices"],"s-s-s and 'like'."],
       ["The theme of a poem is...",["what the poet wants you to think about","the first word","the number of stanzas","the title font"],"The message."],
       ["Which word is onomatopoeia?",["sizzle","bright","river","gentle"],"Sounds like it means."],
       ["To find a poem's mood, ask...",["how does it make me feel?","how many lines?","who printed it?","what's the page number?"],"Feelings."]]}},
{ id:"e6h", t:"Verb tenses", s:"Simple, continuous and perfect tenses",
  L:[["Simple tenses","Simple tenses show a complete action: past (I walked), present (I walk), future (I will walk).","She plays the drums every day."],
     ["Continuous tenses","Continuous tenses show an action that is ongoing. Use a form of 'to be' + -ing.","Past: I was walking. Present: I am walking. Future: I will be walking."],
     ["Perfect tenses","Perfect tenses show an action completed before a certain time. Use has/have/had + past participle.","Present perfect: I have finished. Past perfect: I had finished before the bell rang."]],
  A:{t:"sort", p:"Which tense is each sentence?", b:["Simple","Continuous","Perfect"], d:[["We ate supper.",0],["We are eating supper.",1],["We have eaten supper.",2],["She will sing.",0],["She was singing.",1],["She had sung before we arrived.",2]]},
  Q:[["'They are playing soccer' is in the...",["present continuous","past simple","present perfect","future simple"],"Happening now."],
     ["Which is the past perfect?",["I had finished my homework.","I finished my homework.","I am finishing my homework.","I will finish my homework."],"had + finished."],
     ["Complete: 'By tomorrow I ___ the book.'",["will have read","have read","was reading","reads"],"Future perfect."],
     ["'I have seen that movie' is in the...",["present perfect","past continuous","future simple","present simple"],"have + seen."]],
  W:["Change 'Thandi writes a letter' into the present continuous and present perfect",["Present continuous: a form of 'to be' + -ing: 'Thandi is writing a letter.'","Present perfect: has + past participle: 'Thandi has written a letter.'","Check the participle: write → written (irregular)."],"Thandi is writing a letter. Thandi has written a letter."],
  X:"Don't mix up 'has' and 'have': he/she/it has; I/you/we/they have. 'She have finished' is wrong.",
  C:["Which is in the past continuous?",["We were laughing.","We laughed.","We have laughed.","We laugh."],"was/were + -ing."],
  H:{L:[["Time lines for tenses","Continuous = an action stretched over time (a long line). Perfect = an action finished before a point (a dot before another dot).","'I had eaten before the guests arrived': eating finished first."],
        ["Irregular participles","Learn: go → gone, see → seen, eat → eaten, write → written, take → taken, sing → sung, break → broken.","She has broken the record."]],
    Q:[["What is the past participle of 'go'?",["gone","went","goed","going"],"have gone."],
       ["'He ___ already left when I called.'",["had","has","have","was"],"Past perfect."],
       ["Which shows an action happening right now?",["I am reading.","I read yesterday.","I had read.","I will read."],"Present continuous."],
       ["Correct the verb: 'She have finished.'",["She has finished.","She haved finished.","She having finished.","She is finish."],"she → has."]]}},
{ id:"e6i", t:"Pronouns, prepositions & articles", s:"Small words that do big jobs",
  L:[["Pronouns","Pronouns replace nouns to avoid repetition. Personal: I, you, he, she, it, we, they. Possessive: mine, yours, his, hers, ours, theirs. Reflexive: myself, yourself, themselves.","Zola fixed the bike herself. The bike is hers."],
     ["Prepositions","Prepositions show the position or relationship of a noun: in, on, under, between, behind, during, across.","The cat hid under the bed during the storm."],
     ["Articles","'A' and 'an' are indefinite articles (any one). 'The' is the definite article (a specific one). Use 'an' before a vowel sound.","a banana, an apple, an hour, a university."]],
  A:{t:"sort", p:"Is each word a pronoun or a preposition?", b:["Pronoun","Preposition"], d:[["they",0],["under",1],["herself",0],["between",1],["ours",0],["during",1],["it",0],["across",1]]},
  Q:[["Choose the article: '___ elephant walked by.'",["An","A","The a","Some an"],"Vowel sound."],
     ["Which word is a preposition?",["behind","they","quickly","happy"],"Shows position."],
     ["Choose the pronoun: 'Sipho and ___ went to the shop.'",["I","me","myself","mine"],"Subject pronoun."],
     ["'The book is ___.' (belongs to them)",["theirs","their's","there","they're"],"Possessive pronoun."]],
  W:["Choose 'I' or 'me': 'Gran gave the sweets to Ama and ___.'",["Remove the other person: 'Gran gave the sweets to ___.'","'Gave the sweets to I' sounds wrong; 'to me' sounds right.","Put the other person back: 'to Ama and me.'"],"Ama and me"],
  X:"'An' depends on the sound, not the letter: 'an hour' (silent h), but 'a university' (sounds like 'you').",
  C:["Choose: '___ honest answer.'",["An","A","The an","Two"],"Silent h, vowel sound."],
  H:{L:[["The remove test","When a pronoun is joined with another person, remove the other person to hear which pronoun is right.","'Me and Thabo went' → 'Me went'? No → 'Thabo and I went'."],
        ["Prepositions of time","Use 'on' for days and dates, 'in' for months, years and seasons, 'at' for times.","on Monday, in June, at 3 o'clock."]],
    Q:[["'Our trip is ___ July.'",["in","on","at","by"],"Months use 'in'."],
       ["'The match starts ___ 3 o'clock.'",["at","in","on","for"],"Times use 'at'."],
       ["Which is correct?",["Thabo and I went to the park.","Me and Thabo went to the park.","Thabo and me went to the park.","I and Thabo went to the park."],"Remove Thabo: 'I went'."],
       ["Choose the reflexive pronoun: 'They taught ___ to swim.'",["themselves","theirselves","them","theirs"],"-selves for plural."]]}},
{ id:"e6j", t:"Formal letters & emails", s:"Layout, tone and purpose of formal writing",
  L:[["When to write formally","Write a formal letter or email to someone you don't know personally, like a principal, a company or a newspaper editor.","Letters of request, complaint and application are formal."],
     ["Layout","Formal letter: your address (top right), date, the recipient's address (left), greeting (Dear Sir/Madam or Dear Mr Dlamini), a subject line (RE: ...), body, and a formal ending.","End with 'Yours faithfully' if you used Sir/Madam, or 'Yours sincerely' if you used their name."],
     ["Tone and emails","Use polite, clear language without slang or contractions. Emails need a clear subject line, a greeting, short paragraphs and a sign-off.","Subject: Request for library access during holidays"]],
  A:{t:"order", p:"Put the parts of a formal letter in order.", d:["Your address and the date","The recipient's name and address","Greeting: Dear Mrs Naidoo","Subject line: RE: Request for a school garden","Introduction: why you are writing","Body: details and reasons","Conclusion: what you hope will happen","Yours sincerely, your name"]},
  Q:[["You start with 'Dear Sir/Madam'. How do you end?",["Yours faithfully","Yours sincerely","Love","Cheers"],"Unknown name → faithfully."],
     ["Which belongs in a formal letter?",["I would appreciate your help.","Hey, what's up?","LOL that's funny","Gonna need help"],"Polite, formal language."],
     ["What does a subject line do?",["states what the letter is about","gives your address","ends the letter","lists your hobbies"],"RE: ..."],
     ["Who would you write a formal letter to?",["the mayor","your best friend","your cousin","your pet"],"Someone in an official role."]],
  W:["Rewrite informally written text in a formal tone: 'Hi! Can u fix the broken taps at school? They're a mess.'",["Use a formal greeting: Dear Mr Mokoena,","Remove slang and contractions: 'can u' → 'could you', 'they're' → 'they are'.","Be specific and polite: 'I am writing to request that the broken taps in the Grade 6 bathroom be repaired.'"],"Dear Mr Mokoena, I am writing to request that the broken taps in the Grade 6 bathroom be repaired."],
  X:"Don't use contractions (don't, can't, I'm) or slang in a formal letter. Write the full words.",
  C:["'Yours sincerely' is used when...",["you know the person's name","you wrote Dear Sir/Madam","writing to a friend","sending a text message"],"Named greeting."],
  H:{L:[["Paragraph plan","Paragraph 1: introduce yourself and the purpose. Paragraph 2 (and 3): details and reasons. Last paragraph: what you'd like to happen and thank them.","'Thank you for considering my request.'"],
        ["Email etiquette","Use a clear subject, a polite greeting, check spelling, and don't type in capitals (it looks like shouting).","Re-read before clicking Send."]],
    Q:[["Typing a whole email in CAPITALS looks like...",["shouting","good manners","a formal style","a subject line"],"Avoid it."],
       ["Which is a good closing sentence?",["Thank you for considering my request.","Bye!","That's all lol.","Write back now."],"Polite and formal."],
       ["Where does your own address go in a formal letter?",["top right","bottom left","in the subject line","nowhere"],"With the date."],
       ["Which is a contraction to avoid?",["can't","cannot","do not","I am"],"Use 'cannot'."]]}},
{ id:"e6k", t:"News reports", s:"Headlines, the 5 Ws and reporting facts",
  L:[["Purpose and headline","A news report informs readers about a real event. The headline is short and catchy and often leaves out small words.","'Lion Escapes Zoo, Found In Garden'"],
     ["The 5 Ws and H","The first paragraph answers who, what, where, when, why and how. Less important details come later.","'On Monday (when), firefighters (who) rescued a cat (what) from a tree in Soweto (where).'"],
     ["Facts, quotes and tone","News reports use facts, are written in the third person and past tense, and include quotes from people involved.","\"It was terrifying,\" said Mrs Khumalo."]],
  A:{t:"match", p:"Match each question to its answer from this lead: 'On Saturday, Grade 6 learners from Sunrise Primary raised R5 000 at a fun run in Polokwane to help flood victims.'", d:[["Who?","Grade 6 learners from Sunrise Primary"],["What?","Raised R5 000"],["When?","On Saturday"],["Where?","In Polokwane"],["Why?","To help flood victims"]]},
  Q:[["What should the first paragraph of a news report answer?",["who, what, where, when, why and how","only the headline","the reporter's opinion","the ending"],"The 5 Ws and H."],
     ["News reports are written mainly in the...",["past tense and third person","future tense and first person","present tense and second person","command form"],"Reporting what happened."],
     ["Which is a good headline?",["Learners Raise Thousands For Flood Victims","This is a story about some learners who did a nice thing","Hello readers","The end"],"Short and catchy."],
     ["Why include quotes?",["to give the words of people involved","to make it a poem","to add opinions of the writer","to fill space"],"Real voices."]],
  W:["Turn this into a news lead: 'A big storm hit Durban last night. Trees fell on cars. No one was hurt.'",["Who/what: a storm, falling trees.","Where/when: Durban, last night.","Most important fact first, in one or two sentences."],"A violent storm struck Durban last night, bringing down trees onto cars, but no one was injured."],
  X:"A news report isn't the place for the writer's opinion. 'The amazing learners did a wonderful thing' becomes 'The learners raised R5 000'.",
  C:["Which sentence belongs in a news report?",["The fire started at 14:00, the fire chief said.","I think fires are scary.","Fires will happen next year.","Please call me."],"A fact with a source."],
  H:{L:[["The inverted pyramid","News reports put the most important information first and the least important last, like an upside-down pyramid.","Editors can cut from the bottom without losing the main story."],
        ["Fact or opinion check","Before writing a sentence, ask: can this be checked? If not, it's opinion, so leave it out or put it in a quote.","\"It was the best day ever,\" said a learner. (an opinion inside a quote)"]],
    Q:[["In the inverted pyramid, the most important information comes...",["first","last","in the middle","nowhere"],"Top of the story."],
       ["How can a reporter include an opinion fairly?",["as a quote from someone","in the headline as fact","as the reporter's view","not at all, ever"],"Attribute it."],
       ["Which question asks about the reason?",["Why?","Where?","When?","Who?"],"The reason."],
       ["Headlines often leave out...",["small words like 'a' and 'the'","all nouns","all verbs","capital letters"],"To be short."]]}},
{ id:"e6l", t:"Dialogues & interviews", s:"Writing conversations and asking good questions",
  L:[["Dialogue layout","A written dialogue (like a play script) puts each speaker's name on the left, followed by a colon. No inverted commas are needed.","THABO: Are you coming to practice? / LERATO: Only if it doesn't rain."],
     ["Stage directions","Instructions for actions or how to speak go in brackets.","LERATO: (laughing) You always say that!"],
     ["Interviews","An interview uses open questions that can't be answered with just yes or no. Listen and ask follow-up questions.","Open: 'What do you enjoy most about being a nurse?'"]],
  A:{t:"sort", p:"Open question (gets a full answer) or closed question (yes/no)?", b:["Open question","Closed question"], d:[["What inspired you to become a chef?",0],["Do you like cooking?",1],["How did you feel on your first day?",0],["Is it hard?",1],["Why did you choose this career?",0],["Are you happy?",1]]},
  Q:[["In a dialogue, what comes after the speaker's name?",["a colon","inverted commas","a question mark","a full stop"],"NAME: words."],
     ["Stage directions go in...",["brackets","inverted commas","capital letters only","footnotes"],"(whispering)"],
     ["Which is an open question?",["What was the hardest part?","Was it hard?","Did you win?","Are you tired?"],"Can't answer yes/no."],
     ["Why ask follow-up questions in an interview?",["to learn more about an interesting answer","to end quickly","to confuse the person","to repeat yourself"],"Dig deeper."]],
  W:["Change direct speech into dialogue form: '\"Can I borrow your pen?\" asked Musa. \"Sure,\" replied Nomsa with a smile.'",["Put each speaker's name, in capitals, then a colon.","Remove the inverted commas and the 'asked/replied'.","Put the action in brackets as a stage direction."],"MUSA: Can I borrow your pen? NOMSA: (smiling) Sure."],
  X:"Don't use inverted commas in a dialogue script. The speaker's name and colon already show who is talking.",
  C:["Which is set out as a dialogue?",["SIPHO: Let's go!","\"Let's go!\" said Sipho.","Sipho said that they should go.","Sipho went."],"Name and colon."],
  H:{L:[["Plan an interview","Research the person first, write 5 to 8 open questions in a logical order, and thank them at the end.","Start easy: 'Tell me about yourself.'"],
        ["Turn closed into open","Start with how, what, why or tell me about.","'Do you like your job?' → 'What do you like most about your job?'"]],
    Q:[["Turn 'Was the trip fun?' into an open question.",["What was the best part of the trip?","Was it fun?","Did you go?","Yes or no?"],"Starts with 'what'."],
       ["What should you do at the end of an interview?",["thank the person","walk away","ask yes/no questions","argue"],"Good manners."],
       ["Which word usually starts an open question?",["Why","Is","Did","Are"],"Invites explanation."],
       ["Where do you write how a line should be spoken?",["in brackets","after the full stop","in the title","nowhere"],"Stage direction."]]}},
{ id:"e6m", t:"Summaries & mind maps", s:"Picking out main ideas and organising notes",
  L:[["Find the main points","Read the text, then underline the topic sentence of each paragraph. Ignore examples, repetition and descriptive details.","A paragraph about a cheetah's speed: main point is 'Cheetahs are the fastest land animals.'"],
     ["Write in your own words","A summary is short, in full sentences and in your own words. Stick to the word limit and don't add your opinion.","'Cheetahs can run about 100 km/h but only for short distances.'"],
     ["Mind maps","A mind map puts the topic in the centre with branches for main ideas and smaller branches for details. It's great for planning and studying.","Topic: Water. Branches: uses, sources, saving water."]],
  A:{t:"sort", p:"Main point or extra detail? (Text: 'Bees are important pollinators. A bee can visit hundreds of flowers a day. Without bees, many crops would fail. Bees are black and yellow.')", b:["Main point","Extra detail"], d:[["Bees are important pollinators.",0],["Without bees, many crops would fail.",0],["Bees are black and yellow.",1],["A bee can visit hundreds of flowers a day.",1]]},
  Q:[["A summary should be...",["short and in your own words","longer than the original","full of your opinions","copied exactly"],"Main points only."],
     ["What goes in the centre of a mind map?",["the main topic","the smallest detail","your name","the date"],"Branches grow from it."],
     ["Which should you leave out of a summary?",["examples and repetition","main ideas","key facts","topic sentences"],"Cut the extras."],
     ["The topic sentence of a paragraph is usually...",["the main idea","a joke","a question","a list"],"Often the first sentence."]],
  W:["Summarise in one sentence: 'Plastic takes hundreds of years to break down. It fills landfills and oceans, where animals eat it and get sick. We can help by using fewer plastic bags and recycling.'",["Main points: plastic lasts a long time; it harms land, oceans and animals; we can reduce and recycle.","Combine them and use your own words.","Keep it short."],"Plastic lasts for centuries and harms the environment, so we should use less and recycle more."],
  X:"Don't just copy the first sentence of each paragraph word for word. A summary must be in your own words.",
  C:["What should a summary NOT include?",["your own opinion","main points","full sentences","your own words"],"Stay objective."],
  H:{L:[["The highlighter test","Highlight only 1 or 2 key phrases per paragraph. If everything is highlighted, nothing stands out.","Less is more."],
        ["Count your words","If you must write 50 words, count as you go and cut extra words like 'very', 'really' and 'basically'.","'It is very, really important' → 'It is vital'."]],
    Q:[["How much should you highlight per paragraph?",["1 or 2 key phrases","everything","nothing","only the last word"],"Focus."],
       ["Which words can usually be cut?",["very, really, basically","main nouns","key verbs","facts"],"Filler words."],
       ["Mind maps are useful for...",["planning and studying","drawing pictures only","writing letters only","nothing"],"Organising ideas."],
       ["Which is a good summary of 'The rain fell all day, so the match was postponed'?",["Rain postponed the match.","It rained.","Matches are fun.","The weather was nice."],"Short and complete."]]}},
{ id:"e6n", t:"Idioms, proverbs & word meanings", s:"Figurative expressions and tricky words",
  L:[["Idioms","An idiom is an expression whose meaning is different from the words themselves.","'It's raining cats and dogs' means it's raining very hard."],
     ["Proverbs","A proverb is a short, well-known saying that gives advice or a truth about life. Many come from African languages.","'Umuntu ngumuntu ngabantu': a person is a person through other people."],
     ["Homonyms and homophones","Homonyms are spelt the same but have different meanings (a bat / to bat). Homophones sound the same but are spelt differently (flour / flower).","She baked with flour and picked a flower."]],
  A:{t:"match", p:"Match each idiom to its meaning.", d:[["Break a leg","Good luck"],["A piece of cake","Very easy"],["Spill the beans","Tell a secret"],["Under the weather","Feeling ill"],["Hit the books","Study hard"]]},
  Q:[["'Once in a blue moon' means...",["very rarely","every night","when the moon is blue","never"],"Hardly ever."],
     ["Which is a proverb?",["Look before you leap.","The cat sat on the mat.","I like rice.","Turn left."],"Advice about life."],
     ["Choose the homophone: 'The wind ___ the leaves away.'",["blew","blue","blow","bloo"],"Past of blow."],
     ["'Bat' (animal) and 'bat' (cricket) are...",["homonyms","antonyms","synonyms","idioms"],"Same spelling, different meanings."]],
  W:["Explain the proverb 'Many hands make light work'",["Literal words: many hands, light (easy) work.","Think about when it's used: when people help each other.","Meaning: a job is easier when many people share it."],"Teamwork makes jobs easier"],
  X:"Don't read an idiom literally. 'Let the cat out of the bag' has nothing to do with cats.",
  C:["'Hold your horses' means...",["wait and be patient","ride a horse","hold a toy","run fast"],"Slow down."],
  H:{L:[["Use context","If you don't know an idiom, read the whole sentence and think about what makes sense.","'After the race, I was dead on my feet' → very tired."],
        ["Proverbs from home","Ask family members for proverbs in your home language and what they mean.","Setswana: 'Kgomo e tshwarwa ka lenaka, motho o tshwarwa ka lefoko' (a cow is held by its horn, a person by their word)."]],
    Q:[["'I was dead on my feet' means...",["very tired","injured","asleep","standing still"],"Exhausted."],
       ["'A person is held by their word' teaches...",["keep your promises","talk a lot","never speak","cows are important"],"Be trustworthy."],
       ["Choose the homophone: 'Please ___ the door.'",["close","clothes","clows","cloze"],"To shut."],
       ["'Cost an arm and a leg' means...",["very expensive","painful","cheap","free"],"A high price."]]}}
];
