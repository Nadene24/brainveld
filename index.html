{ id:"m7g", T:1, t:"Constructions", s:"Using a compass, ruler and protractor accurately",
  L:[["Tools","A ruler measures length, a protractor measures and draws angles, and a compass draws circles and arcs. Use a sharp pencil.","Set the compass to the radius you need before drawing."],
     ["Drawing and measuring angles","Place the centre of the protractor on the vertex and line up 0° with one arm. Read from the scale that starts at 0° on that arm.","An angle that looks less than a right angle must be less than 90°."],
     ["Bisecting","To bisect is to cut exactly in half. To bisect a line, draw equal arcs from both ends above and below the line and join the crossing points. To bisect an angle, draw arcs from the vertex, then from each arm, and join to the crossing point.","A perpendicular bisector cuts a line in half at 90°."]],
  A:{t:"order", p:"Put the steps for constructing a triangle with sides 6 cm, 5 cm and 4 cm in order.", d:["Draw the 6 cm side with a ruler and label its ends A and B","Set the compass to 5 cm and draw an arc from A","Set the compass to 4 cm and draw an arc from B","Mark C where the arcs cross","Join A and B to C"]},
  Q:[["Which tool draws an arc?",["compass","protractor","ruler","calculator"],"It swings around a point."],
     ["To bisect an angle means to...",["cut it into two equal angles","double it","measure it","make it 90°"],"Exactly half."],
     ["A perpendicular bisector meets the line at...",["90°","45°","180°","60°"],"Perpendicular means at right angles."],
     ["When measuring an angle, the protractor's centre goes on the...",["vertex","end of an arm","middle of the paper","longest side"],"The corner point."]],
  W:["Construct a 60° angle without a protractor",["Draw a straight line and mark point A on it.","Put the compass on A and draw an arc that crosses the line at B.","Keep the same width, put the compass on B and draw an arc that crosses the first arc at C.","Join A to C. Angle CAB is 60° (ABC is an equilateral triangle)."],"Two equal arcs make an equilateral triangle, so 60°"],
  X:"Read the protractor scale that starts at 0° on your arm. Using the wrong scale gives 180° minus the right answer, like 130° instead of 50°.",
  C:["Which tool would you use to draw a circle with a 4 cm radius?",["a compass","a protractor","a set square only","an eraser"],"Set it to 4 cm."],
  H:{L:[["Keep the compass steady","Hold the compass at the top, tilt it slightly and turn it in one smooth movement. Don't change the width halfway.","Tighten the screw if the compass slips."],
        ["Check your answer","After constructing, measure to check. A 60° angle should read 60° on a protractor; bisected angles should be equal.","Small errors of 1° are normal; big ones mean redo it."]],
    Q:[["Bisecting a 90° angle gives two angles of...",["45°","90°","30°","180°"],"Half of 90."],
       ["What can you construct with two equal compass arcs from the ends of a line?",["the perpendicular bisector","a reflex angle","a circle only","a parallelogram"],"Join the crossing points."],
       ["You measure 130° but the angle is clearly acute. What went wrong?",["you read the wrong scale","the protractor is broken","acute angles are 130°","nothing"],"It should be 50°."],
       ["An equilateral triangle has angles of...",["60° each","90° each","45° each","different sizes"],"All equal."]]}},
{ id:"m7h", T:2, t:"Triangles, quadrilaterals & congruence", s:"Classifying shapes and recognising congruent and similar figures",
  L:[["Classifying triangles","By sides: equilateral (3 equal), isosceles (2 equal), scalene (none equal). By angles: acute (all < 90°), right-angled (one 90°), obtuse (one > 90°).","An isosceles triangle has two equal base angles."],
     ["Quadrilateral properties","Angles in a quadrilateral add up to 360°. A parallelogram has opposite sides and angles equal. A rhombus has diagonals that cross at 90°. A rectangle has equal diagonals.","Three angles of 90°, 90° and 100° leave 80°."],
     ["Congruent and similar","Congruent shapes are identical in shape and size. Similar shapes have the same shape and angles, but different sizes (sides in proportion).","Two A4 pages are congruent. A photo and its enlargement are similar."]],
  A:{t:"sort", p:"Congruent or similar (but not congruent)?", b:["Congruent","Similar only"], d:[["Two R5 coins",0],["A photo and a poster of the same picture",1],["Two identical floor tiles",0],["A model car and the real car",1],["Two pages from the same exercise book",0],["A map and the area it shows",1]]},
  Q:[["The angles in a quadrilateral add up to...",["360°","180°","90°","540°"],"It splits into two triangles."],
     ["A triangle with sides 5 cm, 5 cm and 8 cm is...",["isosceles","equilateral","scalene","right-angled"],"Two equal sides."],
     ["Congruent shapes are...",["the same shape and size","the same shape, different size","different shapes","only triangles"],"Identical."],
     ["Three angles of a quadrilateral are 70°, 110° and 90°. The fourth is...",["90°","80°","100°","70°"],"360 − 270."]],
  W:["An isosceles triangle has a top angle of 40°. Find the two base angles.",["Angles in a triangle add up to 180°.","180 − 40 = 140° is shared by the two base angles.","In an isosceles triangle, the base angles are equal: 140 ÷ 2 = 70°."],"70° and 70°"],
  X:"Similar doesn't mean 'roughly alike'. Similar shapes must have equal angles and sides in the same proportion.",
  C:["A right-angled triangle has one angle of...",["90°","60°","120°","180°"],"A right angle."],
  H:{L:[["Why 360°?","Draw a diagonal across any quadrilateral: it makes two triangles. 2 × 180° = 360°.","The same trick works for any polygon."],
        ["Checking for similarity","Compare matching sides: if each pair has the same ratio, the shapes are similar.","3 cm → 6 cm and 4 cm → 8 cm: both doubled, so similar."]],
    Q:[["Sides 3, 4, 5 and 6, 8, 10: are the triangles similar?",["Yes, all sides doubled","No","Only if coloured","They're congruent"],"Same ratio."],
       ["A parallelogram has one angle of 70°. The angle opposite it is...",["70°","110°","290°","20°"],"Opposite angles are equal."],
       ["How many triangles does one diagonal make in a quadrilateral?",["2","1","3","4"],"So 2 × 180°."],
       ["A triangle with angles 30°, 60°, 90° is...",["right-angled","obtuse","equilateral","isosceles"],"One 90° angle."]]}},
{ id:"m7i", T:2, t:"Common fractions", s:"Adding, subtracting, multiplying and dividing fractions",
  L:[["Adding and subtracting","Find a common denominator (the LCM of the denominators), change each fraction, then add or subtract the numerators. Simplify.","2/3 + 3/4 = 8/12 + 9/12 = 17/12 = 1 5/12"],
     ["Multiplying","Multiply numerators together and denominators together. Simplify. 'Of' means multiply.","2/3 × 3/5 = 6/15 = 2/5. And 3/4 of 20 = 15."],
     ["Dividing","To divide by a fraction, multiply by its reciprocal (flip it upside down).","3/4 ÷ 1/2 = 3/4 × 2/1 = 6/4 = 1 1/2"]],
  A:{t:"fill", p:"Type answers as fractions like 3/4 or mixed numbers like 1 1/2. Simplest form.", d:[["1/2 + 1/3","5/6"],["3/4 − 1/6","7/12"],["2/5 × 5/8","1/4"],["2/3 ÷ 4/9","1 1/2"],["3/5 of 45","27"]]},
  Q:[["What is 1/4 + 2/3?",["11/12","3/7","3/12","2/12"],"3/12 + 8/12."],
     ["What is 3/4 × 2/3?",["1/2","6/7","5/12","9/8"],"6/12 = 1/2."],
     ["What is 5 ÷ 1/2?",["10","2 1/2","5/2","1/10"],"How many halves in 5? 10."],
     ["What is the reciprocal of 3/7?",["7/3","3/7","1/7","−3/7"],"Flip it."]],
  W:["Calculate 2 1/4 × 1 1/3",["Change to improper fractions: 9/4 × 4/3.","Multiply: (9 × 4) / (4 × 3) = 36/12.","Simplify: 36/12 = 3."],"3"],
  X:"Never multiply mixed numbers part by part. 2 1/4 × 1 1/3 is not 2 × 1 and 1/4 × 1/3. Change to improper fractions first.",
  C:["What is 1/2 of 3/4?",["3/8","3/4","1/4","2/6"],"1/2 × 3/4."],
  H:{L:[["Keep, change, flip","For division: Keep the first fraction, Change ÷ to ×, Flip the second fraction.","2/3 ÷ 4/9 → 2/3 × 9/4 = 18/12 = 1 1/2."],
        ["Simplify before multiplying","Cancel common factors across the top and bottom first to keep numbers small.","4/9 × 3/8: cancel 4 with 8 (÷ 4) and 3 with 9 (÷ 3): 1/3 × 1/2 = 1/6."]],
    Q:[["4/9 × 3/8 = ?",["1/6","12/72","7/17","1/3"],"Cancel first."],
       ["3/5 ÷ 3/10 = ?",["2","9/50","1/2","6/10"],"3/5 × 10/3 = 2."],
       ["1 1/2 + 2 3/4 = ?",["4 1/4","3 4/6","4","3 1/4"],"3 + 1/2 + 3/4 = 4 1/4."],
       ["A recipe needs 3/4 cup of sugar. You make half the recipe. How much sugar?",["3/8 cup","1/4 cup","1 1/2 cups","3/4 cup"],"1/2 × 3/4."]]}},
{ id:"m7j", T:2, t:"Decimal fractions", s:"Calculating with decimals and converting",
  L:[["Place value","After the decimal comma come tenths, hundredths and thousandths. 3,456 = 3 + 4/10 + 5/100 + 6/1 000.","0,25 = 25/100 = 1/4"],
     ["Adding, subtracting and multiplying","Line up the commas to add or subtract. To multiply, multiply as whole numbers, then count the decimal places in the question and put that many in the answer.","0,3 × 0,4: 3 × 4 = 12, two decimal places → 0,12."],
     ["Dividing and rounding","To divide by a decimal, multiply both numbers by 10, 100 or 1 000 to make the divisor a whole number. Round by looking at the next digit.","4,8 ÷ 0,6 = 48 ÷ 6 = 8. 3,467 rounded to 2 decimal places = 3,47."]],
  A:{t:"fill", p:"Use a decimal comma (for example 2,5).", d:[["2,75 + 1,6","4,35"],["5 − 1,25","3,75"],["0,6 × 0,3","0,18"],["7,2 ÷ 0,9","8"],["Round 12,846 to 1 decimal place","12,8"]]},
  Q:[["What is 1,5 × 1,2?",["1,8","18","0,18","2,7"],"15 × 12 = 180, two decimal places."],
     ["Which is the largest?",["0,7","0,65","0,699","0,07"],"0,700 is biggest."],
     ["What is 3/8 as a decimal?",["0,375","0,38","3,8","0,0375"],"3 ÷ 8."],
     ["R45,60 is shared equally by 4 friends. Each gets...",["R11,40","R11,04","R12,40","R10,40"],"45,60 ÷ 4."]],
  W:["Calculate 2,4 × 0,05",["Ignore the commas: 24 × 5 = 120.","Count decimal places: 2,4 has 1 and 0,05 has 2, total 3.","Put 3 decimal places in 120: 0,120 = 0,12."],"0,12"],
  X:"Multiplying by a decimal smaller than 1 makes a number smaller, not bigger. 8 × 0,5 = 4.",
  C:["What is 0,2 × 0,2?",["0,04","0,4","4","0,004"],"2 × 2 = 4, two decimal places."],
  H:{L:[["Money helps","Think of decimals as rands and cents. R0,05 is 5 cents. R2,40 × 3 = R7,20.","Money makes decimals feel real."],
        ["Fractions to decimals","Divide the numerator by the denominator, or make the denominator 10, 100 or 1 000.","3/5 = 6/10 = 0,6. 7/20 = 35/100 = 0,35."]],
    Q:[["What is 7/20 as a decimal?",["0,35","0,72","3,5","0,7"],"35/100."],
       ["R2,40 × 3 = ?",["R7,20","R6,20","R7,02","R72,00"],"Money."],
       ["What is 9 ÷ 0,3?",["30","3","0,3","27"],"90 ÷ 3."],
       ["Round 4,996 to 2 decimal places.",["5,00","4,99","4,10","5,1"],"6 rounds up and carries."]]}},
{ id:"m7k", T:3, t:"Functions & relationships", s:"Input-output rules, tables and formulae",
  L:[["Input and output","A function takes an input, follows a rule, and gives exactly one output. Rules can be written in words, flow diagrams, tables or formulas.","Rule: multiply by 3 and add 1. Input 4 → output 13."],
     ["Tables of values","Find the rule in a table by looking at how the output changes when the input goes up by 1, then adjust.","x: 1, 2, 3 → y: 5, 8, 11. Goes up by 3 each time, so y = 3x + 2."],
     ["Formulas","A formula is a rule using letters. Substitute numbers for the letters to calculate.","Perimeter of a rectangle: P = 2(l + b). If l = 5 and b = 3, P = 16."]],
  A:{t:"fill", p:"Find the missing value.", d:[["y = 2x + 3. If x = 7, y = ?","17"],["y = 5x − 4. If x = 3, y = ?","11"],["y = 4x. If y = 36, x = ?","9"],["Table: x = 1, 2, 3 gives y = 4, 7, 10. What is y when x = 10?","31"],["P = 2(l + b), l = 8, b = 5. P = ?","26"]]},
  Q:[["Rule: y = 3x − 2. What is y when x = 6?",["16","18","20","4"],"3 × 6 − 2."],
     ["Table: x = 1, 2, 3; y = 6, 7, 8. The rule is...",["y = x + 5","y = 6x","y = x + 6","y = 2x + 4"],"Add 5."],
     ["The cost of taxi trips is C = 15n, where n is the number of trips. Cost of 4 trips?",["R60","R19","R15","R54"],"15 × 4."],
     ["Which input gives an output of 20 for y = 4x + 4?",["4","5","6","3"],"4 × 4 + 4 = 20."]],
  W:["Find the rule for: x = 1, 2, 3, 4 and y = 3, 7, 11, 15",["The y-values go up by 4 each time, so the rule starts with 4x.","Check x = 1: 4 × 1 = 4, but y is 3. So subtract 1.","Rule: y = 4x − 1.","Check x = 3: 4 × 3 − 1 = 11. Correct."],"y = 4x − 1"],
  X:"The difference between outputs gives the number that multiplies x, but you usually still need to add or subtract something. Always check with a value from the table.",
  C:["y = x² . What is y when x = 5?",["25","10","7","52"],"5 × 5."],
  H:{L:[["Work backwards","To find the input from an output, undo the rule in reverse: undo adding by subtracting, undo multiplying by dividing.","y = 3x + 5 and y = 23: 23 − 5 = 18, 18 ÷ 3 = 6."],
        ["Real-life formulas","Formulas appear everywhere: cost of airtime, distance = speed × time, area = length × breadth.","Speed 60 km/h for 3 hours: 180 km."]],
    Q:[["y = 3x + 5 and y = 23. What is x?",["6","7","9","18"],"Undo the steps."],
       ["Distance = speed × time. 80 km/h for 2,5 h?",["200 km","82,5 km","160 km","32 km"],"80 × 2,5."],
       ["Which rule fits x = 2 → y = 7 and x = 3 → y = 10?",["y = 3x + 1","y = x + 5","y = 2x + 3","y = 5x − 3"],"Check both."],
       ["A function gives how many outputs for each input?",["exactly one","two","none","any number"],"That's what makes it a function."]]}},
{ id:"m7l", T:3, t:"Reading graphs", s:"Line graphs, global graphs and what they tell us",
  L:[["Axes and plotting","A graph has a horizontal axis (often the input or time) and a vertical axis (the output). Each point is an ordered pair (x ; y).","The point (3 ; 5) is 3 across and 5 up."],
     ["Global graphs","A global graph shows a trend without exact numbers. Look at whether it goes up (increasing), down (decreasing) or stays flat (constant).","A flat line on a distance-time graph means the person stopped."],
     ["Interpreting graphs","Read the title and labels first. Steeper lines mean faster change. Describe what happens in each part of the graph.","A steep rise in a temperature graph means it heated up quickly."]],
  A:{t:"match", p:"Match each graph shape to what it shows on a distance-from-home graph.", d:[["Line going up steeply","Moving away from home quickly"],["Line going up gently","Moving away from home slowly"],["Flat line","Stopped, not moving"],["Line going down","Coming back home"],["Line at zero","At home"]]},
  Q:[["In the ordered pair (4 ; 7), the 4 is read on the...",["horizontal axis","vertical axis","title","key"],"Across first."],
     ["A temperature graph goes down all morning. The temperature is...",["decreasing","increasing","constant","unknown"],"Going down."],
     ["On a distance-time graph, a steeper line means...",["moving faster","moving slower","standing still","going home"],"More distance per time."],
     ["A graph that shows a trend without exact values is a...",["global graph","table","pie chart","pictogram"],"Big-picture view."]],
  W:["Describe a graph of a bath's water level over time: up steadily, flat, then down quickly",["Part 1: the level rises steadily → the tap is filling the bath.","Part 2: the line is flat → the tap is off and someone is bathing.","Part 3: the level drops quickly → the plug is pulled and the water drains."],"Filling, staying the same, then draining"],
  X:"A graph that goes up isn't always 'good'. Read the labels: a rising line on a 'number of injuries' graph is bad news.",
  C:["A flat line on a graph means the value is...",["staying the same","increasing","decreasing","zero always"],"Constant."],
  H:{L:[["Plot from a table","Each row in a table gives one point. Mark it on the graph and join the points if the data changes continuously.","x: 0, 1, 2 and y: 1, 3, 5 → points (0 ; 1), (1 ; 3), (2 ; 5)."],
        ["Tell the story","Describe a graph like a story: what happens first, then next, then at the end. Use words like increases, decreases, stays constant, steeply, gradually.","'The price increased gradually, then fell sharply.'"]],
    Q:[["Which point is plotted from x = 2, y = 5?",["(2 ; 5)","(5 ; 2)","(2 ; 2)","(7 ; 0)"],"x first."],
       ["'Gradually' describes a line that is...",["gently sloping","very steep","flat","broken"],"Slow change."],
       ["A car's speed graph rises, stays flat, then drops to zero. At the end the car...",["stops","speeds up","reverses","flies"],"Speed zero."],
       ["Where does the point (0 ; 0) lie?",["at the origin","at the top","off the graph","at the title"],"Where the axes meet."]]}},
{ id:"m7m", T:3, t:"Area & perimeter", s:"Squares, rectangles, triangles and unit conversions",
  L:[["Formulas","Perimeter of a square = 4 × side. Perimeter of a rectangle = 2(l + b). Area of a square = side². Area of a rectangle = l × b. Area of a triangle = ½ × base × height.","A rectangle 8 m by 5 m: P = 26 m, A = 40 m²."],
     ["Composite shapes","Split a complicated shape into rectangles and triangles, find each area, then add (or subtract).","An L-shape can be split into two rectangles."],
     ["Square units","Area units are squared. 1 cm² = 100 mm². 1 m² = 10 000 cm².","2 m² = 20 000 cm²."]],
  A:{t:"fill", p:"Type the number only.", d:[["Area of a square with sides of 9 cm (cm²)","81"],["Perimeter of a rectangle 12 m by 7 m (m)","38"],["Area of a triangle with base 10 cm, height 7 cm (cm²)","35"],["A square has an area of 64 m². Its side (m)?","8"],["3 m² in cm²","30000"]]},
  Q:[["A rectangle has an area of 48 cm² and a length of 8 cm. What is its breadth?",["6 cm","40 cm","56 cm","5 cm"],"48 ÷ 8."],
     ["What is the area of a triangle with base 12 m and height 9 m?",["54 m²","108 m²","21 m²","42 m²"],"½ × 12 × 9."],
     ["How many cm² in 1 m²?",["10 000","100","1 000","1 000 000"],"100 × 100."],
     ["A square has a perimeter of 36 cm. Its area?",["81 cm²","36 cm²","144 cm²","9 cm²"],"Side 9, area 81."]],
  W:["Find the area of an L-shape: a 10 m by 6 m rectangle with a 4 m by 3 m rectangle cut from one corner",["Area of the full rectangle: 10 × 6 = 60 m².","Area of the cut-out: 4 × 3 = 12 m².","Subtract: 60 − 12 = 48 m²."],"48 m²"],
  X:"1 m² is not 100 cm². A square metre is 100 cm by 100 cm, which is 10 000 cm².",
  C:["Area of a rectangle 7 cm by 6 cm?",["42 cm²","26 cm","13 cm²","42 cm"],"l × b."],
  H:{L:[["Draw and label","Sketch the shape, write every measurement on it, and mark which lengths are base and height.","It's much easier to see what's missing."],
        ["Paint and tile problems","Find the area, then divide by how much one tin or tile covers. Round up for things you buy whole.","25 m² of wall, 1 tin covers 10 m²: 2,5 → buy 3 tins."]],
    Q:[["A wall is 30 m². One tin of paint covers 8 m². How many tins must you buy?",["4","3","3,75","5"],"Round up 3,75."],
       ["Tiles are 0,5 m by 0,5 m. How many cover a 2 m by 2 m floor?",["16","4","8","2"],"4 m² ÷ 0,25 m²."],
       ["Area of a square with side 1,5 m?",["2,25 m²","3 m²","6 m²","2,5 m²"],"1,5 × 1,5."],
       ["Perimeter of a square with area 49 m²?",["28 m","49 m","14 m","7 m"],"Side 7, × 4."]]}},
{ id:"m7n", T:3, t:"Surface area & volume", s:"Cubes and rectangular prisms",
  L:[["Volume","Volume is the space inside a 3D object. Volume of a rectangular prism = length × breadth × height. Volume of a cube = side³.","A box 5 cm × 4 cm × 3 cm has a volume of 60 cm³."],
     ["Surface area","Surface area is the total area of all the faces. A rectangular prism has 3 pairs of matching faces: SA = 2(lb + lh + bh). A cube: SA = 6 × side².","A cube with 3 cm sides: SA = 6 × 9 = 54 cm²."],
     ["Capacity","Capacity is how much a container holds. 1 cm³ = 1 ml, and 1 000 cm³ = 1 litre.","A container 10 cm × 10 cm × 10 cm holds 1 litre."]],
  A:{t:"fill", p:"Type the number only.", d:[["Volume of a cube with 4 cm sides (cm³)","64"],["Volume of a box 6 cm × 5 cm × 2 cm (cm³)","60"],["Surface area of a cube with 2 cm sides (cm²)","24"],["A tank holds 2 000 cm³. How many litres?","2"],["Surface area of a box 4 cm × 3 cm × 2 cm (cm²)","52"]]},
  Q:[["Volume of a box 10 cm × 4 cm × 5 cm?",["200 cm³","19 cm³","100 cm³","220 cm³"],"10 × 4 × 5."],
     ["How many ml in 1 cm³?",["1 ml","10 ml","100 ml","1 000 ml"],"They're equal."],
     ["What is the surface area of a cube with 5 cm sides?",["150 cm²","125 cm²","25 cm²","30 cm²"],"6 × 25."],
     ["A fish tank is 50 cm × 30 cm × 40 cm. How many litres does it hold?",["60 l","600 l","6 l","120 l"],"60 000 cm³ ÷ 1 000."]],
  W:["Find the surface area of a box 5 cm long, 4 cm wide and 2 cm high",["Top and bottom: 2 × (5 × 4) = 40 cm².","Front and back: 2 × (5 × 2) = 20 cm².","Two ends: 2 × (4 × 2) = 16 cm².","Add: 40 + 20 + 16 = 76 cm²."],"76 cm²"],
  X:"Volume is in cubic units (cm³); surface area is in square units (cm²). Don't mix them up.",
  C:["Volume of a cube with 3 cm sides?",["27 cm³","9 cm³","18 cm³","54 cm²"],"3 × 3 × 3."],
  H:{L:[["Count the cubes","Volume = how many 1 cm cubes fit inside: cubes in one layer (l × b) times the number of layers (h).","5 × 4 = 20 cubes per layer, 3 layers = 60 cubes."],
        ["Unfold the box","Surface area is the area of the box's net: add the areas of all six rectangles.","Draw the net and label each face."]],
    Q:[["One layer has 6 × 5 cubes and there are 4 layers. Volume?",["120 cubes","30 cubes","15 cubes","24 cubes"],"30 × 4."],
       ["How many faces does a rectangular prism have?",["6","4","8","12"],"3 pairs."],
       ["A 1 litre carton holds how many cm³?",["1 000","100","10","10 000"],"1 l = 1 000 ml = 1 000 cm³."],
       ["Doubling every side of a cube multiplies its volume by...",["8","2","4","6"],"2 × 2 × 2."]]}},
{ id:"m7o", T:4, t:"Numeric & geometric patterns", s:"Finding general rules for patterns",
  L:[["Constant difference","If the difference between terms stays the same, the rule is: (difference) × n + something, where n is the position of the term.","3, 7, 11, 15: difference 4, so Tn = 4n − 1."],
     ["Other patterns","Some patterns multiply each time (2, 6, 18: × 3), some are square numbers (1, 4, 9: n²), and some have a growing difference.","1, 3, 6, 10: differences 2, 3, 4 (triangular numbers)."],
     ["Geometric patterns","Shape patterns can be described with a rule linking the stage number to the number of shapes or matches.","Squares in a row using matches: 4, 7, 10. Rule: 3n + 1."]],
  A:{t:"fill", p:"Find the term asked for.", d:[["Tn = 5n + 2. What is T10?","52"],["Next term: 2, 6, 18, 54, ?","162"],["Next term: 1, 4, 9, 16, 25, ?","36"],["Pattern 7, 12, 17, 22: what is the 20th term?","102"],["Matches: stage 1 = 4, stage 2 = 7, stage 3 = 10. Stage 50?","151"]]},
  Q:[["What is the general rule for 5, 8, 11, 14 ...?",["Tn = 3n + 2","Tn = n + 3","Tn = 5n","Tn = 3n + 5"],"Difference 3; 3 × 1 + 2 = 5."],
     ["What is the next term: 1, 3, 6, 10, 15, ...?",["21","20","25","18"],"Add 6."],
     ["Tn = n². What is T12?",["144","24","122","14"],"12 × 12."],
     ["Which term of Tn = 2n + 1 equals 41?",["20","21","40","82"],"2n + 1 = 41."]],
  W:["Find the 100th term of 6, 10, 14, 18 ...",["The difference is 4, so the rule starts with 4n.","For n = 1: 4 × 1 = 4, but the term is 6, so add 2.","Rule: Tn = 4n + 2.","T100 = 4 × 100 + 2 = 402."],"402"],
  X:"Don't confuse the term's position (n) with the term's value. In 6, 10, 14, the 2nd term is 10, not 2.",
  C:["What is the difference in 20, 17, 14, 11 ...?",["−3","3","−4","20"],"Each term is 3 less."],
  H:{L:[["Use a table","Write n = 1, 2, 3, 4 above the terms. Compare the terms with a times table to spot the rule.","n: 1, 2, 3 and terms 5, 9, 13 → compare with 4, 8, 12 (4n), then add 1."],
        ["Check every time","Test your rule on two or three terms before using it for a far-away term.","A rule that only works for the first term is wrong."]],
    Q:[["Rule for 9, 13, 17, 21?",["Tn = 4n + 5","Tn = 4n + 9","Tn = n + 4","Tn = 9n"],"4 × 1 + 5 = 9."],
       ["Which term of 4, 7, 10, 13 is 61?",["20","19","21","57"],"3n + 1 = 61."],
       ["Next in 100, 50, 25, ...?",["12,5","0","20","15"],"Divide by 2."],
       ["Rule for 2, 4, 8, 16?",["Tn = 2ⁿ","Tn = 2n","Tn = n + 2","Tn = 4n"],"Powers of 2."]]}},
{ id:"m7p", T:4, t:"Transformations on a grid", s:"Coordinates, translations, reflections and rotations",
  L:[["Coordinates","Points on a Cartesian plane are written (x ; y): x across, y up. The x-axis and y-axis meet at the origin (0 ; 0). There are four quadrants.","(−3 ; 2) is 3 left and 2 up."],
     ["Translations and reflections","Translating moves every point the same amount. Reflecting in the y-axis changes the sign of x; reflecting in the x-axis changes the sign of y.","(4 ; 1) reflected in the y-axis → (−4 ; 1)."],
     ["Rotations","A rotation of 180° about the origin changes the sign of both coordinates.","(2 ; 5) rotated 180° → (−2 ; −5)."]],
  A:{t:"match", p:"Match each transformation of the point (3 ; 2) to its new position.", d:[["Reflect in the y-axis","(−3 ; 2)"],["Reflect in the x-axis","(3 ; −2)"],["Rotate 180° about the origin","(−3 ; −2)"],["Translate 4 units left","(−1 ; 2)"],["Translate 3 units up","(3 ; 5)"]]},
  Q:[["Which quadrant is (−4 ; −1) in?",["third","first","second","fourth"],"Both negative."],
     ["(5 ; −3) reflected in the x-axis becomes...",["(5 ; 3)","(−5 ; −3)","(−5 ; 3)","(3 ; 5)"],"Change the sign of y."],
     ["(2 ; 1) translated 3 right and 2 down becomes...",["(5 ; −1)","(−1 ; 3)","(5 ; 3)","(4 ; −2)"],"x + 3, y − 2."],
     ["The origin is the point...",["(0 ; 0)","(1 ; 1)","(0 ; 1)","(1 ; 0)"],"Where the axes cross."]],
  W:["Reflect triangle A(1 ; 2), B(4 ; 2), C(1 ; 5) in the y-axis",["Reflecting in the y-axis changes the sign of x and keeps y.","A(1 ; 2) → A'(−1 ; 2).","B(4 ; 2) → B'(−4 ; 2).","C(1 ; 5) → C'(−1 ; 5)."],"A'(−1 ; 2), B'(−4 ; 2), C'(−1 ; 5)"],
  X:"Always give x first, then y. (2 ; 5) and (5 ; 2) are different points.",
  C:["(−2 ; 6) reflected in the y-axis becomes...",["(2 ; 6)","(−2 ; −6)","(2 ; −6)","(6 ; −2)"],"Change the sign of x."],
  H:{L:[["Quadrant signs","Quadrant 1: (+ ; +). Quadrant 2: (− ; +). Quadrant 3: (− ; −). Quadrant 4: (+ ; −). They go anticlockwise from the top right.","(−1 ; 4) is in quadrant 2."],
        ["Draw it","When unsure, sketch the axes, plot the point and actually flip, slide or turn it.","Count squares from the mirror line."]],
    Q:[["(−1 ; 4) is in which quadrant?",["second","first","third","fourth"],"Negative x, positive y."],
       ["(3 ; −3) rotated 180° about the origin becomes...",["(−3 ; 3)","(3 ; 3)","(−3 ; −3)","(3 ; −3)"],"Change both signs."],
       ["A translation of (x ; y) → (x − 2 ; y + 5) moves a shape...",["2 left and 5 up","2 right and 5 down","5 left and 2 up","2 up and 5 left"],"Subtract from x = left."],
       ["Which transformation keeps a shape facing the same way?",["translation","reflection","rotation of 90°","rotation of 180°"],"It only slides."]]}},
{ id:"m7q", T:4, t:"Data handling", s:"Mean, median, mode, range and choosing graphs",
  L:[["Measures of central tendency","Mean: add all values and divide by how many there are. Median: the middle value when ordered. Mode: the most common value.","Data 2, 3, 3, 5, 7: mean 4, median 3, mode 3."],
     ["Range and spread","The range is the biggest value minus the smallest. It shows how spread out the data is.","Marks from 35% to 92%: range 57%."],
     ["Choosing a graph","Bar graphs compare categories, histograms show grouped number data, pie charts show parts of a whole, and line graphs show change over time.","Monthly rainfall over a year: a line or bar graph."]],
  A:{t:"fill", p:"Data set: 4, 8, 6, 10, 8, 12. Type each answer.", d:[["Mean","8"],["Median","8"],["Mode","8"],["Range","8"],["Mean of 15, 20 and 25","20"]]},
  Q:[["What is the mean of 3, 7, 8 and 10?",["7","8","28","7,5"],"28 ÷ 4."],
     ["What is the range of 12, 5, 19, 8?",["14","19","7","11"],"19 − 5."],
     ["Which measure is most affected by one very big value?",["the mean","the mode","the median","the range never"],"It pulls the average up."],
     ["A pie chart shows...",["parts of a whole","change over time","exact large numbers only","a map"],"Fractions of 360°."]],
  W:["Find the mean, median and mode of: 7, 3, 9, 3, 8",["Mean: 7 + 3 + 9 + 3 + 8 = 30, and 30 ÷ 5 = 6.","Median: order them: 3, 3, 7, 8, 9. The middle is 7.","Mode: 3 appears twice, so the mode is 3."],"Mean 6, median 7, mode 3"],
  X:"Always order the data before finding the median. The middle of an unordered list isn't the median.",
  C:["Median of 1, 4, 6, 9, 20?",["6","8","4","9"],"Middle value."],
  H:{L:[["Which average to use?","Use the median when there are extreme values (like house prices). Use the mode for the most popular item (like shoe sizes). Use the mean for an even spread.","Salaries: one millionaire makes the mean misleading, so use the median."],
        ["Sector sizes in pie charts","Each sector angle = (amount ÷ total) × 360°.","10 of 40 learners chose soccer: 10/40 × 360° = 90°."]],
    Q:[["10 out of 40 learners chose netball. What angle is its pie sector?",["90°","40°","10°","180°"],"1/4 of 360°."],
       ["For shoe sizes sold in a shop, the most useful average is the...",["mode","mean","range","median"],"Most popular size."],
       ["House prices with one mansion: use the...",["median","mean","range","sum"],"Not affected by extremes."],
       ["The mean of 5 numbers is 12. What is their total?",["60","17","12","2,4"],"5 × 12."]]}},
{ id:"m7r", T:4, t:"Probability", s:"Relative frequency and probability as a fraction",
  L:[["Probability as a number","Probability = number of favourable outcomes ÷ total possible outcomes. It is between 0 (impossible) and 1 (certain).","P(rolling a 4) = 1/6."],
     ["Relative frequency","Relative frequency comes from an experiment: number of times an outcome happened ÷ number of trials.","A coin landed heads 23 times in 50 tosses: relative frequency 23/50 = 0,46."],
     ["More trials, better estimates","The more trials you do, the closer the relative frequency gets to the theoretical probability.","After 1 000 tosses, heads will be very close to 0,5."]],
  A:{t:"fill", p:"Give answers as fractions in simplest form (like 1/3) or decimals.", d:[["P(rolling an even number on a dice)","1/2"],["P(picking a red ball from 3 red and 7 blue)","3/10"],["P(rolling a 7 on a normal dice)","0"],["A spinner landed on blue 12 times in 40 spins. Relative frequency?","3/10"],["P(a coin landing heads)","1/2"]]},
  Q:[["A bag has 4 green and 6 yellow sweets. P(green)?",["2/5","4/6","3/5","1/4"],"4/10."],
     ["A probability of 1 means the event is...",["certain","impossible","unlikely","even"],"Always happens."],
     ["A dice is rolled 60 times. About how many 3s do you expect?",["10","3","20","6"],"60 × 1/6."],
     ["What is P(rolling a number less than 5 on a dice)?",["2/3","5/6","1/2","4/5"],"4 of 6 outcomes."]],
  W:["A bag has 5 red, 3 blue and 2 green beads. Find P(not red).",["Total beads: 5 + 3 + 2 = 10.","Beads that are not red: 3 + 2 = 5.","P(not red) = 5/10 = 1/2."],"1/2"],
  X:"Relative frequency from a small experiment can be far from the true probability. Ten coin tosses could easily give 7 heads.",
  C:["P(picking a vowel from the letters of 'MATHS')?",["1/5","2/5","1/4","4/5"],"Only A."],
  H:{L:[["Count carefully","List all outcomes first, then count the ones you want. For two events, use a table or tree diagram.","Two coins: HH, HT, TH, TT. P(two heads) = 1/4."],
        ["P(not)","The probability that something does NOT happen is 1 minus the probability that it happens.","P(not rolling a 6) = 1 − 1/6 = 5/6."]],
    Q:[["P(not rolling a 6) on a dice?",["5/6","1/6","6/5","1/2"],"1 − 1/6."],
       ["Two coins are tossed. P(two heads)?",["1/4","1/2","1/3","2/4"],"1 of 4 outcomes."],
       ["Probability can never be...",["more than 1","exactly 0","a fraction","a decimal"],"0 to 1 only."],
       ["P(rain) = 0,3. P(no rain)?",["0,7","0,3","1,3","0,03"],"1 − 0,3."]]}}
]};

{ id:"e7e", t:"Narrative & descriptive essays", s:"Planning, structuring and polishing an essay",
  L:[["Essay structure","An essay has an introduction that hooks the reader, body paragraphs that develop the story or description, and a conclusion that gives a satisfying ending.","Hook: 'The siren screamed just as the lights went out.'"],
     ["Narrative techniques","Use dialogue, suspense, flashback (going back in time) and a clear climax. Keep the tense consistent.","Flashback: 'I remembered the day Gogo first showed me the river.'"],
     ["Descriptive techniques","Appeal to the senses, use precise nouns and verbs, and figurative language. Organise description by space (left to right, near to far) or time.","'Steam curled from the pot of umngqusho while rain drummed on the zinc roof.'"]],
  A:{t:"order", p:"Put the essay-writing process in order.", d:["Read the topic carefully and choose an angle","Brainstorm ideas with a mind map","Plan your paragraphs","Write the first draft","Edit for spelling, grammar and word choice","Write the final copy"]},
  Q:[["A 'hook' in an introduction is meant to...",["grab the reader's attention","end the story","list your sources","give the word count"],"Make them want to read on."],
     ["Going back in time in a story is called...",["a flashback","a climax","foreshadowing","dialogue"],"Back to the past."],
     ["Which sentence is the most descriptive?",["Thunder growled over the dusty, silent veld.","It was a storm.","There was weather.","It rained a lot."],"Senses and strong verbs."],
     ["Why keep the tense consistent?",["so the story is clear and easy to follow","to make it longer","because it rhymes","it doesn't matter"],"Avoid confusion."]],
  W:["Write a hook for an essay titled 'The Longest Night'",["Think of a moment of tension near the start of the story.","Use a short, dramatic sentence or a line of dialogue.","Make the reader ask a question they want answered."],"\"Don't open the door,\" Mama whispered, as something scraped across the stoep."],
  X:"Don't start with 'One day I woke up and brushed my teeth.' Start close to the action.",
  C:["What should a conclusion do?",["give a satisfying ending","introduce new characters","start a new problem","repeat the title"],"Wrap it up."],
  H:{L:[["Paragraph power","Each paragraph should focus on one idea or moment. Use linking words to move smoothly: meanwhile, suddenly, later that night.","'Suddenly, the lights flickered back on.'"],
        ["Self-edit checklist","Check: tense consistency, spelling, punctuation, varied sentence starts, and overused words like 'nice', 'very' and 'then'.","Circle every 'then' and replace half of them."]],
    Q:[["Which is a linking word for time?",["meanwhile","because","however","although"],"Shows when."],
       ["Which overused word should you replace?",["nice","glistening","thundered","whispered"],"Too general."],
       ["Each paragraph should focus on...",["one main idea or moment","as many ideas as possible","only dialogue","the title"],"Unity."],
       ["Which is the best essay opening?",["Smoke filled the classroom, and nobody moved.","This is my essay.","Once upon a time there was a day.","I am going to tell you a story."],"Starts with action."]]}},
{ id:"e7f", t:"Drama", s:"Plays, scenes, stage directions and dramatic irony",
  L:[["Features of drama","A play is written to be performed. It is divided into acts and scenes, and is made of dialogue and stage directions.","Act 1, Scene 2: a classroom, Monday morning."],
     ["Stage directions","Stage directions are written in italics or brackets. They tell actors how to move and speak, and describe the set, lighting and sound.","(She slams the book shut and walks to the window.)"],
     ["Conflict and dramatic irony","Plays build tension through conflict. Dramatic irony is when the audience knows something a character doesn't.","The audience knows the gift is a fake; the character opening it doesn't."]],
  A:{t:"match", p:"Match each drama term to its meaning.", d:[["Act","A major section of a play"],["Scene","A smaller part within an act"],["Stage directions","Instructions for actions, set and sound"],["Dialogue","The words characters speak"],["Dramatic irony","The audience knows more than a character"]]},
  Q:[["Where are stage directions usually written?",["in brackets or italics","in the title","in inverted commas","at the end only"],"(walks away)"],
     ["A play is mainly made of...",["dialogue","paragraphs of description","chapters","stanzas"],"Characters speak."],
     ["The audience knows the villain is hiding, but the hero doesn't. This is...",["dramatic irony","a flashback","a stanza","a monologue"],"Audience knows more."],
     ["A long speech by one character is a...",["monologue","dialogue","scene","chorus"],"One speaker."]],
  W:["Turn this story moment into a short script: 'Ayanda nervously asked her coach if she could play. The coach laughed and said yes.'",["Write each speaker's name followed by a colon.","Put actions and feelings in brackets as stage directions.","Write only the spoken words as dialogue."],"AYANDA: (nervously) Coach, can I play today? COACH: (laughing) Of course you can!"],
  X:"Stage directions are not read aloud by actors. They are instructions, not lines.",
  C:["Which is a stage direction?",["(lights dim)","ZOLA: Hello!","Act 1","THE END"],"An instruction in brackets."],
  H:{L:[["Reading a play","Read the character list first, imagine the set from the stage directions, and read the dialogue aloud with different voices.","Acting it out helps you understand it."],
        ["Character through dialogue","In drama we learn about characters mainly through what they say and how they say it.","A character who interrupts everyone may be rude or impatient."]],
    Q:[["How do we mostly learn about characters in a play?",["through their dialogue and actions","through long descriptions","through the title only","through footnotes"],"They speak."],
       ["What should you read first in a play?",["the list of characters","the last scene","the stage lights","the price"],"Know who's who."],
       ["A character who always interrupts may be...",["impatient","shy","asleep","invisible"],"Clue from dialogue."],
       ["Which tells actors how to say a line?",["a stage direction like (angrily)","the act number","the title","the cast list"],"Tone guidance."]]}},
{ id:"e7g", t:"Short stories & literary devices", s:"Foreshadowing, suspense, irony and characterisation",
  L:[["Short story features","A short story has few characters, one main conflict and a quick build-up to a climax. Every detail counts.","Many short stories happen over one day or one event."],
     ["Foreshadowing and suspense","Foreshadowing gives hints about what will happen later. Suspense keeps the reader anxious to know what happens next.","'Little did she know that the letter would change everything.'"],
     ["Irony and characterisation","Situational irony is when the opposite of what's expected happens. Characterisation is how the writer shows what a character is like: through actions, speech, thoughts and others' reactions.","Irony: the fire station burns down."]],
  A:{t:"match", p:"Match each example to the device.", d:[["Dark clouds gathered as they set off.","Foreshadowing"],["The lifeguard needed to be rescued.","Situational irony"],["His heart pounded as the footsteps came closer.","Suspense"],["She gave her last sandwich to a stranger.","Characterisation through action"],["Years earlier, he had made a promise.","Flashback"]]},
  Q:[["A hint about what will happen later is...",["foreshadowing","a flashback","a climax","a resolution"],"Looks forward."],
     ["'The police station was robbed.' This is an example of...",["situational irony","a simile","alliteration","foreshadowing"],"Unexpected opposite."],
     ["Why do short stories have few characters?",["they are short and focus on one main conflict","writers are lazy","characters are expensive","it's a rule for all books"],"Tight focus."],
     ["Showing a character is generous by describing them sharing food is...",["characterisation through action","a flashback","dramatic irony","onomatopoeia"],"Actions reveal character."]],
  W:["Find the foreshadowing: 'Sipho ignored the creaking stair. Later that night, the whole staircase collapsed.'",["Look for an early detail that seems small: the creaking stair.","Check if it connects to a later event: the staircase collapses.","The early detail hints at what's coming."],"The creaking stair foreshadows the collapse"],
  X:"Irony isn't just bad luck or coincidence. It must be the opposite of what you'd expect.",
  C:["Suspense makes the reader feel...",["anxious to know what happens next","bored","sleepy","confused about the title"],"Tension."],
  H:{L:[["Track the conflict","Ask: what does the main character want? What stands in the way? How is it solved?","Want: win the race. Obstacle: an injury. Solution: trains hard and finishes."],
        ["Quote to support","When answering literature questions, back up your point with a short quote from the text.","'Thabo is brave, because he \"stepped forward when no one else would\".'"]],
    Q:[["Why include a quote in a literature answer?",["to prove your point with evidence","to fill space","to copy the story","it's not allowed"],"Evidence."],
       ["What drives the plot of a story?",["the conflict","the font","the page numbers","the cover"],"The problem."],
       ["A fire station burning down is...",["ironic","foreshadowing","a flashback","a metaphor"],"The opposite of expected."],
       ["'His palms were sweaty and his voice shook' shows he is...",["nervous","sleepy","bored","proud"],"Shown, not told."]]}},
{ id:"e7h", t:"Clauses & complex sentences", s:"Main clauses, subordinate clauses and relative clauses",
  L:[["Clauses","A clause has a subject and a verb. A main clause makes sense on its own. A subordinate (dependent) clause doesn't, and is introduced by words like because, although, when, if.","Main: 'We stayed inside.' Subordinate: 'because it was raining'."],
     ["Relative clauses","A relative clause gives more information about a noun and starts with who, which, that, whose or where.","The girl who won the race is my cousin."],
     ["Sentence variety","Mixing simple, compound and complex sentences makes writing more interesting.","'The bell rang. Learners poured out, laughing. Although it was late, nobody wanted to go home.'"]],
  A:{t:"sort", p:"Is it a main clause or a subordinate clause?", b:["Main clause","Subordinate clause"], d:[["The dog barked",0],["because it heard a noise",1],["We cheered loudly",0],["when the team scored",1],["She finished her essay",0],["although she was tired",1]]},
  Q:[["Which is a subordinate clause?",["if it rains tomorrow","The match was cancelled","I like soccer","She ran home"],"Can't stand alone."],
     ["Choose the correct relative pronoun: 'The man ___ car was stolen called the police.'",["whose","who","which","where"],"Belonging to the man."],
     ["Which word introduces a relative clause?",["which","because","and","but"],"Gives more information."],
     ["'Although it was cold, we swam.' The main clause is...",["we swam","Although it was cold","it was cold","Although"],"Makes sense alone."]],
  W:["Combine using a relative clause: 'The book is on the table. I borrowed the book from Lebo.'",["Find the shared noun: the book.","Choose a relative pronoun for a thing: which or that.","Embed the extra information: 'The book which I borrowed from Lebo is on the table.'"],"The book which I borrowed from Lebo is on the table."],
  X:"Use 'who' for people and 'which' for things. 'The teacher which helped me' should be 'the teacher who helped me'.",
  C:["'The town ___ I was born is small.'",["where","who","which","whose"],"A place."],
  H:{L:[["The 'stand-alone' test","Read the clause by itself. If it sounds complete, it's a main clause. If it leaves you waiting ('Because I was late...'), it's subordinate.","'When the sun set' leaves you waiting."],
        ["Commas with clauses","When a sentence starts with a subordinate clause, put a comma after it.","'If you're ready, we can leave.'"]],
    Q:[["Where does the comma go? 'When the bell rang we left.'",["after 'rang'","after 'When'","after 'we'","no comma"],"After the opening clause."],
       ["'Because I was late' is...",["a subordinate clause","a full sentence","a main clause","a question"],"Incomplete alone."],
       ["Choose: 'My aunt, ___ lives in Durban, is visiting.'",["who","which","where","whose"],"A person."],
       ["Which sentence has a relative clause?",["The phone that I bought is broken.","I bought a phone.","The phone broke.","Buy a phone."],"'that I bought'."]]}},
{ id:"e7i", t:"Nouns, adjectives & adverbs", s:"Types of nouns and how describing words work",
  L:[["Kinds of nouns","Common nouns (city), proper nouns (Pretoria), abstract nouns (courage, freedom), collective nouns (a pride of lions), countable (apples) and uncountable nouns (water, sand).","Use 'fewer' with countable nouns and 'less' with uncountable nouns."],
     ["Adjective order","When using several adjectives, the usual order is: opinion, size, age, shape, colour, origin, material, purpose.","A lovely small old round red Zulu clay pot."],
     ["Adverbs","Adverbs tell how (manner), when (time), where (place) or how often (frequency).","She always (frequency) sings loudly (manner) here (place) today (time)."]],
  A:{t:"sort", p:"What kind of noun is each word?", b:["Abstract","Collective","Proper"], d:[["happiness",0],["a herd",1],["Limpopo",2],["honesty",0],["a swarm",1],["Nelson Mandela",2],["fear",0],["a choir",1]]},
  Q:[["Which is an abstract noun?",["bravery","chair","Durban","dog"],"An idea you can't touch."],
     ["Choose: 'There are ___ learners today.'",["fewer","less","lesser","few of"],"Learners are countable."],
     ["A group of lions is called a...",["pride","herd","flock","swarm"],"Collective noun."],
     ["In 'He rarely cries', 'rarely' is an adverb of...",["frequency","place","manner","time"],"How often."]],
  W:["Put the adjectives in order: a (wooden, beautiful, old) chair",["Opinion comes first: beautiful.","Then age: old.","Then material: wooden."],"a beautiful old wooden chair"],
  X:"'Less' is for things you can't count (less water). 'Fewer' is for things you can count (fewer bottles).",
  C:["Which is an uncountable noun?",["rice","apple","learner","car"],"You don't say 'three rices'."],
  H:{L:[["Make abstract nouns","Many abstract nouns are made from adjectives and verbs with suffixes like -ness, -ity, -ment, -dom, -ship.","kind → kindness, free → freedom, friend → friendship."],
        ["Adverbs from adjectives","Many adverbs add -ly to an adjective. Some are irregular: good → well, fast → fast.","She is a good singer. She sings well."]],
    Q:[["What is the abstract noun from 'free'?",["freedom","freely","freer","freeing"],"-dom."],
       ["'She sings ___.' (good)",["well","good","goodly","best"],"Irregular adverb."],
       ["Which is a collective noun?",["a bunch of flowers","a flower","flowery","bloom"],"A group."],
       ["Choose: 'I drink ___ cooldrink now.'",["less","fewer","few","lesser"],"Uncountable."]]}},
{ id:"e7j", t:"Advanced punctuation", s:"Colons, semicolons, brackets, hyphens and apostrophes",
  L:[["Colons and semicolons","A colon (:) introduces a list or explanation. A semicolon (;) joins two closely related sentences, or separates items in a complex list.","Bring three things: a hat, water and sunscreen. It rained; we stayed inside."],
     ["Brackets and hyphens","Brackets ( ) add extra information. A hyphen (-) joins words to make one idea.","The Big Five (lion, leopard, elephant, rhino and buffalo) live in Kruger. A well-known singer."],
     ["Apostrophes for plurals","For a plural ending in s, put the apostrophe after the s. For irregular plurals, add 's.","The girls' changing room (many girls). The children's toys."]],
  A:{t:"match", p:"Match each punctuation mark to its use.", d:[["Colon","Introduces a list"],["Semicolon","Joins two related sentences"],["Brackets","Add extra information"],["Hyphen","Joins words into one idea"],["Apostrophe","Shows ownership or missing letters"]]},
  Q:[["Which sentence uses a colon correctly?",["You need three things: a pen, a ruler and a pencil.","You need: three things a pen.","You: need three things.","You need three things a pen: and ruler."],"Before a list."],
     ["Where does the apostrophe go: the bags belonging to the boys?",["the boys' bags","the boy's bags","the boys bag's","the boys's bags"],"Plural ending in s."],
     ["Which uses a hyphen correctly?",["a well-known author","a well known-author","a-well known author","a well known author-"],"Compound adjective."],
     ["'I was tired; I went to bed.' The semicolon...",["joins two related sentences","starts a list","shows ownership","adds extra information"],"Related ideas."]],
  W:["Punctuate: the childrens toys were everywhere blocks dolls and cars",["Capital letter to start: The.","Irregular plural ownership: children's.","Use a colon before the list: everywhere:","Commas between list items and a full stop: blocks, dolls and cars."],"The children's toys were everywhere: blocks, dolls and cars."],
  X:"Don't use a semicolon before a list. That's the job of a colon.",
  C:["What is the possessive of 'women'?",["women's","womens'","womens","women'"],"Irregular plural: add 's."],
  H:{L:[["Semicolon test","A semicolon can usually be replaced by a full stop, and both halves still make complete sentences.","'It rained; we stayed in.' → 'It rained. We stayed in.'"],
        ["Plural ownership steps","Write the plural first, then add the apostrophe: if it ends in s, add ' only; if not, add 's.","teachers → teachers'. men → men's."]],
    Q:[["Possessive of 'teachers'?",["teachers'","teacher's","teachers's","teachers"],"Ends in s: add '."],
       ["Can 'It rained; we stayed in' be split with a full stop?",["Yes, both halves are complete sentences","No","Only with a comma","Only with a colon"],"Semicolon test."],
       ["Which needs brackets?",["Durban (on the east coast) is humid.","Durban is humid.","Is Durban humid?","Durban, humid!"],"Extra information."],
       ["Possessive of 'children'?",["children's","childrens'","childrens","children'"],"Irregular plural."]]}},
{ id:"e7k", t:"Notices, invitations & emails", s:"Short transactional texts with a clear purpose",
  L:[["Notices","A notice gives information to a group. It needs a clear heading, the key details (what, when, where, who), and who issued it.","NOTICE: Grade 7 parents' meeting, Thursday 12 May, 18:00, school hall. Issued by the Principal."],
     ["Invitations","An invitation includes the occasion, date, time, venue, dress code (if any), and how and when to reply (RSVP).","RSVP by 1 June to 082 123 4567."],
     ["Emails","Use a clear subject line, an appropriate greeting, short paragraphs and a sign-off. Match the tone (formal or informal) to the reader.","Subject: Request for Grade 7 camp information"]],
  A:{t:"sort", p:"Does it belong in an invitation or a notice?", b:["Invitation","Notice"], d:[["You are invited to Lindi's 13th birthday party!",0],["RSVP to Mrs Khumalo by Friday",0],["All learners must bring their reports on Monday",1],["Dress code: smart casual",0],["The library will be closed for repairs",1],["Issued by: the Principal",1]]},
  Q:[["What does RSVP mean?",["please reply","bring a gift","dress smartly","arrive early"],"From French: répondez s'il vous plaît."],
     ["What must every notice include?",["the key details and who issued it","a long story","a poem","only a picture"],"What, when, where, who."],
     ["Which email subject line is best?",["Request for camp information","Hi","Read this","Stuff"],"Clear and specific."],
     ["An invitation to your principal should be...",["formal and polite","full of slang","in capitals","very long"],"Match the reader."]],
  W:["Write a notice about a lost lunch box",["Heading: LOST.","Key details: what it is, where and when it was lost.","Who to contact and how.","Keep it short and clear."],"LOST: Blue lunch box with a yellow lid, lost on Tuesday near the soccer field. Please return to Room 12 or contact Thabo (Grade 7B)."],
  X:"Don't leave out the date, time or venue. A notice or invitation without them is useless.",
  C:["Which detail is NOT needed on an invitation?",["your favourite colour","date","venue","time"],"Keep to what matters."],
  H:{L:[["The 5 Ws checklist","Before finishing any notice or invitation, check: Who? What? When? Where? Why?","If one is missing, the reader may be confused."],
        ["Tone and audience","Friends: informal and warm. Adults or officials: formal and polite.","'Hey guys!' suits friends; 'Dear Parents' suits a school notice."]],
    Q:[["Which greeting suits a school notice to parents?",["Dear Parents","Hey guys!","Yo!","Sup"],"Formal."],
       ["What should you check before posting a notice?",["that the 5 Ws are included","the font colour only","the weather","nothing"],"Complete information."],
       ["An invitation without a date is...",["confusing and unhelpful","fine","more formal","shorter and better"],"Key detail."],
       ["Who issued the notice tells readers...",["who to trust and contact","the time","the venue","the dress code"],"Authority."]]}},
{ id:"e7l", t:"Media & critical language", s:"Bias, stereotypes and manipulation in the media",
  L:[["Fact, opinion and bias","Bias is when a text favours one side unfairly. Biased texts often present opinions as facts and leave out the other side.","'The useless team lost again' is biased; 'The team lost 2–1' is factual."],
     ["Stereotypes","A stereotype is an oversimplified idea about a group of people. Media sometimes reinforces stereotypes about gender, race, age or culture.","An advert that always shows women in the kitchen reinforces a stereotype."],
     ["Manipulative language","Writers can manipulate readers with emotive words, exaggeration, selective facts and loaded questions. Ask who wrote it, why, and who benefits.","'Every smart parent buys...' pressures readers."]],
  A:{t:"sort", p:"Is the sentence neutral or biased?", b:["Neutral","Biased"], d:[["The council voted 7 to 3 to build a new park.",0],["The greedy council wasted money on a silly park.",1],["Temperatures reached 35 °C on Tuesday.",0],["Only lazy people take the bus.",1],["The school has 850 learners.",0],["Everyone knows city people are rude.",1]]},
  Q:[["Bias means...",["favouring one side unfairly","giving all the facts fairly","using correct spelling","writing a poem"],"One-sided."],
     ["'All teenagers are lazy' is an example of a...",["stereotype","fact","statistic","quote"],"Unfair generalisation."],
     ["Which question helps you read critically?",["Who benefits from this message?","What colour is the font?","How long is it?","Is it in English?"],"Look for motives."],
     ["'Every smart parent buys our brand' is...",["manipulative language","a neutral fact","a quote","a statistic"],"Pressure and flattery."]],
  W:["Rewrite neutrally: 'The reckless taxi driver caused total chaos on the highway.'",["Remove loaded words: 'reckless', 'total chaos'.","Keep only facts you can check: a taxi was involved in an incident on the highway.","Add specific facts if known."],"A taxi was involved in an accident on the highway, causing traffic delays."],
  X:"A text with numbers isn't automatically unbiased. Statistics can be chosen selectively to support one side.",
  C:["Which word makes a sentence emotive?",["heartbreaking","Tuesday","seven","meeting"],"It stirs feelings."],
  H:{L:[["Questions to ask","Who made this? Why? Who is the audience? Whose voice is missing? What is left out?","A tobacco advert won't mention lung cancer."],
        ["Compare sources","Read the same story from two different news sources and compare the words and facts each chose.","Different headlines can make the same event sound very different."]],

{ id:"e7m", t:"Debates & prepared speeches", s:"Arguing a point and speaking with confidence",
  L:[["Debate basics","A debate has a motion (topic). The proposition argues for it and the opposition argues against it. Speakers take turns and must respect time limits.","Motion: 'Learners should be allowed to use phones at school.'"],
     ["Building an argument","Make a clear point, give a reason and support it with evidence or an example. Then rebut (answer) the other side's arguments.","Point: phones help learning. Evidence: learners can research quickly."],
     ["Delivery","Speak clearly, project your voice, make eye contact, use gestures and pause for effect. Use cue cards with key points.","A pause before your strongest point makes it stand out."]],
  A:{t:"match", p:"Match each debate term to its meaning.", d:[["Motion","The topic being debated"],["Proposition","The side arguing for the motion"],["Opposition","The side arguing against the motion"],["Rebuttal","Answering the other side's argument"],["Evidence","Facts or examples that support a point"]]},
  Q:[["The team arguing against the motion is the...",["opposition","proposition","chairperson","audience"],"Against."],
     ["What is a rebuttal?",["answering the other side's argument","the opening speech","the motion","clapping"],"Counter-argument."],
     ["Which supports an argument best?",["a fact or example","shouting","repeating yourself","insulting the other team"],"Evidence."],
     ["Why pause in a speech?",["to emphasise a point","because you forgot","to end early","it's not allowed"],"Effect."]],
  W:["Build a point for the motion 'School uniforms should be compulsory'",["Point: uniforms reduce pressure to wear expensive clothes.","Reason: everyone looks the same, so learners aren't judged by brands.","Evidence or example: families save money on fashion items.","Link back: therefore uniforms should be compulsory."],"Point, reason, evidence, link"],
  X:"Attack the argument, not the person. Insults lose points and respect.",
  C:["The topic of a debate is called the...",["motion","rebuttal","verdict","chorus"],"What's being debated."],
  H:{L:[["Prepare both sides","Even if you argue one side, list the other side's likely points so you can rebut them.","If they say phones distract, prepare: 'Phones can be switched off in class.'"],
        ["Beat the nerves","Practise aloud, time yourself, breathe slowly and focus on a friendly face.","Preparation is the best cure for nerves."]],
    Q:[["Why prepare the other side's arguments?",["so you can rebut them","to switch sides","to confuse yourself","no reason"],"Be ready."],
       ["What's the best cure for nerves?",["preparation and practice","not preparing","speaking very fast","reading every word"],"Confidence."],
       ["Which is a respectful rebuttal?",["\"My opponent says phones distract, but they can be switched off in class.\"","\"My opponent is silly.\"","\"That's stupid.\"","\"Whatever.\""],"Address the point."],
       ["Cue cards should have...",["key points only","the full speech","drawings","nothing"],"Prompts."]]}},
{ id:"e7n", t:"Figurative language", s:"Hyperbole, irony, sarcasm, euphemism, oxymoron and puns",
  L:[["Exaggeration and understatement","Hyperbole is deliberate exaggeration for effect. Understatement makes something seem less important than it is.","Hyperbole: 'I've told you a million times!' Understatement: 'It's a bit warm' (in a 45 °C heatwave)."],
     ["Irony, sarcasm and euphemism","Verbal irony says the opposite of what is meant. Sarcasm is mocking irony. A euphemism is a gentle way of saying something unpleasant.","Sarcasm: 'Oh great, another test.' Euphemism: 'passed away' instead of 'died'."],
     ["Oxymoron and pun","An oxymoron puts opposite words together. A pun is a play on words with two meanings.","Oxymoron: 'deafening silence'. Pun: 'I used to be a baker, but I couldn't make enough dough.'"]],
  A:{t:"match", p:"Match each example to its figure of speech.", d:[["My bag weighs a ton!","Hyperbole"],["He passed away last year.","Euphemism"],["Deafening silence","Oxymoron"],["\"Lovely weather,\" she said, as the storm raged.","Sarcasm"],["The bicycle couldn't stand up by itself because it was two-tired.","Pun"]]},
  Q:[["'I'm so hungry I could eat a horse' is...",["hyperbole","euphemism","oxymoron","pun"],"Exaggeration."],
     ["'Bittersweet' is an example of...",["an oxymoron","a pun","hyperbole","a simile"],"Opposites together."],
     ["Saying 'between jobs' instead of 'unemployed' is a...",["euphemism","hyperbole","pun","metaphor"],"Gentler wording."],
     ["'Oh, fantastic,' he muttered, after dropping his phone. This is...",["sarcasm","understatement","a pun","alliteration"],"Mocking opposite."]],
  W:["Explain the pun: 'Time flies like an arrow; fruit flies like a banana.'",["Find the double meanings: 'flies' and 'like'.","First half: time moves (flies) quickly, the way an arrow does.","Second half: insects called fruit flies enjoy (like) bananas.","The joke works because the same words change meaning."],"'Flies' and 'like' have two meanings each"],
  X:"Hyperbole isn't lying. Everyone knows it's exaggerated; it's used for effect.",
  C:["A gentle word for something unpleasant is a...",["euphemism","hyperbole","pun","sarcasm"],"Softens it."],
  H:{L:[["Spot the opposite","For irony and sarcasm, ask: does the speaker mean the opposite of what they say? Tone of voice and context are the clues.","'Great job!' after someone spills paint: sarcasm."],
        ["Why writers use them","They add humour, emphasis or emotion, and make readers think.","Puns are common in headlines and adverts."]],
    Q:[["How do you recognise sarcasm?",["the speaker means the opposite, shown by tone and context","it always rhymes","it uses numbers","it's always polite"],"Context clues."],
       ["Where are puns common?",["headlines and adverts","legal contracts","maths answers","dictionaries"],"Catchy wordplay."],
       ["'Jumbo shrimp' is...",["an oxymoron","hyperbole","a euphemism","a simile"],"Big + tiny."],
       ["'It's just a scratch' (about a broken arm) is...",["understatement","hyperbole","a pun","an oxymoron"],"Makes it seem small."]]}}

{ id:"n7e", T:1, t:"The biosphere", s:"Where life exists on Earth and what it needs",

     ["What living things need","Living things need energy (food or sunlight), water, air (oxygen or carbon dioxide), suitable temperature and shelter.","Plants need sunlight, water, carbon dioxide and nutrients from soil."],

{ id:"n7f", T:1, t:"Reproduction in plants", s:"Flowers, pollination, fertilisation and seeds",
  L:[["Parts of a flower","The male part is the stamen: an anther (makes pollen) on a filament. The female part is the carpel (pistil): stigma, style and ovary (with ovules). Petals attract pollinators.","Proteas attract sugarbirds with their nectar."],
     ["Pollination and fertilisation","Pollination is when pollen moves from an anther to a stigma, carried by insects, birds or wind. Fertilisation happens when the male cell from the pollen joins with an ovule.","Grass is wind-pollinated; its flowers are small and dull."],
     ["Seeds and fruit","After fertilisation the ovule becomes a seed and the ovary becomes a fruit. Seeds are dispersed by wind, water, animals or by bursting out.","Blackjacks hook onto socks and fur to travel."]],
  A:{t:"match", p:"Match each flower part to its job.", d:[["Anther","Makes pollen"],["Stigma","Sticky tip that catches pollen"],["Ovary","Contains the ovules"],["Petals","Attract pollinators"],["Filament","Holds up the anther"]]},
  Q:[["The male part of a flower is the...",["stamen","carpel","sepal","ovary"],"Anther and filament."],

     ["Moving pollen from anther to stigma is...",["pollination","fertilisation","germination","dispersal"],"Before fertilisation."],
     ["Dandelion seeds are spread mainly by...",["wind","water","exploding pods","birds eating fruit"],"Fluffy parachutes."]],
  W:["Describe how an apple forms",["A bee carries pollen from one apple flower's anther to another's stigma (pollination).","A pollen tube grows down the style to the ovary, and the male cell joins an ovule (fertilisation).","The ovules develop into seeds (the pips).","The ovary swells into the fleshy fruit: the apple."],"Pollination → fertilisation → seeds and fruit"],
  X:"Pollination and fertilisation are different steps. Pollination moves pollen; fertilisation is when the cells join.",
  C:["Which part catches pollen?",["the stigma","the anther","the petal","the sepal"],"Sticky tip."],
  H:{L:[["Insect vs wind flowers","Insect-pollinated flowers are bright, scented and have nectar. Wind-pollinated flowers are small, dull, and make huge amounts of light pollen.","Maize tassels release clouds of pollen."],
        ["Why disperse seeds?","Spreading seeds away from the parent plant reduces competition for light, water and space.","A seed that lands under its parent gets little sunlight."]],
    Q:[["Why are some flowers brightly coloured?",["to attract pollinators","to scare animals","to make pollen heavier","for no reason"],"Insects and birds."],
       ["Why do plants disperse seeds?",["to reduce competition","to lose them","to feed the parent","to stop growth"],"More space and light."],
       ["Maize is mainly pollinated by...",["wind","bees","bats","water"],"Tassels release pollen."],
       ["The female part of a flower is the...",["carpel (pistil)","stamen","anther","filament"],"Stigma, style, ovary."]]}},
{ id:"n7g", T:1, t:"Human reproduction & puberty", s:"How the body changes and how new life begins",
  L:[["Puberty","Puberty is when the body becomes able to reproduce. Hormones cause changes such as growth spurts, body hair, breasts developing in girls, voices deepening in boys, and emotional changes.","Puberty starts at different ages for different people."],
     ["Reproductive organs","In males, the testes make sperm cells. In females, the ovaries release an egg cell (ovum) about once a month. The menstrual cycle is about 28 days long.","A period happens when the lining of the uterus is shed."],

  Q:[["What causes the changes of puberty?",["hormones","exercise","food colouring","sleep"],"Chemical messengers."],

     ["A pregnancy lasts about...",["40 weeks","10 weeks","20 weeks","52 weeks"],"About 9 months."]],
  W:["Put the stages from egg cell to baby in order",["An ovary releases an egg cell.","A sperm cell joins the egg cell: fertilisation.","The fertilised egg attaches to the wall of the uterus and grows.","After about 40 weeks the baby is born."],"Egg released → fertilisation → growth in the uterus → birth"],
  X:"Puberty doesn't happen at one fixed age. It's normal for friends to start earlier or later than you.",
  C:["Sperm cells are made in the...",["testes","ovaries","uterus","heart"],"Male organs."],
  H:{L:[["Looking after yourself","During puberty, wash daily, use deodorant, change underwear daily, and girls can track their periods on a calendar.","Ask a parent, clinic nurse or teacher about anything that worries you."],
        ["Respect and safety","Everyone's body is private. Nobody may touch you in a way that makes you uncomfortable. If something feels wrong, tell a trusted adult or call Childline on 116.","You have the right to say no."]],
    Q:[["Who can you ask about body changes?",["a parent, nurse or teacher","nobody","only social media","strangers online"],"Trusted adults."],
       ["If someone touches you in a way that feels wrong, you should...",["tell a trusted adult or call Childline 116","keep it secret","feel guilty","ignore it"],"Your body, your rights."],

{ id:"n7h", T:1, t:"Variation", s:"Differences within a species and why they happen",
  L:[["What is variation?","Variation is the differences between individuals of the same species. No two people (except identical twins) are exactly alike.","Learners in a class have different heights, hair and eye colours."],
     ["Inherited or environmental","Some features are inherited from parents through genes (eye colour). Others are caused by the environment (scars, language, suntan). Many are a mix (height depends on genes and food).","Speaking isiXhosa is learnt, not inherited."],
     ["Continuous and discontinuous","Continuous variation has a range of values (height, mass). Discontinuous variation has distinct groups (blood group, being able to roll your tongue).","Height can be any value; blood group is A, B, AB or O."]],
  A:{t:"sort", p:"Is this feature mainly inherited or caused by the environment?", b:["Inherited","Environmental"], d:[["Natural eye colour",0],["A scar on your knee",1],["Blood group",0],["The language you speak",1],["Natural hair colour",0],["A suntan",1]]},
  Q:[["Differences between members of the same species are called...",["variation","adaptation","pollination","evolution only"],"Not identical."],
     ["Which feature is discontinuous?",["blood group","height","mass","arm length"],"Distinct groups."],
     ["Which is caused by the environment?",["a broken tooth from a fall","natural eye colour","blood group","tongue rolling"],"Not inherited."],
     ["Inherited features are passed on through...",["genes","food","clothing","language"],"From parents."]],
  W:["Decide whether height is inherited or environmental",["Tall parents often have tall children: genes play a part.","Good nutrition and health help children grow taller: environment plays a part.","Height also comes in a range of values: continuous variation."],"Both: genes and environment, and it is continuous variation"],
  X:"Not all features are only one or the other. Many, like height and mass, depend on genes AND environment.",
  C:["Height is an example of...",["continuous variation","discontinuous variation","no variation","a learnt skill"],"A range of values."],
  H:{L:[["Graph it","Continuous data (heights) is shown as a histogram or line graph. Discontinuous data (blood groups) is shown as a bar graph with gaps.","A class height graph makes a bell shape."],
        ["Why variation matters","Variation helps a species survive changes. If the climate changes, some individuals may cope better and survive.","Some plants survive drought better than others of the same kind."]],
    Q:[["Which graph suits blood group data?",["bar graph","line graph","histogram","scatter plot only"],"Separate groups."],
       ["Why is variation useful to a species?",["some individuals may survive changes","it makes them all the same","it stops reproduction","it has no use"],"Survival."],
       ["Can identical twins have different scars?",["yes, scars are environmental","no, never","only if born on different days","only in winter"],"Environment."],
       ["Tongue rolling is...",["discontinuous variation","continuous variation","environmental only","a disease"],"You can or you can't."]]}},
{ id:"n7i", T:2, t:"Properties of materials", s:"Choosing materials for the job and recycling",
  L:[["Material properties","Properties include strength, hardness, flexibility, conductivity (heat and electricity), melting and boiling points, and whether it is waterproof or see-through.","Glass is see-through and hard but brittle."],
     ["Choosing materials","Engineers choose materials whose properties suit the job. A bridge needs strength; a pot handle needs to be a heat insulator; a raincoat needs to be waterproof.","Copper is used in wires because it conducts electricity and bends easily."],

     ["Which property does a raincoat need?",["waterproof","see-through","magnetic","brittle"],"Keeps you dry."],
     ["Recycling materials helps to...",["save resources and energy","use more resources","make more waste","create pollution"],"Less waste."]],
  W:["Choose a material for a shopping bag that will be used many times",["It must be strong, flexible and waterproof.","Paper tears when wet. Thin plastic tears easily and pollutes.","Thick fabric or woven recycled plastic is strong, flexible and can be reused for years."],"A strong reusable fabric or woven bag"],
  X:"Strong doesn't mean hard. Rubber isn't hard, but a rubber rope can be very strong. Glass is hard but not strong when dropped.",
  C:["Which property makes copper useful for electric wires?",["it conducts electricity","it is brittle","it is see-through","it is an insulator"],"Electric current flows."],

       ["Which material can be recycled again and again?",["glass","used tissue","food waste","polystyrene"],"Melt and remake."],
       ["Which property does a pot handle need?",["poor heat conductor (insulator)","good electrical conductor","see-through","magnetic"],"Stays cool."],

{ id:"n7j", T:2, t:"The periodic table", s:"Elements, symbols, metals and non-metals",
  L:[["Elements","An element is a pure substance made of only one kind of atom. There are 118 known elements. Everything around us is made of elements or combinations of them.","Oxygen, iron, gold and carbon are elements."],
     ["Symbols","Each element has a symbol of one or two letters. The first letter is a capital. Some come from Latin names.","H = hydrogen, O = oxygen, C = carbon, Fe = iron (ferrum), Au = gold (aurum), Na = sodium."],
     ["Organising the table","The periodic table arranges elements in rows (periods) and columns (groups). Metals are on the left and in the middle; non-metals are on the right. Dmitri Mendeleev created an early version in 1869.","Elements in the same group behave in similar ways."]],
  A:{t:"match", p:"Match each element to its symbol.", d:[["Hydrogen","H"],["Oxygen","O"],["Iron","Fe"],["Gold","Au"],["Sodium","Na"],["Carbon","C"]]},
  Q:[["An element is made of...",["only one kind of atom","many kinds of atoms","only water","only metals"],"Pure substance."],
     ["Where are the metals on the periodic table?",["on the left and in the middle","only on the right","only at the bottom","nowhere"],"Most elements are metals."],
     ["What is the symbol for iron?",["Fe","Ir","I","In"],"From Latin 'ferrum'."],
     ["Who created an early periodic table in 1869?",["Dmitri Mendeleev","Isaac Newton","Charles Darwin","Albert Einstein"],"Russian chemist."]],
  W:["Decide whether water is an element",["An element has only one kind of atom.","Water is made of hydrogen and oxygen atoms joined together (H₂O).","That's two kinds of atoms, so it's a compound, not an element."],"No, water is a compound of hydrogen and oxygen"],
  X:"Element symbols always start with a capital letter, and the second letter is lowercase: Co is cobalt, but CO is carbon monoxide (a compound).",
  C:["What is the symbol for gold?",["Au","Go","Gd","G"],"From Latin 'aurum'."],
  H:{L:[["Rows and columns","Rows across are periods. Columns down are groups. Elements in a group have similar properties.","Group 1 metals (like sodium) react strongly with water."],
        ["Elements in your life","Calcium in bones, iron in blood, oxygen in air, carbon in all living things, silicon in phone chips.","You're made of elements too!"]],
    Q:[["A column in the periodic table is a...",["group","period","row","family tree"],"Down."],
       ["Which element is in your bones?",["calcium","gold","neon","helium"],"Strong bones."],
       ["Is carbon a metal or non-metal?",["non-metal","metal","both","neither"],"On the right side."],
       ["How many elements are known today?",["118","12","50","1 000"],"And counting."]]}},
{ id:"n7k", T:3, t:"Sources of energy", s:"Renewable and non-renewable energy in South Africa",
  L:[["Non-renewable sources","Non-renewable sources will run out: coal, oil, natural gas (fossil fuels) and uranium (for nuclear power). Burning fossil fuels releases carbon dioxide and pollution.","Most of South Africa's electricity comes from coal power stations in Mpumalanga."],
     ["Renewable sources","Renewable sources won't run out: solar (sun), wind, hydro (moving water), biomass (plant material) and geothermal (heat from underground).","Wind farms in the Eastern and Northern Cape add power to the grid."],
     ["Pros and cons","Coal is reliable but pollutes. Solar and wind are clean but depend on the weather. Nuclear (Koeberg) makes lots of power without smoke but creates dangerous waste.","Using a mix of sources keeps the lights on."]],

     ["Burning fossil fuels releases...",["carbon dioxide","only oxygen","fresh water","nothing"],"A greenhouse gas."]],
  W:["Compare coal and wind power",["Coal: reliable day and night, but non-renewable and causes air pollution and carbon dioxide.","Wind: renewable and clean, but only works when the wind blows.","Conclusion: a mix of both, with more renewables over time, balances reliability and the environment."],"Coal is reliable but polluting; wind is clean but variable"],
  X:"Renewable doesn't mean the equipment is free or has no impact. Solar panels and wind turbines still have to be made, but the energy source won't run out.",
  C:["Hydro-electric power comes from...",["moving water","burning coal","the sun directly","uranium"],"Dams and rivers."],
  H:{L:[["Where energy comes from","Most energy on Earth started as sunlight. Plants store it; fossil fuels are ancient stored sunlight; wind is caused by the sun heating air unevenly.","Coal is really very old stored solar energy."],
        ["Saving energy","Using less energy is the cleanest choice of all: switch off lights, use LED bulbs, and insulate homes.","A geyser blanket keeps water hot for longer."]],
    Q:[["Most energy on Earth originally came from...",["the Sun","the Moon","the core","the ocean"],"Sunlight."],
       ["Which is the cleanest choice?",["using less energy","burning more coal","leaving lights on","heating empty rooms"],"Save energy."],
