<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Brainveld: fun CAPS revision adventures for Grades 5 to 7. Lessons, levels, quizzes and boss battles in nine worlds.">
<meta name="theme-color" content="#2A1260">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Brainveld">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{color-scheme:light; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0; font:14px system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<title>Brainveld</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&family=Baloo+2:wght@700;800&family=Luckiest+Guy&family=M+PLUS+Rounded+1c:wght@800&family=Orbitron:wght@700;800&family=Bangers&family=Cinzel:wght@700;900&family=Lilita+One&family=Special+Elite&family=Russo+One&display=swap">
<style>
/* Layout: a sticky "school bag" bar with grade + stats, then one view at a time (home, subject, topic, challenge) in a 1040px column. */
:root{
  --bg:#F3F5EA; --surface:#FFFFFF; --surface-2:#E9EDDD; --ink:#1A2620; --muted:#58665B; --line:#D6DCC6;
  --brand:#1D6646; --brand-ink:#FFFFFF; --brand-soft:#DCEDE2;
  --c-math:#E09C0B; --c-eng:#7256C6; --c-sci:#2B9558; --c-ss:#D6553C; --c-ls:#178590;
  --sun:#F4B731; --on-sun:#241B04;
  --good:#1F7F4B; --good-bg:#DFF2E5; --bad:#C23A32; --bad-bg:#FBE4E0;
  --shadow:0 1px 0 rgba(26,38,32,.05), 0 10px 26px -16px rgba(26,38,32,.28);
  --f-display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito","Segoe UI",system-ui,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1612; --surface:#18211B; --surface-2:#202B24; --ink:#E8EFE4; --muted:#9CAA9F; --line:#2C3830;
  --brand:#5DC58D; --brand-ink:#0B1A11; --brand-soft:#173225;
  --c-math:#F2BD43; --c-eng:#A890F2; --c-sci:#5DC58D; --c-ss:#F28A6E; --c-ls:#52C2CA;
  --good:#5DC58D; --good-bg:#15301F; --bad:#F27C72; --bad-bg:#3A1B18;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 12px 30px -16px rgba(0,0,0,.7);
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0F1612; --surface:#18211B; --surface-2:#202B24; --ink:#E8EFE4; --muted:#9CAA9F; --line:#2C3830;
  --brand:#5DC58D; --brand-ink:#0B1A11; --brand-soft:#173225;
  --c-math:#F2BD43; --c-eng:#A890F2; --c-sci:#5DC58D; --c-ss:#F28A6E; --c-ls:#52C2CA;
  --good:#5DC58D; --good-bg:#15301F; --bad:#F27C72; --bad-bg:#3A1B18;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 12px 30px -16px rgba(0,0,0,.7);
  color-scheme:dark; }

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--bg)}
h1,h2,h3,h4{font-family:var(--f-display); font-weight:600; line-height:1.15; margin:0; text-wrap:balance; letter-spacing:-.01em}
p{margin:0}
button{font:inherit; color:inherit; cursor:pointer}
input{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--c-eng); outline-offset:2px; border-radius:10px}
svg.i{width:1.15em; height:1.15em; flex:none; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; vertical-align:-.2em}
svg.i.solid{fill:currentColor; stroke:none}

.wrap{max-width:1040px; margin:0 auto; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px))}

/* top bar */
.bar{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-bottom:1px solid var(--line)}
.bar-in{display:flex; align-items:center; gap:12px; padding-block:10px; flex-wrap:wrap}
.logo{display:flex; align-items:center; gap:8px; background:none; border:0; padding:0; font-family:var(--f-display); font-weight:700; font-size:1.35rem; letter-spacing:-.02em}
.logo-mark{width:34px; height:34px; border-radius:11px; background:var(--brand); color:var(--brand-ink); display:grid; place-items:center}
.logo-mark svg{width:22px; height:22px}
.grades{display:flex; background:var(--surface-2); border-radius:999px; padding:3px; gap:2px}
.grades button{border:0; background:none; padding:6px 12px; border-radius:999px; font-family:var(--f-display); font-weight:600; font-size:.95rem; color:var(--muted)}
.grades button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:var(--shadow)}
.stats{display:flex; gap:6px; margin-left:auto}
.stat{display:flex; align-items:center; gap:5px; padding:5px 10px; border-radius:999px; background:var(--surface); border:1px solid var(--line); font-family:var(--f-display); font-weight:600; font-size:.95rem; font-variant-numeric:tabular-nums}
.stat .xp{color:var(--c-math)} .stat .fl{color:var(--c-ss)} .stat .st{color:var(--sun)}
.stat{white-space:nowrap}
@media (max-width:560px){ .stats{margin-left:0; width:100%; justify-content:space-between; gap:4px} .stat{flex:1 1 auto; justify-content:center; padding:5px 6px; font-size:.84rem; gap:3px} .logo{margin-right:auto} }

main{padding-block:24px 64px; display:grid; gap:36px}
.eyebrow{font-family:var(--f-display); font-weight:600; font-size:.82rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.lede{color:var(--muted); max-width:58ch; font-size:1.05rem}
.sec-h{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:14px}
.sec-h h2{font-size:1.45rem}
.muted{color:var(--muted)}

/* buttons */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border:0; border-radius:999px; padding:12px 22px; background:var(--brand); color:var(--brand-ink); font-family:var(--f-display); font-weight:600; font-size:1.02rem; transition:transform .12s ease, filter .12s}
.btn:hover{filter:brightness(1.07)} .btn:active{transform:translateY(1px) scale(.98)}
.btn.ghost{background:transparent; color:var(--ink); box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.ghost:hover{box-shadow:inset 0 0 0 1.5px var(--muted)}
.btn.small{padding:8px 14px; font-size:.92rem}
.btn[disabled]{opacity:.45; pointer-events:none}
.link{background:none; border:0; padding:0; color:var(--brand); font-weight:700; text-decoration:underline; text-underline-offset:3px}
.back{display:inline-flex; align-items:center; gap:6px; background:none; border:0; padding:6px 0; color:var(--muted); font-family:var(--f-display); font-weight:600}
.back:hover{color:var(--ink)}

/* home hero */
.hello{display:grid; gap:10px}
.hello h1{font-size:clamp(2rem, 5vw, 3rem)}
.name-form{display:flex; gap:8px; flex-wrap:wrap; margin-top:6px}
.name-form input{padding:10px 14px; border-radius:12px; border:1.5px solid var(--line); background:var(--surface); min-width:0; flex:1 1 180px; max-width:280px}

.quick{display:grid; grid-template-columns:1.35fr 1fr 1fr; gap:14px}
@media (max-width:860px){ .quick{grid-template-columns:1fr 1fr} .quick .daily{grid-column:1 / -1} }
@media (max-width:520px){ .quick{grid-template-columns:1fr} }
.tile{position:relative; overflow:hidden; text-align:left; border:1px solid var(--line); background:var(--surface); border-radius:var(--r); padding:20px; display:flex; flex-direction:column; gap:8px; box-shadow:var(--shadow); min-width:0}
button.tile{transition:transform .15s ease} button.tile:hover{transform:translateY(-2px)}
.tile h3{font-size:1.3rem}
.tile .go{margin-top:auto; padding-top:10px; display:flex; align-items:center; gap:6px; font-family:var(--f-display); font-weight:600}
.daily{background:var(--sun); color:var(--on-sun); border-color:transparent}
.daily .eyebrow{color:color-mix(in srgb, var(--on-sun) 70%, transparent)}
.daily::after{content:""; position:absolute; right:-90px; top:-90px; width:210px; height:210px; border-radius:50%; background:repeating-conic-gradient(from 0deg, rgba(255,255,255,.35) 0 8deg, transparent 8deg 22deg); -webkit-mask:radial-gradient(circle, transparent 38px, #000 39px); mask:radial-gradient(circle, transparent 38px, #000 39px)}
.daily::before{content:""; position:absolute; right:-30px; top:-30px; width:90px; height:90px; border-radius:50%; background:rgba(255,255,255,.4)}
.daily h3{font-size:1.65rem; max-width:14ch}
.daily p{max-width:34ch; position:relative}
.pill{display:inline-flex; align-items:center; gap:6px; align-self:flex-start; padding:4px 10px; border-radius:999px; font-size:.82rem; font-weight:800; background:var(--surface-2); color:var(--ink)}
.daily .pill{background:rgba(255,255,255,.55); color:var(--on-sun)}
.sprint .big{font-family:var(--f-display); font-size:2.4rem; font-weight:700; line-height:1; color:var(--c-ls); font-variant-numeric:tabular-nums}
.ring-wrap{display:flex; align-items:center; gap:16px}
.ring{width:84px; height:84px; flex:none}
.ring circle{fill:none; stroke-width:9}
.ring .trk{stroke:var(--surface-2)} .ring .val{stroke:var(--brand); stroke-linecap:round; transform:rotate(-90deg); transform-origin:50% 50%; transition:stroke-dashoffset .6s ease}
.ring text{font-family:var(--f-display); font-weight:700; font-size:20px; fill:var(--ink); text-anchor:middle; dominant-baseline:central}

/* subjects */
.subjects{display:grid; grid-template-columns:repeat(5, 1fr); gap:12px}
@media (max-width:980px){ .subjects{grid-template-columns:repeat(3,1fr)} }
@media (max-width:640px){ .subjects{grid-template-columns:1fr} }
.subj{--c:var(--brand); text-align:left; border:1px solid var(--line); background:var(--surface); border-radius:var(--r); padding:16px; display:flex; flex-direction:column; gap:10px; box-shadow:var(--shadow); transition:transform .15s ease, border-color .15s; min-width:0}
.subj:hover{transform:translateY(-2px); border-color:var(--c)}
.blob{width:46px; height:46px; border-radius:14px; display:grid; place-items:center; background:color-mix(in srgb, var(--c) 18%, var(--surface)); color:var(--c)}
.blob svg{width:26px; height:26px}
.subj h3{font-size:1.08rem}
.subj .meta{font-size:.88rem; color:var(--muted); margin-top:auto}
.bar-p{height:8px; border-radius:99px; background:var(--surface-2); overflow:hidden}
.bar-p > i{display:block; height:100%; background:var(--c); border-radius:99px; transition:width .5s ease}
@media (max-width:640px){ .subj{flex-direction:row; align-items:center; flex-wrap:wrap} .subj .txt{flex:1; min-width:0} .subj .bar-p{flex-basis:100%} .subj .meta{margin-top:2px} }

/* badges */
.badges{display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:10px}
.badge{display:flex; gap:10px; align-items:center; padding:12px; border-radius:14px; border:1px dashed var(--line); background:transparent; min-width:0}
.badge .medal{width:40px; height:40px; border-radius:50%; flex:none; display:grid; place-items:center; background:var(--surface-2); color:var(--muted)}
.badge .medal svg{width:22px; height:22px}
.badge b{display:block; font-family:var(--f-display); font-weight:600; font-size:.95rem; line-height:1.2}
.badge small{display:block; color:var(--muted); font-size:.78rem; line-height:1.3}
.badge.on{border-style:solid; background:var(--surface); box-shadow:var(--shadow)}
.badge.on .medal{background:var(--sun); color:var(--on-sun)}

.foot{display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; border-top:1px solid var(--line); padding-top:18px; color:var(--muted); font-size:.9rem}
.confirm{display:flex; gap:8px; align-items:center; flex-wrap:wrap}

/* subject view */
.s-head{--c:var(--brand); display:flex; gap:16px; align-items:center; flex-wrap:wrap}
.s-head .blob{width:64px; height:64px; border-radius:20px} .s-head .blob svg{width:34px; height:34px}
.s-head h1{font-size:clamp(1.7rem,4vw,2.4rem)}
.s-head .txt{flex:1; min-width:0}
.topics{display:grid; gap:10px}
.topic{--c:var(--brand); display:grid; grid-template-columns:auto 1fr auto; gap:14px; align-items:center; text-align:left; border:1px solid var(--line); background:var(--surface); border-radius:var(--r); padding:14px 16px; box-shadow:var(--shadow); transition:border-color .15s, transform .15s}
.topic:hover{border-color:var(--c); transform:translateX(2px)}
.topic .num{width:38px; height:38px; border-radius:12px; display:grid; place-items:center; font-family:var(--f-display); font-weight:700; background:color-mix(in srgb, var(--c) 16%, var(--surface)); color:var(--c)}
.topic.complete .num{background:var(--c); color:var(--surface)}
.topic h3{font-size:1.1rem}
.topic p{color:var(--muted); font-size:.92rem}
.steps{display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end}
.chip{display:inline-flex; align-items:center; gap:4px; padding:3px 9px; border-radius:999px; font-size:.78rem; font-weight:800; background:var(--surface-2); color:var(--muted); white-space:nowrap}
.chip.ok{background:var(--good-bg); color:var(--good)}
.stars{color:var(--sun); letter-spacing:1px}
.stars .off{color:var(--line)}
@media (max-width:640px){ .topic{grid-template-columns:auto 1fr} .steps{grid-column:1 / -1; justify-content:flex-start} }
.test-cta{--c:var(--brand); display:flex; gap:14px; align-items:center; justify-content:space-between; flex-wrap:wrap; padding:18px; border-radius:var(--r); background:color-mix(in srgb, var(--c) 14%, var(--surface)); border:1px solid color-mix(in srgb, var(--c) 35%, var(--line))}

/* topic view */
.t-head{--c:var(--brand); display:grid; gap:6px; justify-items:start}
.t-head h1{font-size:clamp(1.6rem,4vw,2.3rem)}
.tabs{display:flex; gap:6px; background:var(--surface-2); padding:4px; border-radius:999px; width:max-content; max-width:100%; overflow-x:auto}
.tabs button{display:flex; align-items:center; gap:6px; border:0; background:none; padding:8px 16px; border-radius:999px; font-family:var(--f-display); font-weight:600; color:var(--muted); white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--surface); color:var(--ink); box-shadow:var(--shadow)}
.tabs .tick{color:var(--good)}
.stage{--c:var(--brand); background:var(--surface); border:1px solid var(--line); border-radius:22px; padding:clamp(18px,4vw,32px); box-shadow:var(--shadow); display:grid; gap:18px; min-width:0}
.dots{display:flex; gap:6px}
.dots i{width:28px; height:6px; border-radius:9px; background:var(--surface-2)}
.dots i.on{background:var(--c)}
.card-h{font-size:clamp(1.4rem,3.5vw,1.9rem)}
.card-b{font-size:1.12rem; max-width:62ch}
.example{border-left:5px solid var(--c); background:color-mix(in srgb, var(--c) 10%, var(--surface)); border-radius:0 14px 14px 0; padding:14px 16px; max-width:66ch}
.example .eyebrow{color:var(--c); margin-bottom:4px; filter:brightness(.85)}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.row.end{justify-content:space-between}
.prompt{font-family:var(--f-display); font-weight:600; font-size:1.2rem}

/* activities */
.match{display:grid; grid-template-columns:1fr 1fr; gap:10px 14px}
.col{display:grid; gap:10px; align-content:start; min-width:0}
.opt{border:2px solid var(--line); background:var(--surface); border-radius:14px; padding:12px 14px; text-align:left; font-weight:700; transition:border-color .12s, background .12s, transform .12s; min-width:0; overflow-wrap:anywhere}
.opt:hover{border-color:var(--muted)}
.opt.sel{border-color:var(--c); background:color-mix(in srgb, var(--c) 12%, var(--surface))}
.opt.done{border-color:var(--good); background:var(--good-bg); color:var(--good); pointer-events:none}
.opt.bad{border-color:var(--bad); background:var(--bad-bg); animation:shake .35s}
.opt.right{border-color:var(--good); background:var(--good-bg)}
.opt.dim{opacity:.55}
@keyframes shake{20%,60%{transform:translateX(-5px)} 40%,80%{transform:translateX(5px)}}
.pool{display:flex; flex-wrap:wrap; gap:8px; min-height:48px; padding:12px; border-radius:14px; background:var(--surface-2)}
.pool .opt{padding:8px 12px}
.buckets{display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:10px}
.bucket{border:2px dashed var(--line); border-radius:16px; padding:12px; min-height:110px; background:transparent; text-align:left; display:flex; flex-direction:column; gap:8px; transition:border-color .12s, background .12s}
.bucket.ready{border-color:var(--c); background:color-mix(in srgb, var(--c) 8%, transparent)}
.bucket h4{font-size:1rem}
.bucket .in{display:flex; flex-wrap:wrap; gap:6px}
.bucket .in span{padding:4px 10px; border-radius:999px; background:var(--good-bg); color:var(--good); font-weight:700; font-size:.88rem}
.seq{display:grid; gap:8px; counter-reset:s}
.seq li{list-style:none; display:flex; gap:10px; align-items:center; padding:10px 12px; border-radius:12px; background:var(--good-bg); color:var(--good); font-weight:700}
.seq li::before{counter-increment:s; content:counter(s); width:26px; height:26px; flex:none; border-radius:50%; display:grid; place-items:center; background:var(--good); color:var(--surface); font-size:.85rem}
.seq{padding:0; margin:0}
.fills{display:grid; gap:10px}
.fill{display:grid; grid-template-columns:1fr auto auto; gap:10px; align-items:center; padding:12px 14px; border-radius:14px; border:1.5px solid var(--line)}
.fill label{font-weight:700; min-width:0}
.fill input{width:120px; padding:9px 12px; border-radius:10px; border:1.5px solid var(--line); background:var(--bg); font-weight:700; font-variant-numeric:tabular-nums}
.fill.ok{border-color:var(--good); background:var(--good-bg)} .fill.ok input{border-color:var(--good)}
.fill.no{border-color:var(--bad)} .fill .note{grid-column:1 / -1; font-size:.9rem; color:var(--bad); font-weight:700}
.fill.ok .note{color:var(--good)}
@media (max-width:520px){ .fill{grid-template-columns:1fr auto} .fill label{grid-column:1 / -1} .fill input{width:100%} }
.hint{min-height:1.5em; font-weight:700; color:var(--muted)}

/* quiz */
.qtop{display:flex; justify-content:space-between; gap:10px; align-items:center; flex-wrap:wrap}
.qbar{height:10px; border-radius:99px; background:var(--surface-2); overflow:hidden}
.qbar i{display:block; height:100%; background:var(--c); transition:width .3s}
.q{font-size:clamp(1.25rem,3vw,1.6rem)}
.answers{display:grid; grid-template-columns:1fr 1fr; gap:10px}
@media (max-width:560px){ .answers{grid-template-columns:1fr} }
.answers .opt{display:flex; gap:10px; align-items:center; padding:14px}
.answers .key{width:28px; height:28px; flex:none; border-radius:8px; display:grid; place-items:center; background:var(--surface-2); font-family:var(--f-display); font-size:.9rem}
.feedback{border-radius:14px; padding:14px 16px; font-weight:600}
.feedback.good{background:var(--good-bg); color:var(--good)}
.feedback.bad{background:var(--bad-bg); color:var(--bad)}
.feedback b{font-family:var(--f-display); font-size:1.1rem; margin-right:6px}
.result{text-align:center; display:grid; gap:12px; justify-items:center; padding-block:10px}
.result .score{font-family:var(--f-display); font-weight:700; font-size:clamp(3rem,10vw,4.5rem); line-height:1; font-variant-numeric:tabular-nums}
.result .bigstars{font-size:2.6rem; letter-spacing:6px; color:var(--sun)}
.result .bigstars .off{color:var(--surface-2)}
.tag{display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:999px; font-size:.8rem; font-weight:800; background:color-mix(in srgb, var(--c) 15%, var(--surface)); color:var(--c)}

/* sprint */
.sprint-stage{max-width:520px; margin:0 auto; width:100%}
.timer{height:12px; border-radius:99px; background:var(--surface-2); overflow:hidden}
.timer i{display:block; height:100%; background:var(--c-ls); width:100%; transition:width .25s linear}
.sum{font-family:var(--f-display); font-weight:700; font-size:clamp(2.2rem,9vw,3.4rem); text-align:center; font-variant-numeric:tabular-nums; line-height:1.1}
.entry{font-family:var(--f-display); font-weight:700; font-size:2rem; text-align:center; min-height:64px; border-radius:16px; border:2px solid var(--line); display:grid; place-items:center; font-variant-numeric:tabular-nums; background:var(--bg)}
.entry.good{border-color:var(--good); background:var(--good-bg)} .entry.bad{border-color:var(--bad); background:var(--bad-bg); animation:shake .3s}
.pad{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
.pad button{border:1px solid var(--line); background:var(--surface-2); border-radius:14px; padding:14px 0; font-family:var(--f-display); font-weight:700; font-size:1.4rem}
.pad button:active{transform:scale(.96)}
.pad .go{background:var(--brand); color:var(--brand-ink); border-color:transparent; grid-row:span 2}
.sprint-score{display:flex; justify-content:space-between; font-family:var(--f-display); font-weight:600}

/* toast + confetti */
.toasts{position:fixed; left:50%; bottom:calc(16px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); display:grid; gap:8px; z-index:50; width:max-content; max-width:calc(100vw - 32px); pointer-events:none}
.toast{display:flex; align-items:center; gap:8px; padding:10px 16px; border-radius:999px; background:var(--ink); color:var(--bg); font-family:var(--f-display); font-weight:600; box-shadow:0 10px 30px -10px rgba(0,0,0,.5); animation:pop .3s ease}
@keyframes pop{from{transform:translateY(10px); opacity:0}}
#confetti{position:fixed; inset:0; pointer-events:none; z-index:60; width:100%; height:100%}
@media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important} }
/* report + help + richer lessons */
.rep-btn{cursor:pointer; color:var(--ink)} .rep-btn:hover{border-color:var(--brand)}
.rep-btn svg{color:var(--brand)}
.worked{display:grid; gap:10px; padding:16px; border-radius:16px; background:var(--surface-2); max-width:66ch}
.wk-q{font-family:var(--f-display); font-weight:600; font-size:1.15rem}
.wk-steps{margin:0; padding:0; display:grid; gap:8px; counter-reset:w}
.wk-steps li{list-style:none; display:flex; gap:10px; align-items:flex-start; background:var(--surface); border-radius:12px; padding:10px 12px; animation:pop .25s ease}
.wk-steps li::before{counter-increment:w; content:counter(w); flex:none; width:24px; height:24px; border-radius:50%; display:grid; place-items:center; background:var(--c); color:var(--surface); font-weight:800; font-size:.8rem; margin-top:1px}
.wk-ans{display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; padding:12px 14px; border-radius:12px; background:var(--good-bg); color:var(--good)}
.wk-ans b{font-family:var(--f-display); font-size:1.15rem}
.wk-next{justify-self:start}
.watch{display:flex; gap:16px; align-items:flex-start; padding:18px; border-radius:16px; background:color-mix(in srgb, var(--sun) 22%, var(--surface)); border:1.5px solid color-mix(in srgb, var(--sun) 60%, var(--line))}
.watch-ic{flex:none; width:42px; height:42px; border-radius:50%; display:grid; place-items:center; background:var(--sun); color:var(--on-sun); font-family:var(--f-display); font-weight:700; font-size:1.5rem}
.watch .card-h{margin-bottom:8px}
.rep-home{display:block}
.weak-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:12px}
.weak{--c:var(--brand); display:flex; flex-direction:column; gap:10px; padding:16px; border-radius:var(--r); background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow); min-width:0}
.weak h3{font-size:1.12rem}
.weak-top{display:flex; justify-content:space-between; gap:8px; align-items:center; flex-wrap:wrap}
.lv{font-size:.78rem; font-weight:800; padding:3px 9px; border-radius:999px}
.lv.weak{background:var(--bad-bg); color:var(--bad)} .lv.ok{background:color-mix(in srgb, var(--sun) 25%, var(--surface)); color:var(--ink)} .lv.strong{background:var(--good-bg); color:var(--good)}
.meter-row{display:flex; align-items:center; gap:10px}
.meter{flex:1; height:10px; border-radius:99px; background:var(--surface-2); overflow:hidden; display:block; min-width:60px}
.meter i{display:block; height:100%; border-radius:99px}
.pct{font-family:var(--f-display); font-variant-numeric:tabular-nums; min-width:3.2ch; text-align:right}
.missed{display:grid; gap:8px; padding:12px; border-radius:12px; background:var(--surface-2)}
.missed p{display:grid; gap:2px; font-size:.92rem}
.mq{font-weight:700} .ma{color:var(--good); font-weight:700}
.rep-tiles{display:grid; grid-template-columns:repeat(4,1fr); gap:12px}
@media (max-width:700px){ .rep-tiles{grid-template-columns:1fr 1fr} }
.num-big{font-family:var(--f-display); font-weight:700; font-size:2.4rem; line-height:1; font-variant-numeric:tabular-nums}
.num-big small{font-size:1rem; color:var(--muted); margin-left:2px}
.subj-rows{display:grid; gap:8px}
.subj-row{--c:var(--brand); display:grid; grid-template-columns:auto minmax(0,1fr) minmax(120px,1.4fr); gap:14px; align-items:center; padding:12px 14px; border-radius:14px; background:var(--surface); border:1px solid var(--line)}
.subj-row .blob{width:38px; height:38px; border-radius:12px} .subj-row .blob svg{width:20px; height:20px}
.sr-name b{display:block; font-family:var(--f-display); font-weight:600} .sr-name small{color:var(--muted)}
.sr-meter{display:flex; align-items:center; gap:10px}
@media (max-width:560px){ .subj-row{grid-template-columns:auto 1fr} .sr-meter{grid-column:1 / -1} }
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip-btn{--c:var(--brand); display:inline-flex; align-items:center; gap:6px; padding:7px 12px; border-radius:999px; border:1.5px solid color-mix(in srgb, var(--c) 45%, var(--line)); background:color-mix(in srgb, var(--c) 10%, var(--surface)); font-weight:700; font-size:.9rem}
.chip-btn svg{color:var(--c)}
.chip-btn:hover{border-color:var(--c)}
.term-h{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; font-size:1.2rem; margin-top:14px; padding-bottom:6px; border-bottom:2px solid var(--line)}
.term-h:first-child{margin-top:0}
.term-h span{font-family:var(--f-body); font-size:.85rem; font-weight:700; color:var(--muted)}
.term-h .link{margin-left:auto; font-size:.9rem; font-family:var(--f-body)}
/* ===== Worlds: each world commits to its own look (explicit colours, no dark/light split) ===== */
body[data-world]{min-height:100vh; background:var(--scene-bg); color:var(--ink)}
body[data-world="animals"]{
  --bg:#FFD89A; --surface:#FFFBF2; --surface-2:#FFF0D6; --ink:#2E1F12; --muted:#6E5034; --line:#EED6AE;
  --brand:#D24E17; --brand-ink:#FFFFFF; --brand-soft:#FFE3CC;
  --c-math:#D97A00; --c-eng:#7B4FC9; --c-sci:#2F8F4E; --c-ss:#C2452D; --c-ls:#1F8A8A;
  --sun:#FFC23D; --on-sun:#2E1F12; --good:#1F7F4B; --good-bg:#DFF2E5; --bad:#C23A32; --bad-bg:#FBE4E0;
  --f-display:"Luckiest Guy","Fredoka",system-ui,sans-serif; --display-spacing:.03em;
  --scene-bg:linear-gradient(180deg,#FF9F5A 0%,#FFC27A 28%,#FFDFA6 60%,#E9C285 100%);
  color-scheme:light;
}
body[data-world="anime"]{
  --bg:#BFE3FF; --surface:#FFFFFF; --surface-2:#EEF1FF; --ink:#1F1A3D; --muted:#5B5680; --line:#D9DCF6;
  --brand:#F2427E; --brand-ink:#FFFFFF; --brand-soft:#FFE0EC;
  --c-math:#F05A2A; --c-eng:#D2409E; --c-sci:#139A62; --c-ss:#2F72D6; --c-ls:#C98C00;
  --sun:#FFC83D; --on-sun:#2A1A00; --good:#14855A; --good-bg:#DDF5EA; --bad:#D2304A; --bad-bg:#FFE3E8;
  --f-display:"M PLUS Rounded 1c","Fredoka",system-ui,sans-serif; --display-spacing:0;
  --scene-bg:linear-gradient(180deg,#6FBFFF 0%,#B7E0FF 45%,#FFD6EA 100%);
  color-scheme:light;
}
body[data-world="cute"]{
  --bg:#FFE6F1; --surface:#FFFFFF; --surface-2:#FFF0F6; --ink:#4A2340; --muted:#86587A; --line:#F6CFE1;
  --brand:#F2559E; --brand-ink:#FFFFFF; --brand-soft:#FFE0EF;
  --c-math:#F0773F; --c-eng:#8E63E0; --c-sci:#14A88A; --c-ss:#E8456B; --c-ls:#D98A00;
  --sun:#FFD966; --on-sun:#4A2340; --good:#14855A; --good-bg:#DDF5EA; --bad:#D2304A; --bad-bg:#FFE3E8;
  --f-display:"Baloo 2","Fredoka",system-ui,sans-serif; --display-spacing:0;
  --scene-bg:radial-gradient(circle at 20% 20%, #fff 0 2px, transparent 3px) 0 0/34px 34px, linear-gradient(160deg,#FFD9EA 0%,#FFE9D6 50%,#DDEEFF 100%);
  color-scheme:light;
}
body[data-world="space"]{
  --bg:#0B1030; --surface:#151B45; --surface-2:#1F2758; --ink:#EEF1FF; --muted:#A9B0DA; --line:#2E3972;
  --brand:#00D8F5; --brand-ink:#04122A; --brand-soft:#0F3550;
  --c-math:#FFB020; --c-eng:#FF6FE0; --c-sci:#4DFFA6; --c-ss:#5CC2FF; --c-ls:#FF9466;
  --sun:#FFD23F; --on-sun:#1A1400; --good:#4DFFA6; --good-bg:#10372A; --bad:#FF6B7A; --bad-bg:#3A1626;
  --f-display:"Orbitron","Fredoka",system-ui,sans-serif; --display-spacing:.02em;
  --scene-bg:radial-gradient(ellipse at 70% 10%, #2A2470 0%, transparent 55%), radial-gradient(ellipse at 10% 90%, #1A2A6B 0%, transparent 50%), #070B24;
  --shadow:0 1px 0 rgba(0,0,0,.4), 0 14px 34px -16px rgba(0,0,0,.8);
  color-scheme:dark;
}
body[data-world] h1, body[data-world] h2, body[data-world] h3{letter-spacing:var(--display-spacing,0)}
body[data-world="animals"] h1, body[data-world="animals"] h2, body[data-world="animals"] h3, body[data-world="animals"] .btn{font-weight:400}
body[data-world="space"] h1{font-size:clamp(1.5rem,4.5vw,2.4rem)}

#scene{position:fixed; inset:0; z-index:-1; pointer-events:none; overflow:hidden}
#scene svg{width:100%; height:100%; display:block}
.tw{animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.15}}
.float{animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}
.petal{animation:petal 10s linear infinite}
@keyframes petal{to{transform:translate(-160px,860px) rotate(540deg)}}

/* glass header */
body[data-world] .bar{background:color-mix(in srgb, var(--surface) 82%, transparent); border-bottom-color:color-mix(in srgb, var(--line) 70%, transparent)}
body[data-world] .bar-in{gap:10px}
.world-btn{display:flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:3px 12px 3px 3px; font-family:var(--f-display); font-size:.92rem}
.world-btn .char{width:34px; height:34px}
.icon-btn{border:1px solid var(--line); background:var(--surface); border-radius:999px; width:36px; height:36px; display:grid; place-items:center}
@media (max-width:560px){ .world-btn span{display:none} .world-btn{padding:3px} }

/* every text block sits on a surface so the scene can be bold */
body[data-world] .sec-h h2{background:var(--surface); padding:6px 16px; border-radius:999px; box-shadow:var(--shadow)}
body[data-world] .sec-h > .muted{background:color-mix(in srgb, var(--surface) 85%, transparent); padding:4px 12px; border-radius:999px; color:var(--ink)}
body[data-world] .back{background:var(--surface); padding:6px 14px; border-radius:999px; box-shadow:var(--shadow); color:var(--ink)}
body[data-world] .t-head{background:var(--surface); border-radius:22px; padding:18px 20px; box-shadow:var(--shadow)}
body[data-world] .foot{background:var(--surface); border-radius:18px; padding:14px 18px; border-top:0}
body[data-world] .rep-home > .lede{background:var(--surface); padding:12px 16px; border-radius:16px}
body[data-world] .rep-home > .muted{background:var(--surface); padding:12px 16px; border-radius:16px}

/* characters */
.char{display:block; overflow:visible}
.bob{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.hop{animation:hop .5s ease}
@keyframes hop{30%{transform:translateY(-14px) scale(1.05)} 60%{transform:translateY(0) scale(.97)}}
.wobble{animation:wobble .5s ease}
@keyframes wobble{25%{transform:rotate(-8deg)} 75%{transform:rotate(8deg)}}

/* speech bubble */
.say{display:flex; gap:12px; align-items:flex-end}
.say .av{flex:none; width:84px; height:84px}
.say .av .char{width:100%; height:100%}
.bubble{position:relative; background:var(--surface); color:var(--ink); border-radius:20px; padding:12px 16px; box-shadow:var(--shadow); border:2px solid var(--line); min-width:0; font-weight:600}
.bubble::before{content:""; position:absolute; left:-10px; bottom:18px; width:16px; height:16px; background:var(--surface); border-left:2px solid var(--line); border-bottom:2px solid var(--line); transform:rotate(45deg)}
.bubble b.who{display:block; font-family:var(--f-display); font-weight:inherit; color:var(--brand); font-size:.95rem; margin-bottom:2px}

/* home hero */
.quest{display:grid; grid-template-columns:auto 1fr; gap:18px; align-items:end; padding-top:6px}
.quest .guide{width:clamp(120px,22vw,190px); height:clamp(120px,22vw,190px)}
.quest .guide .char{width:100%; height:100%; filter:drop-shadow(0 10px 14px rgba(0,0,0,.18))}
.quest-card{background:var(--surface); border-radius:24px; padding:18px 20px; box-shadow:var(--shadow); display:grid; gap:10px; position:relative; min-width:0}
.quest-card::before{content:""; position:absolute; left:-12px; bottom:34px; width:22px; height:22px; background:var(--surface); transform:rotate(45deg)}
.quest-card h1{font-size:clamp(1.7rem,4.5vw,2.6rem)}
.qmeter{display:grid; gap:6px}
.qmeter .bar-p{height:14px; background:var(--surface-2)}
.qmeter .bar-p > i{background:linear-gradient(90deg, var(--brand), var(--sun))}
.qmeter small{font-weight:700; color:var(--muted)}
@media (max-width:620px){ .quest{grid-template-columns:1fr; justify-items:center} .quest-card::before{left:50%; top:-10px; bottom:auto; margin-left:-11px} .quest .guide{width:130px; height:130px} }

/* regions */
.regions{display:grid; grid-template-columns:repeat(5,1fr); gap:12px}
@media (max-width:980px){ .regions{grid-template-columns:repeat(3,1fr)} }
@media (max-width:640px){ .regions{grid-template-columns:1fr 1fr} }
.region{--c:var(--brand); position:relative; text-align:left; border:0; border-radius:22px; padding:12px 12px 14px; background:var(--surface); box-shadow:var(--shadow); display:flex; flex-direction:column; gap:6px; overflow:hidden; min-width:0; transition:transform .15s}
.region::before{content:""; position:absolute; inset:0 0 auto; height:62%; background:radial-gradient(circle at 50% 80%, color-mix(in srgb, var(--c) 40%, var(--surface)) 0%, color-mix(in srgb, var(--c) 18%, var(--surface)) 60%, transparent 100%)}
.region:hover{transform:translateY(-4px) rotate(-.5deg)}
.region .char{position:relative; width:96px; height:96px; margin:0 auto}
.region:hover .char{animation:hop .5s ease}
.region h3{position:relative; font-size:1.05rem; color:var(--c); filter:saturate(1.1)}
.region .sub{position:relative; font-size:.85rem; font-weight:700; color:var(--muted)}
.region .bar-p{position:relative}
.region .bar-p > i{background:var(--c)}
.region .lvl{position:relative; font-size:.8rem; color:var(--muted)}

/* region (subject) page */
.region-head{--c:var(--brand); display:grid; grid-template-columns:auto 1fr; gap:16px; align-items:center; background:var(--surface); border-radius:24px; padding:16px 18px; box-shadow:var(--shadow); position:relative; overflow:hidden}
.region-head::before{content:""; position:absolute; left:-40px; top:-40px; width:220px; height:220px; border-radius:50%; background:color-mix(in srgb, var(--c) 22%, transparent)}
.region-head .char{position:relative; width:110px; height:110px}
.region-head h1{font-size:clamp(1.6rem,4vw,2.4rem); color:var(--c)}
.region-head .txt{position:relative; min-width:0; display:grid; gap:6px}
@media (max-width:520px){ .region-head{grid-template-columns:1fr; justify-items:center; text-align:center} }

.map{position:relative; display:grid; gap:14px; padding:6px 0 10px}
.map > svg.trail{position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible}
.chapter{position:relative; z-index:1; display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between; background:var(--surface); border-radius:18px; padding:10px 16px; box-shadow:var(--shadow); border:2px dashed color-mix(in srgb, var(--c) 50%, var(--line))}
.chapter h2{font-size:1.15rem}
.chapter small{font-weight:700; color:var(--muted)}
.lvl-row{--x:0px; position:relative; z-index:1; display:flex; align-items:center; gap:12px; margin-left:var(--x); width:min(calc(100% - var(--x)), 520px); text-align:left; border:0; background:none; padding:0}
.lvl-node{flex:none; width:64px; height:64px; border-radius:50%; display:grid; place-items:center; font-family:var(--f-display); font-size:1.4rem; background:var(--surface); color:var(--c); border:5px solid var(--c); box-shadow:0 6px 0 color-mix(in srgb, var(--c) 55%, #000), var(--shadow); transition:transform .15s}
.lvl-row:hover .lvl-node{transform:translateY(-3px) scale(1.05)}
.lvl-row.complete .lvl-node{background:var(--c); color:var(--surface)}
.lvl-row.next .lvl-node{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 6px 0 color-mix(in srgb, var(--c) 55%, #000), 0 0 0 10px color-mix(in srgb, var(--c) 25%, transparent)}}
.lvl-card{flex:1; min-width:0; background:var(--surface); border-radius:16px; padding:10px 14px; box-shadow:var(--shadow); display:grid; gap:4px}
.lvl-card h3{font-size:1rem; line-height:1.2}
.lvl-card .meta{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.lvl-card .tagn{font-size:.72rem; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--c)}
.boss-row{position:relative; z-index:1; display:grid; grid-template-columns:auto 1fr auto; gap:14px; align-items:center; background:linear-gradient(135deg, color-mix(in srgb, var(--c) 25%, var(--surface)), var(--surface)); border-radius:22px; padding:14px 18px; box-shadow:var(--shadow); border:3px solid var(--c)}
.boss-row .char{width:84px; height:84px}
@media (max-width:560px){ .boss-row{grid-template-columns:auto 1fr} .boss-row .btn{grid-column:1 / -1} .lvl-row{width:100%} }

/* level (topic) page */
.lvl-head{--c:var(--brand); display:grid; grid-template-columns:auto 1fr; gap:14px; align-items:end}
.lvl-head .av{width:96px; height:96px}
.lvl-head .av .char{width:100%; height:100%}
.lvl-head .bubble h1{font-size:clamp(1.4rem,3.6vw,2rem); margin:2px 0}
.lvl-head .bubble .tag{margin-bottom:4px}
@media (max-width:520px){ .lvl-head{grid-template-columns:72px 1fr} .lvl-head .av{width:72px; height:72px} }

/* reaction in quizzes */
.react{display:flex; gap:10px; align-items:center}
.react .av{flex:none; width:58px; height:58px}
.react .av .char{width:100%; height:100%}
.react .feedback{flex:1}
.watch .av{flex:none; width:60px; height:60px}
.watch .av .char{width:100%; height:100%}

/* boss intro */
.boss-intro{display:grid; justify-items:center; gap:10px; text-align:center}
.boss-intro .vs{display:flex; align-items:center; gap:16px}
.boss-intro .vs .char{width:110px; height:110px}
.boss-intro .vs b{font-family:var(--f-display); font-size:1.8rem; color:var(--brand)}
.result .char{width:120px; height:120px; margin:0 auto}

/* world picker */
.pick-head{text-align:center; display:grid; gap:8px; background:var(--surface); border-radius:24px; padding:18px; box-shadow:var(--shadow)}
.pick-head h1{font-size:clamp(1.8rem,5vw,2.8rem)}
.worlds{display:grid; grid-template-columns:repeat(4,1fr); gap:16px}
@media (max-width:980px){ .worlds{grid-template-columns:1fr 1fr} }
@media (max-width:520px){ .worlds{grid-template-columns:1fr} }
.wcard{position:relative; overflow:hidden; border-radius:26px; border:4px solid transparent; min-height:330px; display:flex; flex-direction:column; justify-content:flex-end; padding:0; text-align:left; box-shadow:0 18px 30px -18px rgba(0,0,0,.5); transition:transform .18s}
.wcard:hover{transform:translateY(-6px)}
.wcard[aria-pressed="true"]{border-color:#fff; outline:4px solid var(--brand)}
.wcard .wscene{position:absolute; inset:0}
.wcard .wscene svg{width:100%; height:100%}
.wcard .crew{position:absolute; left:0; right:0; top:22px; display:flex; justify-content:center}
.wcard .crew .char{width:86px; height:86px; margin:0 -10px}
.wcard .crew .char:nth-child(2){width:110px; height:110px; margin-top:-14px; z-index:1}
.wcard .winfo{position:relative; margin:12px; background:rgba(255,255,255,.94); color:#1F1A2E; border-radius:18px; padding:12px 14px; display:grid; gap:4px}
.wcard .winfo h2{font-size:1.4rem}
.wcard .winfo small{font-weight:800; text-transform:uppercase; letter-spacing:.06em; font-size:.72rem; color:#6A5A7A}

/* learner profiles */
.player-btn .initial{width:30px; height:30px; border-radius:50%; display:grid; place-items:center; background:var(--brand); color:var(--brand-ink); font-family:var(--f-display); font-size:1rem}
.players{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:14px}
.player{background:var(--surface); border-radius:22px; box-shadow:var(--shadow); padding:14px; display:grid; gap:8px; justify-items:center; text-align:center; border:3px solid transparent; min-width:0}
.player.on{border-color:var(--brand)}
.player .pick{display:grid; justify-items:center; gap:4px; background:none; border:0; padding:0; width:100%}
.player .pick .char{width:96px; height:96px}
.player .pick b{font-family:var(--f-display); font-size:1.3rem; overflow-wrap:anywhere}
.player .pick small{color:var(--muted); font-weight:700}
.player .confirm{display:grid; gap:6px; justify-items:center; font-size:.9rem}
.player.add{border:3px dashed var(--line); align-content:center}
.player.add .plus{width:56px; height:56px; border-radius:50%; display:grid; place-items:center; background:var(--brand-soft); color:var(--brand); font-size:2rem; font-weight:800}
.player.add input, .player.add select{width:100%; padding:9px 12px; border-radius:12px; border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink); font-weight:700}
body[data-world] .save-line{background:var(--surface); padding:8px 14px; border-radius:999px; justify-self:center; width:max-content; max-width:100%; margin:0 auto}
@media (max-width:560px){ .player-btn span:not(.initial){display:none} .player-btn{padding:3px} }
.world-btn.player-btn .initial{display:grid}
.player .where{font-size:.72rem; text-transform:uppercase; letter-spacing:.05em; color:var(--brand)}
.player .lock{display:inline-grid; vertical-align:-2px; margin-right:4px; color:var(--brand)}
.player .pmenu{display:flex; gap:14px; justify-content:center; flex-wrap:wrap}
.player .pslot{width:100%}
.player .pinf, .player .codebox, .restore{display:grid; gap:8px; width:100%}
.player .pinf input, .player .codebox textarea, .restore textarea{width:100%; padding:9px 12px; border-radius:12px; border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink); font-family:ui-monospace,monospace; font-size:.85rem}
.player .pinf input{font-size:1.3rem; letter-spacing:.4em; text-align:center}
.pinmsg{color:var(--bad); font-weight:700}
.chk{display:flex; gap:8px; align-items:flex-start; text-align:left; font-size:.85rem; font-weight:700; color:var(--muted)}
.restore{background:var(--surface); border-radius:22px; box-shadow:var(--shadow); padding:16px; max-width:560px; margin:0 auto}

.logo-icon{width:40px; height:40px; border-radius:11px; display:block; box-shadow:0 4px 10px -4px rgba(0,0,0,.45)}
.pick-icon{width:96px; height:96px; border-radius:24px; margin:0 auto; box-shadow:0 12px 24px -10px rgba(0,0,0,.45)}

    }[p.top] || '';
    const spots = p.spots ? `<g fill="${INK}" opacity=".85"><circle cx="24" cy="50" r="5"/><circle cx="76" cy="50" r="5"/><circle cx="28" cy="80" r="4"/><circle cx="72" cy="80" r="4"/><circle cx="50" cy="30" r="4"/></g>` : '';

 { id:"m5a", t:"Place value & big numbers", s:"Six-digit numbers, rounding and comparing",
   L:[["Every digit has a job","The place of a digit tells you its value. The columns are hundred thousands, ten thousands, thousands, hundreds, tens and units.","In 352 718 the 3 is worth 300 000. Expanded: 300 000 + 50 000 + 2 000 + 700 + 10 + 8"],
      ["Rounding off","Look at the digit just to the right of the place you are rounding to. If it is 5 or more, round up. If it is 4 or less, round down.","46 382 to the nearest 1 000 is 46 000 (the 3 is less than 5). To the nearest 100 it is 46 400."],
      ["Comparing numbers","Compare from the biggest place first. Use > for 'is greater than' and < for 'is less than'.","204 531 > 199 999 because 2 hundred thousands beats 1 hundred thousand."]],
   A:{t:"fill", p:"Type your answers. Spaces in numbers are fine.", d:[["Round 7 846 to the nearest 10","7850"],["Round 63 501 to the nearest 1 000","64000"],["What is the value of the 6 in 461 205?","60000"],["400 000 + 20 000 + 5 000 + 30 + 7 = ?","425037"]]},
   Q:[["What is the value of the 8 in 582 140?",["80 000","8 000","800 000","800"],"The 8 is in the ten thousands column."],
      ["Round 3 750 to the nearest 100.",["3 800","3 700","4 000","3 750"],"The tens digit is 5, so you round up."],
      ["Which number is the biggest?",["310 001","301 100","300 999","130 999"],"All start with 3 hundred thousands except one. Then 310 001 has 1 ten thousand, which beats 0."],
      ["Which number is 50 000 + 4 000 + 60 + 2?",["54 062","54 620","5 462","540 062"],"5 ten thousands, 4 thousands, 0 hundreds, 6 tens, 2 units."]]},
 { id:"m5b", t:"Multiplication & division", s:"Times tables, bigger sums and sharing",
   L:[["Times tables are your toolbox","Know your facts up to 10 × 10 by heart. Doubling helps: 4 × is double, then double again.","8 × 7 = 56, so 16 × 7 = 112 (double it)."],
      ["Multiplying bigger numbers","Break the number into parts, multiply each part, then add.","243 × 6 = 1 200 + 240 + 18 = 1 458. And 34 × 21 = 680 + 34 = 714."],
      ["Division shares equally","Ask: what times the divisor gives the number? If it does not share exactly, there is a remainder. Check by multiplying back.","96 ÷ 4 = 24 because 4 × 24 = 96. 25 ÷ 4 = 6 remainder 1."]],
   A:{t:"fill", p:"Work these out.", d:[["7 × 8","56"],["125 × 4","500"],["84 ÷ 7","12"],["23 × 12","276"],["150 ÷ 6","25"]]},
   Q:[["Mangoes cost R18 each. How much for 6 mangoes?",["R108","R96","R114","R118"],"18 × 6 = 60 + 48 = 108."],
      ["What is 312 ÷ 3?",["104","14","114","1 004"],"300 ÷ 3 = 100 and 12 ÷ 3 = 4, so 104."],
      ["45 learners sit in rows of 6. How many FULL rows are there?",["7","8","6","9"],"45 ÷ 6 = 7 remainder 3, so there are 7 full rows."],
      ["Which is the same as 15 × 20?",["15 × 2 × 10","15 + 20","15 × 2 + 10","150 × 20"],"20 = 2 × 10, so 15 × 20 = 15 × 2 × 10 = 300."]]},
 { id:"m5c", t:"Common fractions", s:"Parts of a whole, equivalent fractions, fractions of amounts",
   L:[["Parts of a whole","The bottom number (denominator) tells you how many equal parts. The top number (numerator) tells you how many parts you have.","3/4 of a pizza: cut into 4 equal slices, you take 3."],
      ["Equivalent fractions","Multiply or divide the top and bottom by the same number and the fraction keeps its value.","1/2 = 2/4 = 4/8 = 5/10"],
      ["Fraction of a number","Divide by the bottom, multiply by the top. When adding fractions with the same bottom, only add the tops.","2/3 of 18: 18 ÷ 3 = 6, 6 × 2 = 12. And 2/7 + 3/7 = 5/7."]],
   A:{t:"match", p:"Match each fraction to its equivalent fraction.", d:[["1/2","4/8"],["1/3","2/6"],["3/4","6/8"],["2/5","4/10"],["1/4","3/12"]]},
   Q:[["What is 1/4 of 20?",["5","4","10","80"],"20 ÷ 4 = 5."],
      ["Which fraction is equal to 1/2?",["5/10","2/5","1/5","5/2"],"5 is half of 10."],
      ["2/9 + 5/9 = ?",["7/9","7/18","10/9","3/9"],"Same bottoms, so add the tops: 2 + 5 = 7."],
      ["Which fraction is the biggest?",["3/4","1/2","3/8","1/4"],"3/4 = 6/8, which is bigger than 4/8, 3/8 and 2/8."]]},
 { id:"m5d", t:"Measurement & time", s:"Length, mass, capacity and 24-hour time",
   L:[["Units to know","Length: 10 mm = 1 cm, 100 cm = 1 m, 1 000 m = 1 km. Mass: 1 000 g = 1 kg. Capacity: 1 000 ml = 1 l.","A 2 kg bag of mielie meal weighs 2 000 g."],
      ["Changing units","Big unit to small unit: multiply. Small unit to big unit: divide.","3 m = 300 cm. 4 000 ml = 4 l."],
      ["24-hour time","After 12 noon, add 12 to the hour. There are 60 minutes in an hour.","3:45 p.m. is 15:45. A bus leaves at 14:20 and the trip takes 1 h 25 min, so it arrives at 15:45."]],
   A:{t:"match", p:"Match each unit to what it equals.", d:[["1 km","1 000 m"],["1 kg","1 000 g"],["1 l","1 000 ml"],["1 m","100 cm"],["1 cm","10 mm"],["1 hour","60 minutes"]]},
   Q:[["What is 7:30 p.m. in 24-hour time?",["19:30","07:30","17:30","21:30"],"7 + 12 = 19, so 19:30."],
      ["How many grams are in 3 kg?",["3 000 g","300 g","30 g","30 000 g"],"1 kg = 1 000 g, so 3 kg = 3 000 g."],
      ["A bottle holds 500 ml. How many bottles fill a 2 l jug?",["4","2","5","10"],"2 l = 2 000 ml and 2 000 ÷ 500 = 4."],
      ["Which unit would you use for the distance from Durban to Cape Town?",["kilometres","centimetres","millimetres","litres"],"Long distances are measured in kilometres."]]},
 { id:"m5e", t:"Shapes, patterns & data", s:"2D shapes, 3D objects, number patterns and tallies",
   L:[["2D shapes are flat","Name them by their sides: triangle 3, quadrilateral 4, pentagon 5, hexagon 6, octagon 8. A circle has one curved side.","A stop sign is an octagon."],
      ["3D objects take up space","3D objects have faces, edges and vertices (corners). Prisms have two matching ends. Pyramids come to a point.","A cube has 6 faces, 12 edges and 8 vertices."],
      ["Patterns and data","Find the rule in a pattern by looking at how it changes. Tally marks are grouped in fives to make counting quick.","4, 9, 14, 19 ... the rule is 'add 5', so next is 24."]],
   A:{t:"sort", p:"Sort each one: is it a flat 2D shape or a 3D object?", b:["2D shape","3D object"], d:[["square",0],["cube",1],["hexagon",0],["cylinder",1],["triangle",0],["cone",1],["circle",0],["sphere",1]]},
   Q:[["How many faces does a cube have?",["6","8","12","4"],"Think of a dice: it has 6 faces."],
      ["What comes next: 3, 7, 11, 15, ...?",["19","18","20","21"],"The rule is 'add 4'."],
      ["How many sides does a hexagon have?",["6","5","8","7"],"Hex means six. Think of a honeycomb cell."],
      ["Two full tally groups and 2 single marks show which number?",["12","7","22","10"],"Each full group is 5: 5 + 5 + 2 = 12."]]}
]},
{ id:"eng", name:"English", topics:[
 { id:"e5a", t:"Parts of speech", s:"Nouns, verbs, adjectives, adverbs and pronouns",
   L:[["Nouns name things","A noun names a person, place, thing or idea. Proper nouns are names and start with a capital letter.","Thabo, Durban, ball, happiness"],
      ["Verbs and adjectives","A verb is a doing or being word. An adjective describes a noun.","The **tall** giraffe **ate** the leaves. (tall = adjective, ate = verb)"],
      ["Adverbs and pronouns","An adverb tells how, when or where something happens and often ends in -ly. A pronoun takes the place of a noun.","She sang **loudly**. (She = pronoun, loudly = adverb)"]],
   A:{t:"sort", p:"Sort each word into the right part of speech.", b:["Noun","Verb","Adjective"], d:[["elephant",0],["jump",1],["shiny",2],["Limpopo",0],["whisper",1],["brave",2],["teacher",0],["swim",1],["tiny",2]]},
   Q:[["Which word is a verb? 'The dog barked at the postman.'",["barked","dog","postman","the"],"Barked is the action."],
      ["Which word is an adjective?",["colourful","quickly","run","Cape Town"],"Colourful describes a noun, like a colourful kite."],
      ["Find the adverb: 'Lerato walked slowly to school.'",["slowly","walked","school","Lerato"],"Slowly tells us HOW she walked."],
      ["Which is a proper noun?",["Table Mountain","mountain","city","river"],"It is the name of a particular place, so it has capital letters."]]},
 { id:"e5b", t:"Punctuation", s:"Capitals, full stops, commas, apostrophes and speech marks",
   L:[["Start and finish","Begin every sentence with a capital letter. End it with a full stop, a question mark or an exclamation mark. Names of people, places, days and months need capitals.","We visited Kruger Park in July."],
      ["Commas and question marks","Commas separate items in a list. Questions end with a question mark.","I packed bread, apples, juice and a jersey. Are you ready?"],
      ["Apostrophes and speech","An apostrophe shows that something belongs to someone, or that letters are missing. Inverted commas go around the exact words someone says.","Sipho's bag. don't = do not. \"Let's go,\" said Mia."]],
   A:{t:"sort", p:"Is each sentence punctuated correctly, or does it need fixing?", b:["Correct","Needs fixing"], d:[["We visited Kruger Park in July.",0],["my sister likes pizza.",1],["Where is your hat?",0],["I cant find my shoe.",1],["Thandi's dog is friendly.",0],["Are you coming to the braai.",1]]},
   Q:[["Which sentence is punctuated correctly?",["\"Come inside,\" said Gran.","\"come inside\" said Gran.","Come inside said Gran.","\"Come inside,\" said gran"],"Speech marks around the words, a comma inside them, and a capital G for the name."],
      ["What is the short form of 'we are'?",["we're","were","wer'e","we'r"],"The apostrophe replaces the missing letter 'a'."],
      ["Which of these needs a question mark?",["What time is it","I like apples","Close the door","It is cold today"],"It asks something, so it ends with ?"],
      ["How do you write 'the bag belonging to Pieter'?",["Pieter's bag","Pieters' bag","Pieters bag'","Pie'ters bag"],"One owner: add 's to the name."]]},
 { id:"e5c", t:"Tenses", s:"Past, present and future",
   L:[["Present tense","Use it for things happening now or things that happen often.","I walk to school. She plays netball."],
      ["Past tense","Use it for things that already happened. Many verbs add -ed, but some are irregular.","I walked. go becomes went, eat becomes ate, see becomes saw."],
      ["Future tense","Use it for things that will happen. Use 'will' or 'going to'.","I will walk. They are going to visit Gran."]],
   A:{t:"sort", p:"Sort each sentence by its tense.", b:["Past","Present","Future"], d:[["She danced.",0],["We will swim.",2],["He eats.",1],["They ran.",0],["I am going to read.",2],["The baby sleeps.",1],["I will help.",2],["We saw a rhino.",0]]},
   Q:[["What is the past tense of 'eat'?",["ate","eated","eaten","eats"],"Eat is irregular: today I eat, yesterday I ate."],
      ["Which sentence is in the future tense?",["We will visit the zoo.","We visited the zoo.","We visit the zoo.","We are at the zoo."],"'Will' shows it has not happened yet."],
      ["Change to the past tense: 'I run fast.'",["I ran fast.","I runned fast.","I will run fast.","I running fast."],"Run is irregular: run becomes ran."],
      ["'She sings in the choir' is in the...",["present tense","past tense","future tense","no tense"],"It is something she does now or often."]]},
 { id:"e5d", t:"Reading for meaning", s:"Main idea, fact and opinion, sequence words",
   L:[["The main idea","The main idea is what the whole text is mostly about. Details support it with extra information.","A text about how bees make honey: the main idea is honey-making, not one bee's name."],
      ["Fact or opinion?","A fact can be checked and proven. An opinion is what someone thinks or feels.","Fact: the Orange River is the longest river in South Africa. Opinion: rugby is the best sport."],
      ["Sequence and clues","Signal words show order: first, then, next, finally. Use the words around an unknown word (context clues) to work out its meaning.","'The parched soil cracked because it hadn't rained.' Parched must mean very dry."]],
   A:{t:"sort", p:"Is each statement a fact or an opinion?", b:["Fact","Opinion"], d:[["South Africa has nine provinces.",0],["Maths is the most fun subject.",1],["Water freezes at 0 °C.",0],["Cats are better than dogs.",1],["Nelson Mandela became president in 1994.",0],["Winter is the nicest season.",1]]},
   Q:[["Which is an opinion?",["Chocolate is the best food.","Cape Town is in the Western Cape.","A week has seven days.","Lions are mammals."],"'Best' is what someone feels. It cannot be proven."],
      ["Which signal word usually shows the LAST step?",["finally","first","next","then"],"Finally tells you it is the end."],
      ["The main idea of a text is...",["what the whole text is mostly about","the first word","the title's colour","one small detail"],"Details support the main idea."],
      ["'The parched soil cracked because it hadn't rained for months.' Parched means...",["very dry","very wet","very cold","very soft"],"No rain for months, so the soil is very dry."]]}
]},
{ id:"sci", name:"Natural Sciences & Technology", topics:[
 { id:"n5a", t:"Food chains", s:"Producers, consumers and who eats whom",
   L:[["Energy starts with the Sun","Plants are producers. They use sunlight to make their own food.","Grass, trees and aloes are producers."],
      ["Consumers eat other living things","Herbivores eat plants. Carnivores eat meat. Omnivores eat both.","Zebra: herbivore. Lion: carnivore. Baboon: omnivore."],
      ["Reading a food chain","Arrows point from the food to the eater, showing where energy goes. Decomposers like fungi and bacteria break down dead things.","grass → zebra → lion"]],
   A:{t:"order", p:"Build the food chain. Start with the producer.", d:["Grass","Grasshopper","Frog","Snake","Eagle"]},
   Q:[["In a food chain, which way do the arrows point?",["From the food to the eater","From the eater to the food","Up to the Sun","Any way you like"],"The arrow shows energy moving into the animal that eats."],
      ["A zebra eats only grass. It is a...",["herbivore","carnivore","producer","decomposer"],"Herbivores eat plants."],
      ["What is the producer in: grass → impala → leopard?",["grass","impala","leopard","the Sun"],"The Sun gives energy, but the grass makes the food."],
      ["Which living thing is a decomposer?",["mushroom","lion","aloe","sparrow"],"Fungi like mushrooms break down dead material."]]},
 { id:"n5b", t:"Animal skeletons", s:"Vertebrates, invertebrates and how we move",
   L:[["What skeletons do","Skeletons support the body, protect soft organs and help animals move.","Your skull protects your brain. Your ribs protect your heart and lungs."],
      ["Backbone or not?","Vertebrates have a backbone: fish, amphibians, reptiles, birds and mammals. Invertebrates have no backbone.","Cat and frog: vertebrates. Snail and spider: invertebrates."],
      ["Outside skeletons","Some invertebrates have a hard skeleton on the outside, called an exoskeleton. Muscles move bones by pulling on them.","Beetles, crabs and scorpions have exoskeletons."]],
   A:{t:"sort", p:"Sort the animals: backbone or no backbone?", b:["Vertebrate","Invertebrate"], d:[["cat",0],["snail",1],["frog",0],["spider",1],["eagle",0],["earthworm",1],["shark",0],["butterfly",1]]},
   Q:[["What protects your heart and lungs?",["your rib cage","your skull","your thigh bone","your kneecap"],"The ribs form a cage around the chest."],
      ["A beetle's skeleton is on the outside. It is called...",["an exoskeleton","an endoskeleton","a backbone","a skull"],"Exo means outside."],
      ["Which animal is a vertebrate?",["snake","snail","spider","jellyfish"],"Snakes have a long backbone made of many vertebrae."],
      ["What do muscles do to bones to make you move?",["pull them","melt them","make them longer","glue them"],"Muscles can only pull, so they work in pairs."]]},
 { id:"n5c", t:"Metals & non-metals", s:"Properties of materials and choosing the right one",
   L:[["Metals","Metals are usually shiny, strong and can be bent into shape. They conduct heat and electricity well.","Iron, copper, aluminium, gold. South Africa mines gold and platinum."],
      ["Non-metals","Materials like wood, plastic, glass and rubber are usually dull and do not conduct heat or electricity well. They are insulators.","Rubber covers electric wires to keep you safe."],
      ["Choosing materials","We pick materials for their properties.","A pot is metal so heat gets to the food. Its handle is plastic so you don't burn your hand."]],
   A:{t:"sort", p:"Sort the objects by what they are made of.", b:["Metal","Non-metal"], d:[["copper wire",0],["plastic ruler",1],["steel spoon",0],["wooden spoon",1],["aluminium can",0],["rubber band",1],["gold ring",0],["glass jar",1]]},
   Q:[["Why do pots have plastic handles?",["Plastic does not conduct heat well","Plastic is shiny","Plastic is a metal","Plastic conducts heat"],"Plastic is an insulator, so the handle stays cool."],
      ["Which material conducts electricity?",["copper","rubber","wood","glass"],"Copper is a metal used in electric wires."],
      ["Which is a property of most metals?",["shiny","see-through","soft like cotton","dissolves in water"],"Polished metal is shiny."],
      ["Which of these is mined in South Africa and is a metal?",["gold","coal","diamonds","granite"],"Coal, diamonds and granite are mined too, but they are not metals."]]},
 { id:"n5d", t:"Earth, rocks & fossils", s:"Earth's layers, sedimentary rock and fossils",
   L:[["Earth's layers","Earth has a thin crust, a hot mantle, a liquid outer core and a solid inner core.","We live on the crust. It is thinner compared to Earth than an apple's skin is to the apple."],
      ["Sedimentary rock","Sand, mud and bits of shell settle in layers. Over millions of years the layers are pressed into rock.","The colourful sandstone cliffs near Clarens in the Free State are sedimentary rock."],
      ["Fossils","Fossils are remains or traces of plants and animals from long ago, usually found in sedimentary rock.","The Cradle of Humankind in Gauteng has famous fossils of early humans. The Karoo is full of ancient reptile fossils."]],
   A:{t:"order", p:"Put Earth's layers in order, from the outside to the centre.", d:["Crust","Mantle","Outer core","Inner core"]},
   Q:[["Which layer of Earth do we live on?",["the crust","the mantle","the outer core","the inner core"],"The crust is the outer layer."],
      ["Fossils are usually found in which type of rock?",["sedimentary","igneous","metamorphic","lava"],"Layers of sediment bury and protect the remains."],
      ["Sedimentary rock forms when...",["layers of sediment are pressed together over a long time","lava cools quickly","ice melts","plants grow on stones"],"It takes millions of years."],
      ["The Cradle of Humankind is famous for...",["fossils of early humans","gold mines","the biggest dam","penguins"],"It is a World Heritage Site in Gauteng."]]}
]},
{ id:"ss", name:"Social Sciences", topics:[
 { id:"s5a", t:"Map skills", s:"Compass directions, grid references, scale and keys",
   L:[["Compass directions","The four main directions are north, east, south and west. In between are NE, SE, SW and NW.","Remember: Never Eat Soggy Worms (N, E, S, W going clockwise)."],
      ["Grid references","A grid helps you find places. Give the letter across first, then the number.","B3 means column B, row 3."],
      ["Key and scale","The key (legend) tells you what symbols mean. The scale tells you real distances.","Scale 1 cm = 10 km. Two towns 3 cm apart are 30 km apart."]],
   A:{t:"match", p:"Match each map part to its job.", d:[["Key","Explains the symbols"],["Scale","Shows real distance"],["Compass rose","Shows directions"],["Grid","Lines to help you find a block"],["Title","Tells what the map is about"]]},
   Q:[["Which direction is opposite north-east?",["south-west","south-east","north-west","west"],"Swap north for south and east for west."],
      ["On a map, 1 cm = 5 km. Two towns are 4 cm apart. How far apart are they really?",["20 km","9 km","4 km","1 km"],"4 × 5 = 20 km."],
      ["Where do you find what map symbols mean?",["in the key","in the scale","in the title","on the compass"],"The key unlocks the symbols."],
      ["You face north and turn right. Which way do you face now?",["east","west","south","north-west"],"Clockwise from north is east."]]},
 { id:"s5b", t:"South Africa's land & weather", s:"Landforms, rivers, weather and climate",
   L:[["Landforms","South Africa has mountains, a high flat plateau (the Highveld), plains, valleys and a long coastline. The Great Escarpment separates the high inland from the coast.","The Drakensberg is our highest mountain range."],
      ["Rivers","Rivers flow from high ground down to the sea. The Orange is the longest river in South Africa. The Limpopo forms part of our northern border.","The Vaal River joins the Orange River."],
      ["Weather and climate","Weather is what happens on one day. Climate is the usual weather over many years. Most of the country gets summer rain, but the Western Cape gets winter rain.","Today it is sunny (weather). Joburg has hot, wet summers (climate)."]],
   A:{t:"match", p:"Match each place or word to its description.", d:[["Drakensberg","Highest mountain range in SA"],["Orange River","Longest river in SA"],["Highveld","High, flat plateau"],["Karoo","Dry, semi-desert area"],["Climate","Usual weather over many years"]]},
   Q:[["Which part of South Africa gets most of its rain in winter?",["Western Cape","Gauteng","Limpopo","Free State"],"Cape Town has wet winters and dry summers."],
      ["Weather is...",["the conditions on one particular day","the average over 30 years","only rain","the shape of the land"],"Climate is the long-term pattern."],
      ["A large, high, flat area of land is called a...",["plateau","valley","coast","delta"],"The Highveld is a plateau."],
      ["Which river forms part of our border with Botswana and Zimbabwe?",["Limpopo","Orange","Tugela","Breede"],"The Limpopo flows along the north."]]},
 { id:"s5c", t:"San & Khoikhoi", s:"Hunter-gatherers and herders of southern Africa",
   L:[["Hunter-gatherers","The San hunted animals with bows and poisoned arrows and gathered plants, roots, berries and honey. They moved with the seasons to find food and water.","Women gathered most of the food: it was the most reliable supply."],
      ["Rock art","The San painted and engraved on rocks. The paintings show animals, people and their spiritual beliefs.","You can see San rock art in the Drakensberg and the Cederberg."],
      ["The Khoikhoi herders","About 2 000 years ago, the Khoikhoi began herding cattle and fat-tailed sheep. They moved to find grazing and lived in huts made of reed mats that could be packed up.","For the Khoikhoi, more cattle meant more wealth."]],
   A:{t:"sort", p:"Who did this: the San or the Khoikhoi?", b:["San (hunter-gatherers)","Khoikhoi (herders)"], d:[["Hunted with bows and poisoned arrows",0],["Kept cattle and sheep",1],["Gathered berries and roots",0],["Moved to find grazing for animals",1],["Measured wealth in animals",1],["Made rock paintings of eland",0]]},
   Q:[["The San got their food mainly by...",["hunting and gathering","farming maize","trading gold","buying it at markets"],"They lived off the land."],
      ["What animals did the Khoikhoi keep?",["cattle and sheep","pigs and chickens","camels","horses"],"They were herders."],
      ["San rock paintings mostly show...",["animals, people and beliefs","cars and roads","maps of Europe","written words"],"The eland appears often."],
      ["Why did hunter-gatherers move from place to place?",["To follow food and water through the seasons","Because they were lost","To build cities","To go to school"],"Food and water changed with the seasons."]]},
 { id:"s5d", t:"Ancient Egypt", s:"The Nile, pharaohs, pyramids and hieroglyphs",
   L:[["Gift of the Nile","Ancient Egypt grew along the Nile River in north-east Africa. Every year the river flooded and left rich, black soil for farming.","Farmers grew wheat and flax."],
      ["Pharaohs and pyramids","Pharaohs were the kings of Egypt. Some were buried in huge pyramids, like the ones at Giza.","The Great Pyramid is more than 4 500 years old."],
      ["Writing and beliefs","Egyptians wrote in hieroglyphs (picture writing) on papyrus, a paper made from reeds. They made mummies because they believed in life after death.","They are one of the oldest writing systems in the world."]],
   A:{t:"match", p:"Match each word to its meaning.", d:[["Pharaoh","King of Egypt"],["Hieroglyphs","Picture writing"],["Papyrus","Paper made from reeds"],["Pyramid","Tomb for a pharaoh"],["Nile","River that flooded every year"]]},
   Q:[["Why was the Nile so important?",["Its floods left rich soil for farming","It was made of gold","It froze in winter","It had no fish"],"Egypt is mostly desert. The Nile made farming possible."],
      ["Egypt is in which part of Africa?",["north-east","south","west","centre"],"It borders the Mediterranean and Red Seas."],
      ["Why did Egyptians make mummies?",["To preserve the body for the afterlife","To scare visitors","To use as statues","To make paper"],"They believed the body was needed after death."],
      ["Hieroglyphs are...",["a form of picture writing","a type of pyramid","an Egyptian food","a river boat"],"Each picture stands for a sound or idea."]]}
]},
{ id:"ls", name:"Life Skills", topics:[
 { id:"l5a", t:"Healthy eating", s:"Food groups and a balanced plate",
   L:[["Food groups","Starches give energy (pap, bread, rice). Proteins build your body (beans, eggs, fish, chicken). Fruit and vegetables give vitamins. Dairy gives calcium (milk, maas).","A good breakfast: maltabella or oats, milk and a banana."],
      ["A balanced plate","Fill about half your plate with vegetables and fruit, a quarter with starch and a quarter with protein. Drink clean water.","Pap, chakalaka and beans make a balanced meal."],
      ["Smart habits","Eat fewer sugary, salty and fried foods. Wash your hands before eating.","Swap fizzy cooldrink for water."]],
   A:{t:"sort", p:"Sort the foods into groups.", b:["Mostly protein","Mostly starch","Fruit & veg"], d:[["eggs",0],["pap",1],["spinach",2],["beans",0],["bread",1],["banana",2],["chicken",0],["rice",1]]},
   Q:[["Which food group helps your body grow and repair?",["protein","fats","sugar","starch"],"Proteins are the body's building blocks."],
      ["Maas and milk give you lots of...",["calcium for strong bones","caffeine","salt","sugar only"],"Dairy is rich in calcium."],
      ["Which is the best drink with a meal?",["water","energy drink","fizzy cooldrink","sweet syrup"],"Water has no sugar and keeps you hydrated."],
      ["About half of a balanced plate should be...",["vegetables and fruit","sweets","chips","meat"],"Vegetables and fruit give vitamins and fibre."]]},
 { id:"l5b", t:"Rights & responsibilities", s:"Children's rights and the duties that go with them",
   L:[["Your rights","The Constitution protects children: the right to a name, family care, food, shelter, health care, protection from harm and basic education.","These rights are written in South Africa's Bill of Rights."],
      ["Rights come with responsibilities","For every right you have, you have a responsibility.","Right to learn: come to school and do your best. Right to be safe: don't bully others."],
      ["Ubuntu","Ubuntu means 'I am because we are'. We respect other people's rights as much as our own.","Helping a classmate who is struggling is ubuntu."]],
   A:{t:"match", p:"Match each right to a responsibility.", d:[["Right to education","Attend school and try your best"],["Right to be safe","Treat others safely; no bullying"],["Right to a clean environment","Don't litter"],["Right to be heard","Listen when others speak"],["Right to health care","Look after your body"]]},
   Q:[["If you have the right to learn, your responsibility is to...",["attend school and work hard","stay home","copy homework","disturb the class"],"Rights and responsibilities go together."],
      ["Ubuntu means...",["I am because we are","Everyone for themselves","Win at all costs","Rules don't matter"],"We are connected to each other."],
      ["Where are children's rights written in South African law?",["in the Constitution (Bill of Rights)","in the dictionary","in a newspaper","in a recipe book"],"The Constitution is the highest law."],
      ["Which of these is a responsibility?",["keeping your classroom clean","getting pocket money","watching TV","having a birthday"],"A responsibility is something you should do."]]},
 { id:"l5c", t:"Feelings & bullying", s:"Naming feelings, staying calm and getting help",
   L:[["All feelings are OK","Happy, sad, angry, scared: everyone feels them. Naming a feeling helps you handle it.","\"I feel frustrated because I lost the game.\""],
      ["Calm-down tools","Take slow deep breaths, count to 10, walk away for a moment, or talk to someone.","Breathe in for 4 counts, out for 4 counts. Repeat."],
      ["Bullying","Bullying is hurting someone on purpose, again and again. It can be hitting, name-calling or messages online. It is never your fault. Tell a trusted adult. Childline South Africa is free on 116.","If you see bullying, stand with the person and report it."]],
   A:{t:"sort", p:"Is each choice helpful or unhelpful?", b:["Helpful choice","Unhelpful choice"], d:[["Tell a teacher you trust",0],["Hit back",1],["Take slow deep breaths",0],["Keep it a secret forever",1],["Stand with someone who is being teased",0],["Post mean comments online",1]]},
   Q:[["Someone teases you every day. What should you do first?",["Tell a trusted adult","Fight them","Skip school","Tease them back"],"Adults can help stop it."],
      ["Cyberbullying happens...",["online or on phones","only on the playground","only to adults","never in South Africa"],"Mean messages and posts count as bullying."],
      ["What can help you calm down when you are angry?",["slow deep breaths","shouting","breaking things","running into the road"],"Breathing slows your heart rate."],
      ["What is Childline South Africa's free number?",["116","10111","911","123"],"10111 is the police emergency number."]]}
]}
],
6: [
{ id:"math", name:"Mathematics", topics:[
 { id:"m6a", t:"Factors, multiples & primes", s:"Nine-digit numbers, factors, multiples and prime numbers",
   L:[["Really big numbers","Grade 6 numbers go up to 9 digits. Group the digits in threes from the right.","405 316 278: the 4 is worth 400 000 000 (four hundred million)."],
      ["Factors and multiples","Factors divide into a number exactly. Multiples are the answers in a number's times table.","Factors of 12: 1, 2, 3, 4, 6, 12. Multiples of 4: 4, 8, 12, 16 ..."],
      ["Prime numbers","A prime number has exactly two factors: 1 and itself. 1 is not prime. Numbers with more than two factors are composite.","Primes: 2, 3, 5, 7, 11, 13, 17, 19 ... 2 is the only even prime."]],
   A:{t:"sort", p:"Prime or composite?", b:["Prime","Composite"], d:[["7",0],["9",1],["13",0],["15",1],["2",0],["21",1],["29",0],["27",1]]},
   Q:[["Which number is prime?",["11","9","15","21"],"11 can only be divided by 1 and 11."],
      ["What is the HCF (highest common factor) of 12 and 18?",["6","3","2","36"],"6 is the biggest number that divides both."],
      ["What is the LCM (lowest common multiple) of 4 and 6?",["12","24","2","10"],"12 is the first number in both times tables."],
      ["In 405 316 278, what is the value of the 4?",["400 000 000","40 000 000","4 000 000","400 000"],"It is in the hundred millions column."]]},
 { id:"m6b", t:"Working with fractions", s:"Simplifying, adding, subtracting and mixed numbers",
   L:[["Simplify","Divide the top and the bottom by the same number until you can't any more.","8/12: divide both by 4 to get 2/3."],
      ["Different denominators","To add or subtract, first make the bottoms the same.","1/2 + 1/4 = 2/4 + 1/4 = 3/4. And 2/3 − 1/6 = 4/6 − 1/6 = 3/6 = 1/2."],
      ["Mixed numbers","An improper fraction has a top bigger than its bottom. Change it to a mixed number by dividing.","7/4 = 1 3/4 (4 goes into 7 once, 3 left). 2 1/3 = 7/3."]],
   A:{t:"fill", p:"Type fractions like 3/4 and mixed numbers like 2 1/4.", d:[["Simplify 6/8","3/4",true],["1/3 + 1/6 = ?","1/2"],["3/4 − 1/2 = ?","1/4"],["Write 9/4 as a mixed number","2 1/4",true],["Write 1 2/5 as an improper fraction","7/5",true]]},
   Q:[["Simplify 10/15.",["2/3","1/3","5/3","10/5"],"Divide top and bottom by 5."],
      ["1/2 + 3/8 = ?",["7/8","4/10","4/8","1"],"1/2 = 4/8, and 4/8 + 3/8 = 7/8."],
      ["What is 11/3 as a mixed number?",["3 2/3","3 1/3","2 2/3","11 1/3"],"3 goes into 11 three times with 2 left over."],
      ["Thabo ate 1/4 of a cake and Sara ate 1/2. How much is left?",["1/4","3/4","1/2","2/6"],"1/4 + 2/4 = 3/4 eaten, so 1/4 is left."]]},
 { id:"m6c", t:"Decimals & percentages", s:"Tenths, hundredths, money and percent",
   L:[["Decimal comma","In South Africa we write decimals with a comma. The first place after the comma is tenths, the second is hundredths.","0,5 = 5 tenths = 1/2. 0,25 = 25 hundredths = 1/4."],
      ["Comparing decimals","Line up the commas and compare place by place. Adding a zero at the end can help.","0,7 > 0,65 because 0,70 > 0,65."],
      ["Percent means out of 100","50% = 1/2 = 0,5. 25% = 1/4. To find 10%, divide by 10.","10% of R80 = R8, so 20% of R80 = R16."]],
   A:{t:"match", p:"Match the numbers that are equal.", d:[["0,5","50%"],["0,25","1/4"],["0,1","1/10"],["0,75","75%"],["0,2","1/5"]]},
   Q:[["Which decimal is the biggest?",["0,8","0,75","0,09","0,6"],"0,80 is bigger than 0,75, 0,60 and 0,09."],
      ["What is 25% of 40?",["10","25","4","15"],"25% is a quarter, and 40 ÷ 4 = 10."],
      ["R3,45 + R2,30 = ?",["R5,75","R5,57","R6,75","R5,15"],"Add rands and cents: R5 and 75c."],
      ["Write 3/10 as a decimal.",["0,3","3,10","0,03","3,0"],"Three tenths is 0,3."]]},
 { id:"m6d", t:"Angles, perimeter & area", s:"Types of angles and measuring shapes",
   L:[["Types of angles","Angles are measured in degrees (°) with a protractor. Acute: less than 90°. Right: exactly 90°. Obtuse: between 90° and 180°. Straight: 180°. Reflex: between 180° and 360°.","The corner of a book is a right angle."],
      ["Perimeter","Perimeter is the distance all the way around a shape.","A rectangle 6 m by 4 m: 6 + 4 + 6 + 4 = 20 m."],
      ["Area and volume","Area is the space inside a flat shape, in square units. For a rectangle: length × breadth. Volume is the space inside a box: length × breadth × height.","6 m × 4 m = 24 m². A box 3 cm × 2 cm × 4 cm = 24 cm³."]],
   A:{t:"sort", p:"Sort each angle by its type.", b:["Acute","Obtuse","Reflex"], d:[["45°",0],["120°",1],["200°",2],["89°",0],["179°",1],["300°",2],["10°",0],["95°",1]]},
   Q:[["An angle of exactly 90° is called...",["a right angle","an acute angle","an obtuse angle","a reflex angle"],"Look for the little square in the corner."],
      ["What is the perimeter of a square with sides of 7 cm?",["28 cm","49 cm","14 cm","21 cm"],"4 sides × 7 cm = 28 cm."],
      ["What is the area of a rectangle 8 m long and 5 m wide?",["40 m²","26 m²","13 m²","45 m²"],"8 × 5 = 40 square metres."],
      ["Which angle is obtuse?",["135°","35°","90°","270°"],"It is between 90° and 180°."]]},
 { id:"m6e", t:"Data handling", s:"Collecting data, mode, median and graphs",
   L:[["Collecting data","Ask questions with a questionnaire, then record answers in a tally table or frequency table.","Survey: 'What is your favourite fruit?'"],
      ["Mode and median","The mode is the value that appears most often. The median is the middle value once the data is in order. If there are two middle values, the median is halfway between them.","3, 5, 6, 8, 8: mode = 8, median = 6."],
      ["Graphs","Bar graphs compare groups. Pie charts show parts of a whole. Always read the title, the axes and the key first.","A pie chart can show how you spend your day."]],
   A:{t:"fill", p:"Find the mode or median.", d:[["Mode of 3, 8, 5, 8, 6","8"],["Median of 3, 8, 5, 8, 6","6"],["Median of 2, 9, 4","4"],["Mode of 1, 3, 3, 3, 5, 5","3"],["Median of 10, 2, 6, 8","7"]]},
   Q:[["Find the mode: 5, 3, 5, 8, 2",["5","3","8","4,6"],"5 appears twice."],
      ["Find the median: 1, 4, 9, 12, 15",["9","4","12","8,2"],"9 is in the middle."],
