G5_MORE.sci = [
{ id:"n5e", T:1, t:"Plants & animals on Earth", s:"Habitats, biodiversity and living together",
  L:[["So many living things","Earth has millions of kinds of plants and animals. This variety is called biodiversity. South Africa has more than 20 000 kinds of plants.","From tiny ants to elephants, from moss to baobabs."],
     ["Habitats","A habitat is the place where a plant or animal lives. It gives food, water, shelter and space.","A desert, a forest, a river and a grassland are all habitats."],
     ["Interdependence","Plants and animals depend on each other. Animals eat plants, and some animals help plants by spreading seeds or pollinating flowers.","Sunbirds drink nectar from proteas and carry pollen to other flowers."]],
  A:{t:"match", p:"Match each animal to its habitat.", d:[["Hippo","River"],["Gemsbok","Kalahari desert"],["Penguin","Rocky coast"],["Monkey","Forest"],["Springbok","Dry grassland"]]},
  Q:[["What does a habitat provide?",["food, water, shelter and space","only toys","only sunlight","nothing"],"Everything needed to survive."],
     ["How do bees help plants?",["they carry pollen between flowers","they eat the roots","they block sunlight","they dig up seeds"],"Pollination helps make seeds."],
     ["Biodiversity means...",["the variety of living things","only big animals","the number of rocks","the weather"],"Many different kinds."],
     ["Why do cactuses survive in deserts?",["they store water in thick stems","they need lots of rain","they live underwater","they eat insects"],"An adaptation to dry places."]],
  W:["Explain how a protea and a sugarbird depend on each other",["The sugarbird drinks sweet nectar from the protea: the plant gives the bird food.","While feeding, pollen sticks to the bird's head.","The bird carries pollen to the next protea, helping it make seeds.","So both benefit."],"The plant feeds the bird; the bird pollinates the plant"],
  X:"Habitat is not the same as 'home' like a nest. The habitat is the whole area: the nest is just shelter within it.",
  C:["Which is a habitat?",["a wetland","a nest box only","a zoo ticket","a tree leaf"],"A whole area where things live."],
  H:{L:[["Adaptations","Adaptations are features that help living things survive in their habitat.","A meerkat's dark eye patches cut glare in the bright Kalahari sun."],
        ["Losing habitats","When habitats are destroyed by building, pollution or cutting trees, plants and animals lose their homes and food.","Protecting wetlands protects frogs, birds and clean water."]],
    Q:[["An adaptation is...",["a feature that helps a living thing survive","a type of habitat","a kind of food","a zoo"],"Like thick fur or long legs."],
       ["What harms habitats?",["pollution and cutting down forests","planting trees","protecting rivers","picking up litter"],"Destruction of homes."],
       ["Why does a polar bear have thick fur?",["to keep warm in the cold","to swim faster in hot water","to hide in the desert","to climb trees"],"Adapted to cold habitats."],
       ["A wetland is home to...",["frogs and water birds","camels","lions only","penguins only"],"Wet habitats."]]}},
{ id:"n5f", T:1, t:"Life cycles", s:"How plants and animals grow and reproduce",
  L:[["What is a life cycle?","A life cycle shows the stages a living thing goes through from birth, to growing up, to making new young, and eventually dying.","Every living thing has a life cycle."],
     ["Animal life cycles","Some young look like their parents (a calf and a cow). Others change completely. This big change is called metamorphosis.","Butterfly: egg → caterpillar (larva) → pupa → adult butterfly."],
     ["Plant life cycles","A seed germinates (sprouts), grows into a plant, makes flowers, the flowers are pollinated and make seeds, and the cycle starts again.","A bean seed can sprout in a few days on damp cotton wool."]],
  A:{t:"order", p:"Put the stages of a frog's life cycle in order.", d:["Eggs (frogspawn)","Tadpole","Tadpole with legs","Froglet","Adult frog"]},
  Q:[["What is the change from caterpillar to butterfly called?",["metamorphosis","germination","pollination","hibernation"],"A complete change of body."],
     ["Which stage comes after the egg in a butterfly's life cycle?",["caterpillar (larva)","adult","pupa","tadpole"],"The larva hatches."],
     ["When a seed starts to grow, it...",["germinates","pollinates","hibernates","evaporates"],"Sprouts."],
     ["Which young animal looks like a small version of its parent?",["a puppy","a tadpole","a caterpillar","a maggot"],"No metamorphosis."]],
  W:["Describe a bean plant's life cycle",["A bean seed is planted and germinates: a root grows down and a shoot grows up.","It grows into a young plant (seedling) and then an adult plant.","The plant makes flowers, which are pollinated.","The flowers turn into pods with new seeds, and the cycle repeats."],"seed → seedling → adult plant → flowers → seeds"],
  X:"A cycle has no real start or end. The adult makes eggs or seeds, so the cycle goes around and around.",
  C:["What does a tadpole grow into?",["a frog","a fish","a butterfly","a lizard"],"Frog metamorphosis."],
  H:{L:[["Draw it as a circle","Draw a circle and put each stage around it with arrows pointing to the next. The last stage points back to the first.","Egg → larva → pupa → adult → (back to) egg."],
        ["What a seed needs","Seeds need water, warmth and air to germinate. They don't need light until leaves grow.","Seeds kept dry in a packet don't sprout."]],
    Q:[["What do seeds need to germinate?",["water, warmth and air","only darkness","salt","cold"],"The three essentials."],
       ["The pupa stage happens in the life cycle of a...",["butterfly","dog","chicken","cow"],"Inside a cocoon or chrysalis."],
       ["Why is it called a life CYCLE?",["it repeats in a circle","it's on a bicycle","it only happens once","it is very short"],"Adults make new young."],
       ["Tadpoles breathe with gills and live...",["in water","in trees","underground","in deserts"],"They're like little fish."]]}},
{ id:"n5g", T:1, t:"Skeletons as structures", s:"Frame and shell structures in nature and technology",
  L:[["What is a structure?","A structure is something that supports, protects or holds a shape. Skeletons are natural structures.","Your skeleton holds you up and protects your organs."],
     ["Frame and shell structures","A frame structure is made of parts joined together, like your skeleton or a pylon. A shell structure has a hard outer covering, like a snail shell, an egg or a tortoise shell.","Frame: a bridge, a ladder. Shell: a car body, a soda can."],
     ["Making structures strong","Triangles make frames strong because they don't change shape when pushed. Engineers use triangles in roofs, cranes and bridges.","Look for triangles in electricity pylons."]],
  A:{t:"sort", p:"Frame structure or shell structure?", b:["Frame structure","Shell structure"], d:[["Electricity pylon",0],["Egg",1],["Human skeleton",0],["Tortoise shell",1],["Roof trusses",0],["Soda can",1]]},
  Q:[["Which shape makes a frame structure strongest?",["triangle","square","circle","rectangle"],"Triangles hold their shape."],
     ["An egg is an example of a...",["shell structure","frame structure","liquid","machine"],"A hard outer covering."],
     ["What is the job of the skull as a structure?",["to protect the brain","to help us run","to digest food","to make blood only"],"It's a protective shell."],
     ["A spider's web is a...",["frame structure","shell structure","solid block","liquid"],"Joined strands."]],
  W:["Design a strong paper bridge between two books",["Problem: a flat sheet of paper bends under a coin.","Idea: fold the paper into a zigzag (concertina) or roll it into tubes.","Test: the folded paper holds more coins.","Why: the folds make triangle shapes that resist bending."],"Fold it to add triangles and make it stronger"],
  X:"A square frame isn't strong on its own: push a corner and it squashes into a diamond. Add a diagonal to make two triangles.",
  C:["A tortoise is protected by a...",["shell structure","frame structure","fur coat","skeleton only inside"],"Its hard shell."],
  H:{L:[["Test it with straws","Join four straws into a square with pins: it wobbles. Add one diagonal straw: now it's rigid.","That diagonal turns the square into two triangles."],
        ["Endoskeleton vs exoskeleton as structures","Our skeleton is an internal frame (endoskeleton). Insects have an external shell (exoskeleton).","A beetle's hard shell protects it like armour."]],
    Q:[["How do you make a wobbly square frame rigid?",["add a diagonal","remove a side","make it bigger","paint it"],"It forms triangles."],
       ["A beetle's skeleton is a...",["shell structure on the outside","frame inside","liquid","rope"],"Exoskeleton."],
       ["Which uses triangles for strength?",["a crane","a ball","a blanket","a bowl"],"Cranes are frame structures."],
       ["What does a structure do?",["supports or protects","melts","grows food","makes sound only"],"Holds and protects."]]}},
{ id:"n5h", T:2, t:"Uses of metals & rust", s:"Why we use metals and how to stop rust",
  L:[["Metals at work","We choose metals for their properties: strong (steel for bridges), conduct electricity (copper for wires), conduct heat (pots) and shiny (jewellery).","Aluminium is light, so it's used for aeroplanes and cans."],
     ["What is rust?","Iron and steel rust when they are exposed to water and air (oxygen). Rust is reddish-brown and flaky, and it weakens the metal.","An old bicycle left in the rain gets rusty."],
     ["Preventing rust","Keep water and air away from iron: paint it, oil or grease it, or coat it with another metal (galvanising with zinc).","Gates are painted and roofs are galvanised."]],
  A:{t:"match", p:"Match each metal to how we use it.", d:[["Copper","Electric wires"],["Steel","Bridges and buildings"],["Aluminium","Cans and aeroplanes"],["Gold","Jewellery"],["Zinc","Coating iron to stop rust"]]},
  Q:[["What two things cause iron to rust?",["water and air","sun and sand","fire and ice","salt and sugar"],"Oxygen and moisture."],
     ["How does paint stop rust?",["it keeps water and air away from the metal","it makes the metal hotter","it makes the metal magnetic","it adds more water"],"A barrier."],
     ["Why is copper used for electric wires?",["it conducts electricity well","it is magnetic","it rusts quickly","it is cheap plastic"],"Good conductor."],
     ["Which metal does NOT rust?",["gold","iron","steel","an iron nail"],"Only iron and steel rust."]],
  W:["Design an experiment: does salt water make nails rust faster?",["Take three nails and put them in three jars: tap water, salt water, and a dry jar.","Keep everything else the same (same nails, same place).","Check them every day for a week and record what you see.","Compare: the nail in salt water rusts most."],"Salt water speeds up rusting"],
  X:"Only iron and steel rust. Other metals like aluminium, copper and gold may go dull or change colour, but that isn't called rust.",
  C:["Rust is mostly seen on...",["iron and steel","gold","plastic","glass"],"Iron-containing metals."],
  H:{L:[["Why coastal towns rust faster","Sea air is salty and damp, so iron rusts faster at the coast than inland.","Cars in Durban and Port Elizabeth need extra rust protection."],
        ["Galvanising","Coating iron with zinc protects it. Corrugated iron roofs are galvanised so they last for years.","The zinc layer stops air and water reaching the iron."]],
    Q:[["Why do things rust faster at the coast?",["the air is salty and damp","it's colder","there's no air","it's sunny"],"Salt speeds rusting."],
       ["Galvanising coats iron with...",["zinc","paint only","water","plastic"],"A zinc layer."],
       ["Which protects a bicycle chain from rust?",["oil","water","salt","sand"],"Oil keeps water away."],
       ["Why is aluminium used for aeroplanes?",["it is light and strong","it is heavy","it rusts","it is see-through"],"Light metal."]]}},
{ id:"n5i", T:2, t:"Processing materials", s:"Changing raw materials into useful products",
  L:[["Raw and processed","Raw materials come from nature, like wood, clay, cotton and sand. Processing changes them into new materials with useful properties.","Clay is processed into bricks. Sand is processed into glass."],
     ["Ways to process","We process materials by mixing, heating, cooling, drying, cutting, weaving or combining them.","Mixing cement, sand, stones and water makes concrete."],
     ["Better properties","Processed materials are often stronger, waterproof or longer lasting than the raw material.","Wet clay is soft, but fired (heated) clay bricks are hard and strong."]],
  A:{t:"match", p:"Match each raw material to what it's processed into.", d:[["Clay","Bricks"],["Sand","Glass"],["Cotton","Fabric for clothes"],["Wood","Paper"],["Milk","Cheese"]]},
  Q:[["Which is a raw material?",["clay","a brick","glass","paper"],"It comes straight from nature."],
     ["What process turns soft clay into hard bricks?",["heating (firing)","freezing","stirring in water","painting"],"Heat hardens clay."],
     ["Concrete is made by mixing cement, sand, stones and...",["water","oil","sugar","milk"],"Water makes it set."],
     ["Why do we process materials?",["to give them more useful properties","to make them weaker","to waste them","to make them disappear"],"Better for the job."]],
  W:["Explain how papier-mâché makes a strong bowl",["Tear newspaper into strips (a raw, weak material).","Dip the strips in a flour-and-water paste and layer them over a balloon.","Let it dry: the paste glues the layers together.","Pop the balloon: the dry layers form a hard, light bowl."],"Layering and drying combine weak materials into a strong one"],
  X:"Processing doesn't always mean a factory. Cooking, weaving baskets and making mud bricks at home are processing too.",
  C:["Glass is made by heating...",["sand","wood","cotton","clay"],"Very high heat melts sand."],
  H:{L:[["Traditional processing","People in southern Africa have processed materials for centuries: weaving grass into baskets and mats, and drying mud bricks in the sun.","Zulu baskets are woven so tightly they can hold water."],
        ["Testing properties","After processing, test the new material: is it stronger, waterproof, flexible? Compare it with the raw material.","Woven grass is stronger than single blades of grass."]],
    Q:[["Weaving grass into a mat is...",["processing a material","a raw material","a fossil","a chemical"],"Changing it into something useful."],
       ["Why are mud bricks dried in the sun?",["to make them hard","to make them soft","to keep them wet","to colour them"],"Drying hardens them."],
       ["Paper is processed from...",["wood","metal","sand","plastic"],"Wood pulp."],
       ["Which is a processed material?",["cheese","milk","sand","clay"],"Milk is processed into cheese."]]}},
{ id:"n5j", T:3, t:"Stored energy in fuels", s:"Fuels, burning and fire safety",
  L:[["What is a fuel?","A fuel is a material that stores energy. When we burn fuels, the stored energy is released as heat and light.","Wood, coal, paraffin, gas and candle wax are fuels."],
     ["Where the energy comes from","Food is fuel for our bodies. Plants store energy from the sun, and fossil fuels like coal were formed from plants that lived millions of years ago.","When you eat pap, your body uses its stored energy."],
     ["Burning needs three things","Fire needs fuel, heat and oxygen (air). Take away one and the fire goes out. This is the fire triangle.","Covering a pot fire with a lid cuts off oxygen."]],
  A:{t:"sort", p:"Is it a fuel or not a fuel?", b:["Fuel","Not a fuel"], d:[["Coal",0],["Water",1],["Paraffin",0],["Sand",1],["Firewood",0],["Glass",1],["Candle wax",0],["Iron nail",1]]},
  Q:[["What does a fuel store?",["energy","water","sound","air"],"Released when burned."],
     ["What are the three parts of the fire triangle?",["fuel, heat and oxygen","water, sand and wind","wood, rock and ice","light, sound and colour"],"All three are needed."],
     ["How does a fire blanket put out a fire?",["it cuts off the oxygen","it adds fuel","it adds heat","it makes wind"],"No air, no fire."],
     ["Coal formed from...",["plants that lived millions of years ago","melted rocks","sea water","clouds"],"A fossil fuel."]],
  W:["A pot of oil catches fire on the stove. What should you do?",["Do NOT throw water on it: it makes burning oil splash and spread.","Switch off the stove if it's safe to do so (removes heat).","Cover the pot with a lid or damp cloth (removes oxygen).","Get out and call for help: 10177 or 112 from a cellphone."],"Turn off the heat and cover the pot. Never use water."],
  X:"Never throw water on burning oil or an electrical fire. Water spreads oil fires and conducts electricity.",
  C:["Which of these is NOT a fuel?",["water","gas","wood","coal"],"Water doesn't burn."],
  H:{L:[["Fuels in South African homes","Many homes use electricity, gas, paraffin or wood for cooking and heating. Each must be used safely and with good airflow.","Paraffin stoves should never be left burning while you sleep."],
        ["Fire safety plan","Know two ways out of your home, never play with matches, and if your clothes catch fire: stop, drop and roll.","Stop, drop and roll smothers the flames."]],
    Q:[["If your clothes catch fire, you should...",["stop, drop and roll","run fast","jump in the air","fan the flames"],"Smother the flames."],
       ["Why must a room have airflow when burning fuel indoors?",["burning makes harmful smoke and gases","to keep it cold","to save fuel","it doesn't matter"],"Smoke can poison."],
       ["Food is fuel for...",["our bodies","cars","fires","lamps"],"Energy to live."],
       ["Taking away the heat from a fire will...",["put it out","make it bigger","add oxygen","add fuel"],"Break the triangle."]]}},
{ id:"n5k", T:3, t:"Energy & electricity", s:"Cells, batteries, mains power and safety",
  L:[["Cells and batteries","Cells store chemical energy and change it into electrical energy. A battery is two or more cells joined together.","Torches, remotes and toys use cells."],
     ["Mains electricity","Mains electricity comes from power stations through cables to our homes. In South Africa most of it is made by burning coal.","Plugs and wall sockets use mains electricity."],
     ["Using it safely and wisely","Mains electricity is very dangerous. Never touch sockets with wet hands or poke things into them. Save energy by switching off lights.","Stay far away from fallen power lines and never climb pylons."]],
  A:{t:"sort", p:"Does it usually run on a cell (battery) or mains electricity?", b:["Cell or battery","Mains electricity"], d:[["Torch",0],["Fridge",1],["TV remote",0],["Washing machine",1],["Wristwatch",0],["Kettle",1]]},
  Q:[["What kind of energy is stored in a cell?",["chemical energy","sound energy","wind energy","heat energy only"],"Changed into electrical energy."],
     ["Where does most of South Africa's mains electricity come from?",["coal-fired power stations","batteries","candles","the moon"],"Burning coal."],
     ["Which is safe?",["switching off a plug before unplugging","touching a socket with wet hands","climbing a pylon","using a damaged cord"],"Safety first."],
     ["A battery is...",["two or more cells joined together","a light bulb","a type of wire","a switch"],"Several cells."]],
  W:["Trace the energy from a coal power station to a light in your home",["Coal stores chemical energy.","Burning coal makes heat, which boils water into steam.","Steam turns turbines that drive generators, making electrical energy.","Cables carry electricity to your home, where the bulb changes it into light and heat."],"Chemical → heat → movement → electrical → light"],
  X:"Cells and mains are not the same. A small cell is safe to handle, but mains electricity can kill. Never experiment with plugs or sockets.",
  C:["Which device uses a cell?",["a torch","a stove","an electric geyser","a fridge"],"Portable devices use cells."],
  H:{L:[["Energy changes","Electricity is useful because it changes into other forms: light (bulb), heat (kettle), sound (radio) and movement (fan).","A fan changes electrical energy into movement."],
        ["Saving electricity","Saving electricity saves money and means less coal is burnt, which is better for the air.","Switch off lights, unplug chargers and boil only the water you need."]],
    Q:[["A kettle changes electricity mostly into...",["heat","light","sound","movement"],"It heats water."],
       ["Which saves electricity?",["switching off lights you're not using","leaving the TV on","opening the fridge often","leaving chargers plugged in"],"Less waste."],
       ["A fan changes electrical energy into...",["movement","heat only","light","chemical energy"],"The blades spin."],
       ["What should you do if you see a fallen power line?",["stay away and tell an adult","touch it","move it","jump over it"],"It can kill."]]}},
{ id:"n5l", T:3, t:"Energy & movement", s:"Elastic and spring energy in toys",
  L:[["Stored in a stretch","When you stretch an elastic band or squash a spring, energy is stored in it. When you let go, the stored energy changes into movement.","A catapult stores energy in the stretched rubber."],
     ["More stretch, more energy","The more you wind, stretch or squash, the more energy is stored, and the further or faster things move.","Winding a toy car more times makes it go further."],
     ["Toys and machines","Many toys use stored energy: wind-up toys, pull-back cars, jack-in-the-box and elastic-band planes.","A clockwork toy stores energy in a wound-up spring."]],
  A:{t:"sort", p:"What stores the energy in each toy?", b:["Elastic band","Spring"], d:[["Catapult",0],["Jack-in-the-box",1],["Rubber-band paddle boat",0],["Pogo stick",1],["Elastic-band plane",0],["Clockwork wind-up toy",1]]},
  Q:[["What happens to stored energy when you release a stretched elastic band?",["it changes into movement","it disappears","it becomes water","it turns into rust"],"Energy changes form."],
     ["A toy car is wound up 10 times instead of 5. It will most likely go...",["further","less far","backwards only","nowhere"],"More energy stored."],
     ["Where is energy stored in a jack-in-the-box?",["in a squashed spring","in a battery","in the lid paint","in the music"],"The spring pushes it out."],
     ["What kind of energy does a moving car have?",["movement (kinetic) energy","stored energy only","no energy","chemical energy only"],"Energy of motion."]],
  W:["Test how stretch affects how far an elastic band flies",["Stretch the band 5 cm and release it from the same spot; measure how far it lands.","Repeat with 10 cm and 15 cm.","Keep everything else the same (same band, same angle).","Compare: more stretch means more stored energy, so it flies further."],"The further you stretch it, the further it flies"],
  X:"Stretching too far can snap the band. More stretch stores more energy only up to a point.",
  C:["What stores energy in a catapult?",["the stretched rubber","the wooden handle","the stone","the air"],"Elastic energy."],
  H:{L:[["Stored → movement","Think of energy like money in a piggy bank: winding or stretching puts energy in, releasing it spends it as movement.","When the toy stops, its stored energy has been used up."],
        ["Fair tests","In a fair test you change only one thing and keep everything else the same.","Change only the number of winds; keep the same car and same floor."]],
    Q:[["In a fair test, you change...",["only one thing","everything","nothing","the person doing it each time"],"One variable at a time."],
       ["Why does a wind-up toy stop moving?",["its stored energy is used up","it gets tired","it gets cold","it runs out of air"],"Energy converted to movement and heat."],
       ["A pogo stick uses energy stored in a...",["spring","battery","candle","magnet"],"It squashes and pushes back."],
       ["Which stores more energy?",["a band stretched 10 cm","a band stretched 2 cm","a loose band","a cut band"],"More stretch."]]}},
{ id:"n5m", T:3, t:"Systems for moving things", s:"Wheels, axles and making things move easily",
  L:[["Wheels and axles","A wheel and axle is a simple system: the wheel turns on a rod called an axle. Wheels make it easier to move heavy loads.","A wheelbarrow, a bicycle and a car all use wheels and axles."],
     ["Fixed and free axles","An axle can be fixed to the wheel so they turn together, or the wheel can spin freely on the axle.","On a toy car, the wheels can be glued to the axle, and the axle turns in a straw."],
     ["Less friction","Wheels reduce friction (the rubbing force that slows things down). Rolling is easier than dragging.","Dragging a heavy box is hard; putting it on a trolley is easy."]],
  A:{t:"order", p:"Put the steps for building a model car in order (design process).", d:["Investigate: look at how real cars move","Design: draw your car and list materials","Make: build the body and attach the wheels and axles","Evaluate: test the car and see how far it rolls","Improve: fix any problems and test again"]},
  Q:[["What is an axle?",["the rod a wheel turns on","the seat","the handle","the tyre pattern"],"Wheels turn on it."],
     ["Why is it easier to move a load on wheels?",["wheels reduce friction","wheels are heavy","wheels add more friction","wheels are round only for looks"],"Rolling beats dragging."],
     ["Which uses a wheel and axle?",["a wheelbarrow","a spoon","a ladder","a rope"],"One wheel, one axle."],
     ["Friction is a force that...",["slows things down when they rub","makes things float","makes light","keeps things cold"],"Rubbing force."]],
  W:["Your model car won't roll straight. How do you fix it?",["Investigate: look at the wheels and axles.","Find the problem: the two axles aren't parallel.","Improve: re-attach the axles so they are straight and parallel to each other.","Evaluate: test again; it now rolls straight."],"Make sure the axles are parallel"],
  X:"Wheels must spin freely. If the axle rubs too tightly against the body, friction stops the car from rolling.",
  C:["What force do wheels help to reduce?",["friction","gravity","magnetism","wind"],"Rolling has less friction."],
  H:{L:[["The design process","Engineers follow steps: investigate, design, make, evaluate and improve. Then they repeat until it works well.","Every bicycle you see was tested and improved many times."],
        ["Wheels through history","Before wheels, people dragged heavy loads on sledges. Wheels made transport and farming much easier.","Ox-wagons with big wheels crossed South Africa in the 1800s."]],
    Q:[["Which step comes after 'make' in the design process?",["evaluate","investigate","design","throw away"],"Test it."],
       ["Wheels on a car turning smoothly need...",["low friction at the axles","lots of glue on the axles","square wheels","no axles"],"Free spinning."],
       ["Before wheels, people moved heavy loads by...",["dragging them","flying them","rolling them in water","using engines"],"Sledges and dragging."],
       ["Oil on a bicycle chain helps by...",["reducing friction","adding friction","making it rust","making it heavier"],"Smoother movement."]]}},
{ id:"n5n", T:4, t:"Planet Earth", s:"Earth's shape, spin, the Sun and the Moon",
  L:[["Earth's shape and surface","Earth is shaped like a ball (a sphere). About two-thirds of its surface is covered by water (oceans), and the rest is land.","Photos from space show a blue planet."],
     ["Earth spins and travels","Earth spins (rotates) on its axis once every 24 hours, giving us day and night. It also travels (revolves) around the Sun once a year.","The Sun seems to rise in the east and set in the west because Earth spins."],
     ["The Sun and the Moon","The Sun is a star: a huge ball of hot gas that gives light and heat. The Moon is Earth's natural satellite; it orbits Earth and reflects sunlight.","The Moon has no light of its own."]],
  A:{t:"match", p:"Match each word to its meaning.", d:[["Rotate","Spin on an axis"],["Revolve","Travel around something"],["Sun","A star that gives us light and heat"],["Moon","Earth's natural satellite"],["Sphere","Ball shape"]]},
  Q:[["How long does Earth take to spin once?",["24 hours","365 days","1 week","1 month"],"One day."],
     ["What covers most of Earth's surface?",["water","sand","ice","forests"],"About two-thirds."],
     ["Why does the Moon shine at night?",["it reflects sunlight","it burns gas","it has lamps","it is a star"],"Reflected light."],
     ["Where does the Sun seem to rise?",["in the east","in the west","in the north","in the south"],"Earth spins towards the east."]],
  W:["Explain why it is day in Johannesburg while it is night in Mexico",["Earth is a sphere lit by the Sun on one side only.","Earth rotates, so different places face the Sun at different times.","When Johannesburg faces the Sun, it's day there.","Mexico is on the other side of Earth, facing away, so it's night."],"Earth's rotation: only half faces the Sun at a time"],
  X:"The Sun doesn't move around Earth each day. It only looks like it, because Earth is spinning.",
  C:["What is the Sun?",["a star","a planet","a moon","a comet"],"A huge ball of hot gas."],
  H:{L:[["Torch and ball model","In a dark room, shine a torch on a ball. Mark a spot and turn the ball slowly. The spot moves from light (day) into dark (night).","This shows how rotation makes day and night."],
        ["Shadows and the Sun","Shadows are long in the early morning and late afternoon, and shortest at midday when the Sun is high.","You can tell the time roughly from shadow length."]],
    Q:[["When are shadows shortest?",["at midday","early morning","late afternoon","at night"],"The Sun is highest."],
       ["In the torch-and-ball model, the torch is the...",["Sun","Moon","Earth","star"],"The light source."],
       ["How long does Earth take to go around the Sun?",["about 365 days","24 hours","30 days","7 days"],"One year."],
       ["The Moon travels around...",["Earth","Mars","the stars","nothing"],"Earth's satellite."]]}},
{ id:"n5o", T:4, t:"Soil & the surface of the Earth", s:"Rocks, soil types and erosion",
  L:[["From rock to soil","Rocks are slowly broken into small pieces by weather, water, ice and plant roots. This is called weathering. Soil is made of rock bits mixed with humus (rotted plants and animals), water and air.","It can take hundreds of years to make a few centimetres of soil."],
     ["Types of soil","Sand has big grains, so water drains fast. Clay has tiny grains, so it holds water and gets sticky. Loam is a mix of sand, clay and humus, and is best for growing plants.","Farmers love loam soil."],
     ["Erosion","Erosion is when wind or water carries soil away. Plant roots hold soil in place.","Bare hillsides lose soil in heavy rain and form gullies (dongas)."]],
  A:{t:"match", p:"Match each soil word to its description.", d:[["Sand","Big grains, water drains quickly"],["Clay","Tiny grains, holds water, sticky"],["Loam","Best mix for growing plants"],["Humus","Rotted plant and animal material"],["Erosion","Soil carried away by wind or water"]]},
  Q:[["Which soil is best for growing vegetables?",["loam","sand only","clay only","gravel"],"A good mix with humus."],
     ["What holds soil in place and stops erosion?",["plant roots","bare ground","strong wind","running water"],"Roots bind soil."],
     ["Breaking rocks into smaller pieces is called...",["weathering","erosion","fossilising","melting"],"Erosion moves the pieces."],
     ["Water drains fastest through...",["sandy soil","clay soil","loam","concrete"],"Big gaps between grains."]],
  W:["Test which soil holds the most water",["Put the same amount of sand, clay and loam into three funnels lined with filter paper.","Pour the same amount of water into each.","Measure how much water drips through after 10 minutes.","The soil with the least water dripping through holds the most: usually clay."],"Clay holds the most water; sand the least"],
  X:"Weathering and erosion are different. Weathering breaks rock down where it is; erosion carries the pieces away.",
  C:["Humus is...",["rotted plant and animal material","a type of rock","sand","a fertiliser bag"],"It makes soil rich."],
  H:{L:[["The soil layers","Dig down and you'll see layers: topsoil (dark, rich in humus), subsoil (lighter, with fewer nutrients) and then bedrock.","Most plant roots grow in the topsoil."],
        ["Protecting soil","Plant grass on slopes, avoid overgrazing, and use contour ploughing so water doesn't wash soil away.","Overgrazing leaves ground bare, which causes dongas."]],
    Q:[["Which soil layer is darkest and richest?",["topsoil","subsoil","bedrock","sand dune"],"Full of humus."],
       ["What causes dongas in the Eastern Cape and KZN?",["erosion of bare ground","too many trees","snow","earthquakes"],"Water washes soil away."],
       ["How can farmers prevent erosion on slopes?",["plant grass and plough along the contours","remove all plants","let animals overgraze","pour water on it"],"Keep soil covered."],
       ["Clay soil feels...",["sticky when wet","gritty and loose","like cotton wool","dry and dusty always"],"Tiny grains."]]}}
];

;

{ id:"s5e", T:1, t:"Provinces of South Africa", s:"Nine provinces, their capitals and our neighbours",
  L:[["Nine provinces","South Africa has nine provinces. Each has its own capital city and provincial government.","Gauteng is the smallest by area but has the most people. The Northern Cape is the biggest."],
     ["Provincial capitals","Western Cape: Cape Town. Eastern Cape: Bhisho. Northern Cape: Kimberley. Free State: Bloemfontein. KwaZulu-Natal: Pietermaritzburg. North West: Mahikeng. Gauteng: Johannesburg. Mpumalanga: Mbombela. Limpopo: Polokwane.","Pietermaritzburg, not Durban, is the capital of KZN."],
     ["Our neighbours","South Africa borders Namibia, Botswana, Zimbabwe, Mozambique and Eswatini. Lesotho is completely surrounded by South Africa. We also have three national capitals: Pretoria, Cape Town and Bloemfontein.","Pretoria: government offices. Cape Town: Parliament. Bloemfontein: Supreme Court of Appeal."]],
  A:{t:"match", p:"Match each province to its capital city.", d:[["Limpopo","Polokwane"],["KwaZulu-Natal","Pietermaritzburg"],["Free State","Bloemfontein"],["Mpumalanga","Mbombela"],["Northern Cape","Kimberley"],["North West","Mahikeng"]]},
  Q:[["How many provinces does South Africa have?",["9","7","10","12"],"Nine since 1994."],
     ["Which country is completely surrounded by South Africa?",["Lesotho","Eswatini","Botswana","Namibia"],"An enclave."],
     ["What is the capital of the Eastern Cape?",["Bhisho","Gqeberha","East London","Mthatha"],"Bhisho is the seat of government."],
     ["Which province is the largest by area?",["Northern Cape","Gauteng","KwaZulu-Natal","Free State"],"Vast and dry."]],
  W:["Find which province you'd be in at Kruger National Park's southern gate",["Kruger stretches along the north-east of South Africa.","The northern part is in Limpopo.","The southern part is in Mpumalanga.","So the southern gate is in Mpumalanga."],"Mpumalanga"],
  X:"Johannesburg is the capital of Gauteng, but Pretoria (also in Gauteng) is the national administrative capital. Don't mix up provincial and national capitals.",
  C:["What is the capital of the Western Cape?",["Cape Town","Stellenbosch","George","Paarl"],"Also a national capital."],
  H:{L:[["Use the map's shape","Picture the map: Limpopo at the top, Western Cape at the bottom-left tip, KwaZulu-Natal down the east coast, Northern Cape across the west.","The Free State sits in the middle, next to Lesotho."],
        ["Memory trick for neighbours","Going around the border from the west: Namibia, Botswana, Zimbabwe, Mozambique, Eswatini, and Lesotho inside.","Say it as a chain: 'Namibia, Botswana, Zimbabwe, Mozambique, Eswatini'."]],
    Q:[["Which province is at the top (north) of South Africa?",["Limpopo","Western Cape","Free State","Eastern Cape"],"It borders Zimbabwe."],
       ["Which province is along the east coast with Durban?",["KwaZulu-Natal","Gauteng","North West","Northern Cape"],"KZN."],
       ["Which country borders South Africa to the north-west?",["Namibia","Mozambique","Eswatini","Lesotho"],"Across the Orange River."],
       ["Which province does Lesotho mostly border?",["Free State","Limpopo","Gauteng","North West"],"Also KZN and Eastern Cape."]]}},
{ id:"s5f", T:2, t:"The first farmers", s:"Early farming communities in southern Africa",
  L:[["Farmers arrive","About 2 000 years ago, Bantu-speaking farmers moved into southern Africa from further north. They settled where there was good rain, soil and grazing.","They settled mainly in the east and north, where summer rains made farming possible."],
     ["Iron and crops","These farmers could work iron: they smelted iron ore in furnaces to make hoes, axes and spears. They grew sorghum, millet, beans and gourds, and kept cattle, sheep and goats.","Iron hoes made it much easier to farm the land."],
     ["Village life","Families lived in homesteads of round huts with a cattle kraal in the centre. Cattle showed wealth and were used for lobola. Farmers also traded with the San and Khoikhoi.","The Lydenburg Heads, clay heads about 1 500 years old, were made by early farmers in Mpumalanga."]],
  A:{t:"sort", p:"Which group is described: hunter-gatherers or first farmers?", b:["Hunter-gatherers (San)","First farmers"], d:[["Grew sorghum and millet",1],["Hunted with bows and arrows",0],["Smelted iron to make hoes",1],["Moved with the seasons to find food",0],["Lived in settled villages with kraals",1],["Gathered berries and roots",0]]},
  Q:[["About when did the first farmers arrive in southern Africa?",["about 2 000 years ago","about 50 years ago","in 1994","a million years ago"],"Around the first centuries AD."],
     ["What metal did the first farmers work?",["iron","gold only","aluminium","plastic"],"Iron smelting."],
     ["Where was the cattle kraal in a homestead?",["in the centre","far away in the forest","on the roof","in the river"],"Cattle were precious."],
     ["Which crop did the first farmers grow?",["sorghum","potatoes","wheat","maize"],"Maize came much later from the Americas."]],
  W:["Explain why the first farmers settled down instead of moving around",["Crops take months to grow, so farmers had to stay to plant, look after and harvest them.","They needed good soil and enough rain in one place.","Staying put let them build homesteads and store food.","So they lived in villages rather than moving with the seasons."],"Farming tied them to one place"],
  X:"Maize wasn't one of the first crops. It came from the Americas only a few hundred years ago. The first farmers grew sorghum and millet.",
  C:["What were iron hoes used for?",["farming the soil","cooking","hunting only","building boats"],"Digging and planting."],
  H:{L:[["How we know","Archaeologists find pottery, iron tools, furnace remains, grain storage pits and cattle bones at old village sites.","Broken pottery tells us when and where people lived."],
        ["Why cattle mattered","Cattle gave milk, meat and hides. A big herd meant wealth and status, and cattle were exchanged for lobola.","Cattle were like a bank account."]],
    Q:[["What do archaeologists dig up at old farming villages?",["pottery and iron tools","cars","plastic bottles","books"],"Clues from the past."],
       ["Cattle were important because they showed...",["wealth","the time","the weather","the way home"],"Status and wealth."],
       ["The Lydenburg Heads are made of...",["clay","gold","stone","wood"],"Fired clay."],
       ["First farmers traded with...",["the San and Khoikhoi","the Romans","Americans","Australians"],"Their neighbours."]]}},
{ id:"s5g", T:3, t:"Measuring weather & climate", s:"Weather instruments, reports and rainfall regions",
  L:[["Weather instruments","A thermometer measures temperature (°C). A rain gauge measures rainfall (mm). A wind vane shows wind direction. An anemometer measures wind speed.","A wind vane points to where the wind comes FROM."],
     ["Weather reports","Weather forecasts use symbols for sunny, cloudy, rain and storms, plus temperatures. The South African Weather Service makes forecasts.","A sun with a cloud means partly cloudy."],
     ["Rainfall regions","Most of South Africa gets summer rain. The south-western Cape gets winter rain. The southern coast (like the Garden Route) gets rain all year.","Thunderstorms are common on summer afternoons in Gauteng."]],
  A:{t:"match", p:"Match each instrument to what it measures.", d:[["Thermometer","Temperature"],["Rain gauge","Rainfall"],["Wind vane","Wind direction"],["Anemometer","Wind speed"],["Barometer","Air pressure"]]},
  Q:[["What does a rain gauge measure?",["rainfall","temperature","wind speed","sunshine"],"In millimetres."],
     ["Where does a wind vane point?",["to where the wind comes from","to where the wind goes","always north","to the sun"],"A 'south wind' blows from the south."],
     ["Which area gets rain all year round?",["the Garden Route (southern coast)","Gauteng","Limpopo","the Kalahari"],"All-year rainfall."],
     ["Rainfall is measured in...",["millimetres","degrees","kilograms","litres per hour"],"mm of rain."]],
  W:["A rain gauge shows 4 mm on Monday, 0 mm on Tuesday and 11 mm on Wednesday. Find the total.",["Add the daily readings: 4 + 0 + 11.","4 + 0 = 4.","4 + 11 = 15."],"15 mm"],
  X:"Weather is today's conditions; climate is the average pattern over many years. One rainy day doesn't change an area's climate.",
  C:["What does a thermometer measure?",["temperature","rainfall","wind","clouds"],"Hot or cold."],
  H:{L:[["Build a simple rain gauge","Cut the top off a plastic bottle, turn it upside down as a funnel, and mark millimetres on the side with a ruler. Check it at the same time each day.","Keep it in an open place, away from trees and roofs."],
        ["Reading a weather chart","Read the date, the place, the symbol and the minimum and maximum temperatures.","Polokwane: ☀ 14 °C / 29 °C means sunny, low 14, high 29."]],
    Q:[["Where should a rain gauge be placed?",["in an open place away from trees","under a roof","indoors","inside a tree"],"So rain falls straight in."],
       ["In '14 °C / 29 °C', which is the maximum?",["29 °C","14 °C","both","neither"],"The highest temperature."],
       ["Which instrument measures wind speed?",["anemometer","thermometer","rain gauge","compass"],"Spinning cups."],
       ["Which part of South Africa gets winter rain?",["the south-western Cape","Limpopo","Mpumalanga","Gauteng"],"Cape Town area."]]}},
{ id:"s5h", T:4, t:"Minerals & mining", s:"South Africa's mineral wealth and its effects",
  L:[["Rich in minerals","Minerals are natural materials found in rocks. South Africa has gold, platinum, diamonds, coal, iron ore, chrome and manganese.","South Africa has some of the world's biggest platinum and manganese deposits."],
     ["Where and when","Diamonds were found near Kimberley in 1867 (the 'Big Hole'). Gold was found on the Witwatersrand in 1886, and Johannesburg grew around the mines. Coal is mined in Mpumalanga and platinum in North West and Limpopo.","Johannesburg is called eGoli, 'place of gold'."],
     ["Types of mines and effects","Minerals near the surface are dug out by open-cast mining. Deep minerals need underground shaft mines. Mining creates jobs and wealth, but can pollute water and land and is dangerous work.","Some gold mines are more than 3 km deep."]],
  A:{t:"match", p:"Match each mineral to where or how it's linked.", d:[["Gold","Witwatersrand (Johannesburg)"],["Diamonds","Kimberley's Big Hole"],["Coal","Mpumalanga power stations"],["Platinum","North West and Limpopo"],["Iron ore","Northern Cape (used to make steel)"]]},
  Q:[["When was gold discovered on the Witwatersrand?",["1886","1652","1994","1910"],"Johannesburg grew quickly after."],
     ["Which mineral is mostly used to make electricity in South Africa?",["coal","gold","diamonds","platinum"],"Burned in power stations."],
     ["Minerals near the surface are mined by...",["open-cast mining","underground shafts only","fishing","farming"],"Dug from the surface."],
     ["Which is a negative effect of mining?",["water pollution","more jobs","money for the country","building towns"],"Mines can pollute."]],
  W:["Weigh up whether a new mine near a town is good or bad",["Positives: jobs, money for the town, new roads and shops.","Negatives: dust, noise, water pollution, damage to farmland and dangers for workers.","Ask: can the mine reduce harm, for example by cleaning water and fixing the land afterwards?","Decide using both sides."],"It brings jobs and money but must be managed to limit pollution and danger"],
  X:"Coal is a mineral fuel, but it's not a metal. Gold, platinum and iron are metals; coal and diamonds are not.",
  C:["Kimberley is famous for...",["diamonds","gold","coal","sugar"],"The Big Hole."],
  H:{L:[["Mining built cities","Johannesburg and Kimberley grew because of mining. People came from all over Southern Africa and the world to work on the mines.","Many workers lived in hostels far from their families."],
        ["Fixing the land","Mines should rehabilitate land after mining: fill holes, replace soil and plant vegetation. Old mine dumps can be cleaned up.","Yellow mine dumps around Johannesburg are left from gold mining."]],
    Q:[["Johannesburg's nickname eGoli means...",["place of gold","city of lights","big hole","river city"],"Because of gold."],
       ["Rehabilitating land after mining means...",["repairing and replanting it","leaving it empty","digging deeper","building more mines"],"Fixing damage."],
       ["Which is a metal mined in South Africa?",["platinum","coal","diamond","salt"],"A precious metal."],
       ["Deep minerals are reached by...",["underground shaft mines","open fields","boats","planes"],"Going down shafts."]]}},
{ id:"s5i", T:4, t:"Heritage trail", s:"Heritage sites across South Africa's provinces",
  L:[["What is heritage?","Heritage is what we inherit from the past and want to keep for the future. It can be natural (mountains, wetlands) or cultural (buildings, songs, languages, stories).","We celebrate Heritage Day on 24 September."],
     ["Tangible and intangible","Tangible heritage can be touched, like buildings and rock art. Intangible heritage can't be touched, like music, dance, recipes and traditions.","A Zulu dance and a family recipe are intangible heritage."],
     ["World Heritage Sites","South Africa has World Heritage Sites in different provinces, protected because they matter to the whole world.","Robben Island (Western Cape), Cradle of Humankind (Gauteng), Mapungubwe (Limpopo), iSimangaliso Wetland Park (KwaZulu-Natal), Vredefort Dome (Free State)."]],
  A:{t:"match", p:"Match each heritage site to its province.", d:[["Robben Island","Western Cape"],["Cradle of Humankind","Gauteng"],["Mapungubwe","Limpopo"],["iSimangaliso Wetland Park","KwaZulu-Natal"],["Vredefort Dome","Free State"],["Richtersveld","Northern Cape"]]},
  Q:[["When is Heritage Day?",["24 September","27 April","16 June","25 December"],"Also called Braai Day by some."],
     ["Which is intangible heritage?",["a traditional song","a museum building","a statue","a rock painting"],"You can't touch a song."],
     ["Robben Island is famous because...",["Nelson Mandela was imprisoned there","it has gold mines","it is a ski resort","it is the biggest city"],"A symbol of the struggle for freedom."],
     ["The Vredefort Dome was formed by...",["a huge meteorite impact","a volcano","a river","people"],"About 2 billion years ago."]],
  W:["Classify heritage items: the Drakensberg, isiXhosa, the Union Buildings, a family bobotie recipe",["Natural heritage: the Drakensberg (mountains).","Cultural tangible heritage: the Union Buildings (a building you can touch).","Cultural intangible heritage: isiXhosa (a language) and the bobotie recipe (a tradition)."],"Natural: Drakensberg. Tangible: Union Buildings. Intangible: isiXhosa, the recipe."],
  X:"Heritage isn't only old buildings and monuments. Languages, songs, games and recipes passed down in families are heritage too.",
  C:["Which is natural heritage?",["the Drakensberg mountains","a church","a song","a recipe"],"Created by nature."],
  H:{L:[["Why protect heritage","Heritage helps us understand who we are and where we come from. Once destroyed, it can't be replaced.","Rock art damaged by graffiti is lost forever."],
        ["Your own heritage","Ask older family members about your family's history, languages, foods, songs and celebrations. That's your heritage too.","Make a family heritage poster with photos and stories."]],
    Q:[["Why should heritage sites be protected?",["they can't be replaced once destroyed","they are ugly","to stop people learning","they are new"],"Irreplaceable."],
       ["Which is part of YOUR heritage?",["your family's songs and recipes","a random advert","a video game sale","a traffic jam"],"Passed down to you."],
       ["iSimangaliso Wetland Park is in...",["KwaZulu-Natal","Gauteng","Free State","North West"],"Near St Lucia."],
       ["Tangible heritage can be...",["touched","only heard","only remembered","imagined"],"Physical things."]]}}

{ id:"l5d", t:"Respecting diversity", s:"Different cultures, religions and celebrations",
  L:[["A rainbow nation","South Africa has many cultures, 12 official languages (including South African Sign Language) and many religions. Diversity means difference and variety.","Archbishop Desmond Tutu called us the 'rainbow nation'."],
     ["Religious celebrations","Different religions have special days: Christmas and Easter (Christianity), Eid (Islam), Diwali (Hinduism), Passover and Hanukkah (Judaism). Many families also honour ancestors.","Diwali is the festival of lights."],

{ id:"l5e", t:"Germs & diseases", s:"How diseases spread and how to stay healthy",
  L:[["Germs","Germs are tiny living things, like bacteria and viruses, that can make us sick. They are too small to see without a microscope.","Flu and colds are caused by viruses."],
     ["How germs spread","Some diseases are communicable: they spread from person to person through coughs and sneezes, touching, dirty water or food. Others are non-communicable, like diabetes, and can't be caught.","TB spreads through the air when someone with TB coughs."],
     ["Stop the spread","Wash hands with soap for 20 seconds, cough into your elbow, drink clean water and get vaccinated. HIV cannot be spread by hugging, sharing cups or playing together.","Wash hands after the toilet and before eating."]],
  A:{t:"sort", p:"Does it help stop germs or help them spread?", b:["Stops germs","Spreads germs"], d:[["Washing hands with soap",0],["Sneezing into your hands then touching a door",1],["Coughing into your elbow",0],["Drinking dirty river water",1],["Getting vaccinated",0],["Sharing a used tissue",1]]},
  Q:[["How long should you wash your hands with soap?",["about 20 seconds","1 second","5 minutes","no time at all"],"Sing 'Happy Birthday' twice."],
     ["Which disease is communicable?",["flu","diabetes","short-sightedness","a broken arm"],"It spreads between people."],
     ["How is TB mainly spread?",["through the air by coughing","by hugging only","through books","by looking at someone"],"Airborne droplets."],
     ["Can you get HIV by sharing a cup or hugging?",["no","yes","only on Mondays","only from pets"],"It is not spread by everyday contact."]],
  W:["You have a cold. How can you stop others getting sick?",["Cough and sneeze into your elbow or a tissue.","Throw used tissues away and wash your hands.","Don't share cups or spoons.","Rest at home if you have a fever."],"Cover coughs, wash hands, don't share, rest"],
  X:"Antibiotics don't cure colds or flu. They fight bacteria, but colds and flu are caused by viruses.",
  C:["Where should you cough?",["into your elbow","into your hands","onto a friend","into the air"],"Keeps hands clean."],
  H:{L:[["Clean water","Dirty water can carry germs that cause diarrhoea and cholera. If water isn't safe, boil it for one minute before drinking.","Diarrhoea can make you lose a lot of water: drink plenty of clean fluids."],
        ["Vaccines","Vaccines train your body to fight certain diseases before you catch them, like measles and polio.","Clinics give free vaccines to children in South Africa."]],
    Q:[["How can you make unsafe water safer to drink?",["boil it","freeze it","add sugar","stir it"],"Boiling kills germs."],
       ["Vaccines help your body...",["fight certain diseases","grow taller","see better","run faster"],"They train your immune system."],
       ["What causes colds and flu?",["viruses","sweets","cold weather alone","sunlight"],"Not the cold itself."],
       ["Which is non-communicable?",["diabetes","measles","flu","chickenpox"],"You can't catch it."]]}},
{ id:"l5f", t:"Staying safe", s:"Road safety, home safety and emergency numbers",
  L:[["Road safety","Cross at a pedestrian crossing or robot, stop, look right, look left and right again, and walk (don't run) across. Wear a seatbelt in every car and taxi.","Wear bright clothes when walking at dusk."],
     ["Home safety","Keep medicines and chemicals like paraffin and poison out of reach, never play with matches, and don't touch electrical plugs with wet hands.","Store paraffin in a clearly labelled container, never in a cooldrink bottle."],
     ["Emergency numbers","Police: 10111. Ambulance and fire: 10177. From a cellphone: 112. Childline: 116. Learn your home address so you can tell them where you are.","Stay calm, say what happened and where, and don't hang up until they tell you to."]],
  A:{t:"match", p:"Match each emergency to the number to call.", d:[["Someone is breaking into a house","10111 (Police)"],["Someone has collapsed","10177 (Ambulance)"],["Any emergency from a cellphone","112"],["A child needs help or advice","116 (Childline)"]]},
  Q:[["What should you do before crossing the road?",["stop and look right, left and right again","run across quickly","look at your phone","close your eyes"],"Check both ways."],
     ["What is the police emergency number?",["10111","116","999","123"],"10111."],
     ["Why should paraffin never be stored in a cooldrink bottle?",["someone might drink it by mistake","it will turn into juice","it gets cold","it's illegal to buy cooldrink"],"Poisoning risk."],
     ["In a car or taxi you should always...",["wear a seatbelt","stand up","hang out the window","sit on someone's lap"],"Seatbelts save lives."]],
  W:["You find your little brother has swallowed some pills. What do you do?",["Stay calm and keep the pill container to show what he took.","Shout for an adult immediately.","If no adult is near, call 10177 or 112 and say what happened and your address.","Don't try to make him vomit unless a medical person tells you to."],"Get an adult, call for help, keep the container"],
  X:"Never assume a car has seen you. Make eye contact with the driver or wait until the car stops completely.",
  C:["Which number do you call for an ambulance?",["10177","10111","116","1000"],"Ambulance and fire."],
  H:{L:[["Know your details","Learn your full name, your parent's phone number and your home address by heart. Emergency workers need them.","Practise saying your address out loud."],
        ["Stranger safety","Never go with a stranger or accept a lift, even if they say your parent sent them. Agree on a family code word.","If someone you don't know says 'your mom sent me', ask for the code word."]],
    Q:[["A stranger says your mom sent them to fetch you. What do you do?",["ask for the family code word and don't go","get in the car","go if they have sweets","follow them quickly"],"Stay safe."],
       ["Why should you know your home address?",["so emergency services can find you","for fun only","to tell strangers","it isn't important"],"Help reaches you faster."],
       ["Where should medicines be kept?",["out of reach of small children","on the floor","in a cooldrink bottle","in the garden"],"Prevent poisoning."],
       ["When walking at night you should wear...",["bright or reflective clothes","dark clothes","no shoes","a blindfold"],"Be seen."]]}},
{ id:"l5g", t:"Creative Arts: visual art", s:"Line, shape, colour, texture and the colour wheel",
  L:[["Elements of art","Artists use line, shape, colour, texture and space to create artworks.","Lines can be straight, curved, zigzag, thick or thin."],
     ["The colour wheel","Primary colours are red, yellow and blue: you can't mix them from other colours. Secondary colours are made by mixing two primaries: orange, green and purple.","Red + yellow = orange. Yellow + blue = green. Blue + red = purple."],
     ["Warm, cool and texture","Warm colours (red, orange, yellow) feel hot and lively. Cool colours (blue, green, purple) feel calm. Texture is how something feels or looks like it would feel.","Ndebele house paintings use bold lines and bright colours."]],
  A:{t:"match", p:"Match each colour mix to the colour it makes.", d:[["Red + yellow","Orange"],["Yellow + blue","Green"],["Blue + red","Purple"],["Any colour + white","A lighter tint"],["Any colour + black","A darker shade"]]},
  Q:[["Which is a primary colour?",["blue","green","orange","purple"],"Red, yellow and blue."],
     ["Which colours are warm?",["red, orange and yellow","blue, green and purple","black and white","grey and brown"],"Like fire and sun."],
     ["Texture in art is...",["how something feels or looks like it feels","the size of the paper","the artist's name","the price"],"Rough, smooth, bumpy."],
     ["Which South African art style is known for bold geometric patterns on houses?",["Ndebele painting","Egyptian hieroglyphs","Greek pottery","Chinese calligraphy"],"Mpumalanga and Gauteng."]],
  W:["Mix a light green for a spring tree",["Green is a secondary colour: mix yellow and blue.","To make it lighter (a tint), add white.","Add white a little at a time and test on scrap paper."],"Yellow + blue, then add a little white"],
  X:"Adding black makes a shade, not a new colour. Use it a tiny bit at a time; too much makes everything muddy.",
  C:["Yellow + blue makes...",["green","orange","purple","brown"],"A secondary colour."],
  H:{L:[["Complementary colours","Colours opposite each other on the colour wheel are complementary: red and green, blue and orange, yellow and purple. Side by side they look bright and bold.","Sports teams often use complementary colours."],
        ["Looking at artworks","Describe what you see, think about how it was made (lines, colours, textures), and say how it makes you feel.","Talking about art is part of Creative Arts too."]],
    Q:[["Which colour is complementary to blue?",["orange","green","purple","red"],"Opposite on the wheel."],
       ["Adding white to a colour makes a...",["tint","shade","texture","primary"],"Lighter version."],
       ["Cool colours make an artwork feel...",["calm","hot","angry","noisy"],"Like water and sky."],
       ["Which element of art can be straight, curved or zigzag?",["line","colour","texture","space"],"Lines have many types."]]}},
{ id:"l5h", t:"Creative Arts: music, dance & drama", s:"Beat, rhythm, tempo, instruments and performing",
  L:[["Beat and rhythm","The beat is the steady pulse of music, like a heartbeat. Rhythm is the pattern of long and short sounds that fits over the beat.","Clap the beat of a song, then clap the words: that's rhythm."],
     ["Tempo and dynamics","Tempo is how fast or slow music is. Dynamics is how loud or soft it is.","A lullaby has a slow tempo and soft dynamics."],
     ["Instruments and performing","Instruments are grouped into families: percussion (drums, marimba), strings (guitar), wind (flute, kudu horn) and keyboards. In dance and drama, use your body, face and voice to show character and feeling.","The djembe and the marimba are popular percussion instruments in South Africa."]],
  A:{t:"sort", p:"Sort each musical word: is it about speed or loudness?", b:["Tempo (speed)","Dynamics (loud/soft)"], d:[["Fast",0],["Loud",1],["Slow",0],["Soft",1],["Getting faster",0],["Getting louder",1]]},
  Q:[["What is the beat in music?",["the steady pulse","the words","the singer","the title"],"Like a heartbeat."],
     ["Tempo means...",["how fast or slow the music is","how loud it is","who wrote it","how long it is"],"Speed."],
     ["A marimba is a...",["percussion instrument","string instrument","wind instrument","voice"],"You hit it."],
     ["In drama, how can you show a character is sad?",["with slow movements and a soft voice","by jumping and shouting","by laughing","by running"],"Body and voice."]],
  W:["Create a 4-beat body percussion pattern",["Count a steady beat: 1, 2, 3, 4.","Give each beat a sound: 1 = stamp, 2 = clap, 3 = clap, 4 = click.","Repeat it four times.","Change the tempo: first slow, then faster."],"Stamp, clap, clap, click (repeat)"],
  X:"Beat and rhythm are not the same. The beat stays steady; the rhythm changes with the words or tune.",
  C:["Dynamics in music is about...",["how loud or soft it is","how fast it is","the instruments","the costumes"],"Volume."],
  H:{L:[["Music words in action","Practise: clap softly (piano), then loudly (forte). Walk slowly, then quickly to music.","Feeling it in your body helps you remember it."],
        ["Warm up before performing","Dancers and actors warm up their bodies and voices to avoid injury and perform better.","Stretch, roll your shoulders, hum and do tongue twisters."]],
    Q:[["Why do performers warm up?",["to avoid injury and perform better","to waste time","to get tired","to scare the audience"],"Ready body and voice."],
       ["A djembe is played by...",["hitting it with hands","blowing into it","plucking strings","pressing keys"],"Hand drum."],
       ["Music that gets louder is...",["increasing in dynamics","decreasing in tempo","a string","silent"],"Volume goes up."],
       ["The rhythm of a song follows...",["the pattern of long and short sounds","only the beat","the colours","the dance costumes"],"Often the words."]]}},
{ id:"l5i", t:"Physical education", s:"Fitness, warming up and fair play",
  L:[["Why exercise?","Regular exercise makes your heart and lungs stronger, builds muscles, helps you sleep and improves your mood. Children should be active for about an hour a day.","Running, skipping, dancing and soccer all count."],
     ["Warm up and cool down","Warm up for 5 to 10 minutes before exercise to get your muscles ready. Cool down and stretch afterwards to help your body recover.","Jog on the spot, then do gentle stretches."],
     ["Fair play and safety","Follow the rules, respect your teammates and opponents, and shake hands after the game. Drink water and use safe equipment.","Good sports people win and lose with respect."]],
  A:{t:"order", p:"Put a PE lesson in the best order.", d:["Drink some water","Warm up: jog and move your joints","Main activity: play the game","Cool down: walk and slow your breathing","Stretch your muscles"]},
  Q:[["About how long should children be active each day?",["about 1 hour","5 minutes","5 hours","never"],"Every day."],
     ["Why warm up before exercise?",["to prepare muscles and prevent injury","to get tired first","to make it harder","there's no reason"],"Muscles get ready."],
     ["What does exercise do for your heart?",["makes it stronger","makes it weaker","stops it","nothing"],"A stronger pump."],
     ["Showing fair play means...",["respecting the rules and other players","cheating to win","arguing with the referee","refusing to shake hands"],"Good sportsmanship."]],
  W:["Measure your heart rate before and after exercise",["Find your pulse on your wrist or neck.","Count the beats for 15 seconds and multiply by 4 (beats per minute).","Do 1 minute of star jumps, then measure again.","Compare: your heart rate goes up during exercise."],"Your heart beats faster during exercise"],
  X:"Don't skip the cool-down. Stopping suddenly after hard exercise can make you dizzy.",
  C:["What should you do after exercise?",["cool down and stretch","sit still in the sun","eat lots of sweets","skip water"],"Help your body recover."],
  H:{L:[["Parts of fitness","Fitness includes endurance (keeping going), strength, flexibility (stretching), speed and balance.","Skipping builds endurance; stretching builds flexibility."],
        ["Stay hydrated","Your body loses water as you sweat. Drink water before, during and after exercise.","Thirst is a sign you need water."]],
    Q:[["Stretching improves your...",["flexibility","eyesight","handwriting","hearing"],"Bending easily."],
       ["What should you drink during sport?",["water","energy drinks only","nothing","fizzy cooldrink"],"Water hydrates best."],
       ["Counting pulse for 15 seconds gives 25 beats. Beats per minute?",["100","25","40","60"],"25 × 4 = 100."],
       ["Keeping going for a long time is called...",["endurance","balance","speed","flexibility"],"Stamina."]]}}

{ id:"m6f", T:1, t:"Adding & subtracting large numbers", s:"Six-digit calculations, rounding and estimating",
  L:[["Columns all the way","Line up the place values and work from the units column to the left, carrying or borrowing when you need to. Grade 6 calculations go up to 6 digits and more.","235 418 + 146 795 = 382 213"],

  Q:[["What is 345 678 + 154 322?",["500 000","499 000","500 100","490 000"],"The units, tens and so on all carry to make a round number."],

  W:["Calculate 403 215 − 187 648",["Units: 5 − 8 won't work. Borrow from the tens: 15 − 8 = 7 (tens become 0).","Tens: 0 − 4 won't work. Borrow from the hundreds: 10 − 4 = 6 (hundreds become 1).","Hundreds: 1 − 6 won't work. Borrow from the thousands: 11 − 6 = 5 (thousands become 2).","Thousands: 2 − 7 won't work. The ten thousands is 0, so borrow from the hundred thousands: thousands become 12, ten thousands become 9. 12 − 7 = 5, 9 − 8 = 1, 3 − 1 = 2."],"215 567"],
  X:"When you borrow across a zero, the zero becomes 9, not 10. Only the column you're working in gets the extra 10.",

  H:{L:[["Use friendly numbers","Adjust numbers to make them easier, then fix the answer.","499 999 + 250 000 → 500 000 + 250 000 = 750 000, then subtract 1: 749 999."],
        ["Bridging through round numbers","For subtraction, count up from the smaller number to the bigger one in jumps.","100 000 − 37 250: jump to 40 000 (+2 750), then to 100 000 (+60 000). Total jump: 62 750."]],
    Q:[["499 999 + 250 000 = ?",["749 999","750 000","749 000","750 001"],"500 000 + 250 000 − 1."],
