{ id:"n7l", T:3, t:"Potential & kinetic energy", s:"Stored energy, movement energy and energy changes",
  L:[["Potential energy","Potential energy is stored energy. Gravitational potential energy depends on an object's mass and height: the higher and heavier, the more it has.","A rock at the top of a cliff has lots of potential energy."],
     ["Kinetic energy","Kinetic energy is the energy of movement. The faster and heavier something is, the more kinetic energy it has.","A truck moving at 60 km/h has more kinetic energy than a bicycle at the same speed."],
     ["Energy changes","Energy changes from one form to another but is never created or destroyed. A swinging pendulum changes potential energy to kinetic and back. Some energy is lost as heat and sound.","A bouncing ball bounces lower each time because energy is lost as heat and sound."]],
  A:{t:"sort", p:"At this moment, is the energy mainly potential or kinetic?", b:["Mainly potential","Mainly kinetic"], d:[["A book on a high shelf",0],["A ball rolling down a hill",1],["A stretched catapult",0],["A runner sprinting",1],["Water held behind a dam wall",0],["Wind turning a turbine",1]]},
  Q:[["Which has more gravitational potential energy?",["a rock on a high cliff","the same rock on the ground","a feather on the ground","a rolling marble"],"Higher means more."],
     ["Kinetic energy is the energy of...",["movement","height","heat only","light"],"Motion."],
     ["At the top of its swing, a pendulum has the most...",["potential energy","kinetic energy","sound energy","light energy"],"Momentarily still and highest."],
     ["Why does a bouncing ball bounce lower each time?",["energy is lost as heat and sound","gravity disappears","it gains energy","the ball shrinks"],"Energy transfers."]],
  W:["Describe the energy changes on a playground slide",["At the top: the child has gravitational potential energy (height).","Sliding down: potential energy changes into kinetic energy (speed).","Friction with the slide changes some energy into heat.","At the bottom: less potential energy, some kinetic energy, and the slide is slightly warm."],"Potential → kinetic, with some lost as heat"],
  X:"Energy isn't 'used up' or destroyed. It changes into other forms, often heat and sound that we can't use easily.",
  C:["A parked car on flat ground has...",["no kinetic energy","lots of kinetic energy","only sound energy","infinite energy"],"It isn't moving."],
  H:{L:[["Law of conservation of energy","Energy cannot be created or destroyed, only changed from one form to another. The total stays the same.","In a power station, chemical energy changes into heat, then movement, then electricity."],
        ["Useful and wasted energy","In any energy change, some energy becomes useful and some is 'wasted', often as heat.","An old light bulb gets hot: much of its energy is wasted as heat."]],
    Q:[["Energy can be...",["changed from one form to another","destroyed","created from nothing","lost forever"],"Conservation."],
       ["A hot old light bulb shows energy...",["wasted as heat","created","destroyed","stored"],"Not all becomes light."],
       ["Water stored behind a dam has...",["gravitational potential energy","kinetic energy only","no energy","sound energy"],"Height."],
       ["Which moves with the most kinetic energy?",["a fast, heavy truck","a slow bicycle","a parked car","a sleeping cat"],"Mass and speed."]]}},
{ id:"n7n", T:4, t:"The Sun & the seasons", s:"Why we have seasons and how the Sun affects life",
  L:[["Earth's tilt","Earth's axis is tilted at about 23,5°. As Earth orbits the Sun over a year, first one hemisphere and then the other leans towards the Sun.","That tilt, not distance from the Sun, causes the seasons."],
     ["Southern hemisphere seasons","When the southern hemisphere leans towards the Sun, we get summer: longer days and more direct sunlight. In South Africa, summer is from December to February and winter from June to August.","Christmas in South Africa is in summer!"],
     ["The Sun and life","The Sun gives light for photosynthesis and heat to warm the planet. Too much ultraviolet (UV) radiation can cause sunburn and skin cancer.","Wear sunscreen, a hat and avoid the midday sun."]],
  A:{t:"match", p:"Match each date to what happens in the southern hemisphere.", d:[["About 21 December","Longest day (summer solstice)"],["About 21 June","Shortest day (winter solstice)"],["About 21 March","Day and night equal (autumn equinox)"],["About 23 September","Day and night equal (spring equinox)"]]},
  Q:[["What causes the seasons?",["the tilt of Earth's axis","Earth's distance from the Sun","the Moon","clouds"],"23,5° tilt."],
     ["When is summer in South Africa?",["December to February","June to August","March to May","all year"],"Southern hemisphere."],
     ["On the winter solstice, the day is...",["shortest","longest","equal to the night","24 hours"],"About 21 June here."],
     ["Too much UV radiation can cause...",["sunburn and skin cancer","stronger bones","better eyesight","nothing"],"Protect your skin."]],
  W:["Explain why it's winter in Europe when it's summer in South Africa",["Earth's axis is tilted at 23,5°.","In December, the southern hemisphere leans towards the Sun: direct rays and long days, so summer.","At the same time, the northern hemisphere leans away: weaker rays and short days, so winter.","So the seasons are opposite."],"The hemispheres lean towards or away from the Sun at opposite times"],
  X:"Seasons aren't caused by Earth being closer to the Sun. Earth is actually slightly closer to the Sun in January, during our summer, but that isn't the reason.",
  C:["An equinox is when...",["day and night are about equal","the day is longest","there's no sun","it snows everywhere"],"Twice a year."],
  H:{L:[["Torch on a slant","Shine a torch straight down on paper: a small, bright circle. Tilt it: a bigger, dimmer patch. Slanted sunlight in winter spreads out and heats less.","That's why winter sunlight feels weaker."],
        ["Sun safety","The UV index tells you how strong the sun's UV rays are. Slip on a shirt, slop on sunscreen, slap on a hat.","UV is strongest between 10:00 and 15:00."]],
    Q:[["Why does winter sunlight heat less?",["it hits the ground at a slant and spreads out","it's a different sun","it's further away","it is blue"],"Spread over more area."],
       ["UV is strongest at about...",["midday","sunrise","midnight","sunset"],"10:00 to 15:00."],
       ["Earth's axis is tilted at about...",["23,5°","90°","45°","0°"],"The key to seasons."],
       ["In June, the southern hemisphere leans...",["away from the Sun","towards the Sun","straight up","into the Moon"],"Winter here."]]}},
{ id:"n7o", T:4, t:"Tides & eclipses", s:"How the Moon affects Earth",
  L:[["Tides","The Moon's gravity pulls on Earth's oceans, making them bulge. As Earth rotates, most coastlines get two high tides and two low tides about every 24 hours.","Fishermen and surfers check tide tables."],
     ["Spring and neap tides","Spring tides (very high and very low) happen when the Sun and Moon line up at full and new moon. Neap tides (smaller difference) happen at first and last quarter.","Spring tides have nothing to do with the season spring."],
     ["Eclipses","A solar eclipse happens when the Moon passes between the Sun and Earth, blocking sunlight. A lunar eclipse happens when Earth is between the Sun and Moon, and Earth's shadow falls on the Moon.","Never look directly at the Sun during a solar eclipse."]],
  A:{t:"match", p:"Match each event to its cause.", d:[["Solar eclipse","The Moon blocks the Sun's light"],["Lunar eclipse","Earth's shadow falls on the Moon"],["Spring tide","Sun and Moon line up"],["Neap tide","Sun and Moon at right angles"],["High tide","Moon's gravity pulls the ocean"]]},
  Q:[["What mainly causes tides?",["the Moon's gravity","the wind","fish","earthquakes"],"Gravitational pull."],
     ["A solar eclipse happens when...",["the Moon is between the Sun and Earth","Earth is between the Sun and Moon","the Sun is between Earth and Moon","clouds cover the Sun"],"Moon blocks the Sun."],
     ["Spring tides happen at...",["full moon and new moon","only in spring","first quarter","every hour"],"Alignment."],
     ["How many high tides do most coasts get each day?",["two","one","four","none"],"About every 12 hours."]],
  W:["Explain why a lunar eclipse can only happen at full moon",["A lunar eclipse needs Earth exactly between the Sun and the Moon.","When Earth is between them, the Moon is on the far side of Earth from the Sun.","That's the position of a full moon (the whole lit side faces us).","So lunar eclipses only happen at full moon."],"Only at full moon is the Moon on the opposite side of Earth from the Sun"],
  X:"Never look at a solar eclipse with your eyes, sunglasses or binoculars. It can permanently damage your eyes. Use special eclipse glasses or a pinhole viewer.",
  C:["During a lunar eclipse the Moon can look...",["reddish","bright green","square","invisible always"],"Sunlight bent through Earth's atmosphere."],
  H:{L:[["Pinhole viewer","Make a tiny hole in a card and let sunlight shine through onto another card. You'll see a safe image of the Sun, and during an eclipse you can watch it being covered.","Never look through the hole at the Sun."],
        ["Tides and people","Tides affect fishing, shipping, surfing and rock-pool safety. Low spring tides expose rock pools full of sea life.","Always check tide times before exploring rocks."]],
    Q:[["How can you safely view a solar eclipse?",["with a pinhole viewer or eclipse glasses","with sunglasses","by staring quickly","with binoculars"],"Protect your eyes."],
       ["Neap tides happen when the Sun and Moon are...",["at right angles to Earth","in a line","behind each other","not in the sky"],"Pulls partly cancel."],
       ["Why check tide times before exploring rocks?",["the tide can come in and trap you","tides are always low","rocks move","for fun only"],"Safety."],
       ["A solar eclipse can only happen at...",["new moon","full moon","first quarter","any time"],"Moon between Earth and Sun."]]}},
{ id:"n7p", T:4, t:"History of astronomy", s:"From indigenous star knowledge to modern telescopes",
  L:[["Indigenous knowledge","Long before telescopes, people in southern Africa used the stars for timekeeping and farming. The appearance of Isilimela (the Pleiades) signalled the start of the planting season for amaXhosa farmers, and San stories describe the Milky Way.","Stars were a calendar for farmers and travellers."],
     ["Earth-centred to Sun-centred","Ancient Greek astronomers like Ptolemy believed Earth was the centre of the universe. In 1543 Copernicus proposed that the planets orbit the Sun. Galileo's telescope observations from 1609 supported this.","Galileo saw moons orbiting Jupiter."],
     ["Modern astronomy","Today we use giant telescopes, radio telescopes and space telescopes. South Africa is a world leader with SALT, MeerKAT and the Square Kilometre Array (SKA).","MeerKAT has photographed the centre of our galaxy, the Milky Way."]],
  A:{t:"order", p:"Put these astronomy milestones in order.", d:["Ptolemy describes an Earth-centred universe (about AD 150)","Copernicus proposes a Sun-centred system (1543)","Galileo uses a telescope to observe the sky (1609)","Humans land on the Moon (1969)","MeerKAT radio telescope is launched in South Africa (2018)"]},
  Q:[["Who proposed that the planets orbit the Sun?",["Copernicus","Ptolemy","Mendeleev","Darwin"],"In 1543."],
     ["What did Galileo see with his telescope?",["moons orbiting Jupiter","aliens","the far side of the Moon","black holes"],"Evidence for a Sun-centred system."],
     ["What did Isilimela (the Pleiades) signal for amaXhosa farmers?",["the planting season","the end of the year","a storm","a festival of lights"],"A star calendar."],
     ["Which is a South African radio telescope?",["MeerKAT","Hubble","Apollo","Voyager"],"In the Karoo."]],
  W:["Explain why the Sun-centred model replaced the Earth-centred model",["The Earth-centred model struggled to explain how planets sometimes seem to move backwards.","Copernicus showed a Sun-centred system explained this more simply.","Galileo's telescope found moons orbiting Jupiter: not everything orbits Earth.","The evidence supported the Sun-centred model."],"Observations and evidence supported it"],
  X:"Indigenous knowledge isn't 'just stories'. It was based on careful observation of the sky over many generations.",
  C:["The Earth-centred model was proposed by...",["Ptolemy","Galileo","Copernicus","Newton"],"Ancient Greek astronomer."],
  H:{L:[["How science changes","Scientific ideas change when new evidence is found. A good scientist is willing to change their mind.","The Sun-centred model took more than 100 years to be widely accepted."],
        ["Look up!","On a clear night away from city lights, you can see the Milky Way, the Southern Cross and sometimes planets like Jupiter.","The Southern Cross helps you find south."]],
    Q:[["Scientific ideas change when...",["new evidence is found","people vote","it's a new year","someone is famous"],"Evidence-based."],
       ["Which star pattern helps you find south?",["the Southern Cross","the Big Dipper","Orion's belt only","the Moon"],"Southern hemisphere."],
       ["Why see more stars away from cities?",["less light pollution","more stars exist there","the sky is closer","it's colder"],"Dark skies."],
       ["Indigenous star knowledge was based on...",["careful observation over generations","guessing","telescopes","computers"],"Observation."]]}}
];
G7_MORE.ss = [
{ id:"s7e", T:2, t:"The transatlantic slave trade", s:"The triangular trade and its human cost",
  L:[["The triangular trade","From the 1500s to the 1800s, European ships carried goods (guns, cloth, alcohol) to West Africa, enslaved Africans across the Atlantic to the Americas, and sugar, cotton and tobacco back to Europe.","It's called triangular because of its three-sided route."],
     ["The Middle Passage","The voyage from Africa to the Americas was the Middle Passage. Enslaved people were chained and crammed below deck for weeks. Millions died. About 12 million Africans were forcibly transported.","Gorée Island in Senegal is a memorial to the trade."],
     ["Resistance and abolition","Enslaved people resisted through revolts, escape and keeping their cultures alive. Britain abolished the slave trade in 1807 and slavery in its empire in 1834. The USA ended slavery in 1865.","The Haitian Revolution (1791–1804) was led by enslaved people."]],
  A:{t:"order", p:"Put the stages of the triangular trade in order.", d:["Ships leave Europe with guns, cloth and alcohol","Goods are traded for enslaved people in West Africa","Enslaved people are shipped across the Atlantic (Middle Passage)","Enslaved people are sold to work on plantations in the Americas","Ships return to Europe with sugar, cotton and tobacco"]},
  Q:[["The voyage from Africa to the Americas was called the...",["Middle Passage","Silk Road","Cape Route","Great Trek"],"The second side of the triangle."],
     ["About how many Africans were forcibly transported?",["about 12 million","about 12 000","about 1 000","about 120"],"A huge human tragedy."],
     ["When did Britain abolish slavery in its empire?",["1834","1652","1994","1910"],"Including the Cape."],
     ["What crops were grown on plantations in the Americas?",["sugar, cotton and tobacco","maize and sorghum only","grapes only","rice only"],"Sent to Europe."]],
  W:["Explain why the slave trade grew",["European colonies in the Americas set up huge plantations growing sugar, cotton and tobacco.","Plantations needed lots of labour, and many local people had died from disease and violence.","European traders saw enslaved Africans as a source of forced labour and profit.","So the trade grew for profit, at a terrible human cost."],"Demand for plantation labour and profit"],
  X:"Enslaved Africans were not passive victims. Many resisted through revolts, escapes and keeping their languages, music and beliefs alive.",
  C:["Gorée Island is a memorial in...",["Senegal","South Africa","Egypt","Mali"],"West Africa."],
  H:{L:[["Effects on Africa","The trade took millions of young people from West and Central Africa, caused wars between kingdoms and damaged economies for generations.","Communities lost workers, farmers and leaders."],
        ["Why we remember","Remembering the slave trade helps us understand racism and inequality today and honours those who suffered and resisted.","UNESCO marks 23 August as the International Day for the Remembrance of the Slave Trade."]],
    Q:[["How did the trade affect Africa?",["it took millions of people and damaged communities","it made Africa richer","it had no effect","it ended wars"],"Lasting damage."],
       ["Why remember the slave trade today?",["to understand inequality and honour those who suffered","to forget it","for fun","it doesn't matter"],"Learning from history."],
       ["Which was a form of resistance?",["escaping and revolting","obeying always","selling others","doing nothing"],"Fighting for freedom."],
       ["The Haitian Revolution was led by...",["enslaved people","European kings","traders","Portuguese explorers"],"A successful revolt."]]}},
{ id:"s7f", T:4, t:"Frontiers of the Cape Colony", s:"Co-operation and conflict in the early 1800s",
  L:[["The eastern frontier","On the eastern frontier, the Xhosa and colonists competed for land, grazing and cattle. A series of nine Frontier Wars was fought between 1779 and 1879. The Fish River was set as a boundary.","The 1820 Settlers from Britain were placed near the frontier."],
     ["The northern frontier","North of the Orange River, groups such as the Griqua (led by leaders like Adam Kok and Andries Waterboer), the Kora and the Tswana traded and sometimes clashed. Missionaries like Robert Moffat set up a mission at Kuruman.","Guns, horses and cattle were important trade goods."],
     ["Co-operation too","The frontier wasn't only conflict. People traded cattle, ivory, beads and guns, intermarried, learnt each other's languages and sometimes formed alliances.","Trade fairs were held at places on the frontier."]],
  A:{t:"sort", p:"Is it an example of co-operation or conflict?", b:["Co-operation","Conflict"], d:[["Trading cattle for beads",0],["Cattle raids across the border",1],["Learning each other's languages",0],["The Frontier Wars",1],["Forming alliances against a common enemy",0],["Fighting over grazing land",1]]},
  Q:[["What did the Xhosa and colonists mainly compete for?",["land, grazing and cattle","gold mines","ocean fishing","railways"],"Farming resources."],
     ["How many Frontier Wars were fought on the eastern frontier?",["nine","two","twenty","one"],"Between 1779 and 1879."],
     ["Which group lived on the northern frontier?",["the Griqua","the Romans","the Vikings","the Aztecs"],"Led by Adam Kok and Andries Waterboer."],
     ["Robert Moffat set up a mission at...",["Kuruman","Cape Town","Durban","Pretoria"],"Northern Cape today."]],
  W:["Explain why conflict grew on the eastern frontier",["Colonists moved further east looking for farmland.","The Xhosa already lived and grazed cattle there.","Both needed the same land and water, and cattle were raided by both sides.","Attempts to set fixed borders failed, leading to repeated wars."],"Competition for land, water and cattle"],
  X:"The frontier wasn't a simple line with 'two sides'. Many groups lived there, and alliances often crossed language and culture.",
  C:["Which river was set as a boundary on the eastern frontier?",["Fish River","Limpopo","Vaal","Nile"],"In the Eastern Cape."],
  H:{L:[["Why cattle mattered","For the Xhosa, cattle were wealth, food, and part of ceremonies and lobola. For colonists, cattle were also wealth and income. This made cattle a cause of both trade and conflict.","Cattle raids were a major cause of the wars."],
        ["Using sources","Historians use letters, diaries, oral histories and maps. Different sources can tell very different stories, so compare them.","A settler's diary and a Xhosa oral history may describe the same event differently."]],
    Q:[["Why did cattle cause conflict?",["both sides valued them as wealth","they were dangerous","they were rare animals in zoos","they ate gold"],"Shared value."],
       ["Why compare different sources?",["each may show a different point of view","to find one to copy","they're always the same","to save time"],"Balanced history."],
       ["Who were the 1820 Settlers?",["British settlers placed near the eastern frontier","Xhosa leaders","Griqua traders","Portuguese explorers"],"Arrived in 1820."],
       ["Which is an example of co-operation?",["trading at a frontier fair","a cattle raid","a war","burning crops"],"Working together."]]}},
{ id:"s7g", T:1, t:"Map skills", s:"Scale, direction, coordinates and map types",
  L:[["Types of maps","Topographic maps show physical and human features using symbols. Street maps help navigate towns. Thematic maps show one topic, like rainfall or population.","A road atlas helps with long trips."],
     ["Scale three ways","A word scale (1 cm represents 5 km), a line (bar) scale, and a number (ratio) scale (1 : 500 000). Large-scale maps show small areas in detail.","1 : 50 000 means 1 cm on the map = 50 000 cm = 500 m."],
     ["Direction and position","Use 16 compass points for direction (like NNE and WSW). Use latitude and longitude in degrees and minutes for exact position (60 minutes = 1 degree).","Johannesburg is about 26°12′ S, 28°03′ E."]],
  A:{t:"fill", p:"Calculate real distances. Type the number only.", d:[["Scale 1 : 50 000. 4 cm on the map = how many km?","2"],["Scale 1 : 100 000. 7,5 cm on the map = how many km?","7,5"],["Scale 1 cm = 20 km. 3,5 cm on the map = how many km?","70"],["Scale 1 : 250 000. 2 cm on the map = how many km?","5"],["How many minutes are in 1 degree?","60"]]},
  Q:[["A scale of 1 : 50 000 means 1 cm on the map equals...",["500 m","50 m","5 km","50 km"],"50 000 cm = 500 m."],
     ["Which map shows only rainfall across South Africa?",["a thematic map","a street map","a topographic map","a building plan"],"One theme."],
     ["What direction is halfway between north and north-east?",["north-north-east (NNE)","east-north-east (ENE)","north-west","south"],"16-point compass."],
     ["How many minutes are in one degree of latitude?",["60","100","10","360"],"Like time."]],
  W:["On a 1 : 50 000 map, a road measures 6,5 cm. How long is it really?",["1 cm = 50 000 cm in real life.","Convert: 50 000 cm = 500 m = 0,5 km.","Multiply: 6,5 × 0,5 km = 3,25 km."],"3,25 km"],
  X:"A large-scale map (like 1 : 10 000) shows a SMALL area in great detail. A small-scale map (like 1 : 1 000 000) shows a LARGE area with less detail.",
  C:["Which shows more detail of a small area?",["1 : 10 000","1 : 1 000 000","1 : 5 000 000","a world map"],"Large scale."],
  H:{L:[["Converting cm to km","To change cm to km, divide by 100 000 (remove five zeros).","1 : 250 000 → 1 cm = 2,5 km."],
        ["Reading symbols","Every map has a key. Topographic maps use standard symbols: blue for water, green for vegetation, black for buildings and brown contour lines for height.","Contour lines close together mean a steep slope."]],
    Q:[["Contour lines close together show...",["a steep slope","flat land","a river","a road"],"Height changes quickly."],
       ["On a map, blue usually shows...",["water","roads","buildings","forests"],"Rivers and dams."],
       ["1 : 200 000 means 1 cm equals...",["2 km","20 km","200 m","200 km"],"Remove five zeros."],
       ["Which compass point is opposite NE?",["SW","SE","NW","NNE"],"Opposite."]]}},
{ id:"s7h", T:4, t:"Natural resources & conservation", s:"Using South Africa's resources sustainably",
  L:[["Natural resources","Natural resources are things from nature that people use: water, soil, forests, minerals, fish, wildlife and air. Some are renewable (can be replaced), others are non-renewable (will run out).","Fish are renewable if not overfished; coal is non-renewable."],
     ["Threats","Overuse, pollution, poaching, invasive alien plants, soil erosion and climate change threaten our resources.","Rhino poaching threatens one of the Big Five."],
     ["Conservation","Conservation means protecting and wisely using resources so future generations have them. National parks, marine protected areas, recycling and saving water all help.","SANParks manages national parks like Kruger and Addo."]],
  A:{t:"sort", p:"Does this help or harm our natural resources?", b:["Helps conservation","Harms resources"], d:[["Removing invasive alien trees",0],["Rhino poaching",1],["Setting up marine protected areas",0],["Overfishing",1],["Planting indigenous trees",0],["Dumping waste in rivers",1]]},
  Q:[["Which is a non-renewable resource?",["coal","sunlight","wind","fish (managed well)"],"Takes millions of years to form."],
     ["Why are invasive alien plants a problem?",["they use lots of water and push out indigenous plants","they are too pretty","they grow too slowly","they make rain"],"Thirsty invaders."],
     ["Who manages national parks like Kruger?",["SANParks","Eskom","the SABC","the post office"],"South African National Parks."],
     ["Sustainable use means...",["using resources so they last for future generations","using everything now","never using resources","selling all resources"],"Think long term."]],
  W:["Suggest how a town can protect its water resources",["Fix leaks and encourage water saving in homes.","Remove water-thirsty invasive trees along rivers.","Stop pollution: treat sewage properly and stop dumping.","Protect wetlands, which clean and store water."],"Save water, clear invasive plants, prevent pollution and protect wetlands"],
  X:"Renewable resources can still run out if we use them faster than they can recover, like fish that are overfished.",
  C:["Rhino poaching is...",["illegal killing of rhinos for their horns","farming rhinos","counting rhinos","moving rhinos to parks"],"A serious threat."],
  H:{L:[["The tragedy of overuse","When many people take from a shared resource without limits, it can collapse, like overgrazed land or empty fishing grounds.","Fishing quotas limit how many fish can be caught."],
        ["What you can do","Save water and electricity, don't litter, recycle, plant indigenous plants and support conservation projects.","Small actions by many people make a big difference."]],
    Q:[["Fishing quotas are used to...",["stop overfishing","catch more fish","ban the sea","grow fish on land"],"Limits."],
       ["Which is something learners can do?",["recycle and save water","poach animals","litter","waste electricity"],"Every bit helps."],
       ["Wetlands help by...",["cleaning and storing water","causing floods","using up water","polluting rivers"],"Natural sponges."],
       ["Overgrazing leads to...",["soil erosion","healthier soil","more grass","more rain"],"Bare ground washes away."]]}}
];
G7_MORE.ls = [
{ id:"l7d", t:"Relationships & conflict resolution", s:"Healthy friendships and solving disagreements",
  L:[["Healthy relationships","Healthy friendships are built on respect, trust, honesty and support. Unhealthy relationships involve control, put-downs, pressure or jealousy.","A good friend is happy when you succeed."],
     ["Why conflict happens","Conflict happens because of misunderstandings, different opinions, competition or unmet needs. Conflict itself isn't bad; how we handle it matters.","Two friends both want to be team captain."],
     ["Resolving conflict","Calm down first, listen to each other, use 'I' statements, look for a win-win solution, and ask for help from a mediator if needed.","'I feel upset when plans change at the last minute' instead of 'You always ruin everything'."]],
  A:{t:"order", p:"Put the steps of resolving a conflict in order.", d:["Calm down and agree to talk","Each person explains their side using 'I' statements","Listen without interrupting","Brainstorm possible solutions together","Agree on a fair solution and try it"]},
  Q:[["Which is a sign of a healthy friendship?",["respect and trust","constant put-downs","controlling behaviour","jealousy"],"Mutual respect."],
     ["An 'I' statement sounds like...",["\"I feel hurt when I'm left out.\"","\"You're so selfish!\"","\"You always do this!\"","\"Whatever.\""],"Talks about your feelings."],
     ["A win-win solution means...",["both people are satisfied","one person wins","nobody gets anything","you fight it out"],"Fair to both."],
     ["A mediator is...",["a neutral person who helps both sides talk","the person who wins","a judge who punishes","a bystander who laughs"],"Helps resolve."]],
  W:["Two friends argue because one shared the other's secret. Resolve it.",["Calm down before talking.","Use 'I' statements: 'I felt betrayed when my secret was shared.'","Listen to the other side: maybe it was an accident or a misunderstanding.","Agree on a solution: an apology and a promise to keep private things private."],"Calm down, use 'I' statements, listen and agree on a fix"],
  X:"Avoiding conflict forever doesn't solve it, and neither does fighting. Talking it through respectfully does.",
  C:["What should you do first in a conflict?",["calm down","shout louder","walk away forever","post about it online"],"Clear head first."],
  H:{L:[["Online conflict","Arguments online can escalate quickly. Don't post when angry, never share private things, and block and report bullying.","Wait before replying to a hurtful message."],
        ["Warning signs","If a friend or partner checks your phone, tells you who to talk to, or makes you feel afraid, that's an unhealthy relationship. Talk to a trusted adult.","Control isn't love or friendship."]],
    Q:[["Before replying to a hurtful message, you should...",["wait and calm down","reply immediately with insults","share it everywhere","delete your account"],"Think first."],
       ["A friend who tells you who you may talk to is being...",["controlling","supportive","respectful","helpful"],"Warning sign."],
       ["Online bullying should be...",["blocked and reported","ignored forever","shared","copied"],"Take action."],
       ["Conflict can be...",["resolved by talking respectfully","solved only by fighting","never resolved","always bad"],"Communication."]]}},
{ id:"l7e", t:"Body image & self-care", s:"Puberty changes, body image and looking after yourself",
  L:[["Changing bodies","During puberty, bodies change shape and size at different rates. Some people grow early, others later. Both are normal.","Feet often grow before the rest of the body."],
     ["Body image","Body image is how you see and feel about your body. Images in media and on social media are often edited and don't show real bodies.","Filters can change faces and bodies completely."],
     ["Self-care","Eat balanced meals, sleep 9 to 11 hours, stay active, and talk about worries. Focus on what your body can do, not just how it looks.","'My legs let me play netball' is a positive thought."]],
  A:{t:"sort", p:"Does this support a healthy body image or harm it?", b:["Supports it","Harms it"], d:[["Focusing on what your body can do",0],["Comparing yourself to edited photos",1],["Eating balanced meals",0],["Skipping meals to look thinner",1],["Getting enough sleep",0],["Teasing others about their bodies",1]]},
  Q:[["Body image is...",["how you see and feel about your body","your height","your clothes size","your weight only"],"Thoughts and feelings."],
     ["Many images on social media are...",["edited or filtered","always real","official facts","unchanged"],"Not real life."],
     ["How much sleep do teenagers need?",["about 9 to 11 hours","3 hours","15 hours","no sleep"],"Growing bodies need rest."],
     ["Skipping meals to change your body is...",["unhealthy","a good diet","recommended","helpful for growth"],"Bodies need fuel."]],
  W:["A friend says 'I hate my body.' How can you respond?",["Listen without judging.","Point out that everyone grows differently and photos online are often edited.","Mention things you value about them that have nothing to do with looks.","If they seem very upset or stop eating, encourage them to talk to a trusted adult."],"Listen, reassure, focus on their strengths, and get help if needed"],
  X:"Comments about someone's body, even meant as jokes, can hurt for a long time. Compliment people on what they do, not how they look.",
  C:["Which is a positive self-talk statement?",["\"My body is strong and lets me play sport.\"","\"I look terrible.\"","\"I'll never look good.\"","\"Everyone is better than me.\""],"Focus on abilities."],
  H:{L:[["Media literacy","Ask: is this photo edited? Who benefits if I feel bad about myself? (Often companies selling products.)","Unfollow accounts that make you feel bad about yourself."],
        ["When to get help","If worries about your body stop you from eating, sleeping or enjoying life, speak to a trusted adult, clinic or school counsellor.","Help is available, and it works."]],
    Q:[["Who benefits when you feel bad about your body?",["companies selling products","you","your friends","nobody"],"Marketing."],
       ["A helpful action on social media is to...",["unfollow accounts that make you feel bad","compare yourself all day","post mean comments","edit every photo"],"Protect your mind."],

      o.connect(g).connect(AC.destination); o.start(t0); o.stop(t0 + .22);

}

function confetti() {
  sfx('win');
  if (reduced()) return;
  const cv = $('#confetti'), ctx = cv.getContext('2d'); if (!ctx) return;
  const W = cv.width = innerWidth * devicePixelRatio, H = cv.height = innerHeight * devicePixelRatio;
  const cs = getComputedStyle(document.body);
  const cols = ['--c-math','--c-eng','--c-sci','--c-ss','--c-ls','--sun'].map(v => cs.getPropertyValue(v).trim());
  const P = Array.from({ length: 140 }, () => ({ x: W / 2 + (Math.random() - .5) * W * .3, y: H * .35, vx: (Math.random() - .5) * 22 * devicePixelRatio, vy: (-Math.random() * 18 - 6) * devicePixelRatio, r: (4 + Math.random() * 6) * devicePixelRatio, c: pick(cols), a: Math.random() * 6, s: (Math.random() - .5) * .4 }));
  let f = 0;
  (function tick() {
    ctx.clearRect(0, 0, W, H);
    P.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .7 * devicePixelRatio; p.vx *= .985; p.a += p.s; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore(); });
    if (++f < 110) requestAnimationFrame(tick); else ctx.clearRect(0, 0, W, H);
  })();
}

/* ---------- answer checking ---------- */
function toNum(raw) {
  let s = String(raw).toLowerCase().replace(/[−–]/g, '-').replace(/\br\s*(?=-?\d)/, '').replace(/°|%|cm²|m²|cm³|cm|mm|km|kg|ml|\bm\b|\bg\b|\bl\b/g, '').trim();
  let m = s.match(/^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if (m) return (m[1] ? -1 : 1) * (+m[2] + m[3] / m[4]);
  m = s.match(/^(-?\d+)\s*\/\s*(\d+)$/);
  if (m) return m[2] == 0 ? NaN : m[1] / m[2];
  s = s.replace(/\s+/g, '').replace(',', '.');
  return /^-?\d+(\.\d+)?$/.test(s) ? parseFloat(s) : NaN;
}
const normStr = s => String(s).toLowerCase().replace(/[−–]/g, '-').replace(/\s+/g, ' ').replace(/\s*\/\s*/g, '/').trim();
function isRight(given, answer, exact) {
  if (normStr(given) === normStr(answer)) return true;
  if (exact) return false;
  const a = toNum(given), b = toNum(answer);
  return !isNaN(a) && !isNaN(b) && Math.abs(a - b) < 1e-9;
}

/* backup codes: a learner's progress packed into text that can be pasted on another device */
async function packCode(obj) {
  const json = JSON.stringify(obj);
  let bytes = new TextEncoder().encode(json), tag = 'BV1';
  try {
    if (window.CompressionStream) {
      const cs = new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'));
      bytes = new Uint8Array(await new Response(cs).arrayBuffer()); tag = 'BV1Z';
    }
  } catch (e) { bytes = new TextEncoder().encode(json); tag = 'BV1'; }
  let bin = ''; for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return tag + '.' + btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
async function unpackCode(code) {
  const m = String(code).trim().replace(/\s+/g, '').match(/^(BV1Z?)\.([A-Za-z0-9_-]+)$/);
  if (!m) throw new Error('format');
  const b64 = m[2].replace(/-/g, '+').replace(/_/g, '/');
  const bin = atob(b64 + '==='.slice((b64.length + 3) % 4));
  let bytes = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  if (m[1] === 'BV1Z') {
    if (!window.DecompressionStream) throw new Error('browser');
    const ds = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    bytes = new Uint8Array(await new Response(ds).arrayBuffer());
  }
  const obj = JSON.parse(new TextDecoder().decode(bytes));
  if (!obj || typeof obj.state !== 'object') throw new Error('format');
  return obj;
}
async function copyText(text, box) {
  try { await navigator.clipboard.writeText(text); toast('Backup code copied'); }
  catch (e) { const ta = box.querySelector('textarea'); if (ta) { ta.focus(); ta.select(); } toast('Select the code and copy it'); }
}

function viewSubject(app) {
  const s = subjects().find(x => x.id === V.s);
  if (!s) return go('home');
  const col = SUBJ_COLOR[s.id], w = WD(), c = crew(s.id);
  const cleared = s.topics.filter(t => topicComplete(t.id)).length;
  const nextId = (s.topics.find(t => !topicComplete(t.id)) || {}).id;
  const wave = [0, 40, 70, 40, 0, 20, 0];
  const intro = cleared === 0 ? 'Welcome to ' + c.region + '! ' + c.line + ' Start with level 1.'
    : cleared === s.topics.length ? 'You cleared every level in ' + c.region + '! Ready to face ' + w.boss.name + '?'
    : 'Great to see you again! You have cleared ' + cleared + ' of ' + s.topics.length + ' levels. Keep going!';
  const hasTerms = s.topics.some(x => x.T);
  app.innerHTML =
  '<div><button class="back" id="back">' + ic('back') + esc(w.name) + ' map</button></div>' +
  '<section class="region-head" style="--c:' + col + '">' + art(c, 'bob') +
    '<div class="txt"><p class="eyebrow">Grade ' + S.grade + ' · ' + esc(s.name) + '</p><h1>' + esc(c.region) + '</h1>' +
    '<div class="bubble"><b class="who">' + esc(c.name) + ', ' + esc(c.role.toLowerCase()) + '</b>' + esc(intro) + '</div></div></section>' +
  '<section class="map" id="map" style="--c:' + col + '"><svg class="trail" id="trail" aria-hidden="true"></svg>' + s.topics.map((t, i) => {
    const d = S.done[t.id] || {}, st = starsFor(d.q);
    const prevT = i ? s.topics[i - 1].T : undefined;
    let head = '';
    if (hasTerms && (i === 0 || t.T !== prevT)) {
      if (i > 0 && prevT) head += termBoss(prevT);
      head += '<div class="chapter" style="--c:' + col + '"><h2>' + (t.T ? 'Chapter ' + t.T + ' · Term ' + t.T : 'Bonus chapter') + '</h2><small>' + s.topics.filter(x => x.T === t.T).length + ' levels</small></div>';
    }
    return head + '<button class="lvl-row' + (topicComplete(t.id) ? ' complete' : '') + (t.id === nextId ? ' next' : '') + '" data-t="' + t.id + '" style="--x:' + wave[i % wave.length] + 'px">' +
      '<span class="lvl-node">' + (topicComplete(t.id) ? ic('check') : i + 1) + '</span>' +
      '<span class="lvl-card"><span class="tagn">Level ' + (i + 1) + (t.id === nextId ? ' · up next' : '') + '</span><h3>' + esc(t.t) + '</h3>' +
      '<span class="meta">' +
        '<span class="chip' + (d.l ? ' ok' : '') + '">' + (d.l ? ic('check') : '') + 'Learn</span>' +
        '<span class="chip' + (d.a ? ' ok' : '') + '">' + (d.a ? ic('check') : '') + 'Train</span>' +
        '<span class="chip' + (d.q != null ? ' ok' : '') + '">Challenge <span class="stars" aria-label="' + st + ' of 3 stars">' + '★'.repeat(st) + '<span class="off">' + '★'.repeat(3 - st) + '</span></span></span>' +
      '</span></span></button>';
  }).join('') + (hasTerms && s.topics[s.topics.length - 1].T ? termBoss(s.topics[s.topics.length - 1].T) : '') +
  '<div class="boss-row" style="--c:' + col + '">' + art(w.boss, 'bob') +
    '<div><p class="eyebrow">Final boss</p><h3 style="font-size:1.25rem">Battle ' + esc(w.boss.name) + '</h3><p class="muted">10 questions from every level in ' + esc(c.region) + '. Score 70% or more to win.</p></div>' +
    '<button class="btn" id="startTest">' + ic('target') + 'Start the battle</button></div>' +
  '</section>';
  function termBoss(T) {
    return '<div class="chapter" style="--c:' + col + ';border-style:solid"><h2 style="font-size:1rem">Term ' + T + ' boss</h2><button class="btn small term-test" data-term="' + T + '">' + ic('target') + 'Battle for Term ' + T + '</button></div>';
  }
  $('#back').onclick = () => go('home');
  $('#startTest').onclick = () => go('test', { s: s.id });
  $$('.term-test', app).forEach(b => b.onclick = () => go('test', { s: s.id, term: +b.dataset.term }));
  $$('.lvl-row', app).forEach(b => b.onclick = () => {
    const d = S.done[b.dataset.t] || {};
    go('topic', { t: b.dataset.t, tab: !d.l ? 'learn' : !d.a ? 'act' : 'quiz' });
  });
  drawTrail();
  const onResize = () => drawTrail();
  window.addEventListener('resize', onResize);
  cleanup = () => window.removeEventListener('resize', onResize);
}
/* dashed trail joining the level nodes on a region map */
function drawTrail() {
  const map = $('#map'), svg = $('#trail'); if (!map || !svg) return;
  const box = map.getBoundingClientRect();
  const pts = $$('.lvl-node', map).map(n => { const r = n.getBoundingClientRect(); return [r.left - box.left + r.width / 2, r.top - box.top + r.height / 2]; });
  if (pts.length < 2) { svg.innerHTML = ''; return; }
  let d = 'M' + pts[0][0] + ' ' + pts[0][1];
  for (let i = 1; i < pts.length; i++) { const a = pts[i - 1], b = pts[i], my = (a[1] + b[1]) / 2; d += ' C' + a[0] + ' ' + my + ' ' + b[0] + ' ' + my + ' ' + b[0] + ' ' + b[1]; }
  svg.innerHTML = '<path d="' + d + '" fill="none" stroke="var(--surface)" stroke-width="14" stroke-linecap="round" opacity=".85"/><path d="' + d + '" fill="none" stroke="var(--c)" stroke-width="4" stroke-dasharray="2 12" stroke-linecap="round"/>';
}

/* ---------- topic ---------- */
function viewTopic(app) {
  const f = findTopic(V.t); if (!f) return go('home');
  const { s, t } = f, col = SUBJ_COLOR[s.id], d = S.done[t.id] || {};
  const tabs = [['learn', 'Learn', 'book', d.l], ['act', 'Train', 'puzzle', d.a], ['quiz', 'Challenge', 'quiz', d.q != null]];
  const c = crew(s.id), lvl = s.topics.indexOf(t) + 1;
  const say = { learn: 'Let’s learn this one card at a time. ' + c.line, act: 'Training time! Show me what you learnt.', quiz: 'Challenge round! Score 3 or more to clear this level.' }[V.tab];
  app.innerHTML =
  '<div><button class="back" id="back">' + ic('back') + esc(c.region) + '</button></div>' +
  '<section class="lvl-head" style="--c:' + col + '"><span class="av bob">' + art(c) + '</span>' +
    '<div class="bubble"><span class="tag" style="--c:' + col + '">Level ' + lvl + ' · ' + esc(s.name) + ' · Grade ' + f.g + '</span><h1>' + esc(t.t) + '</h1><span style="font-weight:600"><b style="color:var(--brand)">' + esc(c.name) + ':</b> ' + esc(say) + '</span></div></section>' +
  '<div class="tabs" role="tablist">' + tabs.map(x => '<button role="tab" aria-selected="' + (V.tab === x[0]) + '" data-tab="' + x[0] + '">' + ic(x[2]) + x[1] + (x[3] ? ic('check', 'tick') : '') + '</button>').join('') + '</div>' +
  '<section class="stage" id="stage" style="--c:' + col + '"></section>';
  $('#back').onclick = () => go('subject', { s: s.id });
  $$('.tabs button', app).forEach(b => b.onclick = () => go('topic', { t: t.id, tab: b.dataset.tab }));
  const stage = $('#stage');
  if (V.tab === 'learn') learn(stage, t);
  else if (V.tab === 'act') activity(stage, t);
  else topicQuiz(stage, t, s);
}

/* step-by-step worked example: reveals one step per tap */
function mountWorked(box, W, startAll) {
  let shown = startAll ? W[1].length : 0;
  const draw = () => {
    const done = shown >= W[1].length;
    box.innerHTML = '<div class="worked"><p class="eyebrow">Problem</p><p class="wk-q">' + fmt(W[0]) + '</p>' +
      '<ol class="wk-steps">' + W[1].slice(0, shown).map(s => '<li>' + fmt(s) + '</li>').join('') + '</ol>' +
      (done ? '<div class="wk-ans"><span class="eyebrow">Answer</span><b>' + fmt(W[2]) + '</b></div>'
            : '<button class="btn small ghost wk-next">' + ic('next') + (shown ? 'Show next step' : 'Show the first step') + ' (' + (shown + 1) + ' of ' + W[1].length + ')</button>') + '</div>';
    const b = $('.wk-next', box); if (b) b.onclick = () => { shown++; draw(); const nb = $('.wk-next', box); if (nb) nb.focus(); };
  };
  draw();
}

function learn(stage, t) {
  const sid = findTopic(t.id).s.id;
  const cards = t.L.map(c => ({ k:'c', c }));
  if (t.W) cards.push({ k:'w' });
  if (t.X) cards.push({ k:'x' });
  if (t.C) cards.push({ k:'k' });
  let i = 0, answered = false;
  const draw = () => {
    const card = cards[i], last = i === cards.length - 1;
    const label = { c:'Lesson card', w:'Step by step', x:'Watch out', k:'Quick check' }[card.k];
    let body = '';
    if (card.k === 'c') {
      const c = card.c;
      body = '<h2 class="card-h">' + esc(c[0]) + '</h2><p class="card-b">' + fmt(c[1]) + '</p>' +
        (c[2] ? '<div class="example"><p class="eyebrow">Example</p><p>' + fmt(c[2]) + '</p></div>' : '');
    } else if (card.k === 'w') {
      body = '<h2 class="card-h">Let\'s work one out together</h2><p class="muted">Tap to reveal each step. Try to guess the next step before you tap.</p><div id="wk"></div>';
    } else if (card.k === 'x') {
      body = '<div class="watch"><span class="av wobble">' + art(crew(sid)) + '</span><div><h2 class="card-h">' + esc(crew(sid).name) + ' says: watch out!</h2><p class="card-b">' + fmt(t.X) + '</p></div></div>';
    } else {
      body = '<h2 class="card-h">Quick check</h2><p class="muted">One question to see if it clicked.</p><div id="chk"></div>';
    }
    stage.innerHTML =
      '<div class="row end"><span class="eyebrow">' + label + ' · ' + (i + 1) + ' of ' + cards.length + '</span><span class="dots">' + cards.map((_, k) => '<i class="' + (k <= i ? 'on' : '') + '"></i>').join('') + '</span></div>' +
      body +
      '<div class="row end"><button class="btn ghost" id="prev"' + (i === 0 ? ' disabled' : '') + '>' + ic('back') + 'Back</button>' +
      '<button class="btn" id="nxt"' + (card.k === 'k' && !answered ? ' disabled' : '') + '>' + (last ? 'Finish lesson' + ic('check') : 'Next' + ic('next')) + '</button></div>';
    if (card.k === 'w') mountWorked($('#wk', stage), t.W);
    if (card.k === 'k') {
      const o = shuffle(t.C[1]), a = o.indexOf(t.C[1][0]);
      const box = $('#chk', stage);
      box.innerHTML = '<p class="q" style="margin-bottom:12px">' + esc(t.C[0]) + '</p><div class="answers">' + o.map((x, k) => '<button class="opt" data-k="' + k + '"><span class="key">' + 'ABCD'[k] + '</span><span>' + esc(x) + '</span></button>').join('') + '</div><div class="fbk"></div>';
      const btns = $$('.opt', box);
      btns.forEach(b => b.onclick = () => {
        const k = +b.dataset.k, ok = k === a; answered = true;
        record(t.id, t.C[0], ok);
        btns.forEach((x, n) => { x.disabled = true; x.classList.add(n === a ? 'right' : n === k ? 'bad' : 'dim'); });
        sfx(ok ? 'good' : 'bad');
        $('.fbk', box).innerHTML = '<div style="margin-top:12px">' + reactHTML(sid, ok, t.C[2] + (ok ? '' : ' Go back a few cards to look again if you need to.')) + '</div>';
        $('#nxt', stage).disabled = false;
      });
    }
    $('#prev', stage).onclick = () => { i--; draw(); };
    $('#nxt', stage).onclick = () => {
      if (!last) { i++; draw(); return; }
      const first = !D(t.id).l; D(t.id).l = 1; addXP(first ? 15 : 0);
      go('topic', { t: t.id, tab: 'act' });
    };
  };
  draw();
}

function activityDone(stage, t, mistakes) {
  const first = !D(t.id).a; D(t.id).a = 1; addXP(first ? 15 : 5);
  if (mistakes === 0) confetti();
  const box = document.createElement('div');
  box.className = 'feedback good';
  box.innerHTML = '<b>' + (mistakes === 0 ? pick(WD().cheers) + ' No mistakes!' : 'Training complete!') + '</b>' + (mistakes ? mistakes + ' tr' + (mistakes === 1 ? 'y' : 'ies') + ' needed fixing. Practice makes perfect.' : '');
  const row = document.createElement('div'); row.className = 'row';
  row.innerHTML = '<button class="btn" id="toQuiz">Start the challenge' + ic('next') + '</button><button class="btn ghost" id="again">Train again</button>';
  stage.append(box, row);
  $('#toQuiz', stage).onclick = () => go('topic', { t: t.id, tab: 'quiz' });
  $('#again', stage).onclick = () => go('topic', { t: t.id, tab: 'act' });
  box.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'center' });
}
const bump = el => { el.classList.remove('bad'); void el.offsetWidth; el.classList.add('bad'); setTimeout(() => el.classList.remove('bad'), 450); };

function activity(stage, t) {
  const A = t.A; let mistakes = 0;
  const head = '<p class="prompt">' + esc(A.p) + '</p>';
  if (A.t === 'match') {
    const L = A.d.map((p, i) => ({ t: p[0], i })), R = shuffle(A.d.map((p, i) => ({ t: p[1], i })));
    stage.innerHTML = head + '<p class="muted">Tap one item on each side to make a pair.</p><div class="match"><div class="col">' + L.map(x => '<button class="opt" data-side="L" data-i="' + x.i + '">' + esc(x.t) + '</button>').join('') + '</div><div class="col">' + R.map(x => '<button class="opt" data-side="R" data-i="' + x.i + '">' + esc(x.t) + '</button>').join('') + '</div></div>';
    let sel = { L: null, R: null }, left = A.d.length;
    $$('.opt', stage).forEach(b => b.onclick = () => {
      const side = b.dataset.side;
      if (sel[side]) sel[side].classList.remove('sel');
      sel[side] = b; b.classList.add('sel');
      if (sel.L && sel.R) {
        const a = sel.L, c = sel.R; sel = { L: null, R: null };
        a.classList.remove('sel'); c.classList.remove('sel');
        if (a.dataset.i === c.dataset.i) { a.classList.add('done'); c.classList.add('done'); if (--left === 0) activityDone(stage, t, mistakes); }
        else { mistakes++; bump(a); bump(c); }
      }
    });
  } else if (A.t === 'sort') {
    const items = shuffle(A.d.map((x, i) => ({ t: x[0], b: x[1], i })));
    stage.innerHTML = head + '<p class="muted">Tap an item, then tap the group it belongs in.</p><div class="pool" id="pool">' + items.map(x => '<button class="opt" data-i="' + x.i + '">' + esc(x.t) + '</button>').join('') + '</div>' +
      '<div class="buckets">' + A.b.map((name, k) => '<button class="bucket" data-b="' + k + '"><h4>' + esc(name) + '</h4><span class="in"></span></button>').join('') + '</div><p class="hint" id="hint"></p>';
    let sel = null, left = items.length;
    const ready = on => $$('.bucket', stage).forEach(b => b.classList.toggle('ready', on));
    $$('#pool .opt', stage).forEach(b => b.onclick = () => { if (sel) sel.classList.remove('sel'); sel = b; b.classList.add('sel'); ready(true); $('#hint', stage).textContent = ''; });
    $$('.bucket', stage).forEach(bk => bk.onclick = () => {
      if (!sel) { $('#hint', stage).textContent = 'First tap an item above.'; return; }
      const it = A.d[+sel.dataset.i];
      if (it[1] === +bk.dataset.b) {
        const sp = document.createElement('span'); sp.textContent = it[0]; $('.in', bk).appendChild(sp);
        sel.remove(); sel = null; ready(false);
        if (--left === 0) { $('#pool', stage).remove(); activityDone(stage, t, mistakes); }
      } else { mistakes++; bump(sel); $('#hint', stage).textContent = 'Not that group. Try another one.'; }
    });
  } else if (A.t === 'order') {
    const items = shuffle(A.d.map((x, i) => ({ t: x, i })));
    stage.innerHTML = head + '<p class="muted">Tap the items in the right order.</p><ol class="seq" id="seq"></ol><div class="pool" id="pool">' + items.map(x => '<button class="opt" data-i="' + x.i + '">' + esc(x.t) + '</button>').join('') + '</div>';
    let nextI = 0;
    $$('#pool .opt', stage).forEach(b => b.onclick = () => {
      if (+b.dataset.i === nextI) {
        const li = document.createElement('li'); li.textContent = A.d[nextI]; $('#seq', stage).appendChild(li);
        b.remove(); nextI++;
        if (nextI === A.d.length) { $('#pool', stage).remove(); activityDone(stage, t, mistakes); }
      } else { mistakes++; bump(b); }
    });
  } else if (A.t === 'fill') {
    stage.innerHTML = head + '<div class="fills">' + A.d.map((x, k) =>
      '<form class="fill" data-k="' + k + '"><label for="f' + t.id + k + '">' + esc(x[0]) + '</label><input id="f' + t.id + k + '" autocomplete="off" inputmode="text" spellcheck="false"><button class="btn small">Check</button><span class="note" hidden></span></form>').join('') + '</div>';
    let left = A.d.length; const tries = A.d.map(() => 0);
    $$('.fill', stage).forEach(fm => fm.onsubmit = e => {
      e.preventDefault();
      const k = +fm.dataset.k, inp = $('input', fm), note = $('.note', fm), x = A.d[k];
      if (!inp.value.trim()) { inp.focus(); return; }
      if (isRight(inp.value, x[1], x[2])) {
        fm.className = 'fill ok'; note.hidden = false; note.textContent = pick(['Correct!', 'Sharp sharp!', 'Yebo, that\'s it!', 'Spot on!']);
      } else {
        tries[k]++; mistakes++;
        fm.className = 'fill no'; note.hidden = false;
        if (tries[k] < 2) { note.textContent = 'Not quite. Have another go.'; bump(inp); inp.select(); return; }
        note.textContent = 'The answer is ' + x[1] + '. Look back at the lesson to see why.';
      }
      inp.disabled = true; $('button', fm).disabled = true;
      const nxt = $$('.fill input:not([disabled])', stage)[0]; if (nxt) nxt.focus();
      if (--left === 0) activityDone(stage, t, mistakes);
    });
  }
}

/* ---------- quiz engine ---------- */
const CHEERS = ['Lekker!', 'Sharp sharp!', 'Yebo!', 'Spot on!', 'Eish, you\'re good!', 'Nice one!'];
function runQuiz(stage, list, onEnd) {
  const items = list.map(x => { const o = shuffle(x.q[1]); return { q: x.q[0], o, a: o.indexOf(x.q[1][0]), why: x.q[2], s: x.s, tid: x.t }; });
  let i = 0, score = 0;
  const draw = () => {
    const it = items[i];
    stage.innerHTML =
      '<div class="qtop"><span class="eyebrow">Question ' + (i + 1) + ' of ' + items.length + '</span>' + (it.s ? '<span class="tag" style="--c:' + SUBJ_COLOR[it.s.id] + '">' + ic(it.s.id) + esc(it.s.name) + '</span>' : '') + '<span class="eyebrow">Score ' + score + '</span></div>' +
      '<div class="qbar"><i style="width:' + (i / items.length * 100) + '%"></i></div>' +
      '<h2 class="q">' + esc(it.q) + '</h2>' +
      '<div class="answers">' + it.o.map((o, k) => '<button class="opt" data-k="' + k + '"><span class="key">' + 'ABCD'[k] + '</span><span>' + esc(o) + '</span></button>').join('') + '</div>' +
      '<div id="fb"></div>';
    const btns = $$('.answers .opt', stage);
    btns.forEach(b => b.onclick = () => {
      const k = +b.dataset.k, ok = k === it.a;
      if (ok) score++;
      record(it.tid, it.q, ok);
      btns.forEach((x, n) => { x.disabled = true; if (n === it.a) x.classList.add('right'); else if (n === k) x.classList.add('bad'); else x.classList.add('dim'); });
      const last = i === items.length - 1;
      const ft = it.tid && findTopic(it.tid), W = ft && ft.t.W;
      sfx(ok ? 'good' : 'bad');
      $('#fb', stage).innerHTML = reactHTML(it.s ? it.s.id : ft ? ft.s.id : 'math', ok, it.why) +
        '<div class="row" style="margin-top:14px"><button class="btn" id="qn">' + (last ? 'See my score' : 'Next question') + ic('next') + '</button>' +
        (!ok && W ? '<button class="btn ghost" id="how">' + ic('book') + 'Show me how</button>' : '') + '</div><div id="howBox" style="margin-top:14px"></div>';
      if ($('#how', stage)) $('#how', stage).onclick = () => { $('#how', stage).remove(); mountWorked($('#howBox', stage), W, true); };
      $('#qn', stage).focus();
      $('#qn', stage).onclick = () => { if (last) onEnd(score, items.length); else { i++; draw(); } };
    });
  };
  draw();
}
const starRow = n => '<div class="bigstars" aria-label="' + n + ' of 3 stars">' + '★'.repeat(n) + '<span class="off">' + '★'.repeat(3 - n) + '</span></div>';

function topicQuiz(stage, t, s) {
  runQuiz(stage, shuffle(t.Q).map(q => ({ q, t: t.id })), (score, total) => {
    const d = D(t.id), best = d.q == null ? 0 : d.q;
    const gain = Math.max(0, score - best) * 5;
    d.q = Math.max(best, score);
    addXP(gain);
    if (score === total) confetti();
    const st = starsFor(score), c = crew(s.id), cleared = topicComplete(t.id);
    stage.innerHTML = '<div class="result"><span class="' + (score >= 3 ? 'hop' : 'wobble') + '" style="display:block">' + art(c) + '</span><p class="eyebrow">' + (cleared ? 'Level cleared!' : 'Challenge complete') + '</p><div class="score">' + score + '/' + total + '</div>' + starRow(st) +
      '<p class="lede"><b style="color:var(--brand)">' + esc(c.name) + ':</b> ' + (score === total ? pick(WD().cheers) + ' Full marks!' : score >= 3 ? 'Great work! One more go for 3 stars?' : 'Let\u2019s train a bit more, then try again.') +
      (cleared ? ' You recovered a ' + esc(WD().collect[0]) + '!' : (d.l && d.a ? '' : ' Finish the lesson and training too, to clear this level.')) + '</p>' +
      (gain ? '' : '<p class="muted">Beat your best score (' + best + '/4) to earn more XP.</p>') +
      '<div class="row" style="justify-content:center"><button class="btn" id="back2">Back to ' + esc(c.region) + '</button><button class="btn ghost" id="retry">Try again</button>' + (score < 3 ? '<button class="btn ghost" id="relearn">' + ic('target') + 'Get extra help</button>' : '') + '</div></div>';
    $('#back2', stage).onclick = () => go('subject', { s: s.id });
    $('#retry', stage).onclick = () => go('topic', { t: t.id, tab: 'quiz' });
    if ($('#relearn', stage)) $('#relearn', stage).onclick = () => go('help', { t: t.id });
  });
}

/* ---------- daily challenge + subject test ---------- */
function seeded(str) { let h = 1779033703 ^ str.length; for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; } return function () { h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909); h ^= h >>> 16; let t = (h += 0x6D2B79F5); t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function challengeShell(app, title, sub, col, startLabel, onStart) {
  app.innerHTML = '<div><button class="back" id="back">' + ic('back') + esc(WD().name) + ' map</button></div>' +
    '<section class="t-head"><h1>' + title + '</h1><p class="lede">' + sub + '</p></section><section class="stage" id="stage" style="--c:' + col + '"></section>';
  $('#back').onclick = () => go(V.view === 'test' ? 'subject' : 'home', V.view === 'test' ? { s: V.s } : null);
  if (V.view === 'test') $('#back').innerHTML = ic('back') + 'Back to ' + esc(crew(V.s).region);
  const stage = $('#stage');
  stage.innerHTML = '<div class="result">' + startLabel + '<div class="row" style="justify-content:center"><button class="btn" id="go">Let\'s go' + ic('next') + '</button></div></div>';
  $('#go', stage).onclick = () => onStart(stage);
}
function viewDaily(app) {
  const g = S.grade, rnd = seeded(today() + '#' + g);
  const pool = []; subjects(g).forEach(s => s.topics.forEach(t => t.Q.forEach(q => pool.push({ q, s, t: t.id }))));
  // one question per subject first, then fill to 8, all chosen by today's date
  const bySubj = subjects(g).map(s => shuffle(pool.filter(x => x.s === s), rnd)[0]);
  const rest = shuffle(pool.filter(x => !bySubj.includes(x)), rnd).slice(0, 8 - bySubj.length);
  const list = shuffle(bySubj.concat(rest), rnd);
  const dd = S.daily[g], doneToday = dd && dd.date === today();
  challengeShell(app, 'Daily Quest', 'Grade ' + g + ' · ' + new Date().toLocaleDateString('en-ZA', { weekday: 'long', day: 'numeric', month: 'long' }), 'var(--c-math)',
    '<span class="bob" style="display:block">' + art(WD().guide) + '</span><p class="eyebrow">8 questions · every region</p><p class="lede"><b style="color:var(--brand)">' + esc(WD().guide.name) + ':</b> ' + (doneToday ? 'You scored ' + dd.score + '/8 today. Play again for practice (XP is only given once a day).' : 'Everyone in Grade ' + g + ' gets the same set today. Earn 5 XP per right answer plus a 20 XP bonus.') + '</p>',
    stage => runQuiz(stage, list, score => {
      const already = doneToday;
      if (!already) { S.daily[g] = { date: today(), score }; addXP(score * 5 + 20); } else { S.daily[g].score = Math.max(S.daily[g].score, score); save(); }
      if (score >= 7) confetti();
      stage.innerHTML = '<div class="result">' + art(WD().guide, 'hop') + '<p class="eyebrow">Daily Quest done</p><div class="score">' + score + '/8</div><p class="lede">' + (score === 8 ? 'Perfect day!' : score >= 6 ? 'Strong effort! Come back tomorrow for a new set.' : 'Every day you practise, it gets easier. See you tomorrow!') + '</p>' +
        '<div class="row" style="justify-content:center"><button class="btn" id="home">Back home</button></div></div>';
      $('#home', stage).onclick = () => go('home');
    }));
}

/* ---------- My Report ---------- */
function reportData(g) {
  const rows = [];
  subjects(g).forEach(s => s.topics.forEach(t => { const m = mastery(t.id); rows.push({ s, t, m, lv: levelOf(m) }); }));
  const tried = rows.filter(r => r.m != null);
  const st = tried.reduce((a, r) => { const x = S.stats[r.t.id]; a.r += x.r; a.n += x.n; return a; }, { r:0, n:0 });
  const bySubj = subjects(g).map(s => {
    const tr = tried.filter(r => r.s === s);
    return { s, tried: tr.length, total: s.topics.length, avg: tr.length ? Math.round(tr.reduce((a, r) => a + r.m, 0) / tr.length) : null };
  });
  return { rows, tried, acc: st.n ? Math.round(100 * st.r / st.n) : null, answered: st.n, bySubj,
    weak: tried.filter(r => r.lv === 'weak').sort((a, b) => a.m - b.m),
    okay: tried.filter(r => r.lv === 'ok').sort((a, b) => a.m - b.m),
    strong: tried.filter(r => r.lv === 'strong').sort((a, b) => b.m - a.m),
    untried: rows.filter(r => r.m == null) };
}

/* ---------- speed sprint ---------- */
const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const comma = n => String(Math.round(n * 100) / 100).replace('.', ',');
const neg = n => n < 0 ? '(−' + (-n) + ')' : String(n);
function makeSum(g) {
  const kinds = {
    5: [() => { const a = R(12, 99), b = R(11, 99); return [a + ' + ' + b, a + b]; },
        () => { const a = R(50, 199), b = R(10, a - 5); return [a + ' − ' + b, a - b]; },
        () => { const a = R(2, 10), b = R(2, 10); return [a + ' × ' + b, a * b]; },
        () => { const a = R(2, 10), b = R(2, 10); return [(a * b) + ' ÷ ' + a, b]; },
        () => { const a = R(2, 9) * 10, b = R(2, 9); return [a + ' × ' + b, a * b]; }],
    6: [() => { const a = R(2, 12), b = R(2, 12); return [a + ' × ' + b, a * b]; },
        () => { const a = R(2, 12), b = R(2, 12); return [(a * b) + ' ÷ ' + b, a]; },
        () => { const a = R(13, 99); return ['Double ' + a, a * 2]; },
        () => { const a = R(10, 99) * 2; return ['Half of ' + a, a / 2]; },
        () => { const a = R(1, 9), b = R(1, 9); return ['0,' + a + ' + 0,' + b, (a + b) / 10]; },
        () => { const a = R(1, 9) * 10; return ['10% of ' + a * 10, a]; }],
    7: [() => { const a = R(-12, 12), b = R(-12, 12); return [String(a).replace('-', '−') + ' + ' + neg(b), a + b]; },
        () => { const a = R(-10, 10), b = R(1, 15); return [String(a).replace('-', '−') + ' − ' + b, a - b]; },
        () => { const a = R(2, 15); return [a + '²', a * a]; },
        () => { const a = R(2, 12); return ['√' + a * a, a]; },
        () => { const a = R(1, 5); return [a + '³', a * a * a]; },
        () => { const p = pick([10, 20, 25, 50]), a = R(2, 20) * 20; return [p + '% of ' + a, a * p / 100]; },
        () => { const a = R(2, 12), b = R(2, 12); return [a + ' × ' + b, a * b]; }]
  };
  return pick(kinds[g])();
}
function viewSprint(app) {
  const g = S.grade;
  app.innerHTML = '<div><button class="back" id="back">' + ic('back') + 'Home</button></div>' +
    '<section class="t-head"><h1>Speed Run with ' + esc(crew('math').name) + '</h1><p class="lede">Grade ' + g + ' mental maths. 60 seconds on the clock. Your best: ' + (S.sprint[g] || 0) + '</p></section>' +
    '<section class="stage sprint-stage" id="stage" style="--c:var(--c-ls)"><div class="result">' + art(crew('math'), 'bob') + '<p class="lede">Type with the keypad or your keyboard and press Go (or Enter). Wrong answers just shake, so keep trying or skip.</p><button class="btn" id="go">Start the clock' + ic('timer') + '</button></div></section>';
  $('#back').onclick = () => go('home');
  $('#go').onclick = () => start($('#stage'));
  function start(stage) {
    let score = 0, entry = '', cur = makeSum(g), end = Date.now() + 60000, over = false;
    stage.innerHTML = '<div class="timer"><i id="tm"></i></div><div class="sprint-score"><span id="sc">Score 0</span><span id="sec">60s</span></div>' +
      '<div class="sum" id="sum"></div><div class="entry" id="en" aria-live="polite"></div>' +
      '<div class="pad" id="pad">' + ['7','8','9','⌫','4','5','6','Go','1','2','3','−','0',',','Skip'].map(k => '<button data-k="' + k + '"' + (k === 'Go' ? ' class="go"' : '') + '>' + k + '</button>').join('') + '</div>';
    const sum = $('#sum', stage), en = $('#en', stage);
    const show = () => { sum.textContent = cur[0] + ' = ?'; en.textContent = entry || ' '; };
    const press = k => {
      if (over) return;
      if (k === '⌫') entry = entry.slice(0, -1);
      else if (k === 'Skip') { entry = ''; cur = makeSum(g); }
      else if (k === 'Go') {
        if (!entry) return;
        if (isRight(entry, cur[1])) { score++; sfx('tap'); $('#sc', stage).textContent = 'Score ' + score; en.className = 'entry good'; setTimeout(() => en.className = 'entry', 200); cur = makeSum(g); entry = ''; }
        else { en.className = 'entry'; void en.offsetWidth; en.className = 'entry bad'; entry = ''; }
      } else if (k === '−') { entry = entry.startsWith('-') ? entry.slice(1) : '-' + entry; }
      else if (entry.length < 7) entry += k;
      show();
    };
    $('#pad', stage).onclick = e => { const b = e.target.closest('button'); if (b) press(b.dataset.k); };
    const onKey = e => {
      if (/^[0-9]$/.test(e.key)) press(e.key);
      else if (e.key === 'Backspace') press('⌫');
      else if (e.key === 'Enter') { e.preventDefault(); press('Go'); }
      else if (e.key === '-') press('−');
      else if (e.key === ',' || e.key === '.') press(',');
    };
    document.addEventListener('keydown', onKey);
    const timer = setInterval(() => {
      const left = Math.max(0, end - Date.now());
      $('#tm', stage).style.width = (left / 600) + '%';
      $('#sec', stage).textContent = Math.ceil(left / 1000) + 's';
      if (left <= 0) finish();
    }, 200);
    cleanup = () => { clearInterval(timer); document.removeEventListener('keydown', onKey); };
    function finish() {
      over = true; cleanup(); cleanup = null;
      const best = S.sprint[g] || 0, isBest = score > best;
      if (isBest) S.sprint[g] = score;
      addXP(score);
      if (isBest && score > 0) confetti();
      stage.innerHTML = '<div class="result">' + art(crew('math'), 'hop') + '<p class="eyebrow">Time!</p><div class="score">' + score + '</div><p class="lede">' + (isBest && score > 0 ? 'New personal best!' : 'Your best is ' + best + '. Have another go!') + '</p><div class="row" style="justify-content:center"><button class="btn" id="again">Run again</button><button class="btn ghost" id="home">Home</button></div></div>';
      $('#again', stage).onclick = () => start(stage);
      $('#home', stage).onclick = () => go('home');
    }
    show();
  }
}

/* ---------- boot ---------- */
if (![5,6,7].includes(S.grade)) S.grade = 5;
go('home');
cloudInit();
})();

</script>

  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
