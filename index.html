const G5_MORE = { math:[
{ id:"m5f", T:1, t:"Adding & subtracting big numbers", s:"Column method, carrying, borrowing and checking",
  L:[["Line up the columns","Write the numbers under each other so units are under units, tens under tens and so on. Always start adding or subtracting from the units column.","4 356 + 2 518 = 6 874. Work from the units: 6 + 8 = 14 (write 4, carry 1), then 5 + 1 + 1 = 7, then 3 + 5 = 8, then 4 + 2 = 6."],
     ["Carrying when adding","If a column adds up to 10 or more, write the units digit and carry the tens to the next column.","6 + 8 = 14 in the units: write 4, carry 1 to the tens."],
     ["Borrowing when subtracting","If the top digit is smaller, borrow 1 from the next column. That 1 is worth 10 in the column you need it.","52 − 17: 2 − 7 won't work, so borrow: 12 − 7 = 5, then 4 − 1 = 3. Answer: 35."]],
  A:{t:"fill", p:"Work these out. Use the column method on paper if it helps.", d:[["345 + 238","583"],["1 206 + 3 795","5001"],["600 − 245","355"],["5 000 − 1 234","3766"],["2 468 + 1 357","3825"]]},
  Q:[["What is 4 527 + 3 685?",["8 212","7 212","8 202","8 112"],"7 + 5 = 12 (carry 1), 2 + 8 + 1 = 11 (carry 1), 5 + 6 + 1 = 12 (carry 1), 4 + 3 + 1 = 8."],
     ["What is 803 − 456?",["347","453","357","447"],"Borrow twice: 13 − 6 = 7, 9 − 5 = 4, 7 − 4 = 3."],
     ["A school has 1 245 learners. 378 are in Grade 5. How many are NOT in Grade 5?",["867","977","1 623","877"],"1 245 − 378 = 867."],
     ["How can you check 652 − 287 = 365?",["Add 365 + 287 and see if you get 652","Subtract 652 − 365","Multiply 365 × 287","Add 652 + 287"],"Addition undoes subtraction."]],
  W:["Calculate 3 402 − 1 658",["Units: 2 − 8 won't work. The tens is 0, so borrow from the hundreds: 4 hundreds becomes 3, tens becomes 10.","Now borrow from the tens: tens becomes 9, units becomes 12. 12 − 8 = 4.","Tens: 9 − 5 = 4. Hundreds: 3 − 6 won't work, borrow from thousands: 13 − 6 = 7.","Thousands: 2 − 1 = 1. Answer: 1 744."],"1 744"],
  X:"Don't subtract the smaller digit from the bigger one just because it's easier. In 52 − 17, the units answer is NOT 7 − 2. You must borrow.",
  C:["What is 2 999 + 1?",["3 000","2 1000","3 999","2 990"],"Every 9 becomes 0 and the 1 carries all the way."],
  H:{L:[["Round first to estimate","Before you calculate, round both numbers to see roughly what the answer should be. If your answer is far off, check again.","4 527 + 3 685 is about 4 500 + 3 700 = 8 200. So 8 212 makes sense."],
        ["Break it into parts","You can add place by place: thousands, then hundreds, then tens, then units, and add the totals.","345 + 238 = (300 + 200) + (40 + 30) + (5 + 8) = 500 + 70 + 13 = 583."]],
    Q:[["Estimate 6 912 + 2 104 by rounding to the nearest thousand.",["9 000","8 000","10 000","7 000"],"7 000 + 2 000 = 9 000."],
       ["What is 900 − 365?",["535","645","565","435"],"Borrow from the hundreds and tens."],
       ["What is 2 750 + 1 250?",["4 000","3 900","4 100","3 000"],"750 + 250 = 1 000."],
       ["Thandi has R1 000 and spends R475. How much is left?",["R525","R625","R575","R535"],"1 000 − 475 = 525."]]}},
{ id:"m5g", T:1, t:"Number sentences", s:"Finding missing numbers and writing sums from stories",
  L:[["What is a number sentence?","A number sentence uses numbers, operation signs and an equals sign. The two sides must have the same value.","24 + 6 = 30 and 5 × 4 = 20 are number sentences."],
     ["Finding the missing number","Use the opposite operation to find a missing number. Addition and subtraction undo each other, and so do multiplication and division.","□ + 15 = 40, so □ = 40 − 15 = 25."],
     ["Turning stories into sentences","Read the story and decide which operation it needs. Then write a number sentence and solve it.","'Sipho has 12 marbles and gets 9 more.' 12 + 9 = □, so □ = 21."]],
  A:{t:"fill", p:"Find the number that goes in the box.", d:[["□ + 18 = 50","32"],["70 − □ = 45","25"],["□ × 6 = 42","7"],["81 ÷ □ = 9","9"],["5 × 8 = □ × 4","10"]]},
  Q:[["□ − 25 = 60. What is □?",["85","35","15","75"],"Add 25 to 60."],
     ["Which number sentence matches: 'There are 7 rows of 8 chairs. How many chairs?'",["7 × 8 = □","7 + 8 = □","8 − 7 = □","56 ÷ 7 = □"],"Equal rows mean multiply."],
     ["□ ÷ 4 = 12. What is □?",["48","3","16","8"],"Multiply 12 by 4."],
     ["Which is a true number sentence?",["6 × 5 = 15 + 15","6 × 5 = 11","6 + 5 = 30","6 × 5 = 35"],"30 = 30, so both sides balance."]],
  W:["Solve: 'A taxi has 15 seats. 9 people are inside. How many more can get in?'",["What do we know? 15 seats in total, 9 are full.","Write a number sentence: 9 + □ = 15.","Use the opposite operation: □ = 15 − 9.","□ = 6."],"6 more people"],
  X:"The equals sign means 'the same value as', not 'the answer comes next'. In 20 = □ + 5, the box is 15.",
  C:["What goes in the box: 30 = □ + 12?",["18","42","12","20"],"Both sides must be 30."],
  H:{L:[["Think of a balance scale","An equals sign is like a balanced scale. Whatever is on the left must weigh the same as the right.","8 + 4 = □ + 2 → 12 on the left, so □ = 10."],
        ["Key words help","'Altogether', 'total', 'more' often mean add. 'Left', 'difference', 'fewer' often mean subtract. 'Each', 'groups of', 'rows of' often mean multiply. 'Share equally' means divide.","'Share 24 sweets equally among 4 friends' → 24 ÷ 4 = 6."]],
    Q:[["'Share 36 oranges equally among 9 learners.' Which sentence fits?",["36 ÷ 9 = □","36 × 9 = □","36 − 9 = □","36 + 9 = □"],"Share equally means divide."],
       ["8 + 7 = □ + 5. What is □?",["10","15","20","5"],"8 + 7 = 15, and 10 + 5 = 15."],
       ["□ × 9 = 63. What is □?",["7","54","72","8"],"63 ÷ 9 = 7."],
       ["'Lindi had 50 stickers and gave some away. Now she has 32.' How many did she give away?",["18","82","22","28"],"50 − □ = 32, so □ = 18."]]}},
{ id:"m5h", T:1, t:"Data handling", s:"Collecting, sorting and showing data in graphs",
  L:[["The data cycle","First ask a question. Then collect data, sort it, show it in a table or graph, and finally say what it tells you.","Question: 'What is our class's favourite sport?'"],
     ["Tallies and tables","Tally marks are grouped in fives so they are easy to count. A frequency table shows how many of each thing there are.","Soccer: 卌 ||| = 8 learners."],
     ["Bar graphs and the mode","A bar graph uses bars to compare groups. Always give it a title and label both axes. The mode is the value that appears most often.","If 'soccer' has the tallest bar, soccer is the mode."]],
  A:{t:"order", p:"Put the steps of the data cycle in order.", d:["Ask a question","Collect the data","Sort and organise it","Show it in a table or graph","Say what the data tells you"]},
  Q:[["What is the mode of 3, 5, 5, 7, 5, 2?",["5","3","7","2"],"5 appears three times."],
     ["Why are tally marks grouped in fives?",["to make counting quicker","because it looks nice","to make the number bigger","because there are 5 days in a week"],"You can count in fives."],
     ["Which part of a bar graph tells you what the graph is about?",["the title","the bars","the gaps","the colours"],"Always read the title first."],
     ["A bar for 'Rugby' reaches 6 and a bar for 'Netball' reaches 9. How many more chose netball?",["3","15","6","9"],"9 − 6 = 3."]],
  W:["Show this data in a frequency table: apple, banana, apple, orange, apple, banana",["List each fruit once: apple, banana, orange.","Tally each one: apple |||, banana ||, orange |.","Write the totals: apple 3, banana 2, orange 1.","The mode is the fruit with the biggest total."],"Apple 3, banana 2, orange 1. Mode: apple."],
  X:"The mode is the most common VALUE, not how many times it appears. In 4, 4, 4, 7 the mode is 4, not 3.",
  C:["What is the mode of: red, blue, red, green, red?",["red","blue","green","3"],"Red appears most often."],
  H:{L:[["Reading a bar graph step by step","Read the title. Read what the bottom axis shows. Read the number scale on the side. Then run your finger from the top of each bar across to the scale.","A bar that stops halfway between 10 and 12 shows 11."],
        ["Pictographs","A pictograph uses small pictures to show data. Check the key: one picture might stand for more than one thing.","Key: one ⚽ = 2 learners. Four balls = 8 learners."]],
    Q:[["In a pictograph, 1 picture = 5 learners. There are 3 pictures. How many learners?",["15","3","8","5"],"3 × 5 = 15."],
       ["What should every graph have?",["a title and labels","only colours","no numbers","a joke"],"So readers know what it shows."],
       ["What is the mode of 9, 2, 2, 6, 9, 2?",["2","9","6","3"],"2 appears three times."],
       ["Which question can you answer by collecting data in class?",["What is the most popular lunch?","What is 5 × 5?","How old is the Earth?","What is the capital of France?"],"You can survey classmates."]]}},
{ id:"m5j", T:2, t:"Symmetry", s:"Lines of symmetry in shapes, letters and nature",
  L:[["What is symmetry?","A shape is symmetrical if you can fold it along a line and both halves match exactly. That fold line is called a line of symmetry.","A butterfly is symmetrical down the middle."],
     ["Counting lines of symmetry","Some shapes have one line of symmetry, some have many, and some have none.","A square has 4. A rectangle has 2. An equilateral triangle has 3. A circle has endless lines."],
     ["Symmetry around us","Look for symmetry in letters, flags, buildings and nature.","The letters A, H, M, O, T, U, V, W, X and Y have a vertical line of symmetry."]],
  A:{t:"sort", p:"Does it have at least one line of symmetry?", b:["Symmetrical","Not symmetrical"], d:[["The letter A",0],["The letter F",1],["A square",0],["The letter R",1],["A heart shape",0],["The letter G",1],["A circle",0],["The letter J",1]]},
  Q:[["How many lines of symmetry does a square have?",["4","2","1","0"],"Up, across and both diagonals."],
     ["How many lines of symmetry does a rectangle (not a square) have?",["2","4","1","0"],"Only up and across. The diagonals don't work."],
     ["Which letter has a line of symmetry?",["M","F","P","L"],"Fold M down the middle."],
     ["A line of symmetry divides a shape into two halves that are...",["mirror images","different sizes","different colours","triangles"],"Each half reflects the other."]],
  W:["Find the lines of symmetry of the letter H",["Try a vertical fold down the middle: both sides match. That's 1 line.","Try a horizontal fold across the middle: top and bottom match. That's 2 lines.","Try the diagonals: they don't match."],"2 lines of symmetry"],
  X:"A rectangle's diagonals are NOT lines of symmetry. Fold one on a diagonal and the corners won't meet.",
  C:["How many lines of symmetry does an equilateral triangle have?",["3","1","2","0"],"One from each corner to the middle of the opposite side."],
  H:{L:[["Use a mirror","Put a small mirror on the line you think is a line of symmetry. If the shape looks complete in the mirror, you're right.","Put a mirror down the middle of a picture of a face."],
        ["Complete the other half","To draw a symmetrical picture, copy each point the same distance on the other side of the line.","A point 2 squares left of the line goes 2 squares right of the line."]],
    Q:[["A point is 3 squares to the left of a line of symmetry. Where is its mirror point?",["3 squares to the right","3 squares up","6 squares right","on the line"],"Same distance, other side."],
       ["How many lines of symmetry does a regular hexagon have?",["6","3","2","4"],"A regular shape has as many as its sides."],
       ["Which shape has no lines of symmetry?",["a scalene triangle","a square","a circle","a rectangle"],"All its sides are different."],
       ["Which word has a horizontal line of symmetry all the way through?",["BOX","CAT","DOG","SUN"],"B, O and X each fold top to bottom."]]}},
{ id:"m5k", T:2, t:"Measuring length, mass & capacity", s:"Choosing tools and reading scales",
  L:[["The right tool","Use a ruler or tape measure for length, a scale for mass, and a measuring jug for capacity.","A trundle wheel measures long distances like a sports field."],
     ["Reading a scale","Count how much each small mark is worth before you read. Find the two numbers on either side of the marks and divide.","If 0 to 100 ml has 10 marks, each mark is 10 ml."],
     ["Estimate, then measure","Estimate first using a benchmark you know. Then measure to check.","A 1 l bottle of water has a mass of about 1 kg. A door is about 2 m high."]],
  A:{t:"match", p:"Match each item to the best tool to measure it.", d:[["Length of your pencil","Ruler"],["Mass of a bag of potatoes","Kitchen scale"],["Juice in a jug","Measuring jug"],["Length of the school field","Trundle wheel"],["Your own mass","Bathroom scale"]]},
  Q:[["A scale goes from 0 to 1 kg with 10 equal marks. What is each mark worth?",["100 g","10 g","1 g","1 000 g"],"1 kg = 1 000 g, and 1 000 ÷ 10 = 100."],
     ["Which is the best estimate for the mass of an apple?",["150 g","15 kg","1 500 kg","1 g"],"An apple is light but not tiny."],
     ["Which is the best estimate for the capacity of a teaspoon?",["5 ml","5 l","500 ml","50 l"],"A teaspoon holds a tiny amount."],
     ["What tool measures length?",["a ruler","a measuring jug","a thermometer","a scale"],"Rulers measure in mm and cm."]],
  W:["A measuring jug shows 0, 200, 400 and 600 ml with 1 small mark between each number. The juice is at the first mark after 400. How much juice is there?",["The gap between numbers is 200 ml.","There is 1 mark between each number, which splits the gap into 2 parts.","Each part is 200 ÷ 2 = 100 ml.","The first mark after 400 is 400 + 100 = 500 ml."],"500 ml"],
  X:"Don't count every mark as 1. Always work out what each small mark is worth first.",
  C:["Which would you measure in millilitres?",["medicine on a spoon","the length of a road","a bag of cement","a learner's height"],"Millilitres measure small amounts of liquid."],
  H:{L:[["Benchmarks to remember","Your thumb is about 1 cm wide. A big step is about 1 m. A litre of milk has a mass of about 1 kg. A teaspoon holds about 5 ml.","Use these to check if a measurement makes sense."],
        ["Zero matters","When measuring length, start at the 0 mark on the ruler, not the edge of the ruler.","If you start at 1 cm, subtract 1 from your reading."]],
    Q:[["A pencil starts at the 1 cm mark and ends at the 9 cm mark. How long is it?",["8 cm","9 cm","10 cm","1 cm"],"9 − 1 = 8."],
       ["About how wide is your thumb?",["1 cm","1 m","10 cm","1 mm"],"A handy benchmark."],
       ["Which unit fits the mass of a car?",["kilograms","grams","millilitres","centimetres"],"Cars weigh about 1 000 kg or more."],
       ["A jug scale shows 250 ml per mark. The water is at the 3rd mark. How much water?",["750 ml","250 ml","3 ml","500 ml"],"3 × 250 = 750."]]}},
{ id:"m5m", T:3, t:"Perimeter, area & volume", s:"Measuring around, inside and the space in boxes",
  L:[["Perimeter","Perimeter is the total distance around the outside of a shape. Add up the lengths of all the sides.","A triangle with sides 5 cm, 6 cm and 7 cm has a perimeter of 18 cm."],
     ["Area","Area is how much flat space a shape covers. In Grade 5 we count the squares that fit inside it.","A shape that covers 12 squares of 1 cm² has an area of 12 cm²."],
     ["Volume","Volume is how much space an object takes up. We can count the cubes that fit inside a box.","A box filled with 3 rows of 4 cubes, 2 layers high, holds 24 cubes."]],
  A:{t:"fill", p:"Work these out. Type the number only.", d:[["Perimeter of a square with 6 cm sides (cm)","24"],["Perimeter of a rectangle 8 m by 3 m (m)","22"],["How many 1 cm squares cover a rectangle 5 cm by 4 cm?","20"],["Cubes in a box 3 long, 2 wide and 2 high","12"]]},
  Q:[["What is the perimeter of a rectangle 10 cm long and 4 cm wide?",["28 cm","40 cm","14 cm","24 cm"],"10 + 4 + 10 + 4 = 28."],
     ["Area tells you...",["how much flat space a shape covers","the distance around a shape","how heavy a shape is","how tall a shape is"],"It's the space inside."],
     ["A shape covers 15 squares, each 1 cm². What is its area?",["15 cm²","15 cm","30 cm²","1 cm²"],"Count the squares."],
     ["Which of these is about volume?",["How many cubes fit in a box","The fence around a garden","The length of a road","The colour of a wall"],"Volume is space taken up."]],
  W:["A rectangular garden is 7 m long and 4 m wide. Find its perimeter.",["A rectangle has 2 long sides and 2 short sides.","Long sides: 7 + 7 = 14 m.","Short sides: 4 + 4 = 8 m.","Total: 14 + 8 = 22 m."],"22 m"],
  X:"Perimeter is measured in cm or m. Area is measured in square units like cm² or m². Don't give area in cm.",
  C:["A square has sides of 9 cm. What is its perimeter?",["36 cm","81 cm","18 cm","27 cm"],"4 × 9 = 36."],
  H:{L:[["Walk it or cover it","Perimeter: imagine an ant walking all the way around the edge. Area: imagine covering the shape with square tiles.","A fence uses perimeter. A carpet uses area."],
        ["Rows times columns","Counting squares is faster if you count one row and multiply by the number of rows.","A rectangle 6 squares long and 3 rows high: 6 × 3 = 18 squares."]],
    Q:[["You want to put a border around a notice board. Do you need perimeter or area?",["perimeter","area","volume","mass"],"A border goes around the edge."],
       ["A rectangle is 6 squares long with 5 rows. How many squares?",["30","11","22","65"],"6 × 5 = 30."],
       ["A carpet covers a floor. That's about...",["area","perimeter","volume","capacity"],"Covering a surface."],
       ["A box has 2 layers of 6 cubes each. How many cubes?",["12","8","6","24"],"2 × 6 = 12."]]}},
{ id:"m5n", T:3, t:"Views & position", s:"Seeing objects from different sides and finding places on a grid",
  L:[["Different views","An object looks different depending on where you look from: the front view, side view and top view.","From the top, a cylinder looks like a circle. From the front, it looks like a rectangle."],
     ["Position words","Use words like left, right, above, below, between, in front of and behind to describe where things are.","The ball is between the box and the chair."],
     ["Grids and directions","On a grid, find a position by its column letter and row number. Give directions using north, south, east and west and the number of blocks.","Start at B2, move 3 blocks east: you are at E2."]],
  A:{t:"match", p:"Match each object to what it looks like from the TOP.", d:[["A tin of beans (cylinder)","Circle"],["A dice (cube)","Square"],["A cereal box","Rectangle"],["An ice-cream cone pointing up","Circle with a dot in the middle"],["A ball (sphere)","Circle (and the same from every side)"]]},
  Q:[["What does a cone look like from the side?",["a triangle","a square","a circle","a rectangle"],"It narrows to a point."],
     ["You are at C3 on a grid and move 2 blocks north (up a row each block). Where are you?",["C5","E3","C1","A3"],"Same column, row number goes up by 2."],
     ["Which view shows an object from above?",["top view","front view","side view","back view"],"Like a bird looking down."],
     ["Which object looks like a circle from the top AND the front?",["a ball","a tin","a box","a cone"],"A sphere looks the same from every side."]],
  W:["Describe the route from the gate at A1 to the tuck shop at D4",["Find the start: column A, row 1.","Move east along row 1 from A to D: 3 blocks east.","Move north up column D from row 1 to row 4: 3 blocks north.","Check: you're now at D4."],"3 blocks east, then 3 blocks north"],
  X:"Left and right depend on which way someone is facing. Use compass directions or describe from the map, not just 'left'.",
  C:["What does a cereal box look like from the front?",["a rectangle","a circle","a triangle","a pentagon"],"Its faces are rectangles."],
  H:{L:[["Become the camera","Imagine you are a camera above, in front of or next to the object. Only draw what the camera would see.","From the top, you can't see the sides of a box, only its lid."],
        ["Grid references","Like Battleships: go across first (letters), then up or down (numbers).","D4 = across to D, then up to 4."]],
    Q:[["From the top, a square-based pyramid looks like...",["a square with lines to the middle","a circle","a triangle","a rectangle"],"You see the square base and the edges meeting at the top."],
       ["You are at B2 and move 3 blocks east. Where are you?",["E2","B5","A2","E5"],"Letters change when you move east or west."],
       ["What does a tin look like from the front?",["a rectangle","a circle","a triangle","a square only"],"Straight sides, flat top and bottom."],
       ["'The cat is ___ the box and the chair.' Which word shows it's in the middle?",["between","above","behind","outside"],"Between means in the middle of two things."]]}},
{ id:"m5o", T:4, t:"Transformations", s:"Slides, flips, turns and tessellations",
  L:[["Translation (slide)","A translation slides a shape to a new position without turning or flipping it. The shape stays exactly the same.","Slide a triangle 4 squares to the right."],
     ["Reflection (flip) and rotation (turn)","A reflection flips a shape over a line, like a mirror image. A rotation turns a shape around a point, for example a quarter turn or a half turn.","A quarter turn is 90°. A half turn is 180°."],
     ["Tessellation","A tessellation is a pattern of shapes that fit together with no gaps and no overlaps.","Floor tiles and honeycomb cells tessellate. Circles don't."]],
  A:{t:"sort", p:"Is each one a slide, a flip or a turn?", b:["Slide (translation)","Flip (reflection)","Turn (rotation)"], d:[["Moving a chess piece forward",0],["Your face in a mirror",1],["The hands of a clock moving",2],["A lift going up",0],["A pancake flipped over",1],["Opening a tap",2]]},
  Q:[["Which transformation makes a mirror image?",["reflection","translation","rotation","tessellation"],"A reflection is a flip."],
     ["A half turn is how many degrees?",["180°","90°","360°","45°"],"A full turn is 360°."],
     ["Which shape can tessellate on its own?",["a square","a circle","an oval","a star"],"Squares fit with no gaps."],
     ["After a translation, a shape...",["is the same size and faces the same way","is bigger","is upside down","becomes a circle"],"It only slides."]],
  W:["A shape is turned a quarter turn clockwise, then another quarter turn clockwise. What single turn is that?",["One quarter turn = 90°.","Two quarter turns = 90° + 90° = 180°.","180° is a half turn."],"A half turn (180°)"],
  X:"A reflection is not the same as a turn. A reflected shape is a mirror image; you can't get it just by turning the original.",
  C:["Sliding a book across a table is a...",["translation","reflection","rotation","tessellation"],"It moves without turning."],
  H:{L:[["Act it out","Hold a piece of paper cut into a shape. Slide it across the desk (translation). Flip it over (reflection). Spin it on one corner (rotation).","Notice which way the shape faces after each move."],
        ["Tessellation test","Check where the corners meet: the angles must add up to a full turn (360°) with no gaps.","Three hexagons meet at each point in a honeycomb."]],
    Q:[["Spinning a shape around a point is...",["rotation","translation","reflection","enlargement"],"Rotate means turn."],
       ["Which pattern is a tessellation?",["brick paving with no gaps","coins scattered on a table","balloons in the sky","stars in the sky"],"No gaps, no overlaps."],
       ["How many quarter turns make a full turn?",["4","2","3","1"],"4 × 90° = 360°."],
       ["The letter b reflected in a vertical mirror looks like...",["d","p","q","b"],"It flips left to right."]]}},
{ id:"m5p", T:4, t:"Temperature", s:"Reading thermometers and degrees Celsius",
  L:[["Measuring temperature","Temperature tells us how hot or cold something is. We measure it with a thermometer in degrees Celsius (°C).","A warm summer day in Durban might be 30 °C."],
     ["Temperatures to remember","Water freezes at 0 °C and boils at 100 °C. A healthy body is about 37 °C.","If you have a fever, your temperature might be 39 °C."],
     ["Reading a thermometer","Read the number at the top of the liquid line. Work out what each small mark is worth first.","If marks go up in 2s and the line is 3 marks past 20, it shows 26 °C."]],
  A:{t:"match", p:"Match each temperature to the best description.", d:[["0 °C","Water freezes"],["100 °C","Water boils"],["37 °C","Normal body temperature"],["22 °C","A comfortable room"],["40 °C","A very hot summer day"]]},
  Q:[["What does a thermometer measure?",["temperature","mass","length","time"],"How hot or cold."],
     ["At what temperature does water boil?",["100 °C","0 °C","37 °C","50 °C"],"At sea level."],
     ["It was 14 °C in the morning and 23 °C in the afternoon. How much warmer was it?",["9 °C","37 °C","11 °C","7 °C"],"23 − 14 = 9."],
     ["Which temperature is likely for a cold winter night in Bloemfontein?",["2 °C","35 °C","70 °C","100 °C"],"Highveld winter nights are cold."]],
  W:["A thermometer's marks go up in 5s. The liquid stops 2 marks above 20. What is the temperature?",["Each small mark is worth 5 °C.","2 marks = 2 × 5 = 10 °C.","Add it to 20: 20 + 10 = 30."],"30 °C"],
  X:"Read at eye level, straight across from the top of the liquid. Looking from above or below gives a wrong reading.",
  C:["Water freezes at...",["0 °C","10 °C","100 °C","37 °C"],"Zero degrees Celsius."],
  H:{L:[["Hot and cold benchmarks","Ice: 0 °C. Fridge: about 4 °C. Room: about 20 °C. Your body: 37 °C. Hot tea: about 70 °C. Boiling water: 100 °C.","Use these to check if a temperature makes sense."],
        ["Temperature differences","To find how much warmer or colder, subtract the smaller temperature from the bigger one.","From 8 °C to 19 °C is a rise of 11 °C."]],
    Q:[["About what temperature is a fridge?",["4 °C","40 °C","100 °C","20 °C"],"Cold but not frozen."],
       ["From 31 °C it dropped to 18 °C. By how much?",["13 °C","49 °C","17 °C","12 °C"],"31 − 18 = 13."],
       ["Which is the hottest?",["boiling water","a sunny day","your body","a cup of cold juice"],"100 °C."],
       ["Marks go up in 2s. The liquid is 4 marks above 30. Temperature?",["38 °C","34 °C","32 °C","40 °C"],"4 × 2 = 8, and 30 + 8 = 38."]]}},
{ id:"m5q", T:4, t:"Probability", s:"How likely is it? Outcomes of coins, dice and spinners",
  L:[["Chance words","We describe how likely something is with words: impossible, unlikely, even chance, likely and certain.","The sun rising tomorrow is certain. Snow in Durban in summer is impossible (almost!)."],
     ["Outcomes","An outcome is a possible result of an experiment. A coin has 2 outcomes: heads or tails. A dice has 6 outcomes: 1, 2, 3, 4, 5 or 6.","Rolling a 7 on a normal dice is impossible."],
     ["Doing experiments","Repeat an experiment many times and tally the results. The more times you try, the closer the results get to what you expect.","Flip a coin 20 times: you'll get about 10 heads."]],
  A:{t:"sort", p:"How likely is each event?", b:["Impossible","Possible (could happen)","Certain"], d:[["Rolling a 7 on a normal dice",0],["Getting heads when you flip a coin",1],["Tomorrow will be a day of the week",2],["A cow flying to school",0],["Rain in Cape Town in winter",1],["A month having at least 28 days",2]]},
  Q:[["How many possible outcomes are there when you roll a dice?",["6","2","1","12"],"1, 2, 3, 4, 5 or 6."],
     ["Getting heads on a coin has...",["an even chance","no chance","a certain chance","a very small chance"],"Heads or tails: 1 out of 2."],
     ["A bag has 9 red beads and 1 blue bead. Picking red is...",["likely","impossible","unlikely","certain"],"Most beads are red."],
     ["Which is impossible?",["rolling a 0 on a normal dice","rolling a 6","rolling an even number","rolling a 1"],"A dice has no 0."]],
  W:["A spinner has 4 equal parts: 3 green and 1 yellow. Which colour is more likely?",["Count the parts: 4 in total.","Green has 3 of the 4 parts.","Yellow has 1 of the 4 parts.","More parts means more likely."],"Green is more likely (3 out of 4)."],
  X:"If you flip heads 3 times in a row, tails is not 'due' next. Each flip still has an even chance.",
  C:["A bag has only blue marbles. Picking a blue marble is...",["certain","impossible","unlikely","even chance"],"There's nothing else to pick."],
  H:{L:[["The chance line","Picture a line from impossible on the left, through even chance in the middle, to certain on the right. Place each event on the line.","Picking a red sweet from a bag of all red sweets goes on 'certain'."],
        ["Count the ways","To compare chances, count how many ways each outcome can happen.","On a dice, 'an even number' can happen 3 ways (2, 4, 6). 'A 6' can happen only 1 way."]],
    Q:[["On a dice, which is more likely: an even number or a 6?",["an even number","a 6","they are the same","neither can happen"],"3 ways vs 1 way."],
       ["A bag has 5 red and 5 green beads. Picking red has...",["an even chance","no chance","a certain chance","a small chance"],"Half are red."],
       ["Where does 'certain' go on a chance line?",["at the far right end","in the middle","at the far left end","nowhere"],"Certain is the highest chance."],
       ["You flip a coin 50 times. About how many heads should you expect?",["25","50","5","0"],"About half."]]}}
]};

{ id:"e5e", t:"Writing a story", s:"Characters, setting, plot and a great ending",
  L:[["The building blocks","Every story has characters (who), a setting (where and when) and a plot (what happens).","Characters: Zola and her dog. Setting: a farm in the Karoo, one stormy night."],
     ["Beginning, middle and end","The beginning introduces the characters and setting. In the middle, a problem (conflict) happens. At the end, the problem is solved.","Problem: the dog runs off in the storm. Ending: Zola finds him in the barn."],
     ["Make it come alive","Use interesting verbs and adjectives, add dialogue, and describe what characters see, hear and feel.","Instead of 'It rained', try 'Rain hammered on the tin roof.'"]],
  A:{t:"order", p:"Put the parts of this story in the right order.", d:["Thabo and his gran lived next to the river.","One morning, Thabo saw that the river was rising fast.","He ran to warn the neighbours.","Everyone moved their animals to higher ground.","That night the village was safe, and Gran hugged Thabo proudly."]},
  Q:[["What is the setting of a story?",["where and when it happens","the main character","the problem","the title"],"Place and time."],
     ["Where does the main problem usually happen?",["in the middle","in the title","after the end","in the first word"],"The middle builds the action."],
     ["Which sentence is the most interesting?",["The lion's roar shook the dry grass.","The lion was there.","There was a lion.","It was a lion."],"Strong verbs and detail."],
     ["A story's ending should...",["solve the problem","start a new story","introduce new characters","be left out"],"Tie it together."]],
  W:["Plan a short story about a lost school bag",["Characters: Lerato and her best friend Musa.","Setting: the school playground, after the bell.","Problem: Lerato's bag, with her homework, is missing.","Solution and ending: Musa spots it under a bench, and they finish the homework together."],"Characters, setting, problem, solution"],
  X:"Don't end with 'and then I woke up, it was a dream'. It makes the reader feel the story didn't matter. Solve the problem instead.",
  C:["Who are the characters in a story?",["the people or animals in it","the place it happens","the moral","the pages"],"Characters do the actions."],
  H:{L:[["Use a story map","Draw five boxes: Characters, Setting, Problem, Events, Solution. Fill each box with a few words before you write.","Planning first stops you getting stuck halfway."],
        ["Show, don't tell","Instead of telling the reader how someone feels, show it with actions.","Tell: 'Sam was scared.' Show: 'Sam's hands shook and he hid behind the door.'"]],
    Q:[["Which sentence SHOWS a character is happy?",["Ama skipped down the road, humming.","Ama was happy.","Ama felt good.","Ama is a girl."],"Actions show feelings."],
       ["What should you do before writing a story?",["plan it","write the ending only","draw the cover","count the words"],"A plan keeps it on track."],
       ["The conflict in a story is...",["the problem the characters face","the setting","the title","the last line"],"It drives the plot."],
       ["Which is a good story opening?",["\"Run!\" shouted Ben as the storm rolled in.","This is a story.","Once there was a story.","The end."],"It grabs attention."]]}},
{ id:"e5f", t:"Folktales, myths & legends", s:"Traditional stories and the lessons they teach",
  L:[["Folktales","Folktales are old stories passed down by word of mouth. They often have talking animals and teach a lesson, called a moral.","Many South African folktales feature clever Hare (Mmutla) or Jackal."],
     ["Myths and legends","A myth explains how something in nature came to be, like why the sun rises. A legend is about a hero and may be partly true.","A myth might explain why the tortoise has a cracked shell."],
     ["Features to look for","Look for a simple setting, good and bad characters, repetition (things happening three times) and a clear moral.","'Once upon a time...' or 'Long, long ago...' are typical openings."]],
  A:{t:"match", p:"Match each story type to its description.", d:[["Folktale","Traditional story that teaches a lesson"],["Myth","Explains how something in nature began"],["Legend","Story about a hero that may be partly true"],["Fable","Short animal story with a stated moral"],["Moral","The lesson the story teaches"]]},
  Q:[["What is a moral?",["the lesson a story teaches","the main character","the setting","the title"],"Like 'slow and steady wins the race'."],
     ["How were folktales first shared?",["by telling them aloud","on the internet","in newspapers","on TV"],"By word of mouth."],
     ["A story that explains why zebras have stripes is probably a...",["myth","recipe","letter","diary"],"It explains nature."],
     ["Which character is often clever and tricky in African folktales?",["the hare","the rock","the tree","the river"],"Hare often outsmarts bigger animals."]],
  W:["Find the moral: 'Tortoise and Hare race. Hare is so sure he'll win that he takes a nap. Tortoise keeps going slowly and wins.'",["What did Hare do wrong? He was too sure of himself and stopped trying.","What did Tortoise do right? He kept going.","Turn it into a lesson for life."],"Keep trying and don't be overconfident: slow and steady wins the race."],
  X:"The moral isn't what happens in the story. It's the lesson for real life. 'Tortoise won' is the plot; 'keep going' is the moral.",
  C:["'Once upon a time' is a typical opening for a...",["folktale","recipe","report","news article"],"Traditional stories start this way."],
  H:{L:[["Why we still tell them","Folktales carry the values of a community: respect, kindness, cleverness and fairness. Elders used them to teach children.","Grandparents telling stories by the fire is part of South African heritage."],
        ["Find the moral in 3 steps","1. Who made a good or bad choice? 2. What happened because of it? 3. What should we learn?","The greedy dog dropped his bone chasing a reflection → don't be greedy."]],
    Q:[["Why did elders tell folktales?",["to teach values and lessons","to sell books","to make maps","to count cattle"],"Stories teach."],
       ["The greedy dog drops his real bone to grab a reflection. The moral is...",["don't be greedy","dogs love water","bones are tasty","always swim"],"Greed made him lose what he had."],
       ["Things often happen how many times in folktales?",["three","ten","one hundred","zero"],"The rule of three."],
       ["A legend is usually about...",["a hero","a recipe","a weather report","a shopping list"],"Heroes and brave deeds."]]}},
{ id:"e5g", t:"Poetry basics", s:"Rhyme, rhythm, stanzas and sound",
  L:[["How poems look","Poems are written in lines, and groups of lines are called stanzas (verses). Poems don't always use full sentences.","A poem with 3 stanzas of 4 lines has 12 lines."],
     ["Rhyme and rhythm","Words rhyme when they end with the same sound: cat, hat, flat. Rhythm is the beat you hear when you read a poem aloud.","Clap along as you read to feel the rhythm."],
     ["Sound and pictures","Poets use similes (like/as), alliteration (same starting sound) and onomatopoeia (sound words) to make poems vivid.","'Raindrops ping and pong on the plastic pot.'"]],
  A:{t:"match", p:"Match each word to a word that rhymes with it.", d:[["rain","train"],["light","night"],["sun","run"],["tree","bee"],["cake","lake"]]},
  Q:[["A group of lines in a poem is called a...",["stanza","paragraph","chapter","heading"],"Also called a verse."],
     ["Which pair of words rhymes?",["moon / spoon","moon / sun","moon / night","moon / star"],"Same ending sound."],
     ["'Buzz', 'crash' and 'pop' are examples of...",["onomatopoeia","rhyme","similes","stanzas"],"They sound like what they mean."],
     ["'Silly snakes slither slowly' uses...",["alliteration","rhyme","a simile","onomatopoeia"],"Repeated 's' sound."]],
  W:["Count the stanzas and find the rhymes: 'The wind blew high, / across the sky. // The leaves fell down, / all over town.'",["Each // shows a new stanza, so there are 2 stanzas.","Stanza 1 rhymes high / sky.","Stanza 2 rhymes down / town."],"2 stanzas; high/sky and down/town rhyme"],
  X:"Rhyme is about sound, not spelling. 'Blue' and 'shoe' rhyme even though they're spelt differently. 'Cough' and 'though' don't.",
  C:["Which word rhymes with 'blue'?",["shoe","blow","blur","bloom"],"Same 'oo' sound."],
  H:{L:[["Read it aloud","Poems are made to be heard. Read slowly, then clap the beat. Notice which words sound alike at the ends of lines.","Reading aloud helps you find rhyme and rhythm."],
        ["Pictures in words","Ask: what can I see, hear, smell, feel or taste in this poem? Those words are the poet's pictures.","'Cold, crunchy frost' helps you feel and hear winter."]],
    Q:[["Which word rhymes with 'night'?",["kite","knit","nine","nest"],"Same 'ite' sound."],
       ["Clapping along to a poem helps you hear its...",["rhythm","spelling","title","author"],"The beat."],
       ["'The snow was as soft as a pillow' is a...",["simile","rhyme","stanza","question"],"It uses 'as'."],
       ["Rhyme depends on...",["sound","spelling","length","capital letters"],"How the words sound."]]}},
{ id:"e5h", t:"Writing instructions", s:"Recipes and how-to texts that are easy to follow",
  L:[["Purpose and title","Instructions tell someone how to do or make something. Start with a clear title that says what the result is.","How to Make Vetkoek"],
     ["Materials, then steps","List what you need first. Then write numbered steps in the right order.","You need: flour, yeast, water, oil. Step 1: Mix the flour and yeast."],
     ["Command verbs","Start each step with a command (imperative) verb like mix, cut, pour, fold or stir. Keep steps short and clear.","Pour the water slowly. Stir until smooth."]],
  A:{t:"order", p:"Put the steps for making a jam sandwich in order.", d:["Take two slices of bread.","Spread butter on one side of each slice.","Spread jam on top of the butter on one slice.","Put the second slice on top, butter side down.","Cut the sandwich in half."]},
  Q:[["What usually comes first in a recipe?",["a list of ingredients","the last step","a story","the author's address"],"So you can get everything ready."],
     ["Which is a command (imperative) verb?",["stir","stirring","stirred","stirs"],"It tells someone what to do."],
     ["Why are steps numbered?",["to show the order","to make them longer","to look pretty","so they rhyme"],"Order matters."],
     ["Which instruction is clearest?",["Boil 1 cup of water.","Do some water stuff.","Water is boiled sometimes.","I like water."],"Short, exact and starts with a verb."]],
  W:["Turn this into clear steps: 'You should probably put some water in the kettle and then maybe switch it on and wait for it to boil.'",["Find the actions: fill, switch on, wait.","Start each with a command verb.","Number them in order and remove extra words like 'probably' and 'maybe'."],"1. Fill the kettle with water. 2. Switch it on. 3. Wait for it to boil."],
  X:"Don't skip steps that seem obvious to you. The reader may never have done it before.",
  C:["Which word would start a step in instructions?",["Fold","Folding","Folded","Fun"],"Commands start with a verb."],
  H:{L:[["Test your instructions","Ask someone to follow your instructions exactly as written, without help. Where they get stuck, add or fix a step.","If they ask 'how much?', add a measurement."],
        ["Be exact","Use amounts, times and sizes: 2 cups, 10 minutes, cut into 4 pieces.","'Bake for 20 minutes at 180 °C' is better than 'bake until done'."]],
    Q:[["Which step is the most exact?",["Bake for 25 minutes.","Bake for a while.","Bake it.","Baking is fun."],"It gives a time."],
       ["What is a good title for instructions?",["How to Plant a Bean Seed","Beans","My Weekend","Hello"],"It says what you'll make or do."],
       ["Why test instructions on someone else?",["to find missing or unclear steps","to waste time","to make them longer","to change the title"],"Fresh eyes catch gaps."],
       ["Which is NOT needed in a recipe?",["a long story about your holiday","ingredients","steps","a title"],"Keep to the point."]]}},
{ id:"e5i", t:"Diaries & recounts", s:"Writing about what happened, in order",
  L:[["What is a recount?","A recount tells about something that already happened, in the order it happened. It's written in the past tense.","My trip to the Two Oceans Aquarium."],
     ["Diary entries","A diary is a private, personal recount. Start with the date and 'Dear Diary'. Write in the first person (I, me, we) and share your feelings.","Saturday, 3 May. Dear Diary, today was the best day ever!"],
     ["Time words","Use time connectives to show order: first, then, after that, later, finally.","First we packed the car. After that we drove to the coast."]],
  A:{t:"sort", p:"Does each sentence belong in a diary entry or a recipe?", b:["Diary entry","Recipe"], d:[["Dear Diary, I felt so nervous today.",0],["Add two eggs and mix well.",1],["Yesterday I scored my first goal!",0],["Bake for 30 minutes.",1],["I can't wait to tell Gran tomorrow.",0],["You will need 2 cups of flour.",1]]},
  Q:[["A recount is written mainly in the...",["past tense","future tense","present tense only","command form"],"It already happened."],
     ["How does a diary entry usually start?",["with the date and 'Dear Diary'","with a list of ingredients","with 'Once upon a time'","with a heading in capitals"],"Personal and dated."],
     ["Which word shows the order of events?",["afterwards","beautiful","quickly","because"],"A time connective."],
     ["Diaries are written in the...",["first person (I, me)","third person (he, she)","second person (you) only","command form"],"It's about you."]],
  W:["Write the start of a diary entry about a school sports day",["Start with the date: Friday, 14 March.","Greeting: Dear Diary,","First event in past tense and first person: Today we had our sports day.","Add a feeling: I was so nervous before my race!"],"Friday, 14 March. Dear Diary, today we had our sports day. I was so nervous before my race!"],
  X:"Don't switch tenses halfway. If you start in the past ('I ran'), don't change to 'I run'.",
  C:["Which sentence belongs in a recount?",["Last Sunday we visited the zoo.","Mix the sugar and butter.","We will go to the zoo.","Go to the zoo."],"Past tense, real event."],
  H:{L:[["The 5 Ws","Before writing a recount, answer: Who was there? What happened? Where? When? Why?","Who: my class. What: a trip. Where: Kirstenbosch. When: Tuesday. Why: to learn about plants."],
        ["End with a reflection","Finish with how you felt or what you learnt.","'It was tiring, but I learnt so much about fynbos.'"]],
    Q:[["Which of the 5 Ws asks about the place?",["Where","Who","When","Why"],"Where = place."],
       ["Which is a good ending for a recount?",["I learnt that teamwork really matters.","First we got on the bus.","Stir well.","Chapter one."],"A reflection."],
       ["Change to the past tense: 'We eat lunch on the grass.'",["We ate lunch on the grass.","We eats lunch on the grass.","We will eat lunch.","We eating lunch."],"Eat → ate."],
       ["Which time word usually comes last?",["Finally","First","Next","Then"],"It ends the sequence."]]}},
{ id:"e5j", t:"Word power", s:"Synonyms, antonyms, prefixes, suffixes and homophones",
  L:[["Synonyms and antonyms","Synonyms are words with similar meanings (big, large). Antonyms are opposites (hot, cold).","Happy: synonym = glad, antonym = sad."],
     ["Prefixes and suffixes","A prefix goes at the front of a word and changes its meaning (un-, re-, dis-). A suffix goes at the end (-ful, -less, -ly).","un + happy = unhappy. hope + ful = hopeful."],
     ["Homophones","Homophones sound the same but have different spellings and meanings.","their / there / they're, to / too / two, sea / see."]],
  A:{t:"match", p:"Match each word to its antonym (opposite).", d:[["ancient","modern"],["generous","selfish"],["arrive","depart"],["brave","cowardly"],["shallow","deep"]]},
  Q:[["Which is a synonym for 'tiny'?",["small","huge","tall","loud"],"Similar meaning."],
     ["What does the prefix 're-' mean in 'rewrite'?",["again","not","before","under"],"Write again."],
     ["Which word has a suffix that means 'without'?",["careless","careful","uncare","recare"],"-less means without."],
     ["Choose the right homophone: 'I can ___ the ocean.'",["see","sea","se","cee"],"See = look with your eyes."]],
  W:["Find the meaning of 'unbreakable'",["Split it: un + break + able.","break = to smash into pieces.","-able = can be done. un- = not.","Put it together: cannot be broken."],"Not able to be broken"],
  X:"'Two', 'too' and 'to' are often mixed up. Two is the number 2. Too means also or very. To is for direction or with a verb (to go).",
  C:["Which word is an antonym of 'empty'?",["full","bare","clear","hollow"],"The opposite."],
  H:{L:[["Use a thesaurus","A thesaurus lists synonyms. Use it to avoid repeating the same word.","Instead of 'nice' every time: kind, lovely, pleasant, friendly."],
        ["Prefix meanings","un- / dis- / in- = not. re- = again. pre- = before. mis- = wrongly.","misspell = spell wrongly. preview = see before."]],
    Q:[["What does 'misbehave' mean?",["behave badly","behave again","behave before","not behave at all"],"mis- = wrongly."],
       ["Choose the correct word: 'I want ___ sweets, please.'",["two","to","too","tue"],"The number 2."],
       ["Which is a synonym for 'angry'?",["furious","calm","happy","sleepy"],"Very angry."],
       ["Add a prefix to make 'agree' mean the opposite.",["disagree","reagree","preagree","agreeful"],"dis- = not."]]}},
{ id:"e5k", t:"Comparing & joining words", s:"Degrees of comparison and conjunctions",
  L:[["Comparing with adjectives","Adjectives have three degrees: positive (tall), comparative (taller, for two things) and superlative (tallest, for three or more).","A giraffe is taller than a zebra. It is the tallest animal."],
     ["Long words and tricky ones","Long adjectives use more and most: beautiful, more beautiful, most beautiful. Some are irregular: good, better, best; bad, worse, worst.","This is the best day ever!"],
     ["Conjunctions join ideas","Conjunctions join words or sentences: and, but, or, so, because, when.","I was hungry, so I made a sandwich."]],
  A:{t:"match", p:"Match each adjective to its superlative.", d:[["good","best"],["bad","worst"],["happy","happiest"],["big","biggest"],["many","most"]]},
  Q:[["The cheetah is the ___ land animal.",["fastest","faster","fast","most fast"],"More than two animals: superlative."],
     ["My bag is ___ than yours.",["heavier","heaviest","more heavy","heavy"],"Comparing two."],
     ["Which is correct?",["more interesting","interestinger","most interestinger","interestinger than"],"Long words use more/most."],
     ["Choose the conjunction: 'I stayed inside ___ it was raining.'",["because","but","or","and so"],"Gives a reason."]],
  W:["Compare three mountains: Table Mountain (1 085 m), Mafadi (3 450 m), and a hill (300 m)",["Positive degree describes one: Table Mountain is high.","Comparative compares two: Table Mountain is higher than the hill.","Superlative compares three or more: Mafadi is the highest of the three."],"high, higher, highest"],
  X:"Never double up: 'more taller' and 'most biggest' are wrong. Use either -er/-est OR more/most, not both.",
  C:["What is the comparative of 'good'?",["better","gooder","best","more good"],"An irregular adjective."],
  H:{L:[["Spelling rules","Short word with one vowel + one consonant: double it (big, bigger). Ends in -y: change y to i (happy, happier). Ends in -e: just add r/st (nice, nicer).","hot → hotter, funny → funnier, large → largest."],
        ["Two or more?","Comparing two things? Use -er or more. Three or more? Use -est or most.","Of the two sisters, Ama is older. Of all the children, Ama is the oldest."]],
    Q:[["What is the comparative of 'hot'?",["hotter","hoter","hottest","more hot"],"Double the t."],
       ["What is the superlative of 'funny'?",["funniest","funnyest","most funny","funnier"],"y changes to i."],
       ["'Of the two cakes, this one is ___.'",["sweeter","sweetest","most sweet","sweet"],"Only two."],
       ["What is the superlative of 'bad'?",["worst","baddest","worse","most bad"],"Irregular."]]}},
{ id:"e5l", t:"Adverts & visual texts", s:"How pictures and words persuade",
  L:[["What is a visual text?","A visual text uses pictures, colour and words together to give a message. Adverts, posters, comics and cartoons are visual texts.","A poster for a school market uses bright colours and big words."],
     ["How adverts persuade","Adverts try to make you want or do something. They use catchy slogans, exciting adjectives, bright pictures and sometimes famous people.","Slogan: 'Fresh, fast and fantastic!'"],
     ["Think critically","Ask: what is being sold? Who is it aimed at? Is the claim true, or just exciting words?","'The best juice in the world!' is an opinion, not a fact."]],
  A:{t:"sort", p:"Is it a fact or a persuasive claim?", b:["Fact","Persuasive claim"], d:[["Contains 250 ml of juice",0],["The tastiest snack ever!",1],["Price: R15",0],["Everyone loves it!",1],["Made in South Africa",0],["You'll be the coolest kid in class!",1]]},
  Q:[["What is a slogan?",["a short, catchy phrase in an advert","the price","a long story","the company's address"],"Easy to remember."],
     ["Why do adverts use bright colours?",["to catch your attention","to save ink","because it's a rule","to hide the price"],"Eye-catching."],
     ["'Amazing! Incredible! Unbeatable!' These words are used to...",["make the product sound exciting","give facts","explain the price","describe the weather"],"Persuasive adjectives."],
     ["Which question helps you think critically about an advert?",["Is this claim true?","What's my favourite colour?","How tall am I?","What day is it?"],"Check the claim."]],
  W:["Analyse a poster: big cartoon lion, the words 'ROAR-ING good cereal!', and a small price R39,99",["What's being sold? Cereal.","Who is it aimed at? Children (cartoon, fun pun).","Techniques: a fun character, a pun ('ROAR-ING'), big bold words.","Notice: the price is small so it doesn't stand out."],"It targets children with a cartoon and a pun, and plays down the price."],
  X:"An advert's job is to sell, not to inform fairly. Don't believe every claim just because it's in big letters.",
  C:["Which is a fact you could check on a cereal box?",["Contains 500 g","Kids go crazy for it!","The yummiest breakfast","Best in the world"],"Mass can be checked."],
  H:{L:[["Target audience","Adverts are made for a certain group. Toys are aimed at children; cars are aimed at adults. Look at the pictures and words to tell who.","Cartoons and bright colours usually target children."],
        ["Design a fair poster","When you make a poster, use a clear heading, one main picture, key information (what, where, when, price) and a slogan.","School Market! Friday at 10:00, Hall. Treats from R5."]],
    Q:[["An advert with cartoons and games is probably aimed at...",["children","grandparents","farmers","doctors"],"Bright and fun."],
       ["What must a poster for an event include?",["what, where and when","a long story","no words","only a picture"],"Key information."],
       ["Why might an advert use a famous sports star?",["so people want to copy them","because it's the law","to explain facts","to make it cheaper"],"Celebrities persuade."],
       ["Which slogan uses alliteration?",["Crunchy, crispy, crackers!","Buy this now.","We sell bread.","Open daily."],"Repeated 'c' sound."]]}},
{ id:"e5m", t:"Listening & speaking", s:"Giving a talk and being a good listener",
  L:[["Being a good listener","Look at the speaker, stay quiet while they talk, and think about what they're saying. Ask questions afterwards.","Nod to show you're following."],
     ["Giving a prepared talk","Plan your talk: an introduction (what it's about), a few main points, and a conclusion. Use cue cards with key words, not full sentences.","'Today I'm going to tell you about my favourite animal, the pangolin.'"],
     ["Using your voice","Speak clearly and loudly enough, not too fast. Look up at your audience and use your voice to show feeling.","Pause after an important point."]],
  A:{t:"sort", p:"Is it good or poor listening and speaking?", b:["Good habit","Poor habit"], d:[["Making eye contact",0],["Interrupting the speaker",1],["Speaking clearly and slowly",0],["Reading every word from your page",1],["Asking a question at the end",0],["Looking at the floor the whole time",1]]},
  Q:[["What should cue cards have on them?",["key words","your whole speech","drawings only","nothing"],"Short reminders."],
     ["What does a good listener do?",["looks at the speaker and listens quietly","talks to a friend","plays with a pen","interrupts often"],"Show respect."],
     ["How should you start a talk?",["by saying what it's about","by saying 'the end'","with a joke only","by sitting down"],"An introduction."],
     ["If you speak too fast, the audience may...",["miss what you say","understand better","clap louder","fall asleep happily"],"Slow down."]],
  W:["Plan a 1-minute talk about your favourite food",["Introduction: My favourite food is bunny chow.","Point 1: what it is (curry in a hollowed-out loaf).","Point 2: where it comes from (Durban).","Conclusion: why you love it, and thank the audience."],"Introduction, two or three points, conclusion"],
  X:"Don't write your whole talk on cards and read it. Use key words so you can look up and talk to your audience.",
  C:["What should you do while someone is giving a talk?",["listen quietly and look at them","chat to friends","practise your own talk","look out the window"],"Good listening."],
  H:{L:[["Practise out loud","Practise your talk aloud at least three times, in front of a mirror or a family member. Time yourself.","Practising makes you less nervous."],
        ["Calm your nerves","Take a deep breath before you start, stand still, and find a friendly face to look at.","Everyone feels nervous; preparation helps the most."]],
    Q:[["What helps most with nerves before a talk?",["practising and being prepared","not preparing","talking very fast","hiding your notes"],"Preparation builds confidence."],
       ["How many times should you practise a talk?",["several times, out loud","never","only in your head once","after you give it"],"Practice aloud."],
       ["Looking at the audience is called...",["eye contact","cue cards","a conclusion","a pause"],"It connects you to them."],
       ["Which is a polite question after a talk?",["\"Why did you choose pangolins?\"","\"That was boring.\"","\"Can I go now?\"","\"Mine is better.\""],"Curious and kind."]]}},
{ id:"e5n", t:"Dictionary & spelling skills", s:"Alphabetical order, guide words and plural rules",
  L:[["Alphabetical order","Dictionaries list words in alphabetical order. If the first letters match, look at the second letter, then the third.","bat, bed, bin, box, bus (a, e, i, o, u)."],
     ["Guide words","At the top of each dictionary page are guide words: the first and last words on that page. Your word must fit between them alphabetically.","Guide words 'pan / pet': 'pen' is on this page, 'pig' is not."],
     ["Plural rules","Most nouns add -s. Words ending in s, x, ch, sh add -es. Consonant + y: change y to i and add -es. Some are irregular.","bus → buses, baby → babies, child → children, mouse → mice."]],
  A:{t:"order", p:"Put these words in alphabetical order.", d:["giraffe","goat","gorilla","grasshopper","guineafowl"]},
  Q:[["What is the plural of 'box'?",["boxes","boxs","boxies","box"],"Ends in x, add -es."],
     ["What is the plural of 'city'?",["cities","citys","cityes","citi"],"Consonant + y: change to -ies."],
     ["Which word comes first in alphabetical order?",["ant","apple","arm","axe"],"an- comes before ap-, ar-, ax-."],
     ["What is the plural of 'tooth'?",["teeth","tooths","toothes","teeths"],"Irregular."]],
  W:["Guide words on a page are 'kettle' and 'kite'. Is 'key' on this page?",["Compare 'key' with 'kettle': k-e-y vs k-e-t. y comes after t, so 'key' comes after 'kettle'.","Compare 'key' with 'kite': k-e vs k-i. e comes before i, so 'key' comes before 'kite'.","It fits between them."],"Yes, 'key' is on this page"],
  X:"Words ending in vowel + y just add -s: boy → boys, day → days. Only consonant + y changes to -ies.",
  C:["What is the plural of 'monkey'?",["monkeys","monkies","monkeyes","monkey"],"Vowel (e) + y: just add s."],
  H:{L:[["Irregular plurals to learn","man → men, woman → women, child → children, foot → feet, mouse → mice, sheep → sheep, person → people.","These don't follow the -s rule, so learn them by heart."],
        ["Look, say, cover, write, check","To learn a spelling: look at the word, say it, cover it, write it from memory, then check.","Repeat for any word you get wrong."]],
    Q:[["What is the plural of 'sheep'?",["sheep","sheeps","sheepes","shoop"],"It stays the same."],
       ["What is the plural of 'church'?",["churches","churchs","churchies","church"],"Ends in ch, add -es."],
       ["What is the plural of 'day'?",["days","daies","dayes","day"],"Vowel + y: add s."],
       ["Which word comes first alphabetically?",["sea","seal","seat","seed"],"'sea' is shortest with the same start."]]}}
];
